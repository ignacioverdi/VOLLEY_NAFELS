<!-- El cuerpo pedia Barlow Condensed y la pantalla no la cargaba: salia
     con la tipografia del sistema. -->
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow+Condensed:wght@300;400;600;700;800;900&display=swap" rel="stylesheet">
<style>
  /* En esta app los controles no heredan la tipografia. */
  button,select,input,textarea{font-family:'Barlow Condensed',sans-serif}
  :root{--bg:#07080F;--card:#11162a;--card2:#0d1322;--border:#1e2944;--text:#e8edf7;--mut:#64748b;--mut2:#94a3b8;
        /* La paleta validada, la misma que usan el panel, el plan de partido
           y el propio javascript de esta pantalla mas abajo. Antes estas seis
           decian otra cosa que el codigo de al lado. */
        --saque:#CE7C18;--ataque:#0B84C4;--recep:#0E9F6E;--bloqueo:#8B5CF6;--defensa:#DC2A5A;--armado:#0FA3B1}
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--text);font-family:'Barlow Condensed',system-ui,sans-serif;padding:20px 16px;max-width:980px;margin:0 auto}
  .hdr{display:flex;align-items:center;gap:14px;margin-bottom:16px}
  .back-btn{color:var(--mut2);text-decoration:none;border:1px solid var(--border);border-radius:8px;padding:7px 12px;font-weight:700;font-size:13px}
  .ttl{font-family:'Bebas Neue',sans-serif;font-size:30px;letter-spacing:1px;line-height:1}
  .ttl span{color:var(--recep)}
  .sub{color:var(--mut2);font-size:13px}
  .strip{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:18px}
  .res{width:30px;height:30px;border-radius:7px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13px;font-family:'Bebas Neue',sans-serif}
  .res.w{background:rgba(34,197,94,.18);color:#4ade80;border:1px solid rgba(34,197,94,.4)}
  .res.l{background:rgba(239,68,68,.16);color:#f87171;border:1px solid rgba(239,68,68,.4)}
  .cards{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  @media(max-width:720px){.cards{grid-template-columns:1fr}}
  .card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:15px}
  .card.full{grid-column:1/-1}
  .ch-t{font-family:'Bebas Neue',sans-serif;font-size:18px;letter-spacing:.5px;display:flex;align-items:center;gap:8px;margin-bottom:4px}
  .ch-t .ic{width:10px;height:10px;border-radius:3px}
  .leg{font-size:11px;color:var(--mut2);margin-bottom:8px}
  .leg b{font-weight:800}
  svg{width:100%;height:auto;display:block}
  .avg{font-size:11px;color:var(--mut);margin-top:6px}
  .avg b{color:var(--text)}
  .empty{text-align:center;color:var(--mut);padding:60px 20px}
</style>

<body>
  <div class="hdr">
    <a href="dashboard.html" class="back-btn" data-t="← Dashboard"><span data-t="← Dashboard">← Dashboard</span></a>
    <div>
      <div class="ttl">TENDENCIAS <span>NÄFELS</span></div>
      <div class="sub" data-t="Evolución del equipo partido a partido"><span data-t="Evolución del equipo partido a partido">Evolución del equipo partido a partido</span></div>
    </div>
    <div id="lang-wrap" style="margin-left:auto;display:flex;gap:4px"></div>
  </div>
  <div id="strip" class="strip"></div>
  <div id="cards" class="cards"></div>

  <!-- VB_EFF y las metas: esta pantalla hacia sus propias cuentas -->
  <script src="objetivos_config.js?v=20261005-2033"></script>
  <script src="datos_historial.js?v=20261005-2033"></script>
  <script>
  (function(){
    var H=window.HISTORIAL_DATA||{};

/* Los datos cifrados pueden llegar despues de esta linea. Si eso pasa, la
   pantalla se quedaba vacia para siempre. Ahora los espera y se redibuja. */
(function esperarDatos(){
  /* Los archivos grandes ahora se abren de a pedazos, y avisan al terminar.
     Escuchar ese aviso es mas directo que esperar a que el vigia mire. */
  try{ window.addEventListener('datos-listos', function(){
    try{ if(typeof render==='function') render();
         else if(typeof pintar==='function') pintar();
         else if(typeof dibujar==='function') dibujar();
         else if(typeof init==='function') init(); }catch(e){}
  }); }catch(e){}

  var _i = 0, _t = setInterval(function(){
    if(++_i > 40){ clearInterval(_t); return; }
    if(window.HISTORIAL_DATA && window.HISTORIAL_DATA !== H){
      H = window.HISTORIAL_DATA;
      clearInterval(_t);
      try{ if(typeof render==='function') render();
           else if(typeof pintar==='function') pintar();
           else if(typeof dibujar==='function') dibujar();
           else if(typeof init==='function') init(); }catch(e){}
    }
  }, 200);
})();
    /* == ENTRABAN LOS ENTRENAMIENTOS TAMBIEN ==============================
       El filtro pedia "que tenga resultado", y los entrenamientos traen
       resultado 0-0. Entonces esta pantalla —que se llama "partido a
       partido"— dibujaba 17 puntos donde hay 4 partidos, y como 0 no es
       mayor que 0, los 13 entrenamientos salian marcados como PERDIDOS en
       la tira de arriba. Ahora entran solo los partidos.              */
    var M=(H.entrenamientos||[]).filter(function(m){return m && m.tipo==='P' && m.jugadores && m.resultado;});
    function pd(s){var p=(s||'').split('/');return p.length===3?new Date(+p[2],+p[1]-1,+p[0]):new Date(0);}
    M.sort(function(a,b){return pd(a.fecha)-pd(b.fecha);});
    if(!M.length){document.getElementById('cards').innerHTML='<div class="empty">No hay partidos en el historial.</div>';return;}

    /* == LAS MISMAS CUENTAS QUE EL RESTO DE LA APP ========================
       Aca habia cuatro cuentas propias. La de ataque promediaba el aEff ya
       redondeado de cada jugador pesandolo por sus ataques; las otras tres
       ni siquiera eran eficacias: eran aces%, errores% y % positiva. Ahora
       se suman los conteos crudos de los doce jugadores y la cuenta la hace
       VB_EFF una sola vez, igual que en el panel, la ficha y el plan.    */
    var TCAMPOS=['sT','sPunto','sPos','sAdm','sNeg','sVend','sErr',
                 'rT','rPunto','rPos','rAdm','rNeg','rVend','rErr',
                 'aT','aPunto','aPos','aAdm','aNeg','aVend','aErr',
                 'bT','bPt','bPtPos'];
    function tpc(a,b){ return b>0?Math.round(a/b*100):0; }
    function agg(m){
      var s={}; TCAMPOS.forEach(function(k){s[k]=0;});
      (m.jugadores||[]).forEach(function(j){ TCAMPOS.forEach(function(k){ s[k]+=(j[k]||0); }); });
      var V=window.VB_EFF||{};
      var won=m.resultado.nafels>m.resultado.rival;
      return {
        fecha:m.fecha, rival:m.rival, won:won,
        score:m.resultado.nafels+'-'+m.resultado.rival,
        atk_eff: s.aT&&V.ataque? V.ataque(s):0,
        atk_kill: tpc(s.aPunto,s.aT),
        srv_eff: s.sT&&V.saque? V.saque(s):0,
        srv_err: tpc(s.sErr,s.sT),
        rec_eff: s.rT&&V.recepcion? V.recepcion(s):0,
        rec_pos: tpc(s.rPunto+s.rPos,s.rT),
        blk_pos: tpc(s.bPt+s.bPtPos,s.bT),
        blk: s.bPt
      };
    }
    var D=M.map(agg);

    // resultados strip
    document.getElementById('strip').innerHTML=D.map(function(d){
      return '<div class="res '+(d.won?'w':'l')+'" title="'+d.fecha+' vs '+d.rival+' ('+d.score+')">'+(d.won?'G':'P')+'</div>';
    }).join('');

    function avg(key){var v=D.map(function(d){return d[key];});return Math.round(v.reduce(function(a,b){return a+b;},0)/v.length);}

    // chart: dibuja una o varias series sobre el mismo eje
    function chart(series, opts){
      opts=opts||{};
      var W=440,Hh=156,pl=30,pr=8,pt=12,pb=30, n=D.length;
      var allv=[]; series.forEach(function(s){allv=allv.concat(s.data);});
      var mn=opts.min!=null?opts.min:Math.min.apply(null,allv);
      var mx=opts.max!=null?opts.max:Math.max.apply(null,allv);
      /* si el objetivo queda arriba del mejor partido, la escala se estira
         hasta el: asi la linea entra siempre en el cuadro y se ve cuanto
         falta, en vez de desaparecer justo cuando mas importa. */
      if(opts.meta!=null){ mx=Math.max(mx,opts.meta); mn=Math.min(mn,opts.meta); }
      if(mx===mn){mx=mn+1;}
      var iw=W-pl-pr, ih=Hh-pt-pb;
      function X(i){return pl + (n<=1?iw/2:iw*i/(n-1));}
      function Y(v){return pt + ih*(1-(v-mn)/(mx-mn));}
      var svg='<svg viewBox="0 0 '+W+' '+Hh+'">';
      // gridlines
      [0,.5,1].forEach(function(f){var y=pt+ih*f;var val=Math.round(mx-(mx-mn)*f);
        svg+='<line x1="'+pl+'" y1="'+y+'" x2="'+(W-pr)+'" y2="'+y+'" stroke="#1e2944" stroke-width="1"/>';
        svg+='<text x="'+(pl-5)+'" y="'+(y+3)+'" fill="#475569" font-size="9" text-anchor="end">'+val+'</text>';});
      // zero line si aplica
      if(mn<0&&mx>0){var y0=Y(0);svg+='<line x1="'+pl+'" y1="'+y0+'" x2="'+(W-pr)+'" y2="'+y0+'" stroke="#334155" stroke-width="1" stroke-dasharray="3 3"/>';}
      /* la primera serie es la que manda: llena y gruesa. La segunda es el
         detalle: mas fina y punteada, para que no le gane de un vistazo. */
      series.forEach(function(s,si){
        var sec=si>0;
        var pts=s.data.map(function(v,i){return X(i)+','+Y(v);}).join(' ');
        svg+='<polyline points="'+pts+'" fill="none" stroke="'+s.color+'" stroke-width="'+(sec?1.8:2.5)+'"'
             +(sec?' stroke-dasharray="5 4"':'')+' stroke-linejoin="round" stroke-linecap="round"/>';
        s.data.forEach(function(v,i){svg+='<circle cx="'+X(i)+'" cy="'+Y(v)+'" r="'+(sec?2:2.8)+'" fill="'+s.color+'"/>';});
      });
      /* la linea del objetivo del club, la misma de las baterias */
      if(opts.meta!=null && opts.meta>=mn && opts.meta<=mx){
        var ym=Y(opts.meta);
        svg+='<line x1="'+pl+'" y1="'+ym+'" x2="'+(W-pr)+'" y2="'+ym+'" stroke="rgba(255,255,255,.34)" stroke-width="1" stroke-dasharray="5 4"/>';
        svg+='<text x="'+(W-pr)+'" y="'+(ym-4)+'" fill="#94a3b8" font-size="8" text-anchor="end">objetivo '+opts.meta+'%</text>';
      }
      // marcas G/P abajo
      /* debajo de cada punto, contra quien fue: con cuatro partidos, una G
         suelta no dice nada. */
      D.forEach(function(d,i){
        svg+='<text x="'+X(i)+'" y="'+(Hh-12)+'" fill="'+(d.won?'#4ade80':'#f87171')+'" font-size="8" text-anchor="middle" font-weight="700">'+(d.won?'G':'P')+'</text>';
        var nom=String(d.rival||'').substring(0,9);
        /* el primero y el ultimo se alinean hacia adentro: centrados se
           salian del cuadro y se veian cortados */
        var anc=(i===0)?'start':(i===n-1)?'end':'middle';
        svg+='<text x="'+X(i)+'" y="'+(Hh-2)+'" fill="#64748b" font-size="7.5" text-anchor="'+anc+'">'+nom+'</text>';
      });
      svg+='</svg>';
      return svg;
    }

    /* Los colores son los de la paleta validada del resto de la app y el
       numero que manda en cada tarjeta es el del club; el segundo es el
       detalle, en gris, para que no compitan. */
    var CAT='#0B84C4', CSQ='#CE7C18', CRE='#0E9F6E', CBL='#8B5CF6', CGR='#94a3b8', CER='#DC2A5A';
    var MT=(window.OBJETIVOS_CONFIG&&window.OBJETIVOS_CONFIG.metas)||{};
    function obj(k){ return MT[k]?MT[k].obj:null; }
    var cards=[
      {t:'Ataque', ic:CAT, leg:'<b style="color:'+CAT+'">Eficacia</b> · <b style="color:'+CGR+'">Punto%</b>',
       series:[{data:D.map(function(d){return d.atk_eff;}),color:CAT},{data:D.map(function(d){return d.atk_kill;}),color:CGR}],
       avg:'Promedio por partido \u00b7 eficacia <b>'+avg('atk_eff')+'%</b> · punto <b>'+avg('atk_kill')+'%</b>'},
      {t:'Saque', ic:CSQ, leg:'<b style="color:'+CSQ+'">Eficacia</b> · <b style="color:'+CER+'">Errores%</b>',
       series:[{data:D.map(function(d){return d.srv_eff;}),color:CSQ},{data:D.map(function(d){return d.srv_err;}),color:CER}], min:0, meta:obj('sq'),
       avg:'Promedio por partido \u00b7 eficacia <b>'+avg('srv_eff')+'%</b> (obj. '+obj('sq')+'%) · errores <b>'+avg('srv_err')+'%</b>'},
      {t:'Recepción', ic:CRE, leg:'<b style="color:'+CRE+'">Eficacia</b> · <b style="color:'+CGR+'">% Positiva</b>',
       series:[{data:D.map(function(d){return d.rec_eff;}),color:CRE},{data:D.map(function(d){return d.rec_pos;}),color:CGR}], min:0, max:100, meta:obj('rec'),
       avg:'Promedio por partido \u00b7 eficacia <b>'+avg('rec_eff')+'%</b> (obj. '+obj('rec')+'%) · positiva <b>'+avg('rec_pos')+'%</b>'},
      {t:'Bloqueo', ic:CBL, leg:'<b style="color:'+CBL+'">Blq #+</b>',
       series:[{data:D.map(function(d){return d.blk_pos;}),color:CBL}], min:0, meta:obj('bqpos'),
       avg:'Promedio por partido \u00b7 Blq #+ <b>'+avg('blk_pos')+'%</b> (obj. '+obj('bqpos')+'%) · <b>'+avg('blk')+'</b> puntos de bloqueo por partido'}
    ];
    document.getElementById('cards').innerHTML=cards.map(function(c){
      return '<div class="card"><div class="ch-t"><span class="ic" style="background:'+c.ic+'"></span>'+c.t+'</div>'
        +'<div class="leg">'+c.leg+'</div>'+chart(c.series,{min:c.min,max:c.max,meta:c.meta})
        +'<div class="avg">'+c.avg+'</div></div>';
    }).join('');
  })();
  </script>
<style>@media print{#lang-wrap{display:none!important}}
/* === ENCABEZADO: QUE NO SE ENCIME === */
/* La barra de arriba es un flex en una sola fila. Cuando el titulo es
   largo, los botones de idioma y la etiqueta de temporada se le montan
   encima. Con esto, si no entran, bajan de renglon. */
.header,
.topbar,
.top-bar,
.page-header,
.hdr {
  flex-wrap: wrap;
  gap: 10px 14px;
  row-gap: 10px;
}
/* El titulo puede achicarse en vez de empujar al resto */
.header > div,
.topbar > div,
.top-bar > div,
.page-header > div,
.hdr > div {
  min-width: 0;
}
.header .title,
.topbar .title,
.top-bar .title,
.page-header .title,
.hdr .title {
  min-width: 0;
  overflow-wrap: break-word;
}
/* Los botones de idioma no se estiran ni se parten */
.lang-wrap,
.lang-switch,
.idiomas {
  flex: none;
  white-space: nowrap;
}
@media (max-width: 700px) {
  .header,
  .topbar,
  .top-bar,
  .page-header,
  .hdr {
    align-items: flex-start;
  }
}
</style>
