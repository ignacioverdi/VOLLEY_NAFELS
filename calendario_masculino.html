<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="dark">
<title>Calendario masculino — Axpo Volley Näfels 2026/27</title>
<style>
html,body{margin:0;background:#0d1117}
body{padding:18px}
@media(max-width:640px){body{padding:8px}}
.cal-idiomas{display:flex;gap:6px;justify-content:flex-end;margin:0 0 10px}
.cal-idiomas button{background:#141b24;border:1px solid #242e3c;color:#94a3b8;
  border-radius:7px;padding:5px 11px;font:700 11.5px/1 system-ui,sans-serif;cursor:pointer}
.cal-idiomas button[aria-pressed="true"]{background:#1a2330;color:#e8edf5;border-color:#3b4858}
</style>
<style id="cal-css">
/* ══ CALENDARIO MASCULINO · AXPO VOLLEY NÄFELS ════════════════════════════
   Todo con prefijo .cal- para no pisar nada de modelo_completo.
   Los colores de los equipos son una rampa de un solo tono, de claro a
   oscuro, porque las cinco ligas son una escala (NLA arriba, 4L abajo) y no
   cinco categorias sueltas: cinco tonos distintos no se distinguen entre si
   con seguridad, una rampa ordenada si. Y la sigla va escrita en cada chapa,
   asi que el color nunca es lo unico que identifica al equipo. */
.cal-root{--bg:#0d1117;--card:#141b24;--card2:#1a2330;--linea:#242e3c;
  --tinta:#e8edf5;--mut:#94a3b8;--mut2:#64748b;--rojo:#ef2740;
  --aviso:#fab219;--grave:#d03b3b;
  color-scheme:dark;background:var(--bg);color:var(--tinta);
  font-family:system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
  padding:22px 18px 40px;border-radius:12px;line-height:1.45;text-align:left}
.cal-root *{box-sizing:border-box}
.cal-h1{margin:0 0 4px;font-size:clamp(20px,3.4vw,27px);font-weight:800;
  letter-spacing:-.4px;color:var(--tinta);border:0;padding:0}
.cal-sub{margin:0 0 18px;color:var(--mut);font-size:13.5px}
.cal-sub a{color:#6da7ec}
.cal-kpis{display:flex;flex-wrap:wrap;gap:9px;margin:0 0 18px}
.cal-kpi{background:var(--card);border:1px solid var(--linea);border-radius:9px;
  padding:9px 13px;min-width:92px}
.cal-kpi b{display:block;font-size:21px;font-weight:800;line-height:1.1;color:var(--tinta)}
.cal-kpi span{font-size:10.5px;color:var(--mut);text-transform:uppercase;letter-spacing:.6px}
.cal-barra{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:0 0 7px}
.cal-barra>em{font-style:normal;font-size:10.5px;color:var(--mut2);
  text-transform:uppercase;letter-spacing:.8px;font-weight:700;margin-right:3px}
.cal-tg{display:inline-flex;align-items:center;gap:6px;background:transparent;
  border:1px solid var(--linea);border-radius:20px;padding:5px 11px 5px 8px;
  color:var(--mut);font-size:12px;font-family:inherit;cursor:pointer;font-weight:600}
.cal-tg:hover{border-color:#3b4858;color:var(--tinta)}
.cal-tg .pt{width:10px;height:10px;border-radius:3px;flex:0 0 10px;opacity:.35}
.cal-tg.on{color:var(--tinta);border-color:#3b4858;background:var(--card)}
.cal-tg.on .pt{opacity:1}
.cal-tg2{padding:5px 12px}
.cal-tg2.on{background:rgba(250,178,25,.15);border-color:rgba(250,178,25,.5);color:#fab219}
.cal-busca{flex:1 1 170px;min-width:140px;background:var(--card);color:var(--tinta);
  border:1px solid var(--linea);border-radius:8px;padding:7px 11px;font-size:12.5px;
  font-family:inherit;outline:none}
.cal-busca:focus{border-color:#3987e5}
.cal-cuenta{font-size:12px;color:var(--mut2);margin:0 0 13px}
.cal-wrap{overflow-x:auto;border:1px solid var(--linea);border-radius:10px;background:var(--card);
  -webkit-overflow-scrolling:touch}
table.cal{width:100%;border-collapse:collapse;font-size:13px;min-width:700px;margin:0}
table.cal thead th{position:sticky;top:0;z-index:2;background:#0f1620;
  text-align:left;font-size:10px;letter-spacing:.9px;text-transform:uppercase;
  color:var(--mut);font-weight:700;padding:9px 11px;border-bottom:1px solid var(--linea);
  white-space:nowrap}
table.cal td{padding:8px 11px;border-bottom:1px solid rgba(36,46,60,.6);
  vertical-align:middle;background:transparent}
tr.cal-mes td{background:#0f1620;padding:7px 11px;border-bottom:1px solid var(--linea)}
tr.cal-mes b{font-size:11px;letter-spacing:1.4px;text-transform:uppercase;color:#6da7ec;font-weight:800}
tr.cal-mes span{color:var(--mut2);font-size:11px;margin-left:9px;font-weight:600}
tr.cal-g.multi td{background:rgba(250,178,25,.045)}
tr.cal-g.multi td:first-child{box-shadow:inset 3px 0 0 var(--aviso)}
tr.cal-g:hover td{background:var(--card2)}
tr.cal-g.d0 td{border-top:1px solid var(--linea)}
.cal-f{white-space:nowrap}
.cal-f b{font-size:14px;font-weight:800}
.cal-f i{font-style:normal;color:var(--mut);font-size:11px;display:block;margin-top:1px}
.cal-hora{font-variant-numeric:tabular-nums;font-weight:800;font-size:14px;white-space:nowrap}
.cal-bd{display:inline-block;min-width:34px;text-align:center;border-radius:5px;
  padding:3px 8px;font-size:11px;font-weight:800;letter-spacing:.3px}
.cal-copa{display:inline-block;font-size:9.5px;font-weight:800;letter-spacing:.6px;
  border-radius:4px;padding:2px 6px;margin-left:6px;vertical-align:1px;
  background:rgba(250,178,25,.14);color:#fac44f;border:1px solid rgba(250,178,25,.34)}
.cal-eq{font-weight:500}
.cal-eq.nos{font-weight:800;color:#fff}
.cal-eq.nos::before{content:'';display:inline-block;width:5px;height:5px;border-radius:50%;
  background:var(--rojo);margin-right:6px;vertical-align:1px}
.cal-casa{display:inline-block;font-size:9.5px;font-weight:800;letter-spacing:.6px;
  border-radius:4px;padding:2px 5px;margin-left:7px;vertical-align:1px;
  background:rgba(239,39,64,.14);color:#ff8095;border:1px solid rgba(239,39,64,.3)}
.cal-sede{color:var(--mut);font-size:12px}
.cal-sede a{color:var(--tinta);text-decoration:none;font-weight:600;
  border-bottom:1px dotted #3b4858}
.cal-sede a:hover{color:#6da7ec;border-bottom-color:#6da7ec}
.cal-sede i{font-style:normal;display:block;color:var(--mut2);font-size:11px;margin-top:1px}
.cal-av{display:inline-flex;align-items:center;gap:4px;font-size:10.5px;font-weight:700;
  border-radius:5px;padding:2px 6px;margin-top:3px;white-space:nowrap}
.cal-av.pisa{background:rgba(208,59,59,.16);color:#f08a8a;border:1px solid rgba(208,59,59,.35)}
.cal-av.sede{background:rgba(250,178,25,.14);color:#fac44f;border:1px solid rgba(250,178,25,.32)}
.cal-vacio{padding:34px 16px;text-align:center;color:var(--mut)}
.cal-pie{margin-top:14px;font-size:11.5px;color:var(--mut2);line-height:1.6}
.cal-pie b{color:var(--mut)}
/* en pantalla ancha la fecha repetida se calla: la tabla ya agrupa por dia */
@media(min-width:701px){ td.cal-f.cal-rep > *{display:none} }

/* ══ EN EL TELEFONO NO ES UNA TABLA ═══════════════════════════════════════
   Seis columnas en 390 px obligan a arrastrar de costado para llegar al rival
   y al gimnasio, que es justo lo que uno mira parado en el club. Asi que
   abajo de 700 px cada partido pasa a ser una ficha: fecha arriba, hora y
   equipo en una linea, los dos rivales debajo y el gimnasio al pie. Mismo
   marcado, mismos datos; cambia solo como se acomoda. */
@media(max-width:700px){
  .cal-root{padding:16px 12px 30px}
  .cal-kpi{min-width:0;flex:1 1 44%;padding:8px 10px}
  .cal-wrap{overflow-x:visible;border:0;background:transparent;border-radius:0}
  table.cal{min-width:0;font-size:13px;display:block}
  table.cal thead{display:none}
  table.cal tbody{display:block}
  tr.cal-mes{display:block;background:transparent;border:0;margin:14px 0 7px;padding:0}
  tr.cal-mes td{display:block;background:transparent;border:0;padding:0}
  tr.cal-g{display:grid;grid-template-columns:max-content 1fr;gap:3px 10px;
    grid-template-areas:'f f' 'hora eq' 'loc loc' 'vis vis' 'sede sede';
    background:var(--card);border:1px solid var(--linea);border-radius:10px;
    padding:10px 12px;margin:0 0 8px}
  tr.cal-g.multi{border-color:rgba(250,178,25,.45)}
  tr.cal-g.multi td:first-child{box-shadow:none}
  /* el borde que en la tabla separa un dia del siguiente no corresponde
     acá: con las celdas en bloque dibujaba una raya entre cada renglon */
  tr.cal-g td,
  tr.cal-g.d0 td,
  tr.cal-g.multi td{display:block;border:0;padding:0;background:transparent}
  tr.cal-g:hover td{background:transparent}
  td.cal-f{grid-area:f;margin-bottom:3px}
  td.cal-f b{font-size:13.5px}
  td.cal-f i{display:inline;margin-left:7px;font-size:11.5px}
  td.cal-hora{grid-area:hora;font-size:17px}
  tr.cal-g td:nth-child(3){grid-area:eq;align-self:center}
  tr.cal-g td:nth-child(4){grid-area:loc;margin-top:4px}
  tr.cal-g td:nth-child(5){grid-area:vis}
  td.cal-sede{grid-area:sede;margin-top:6px;padding-top:6px;
    border-top:1px solid rgba(36,46,60,.8)}
  .cal-av{margin-top:5px;margin-right:4px}
}
@media print{
  .cal-root{background:#fff;color:#000;padding:0}
  .cal-barra,.cal-busca,.cal-kpis{display:none}
  .cal-wrap{overflow:visible;border:0}
  table.cal thead th{position:static;background:#eee;color:#000}
  tr.cal-g.multi td{background:#fff8e6}
  .cal-sede a{color:#000}
}

</style>

os":"Teams","cruces":"clashes only","cruceTit":"Show only matches that overlap in time or share a hall","buscar":"Search opponent, hall or town…","buscarAria":"Search","cuenta":"{n} of {t} matches","cFecha":"Date","cHora":"Time","cEquipo":"Team","cLocal":"Home","cVisit":"Away","cSede":"Hall","casa":"HOME","casaTit":"Näfels plays at home","pisa":"overlaps with","pisaTit":"Overlapping kick-off times","sede":"same hall","sedeTit":"Two of our teams in the same hall that day","vacio":"No matches with these filters.","uno":"match","varios":"matches","mapa":"Open in maps","copa":"Not a league match","fdia":"{d} {m}","dias":["Monday","Tuesday","Wednesday","Thursday","Friday","Saturday","Sunday"],"meses":["January","February","March","April","May","June","July","August","September","October","November","December"],"ligas":{"NLA":"NLA","1L":"1. Liga","2L":"2. Liga","3L":"3. Liga","4L":"4. Liga"},"pieTit":"How to read it.","pie":"Rows with a yellow edge are days with more than one club match. <b>&#9888; overlaps with</b> marks the ones that clash in time (each match is counted as two hours). <b>&#9679; same hall</b>, two of our teams in the same venue that day. The red dot marks Näfels, and <b>HOME</b> that it plays at home. The hall name opens the map on the exact spot.","pie2":"The warnings follow the filters: switch a team off and it stops counting as a clash."},"de":{"tit":"Spielplan Männer · Axpo Volley Näfels","sub":"Alle fünf Männerteams des Vereins in einer Tabelle, Saison 2026/27. Daten von {fuente} · Stand {fecha}.","k1":"Spiele","k2":"Spieltage","k3":"Tage mit 2 oder mehr","k4":"Tage mit Konflikt","equipos":"Teams","cruces":"nur Konflikte","cruceTit":"Nur Spiele zeigen, die sich zeitlich überschneiden oder dieselbe Halle teilen","buscar":"Gegner, Halle oder Ort suchen…","buscarAria":"Suchen","cuenta":"{n} von {t} Spielen","cFecha":"Datum","cHora":"Zeit","cEquipo":"Team","cLocal":"Heim","cVisit":"Auswärts","cSede":"Halle","casa":"HEIM","casaTit":"Näfels spielt zu Hau /* ══ CALENDARIO MASCULINO · la logica ══════════════════════════════════════
   Un solo bloque que sirve suelto y pegado adentro de modelo_completo.

   El idioma sale de window.LANG cuando existe —modelo_completo lo define y lo
   cambia con sus botones ES/DE/EN— y si no, del navegador. Asi el mismo
   archivo anda en los dos lados sin una linea distinta.

   Los listeners van DELEGADOS en document y se enganchan una sola vez: dentro
   de modelo_completo el render() reemplaza #contenido entero cada vez que
   cambia de solapa o de idioma, y unos listeners puestos sobre los botones se
   perderian en el primer cambio. */
(function () {
  if (window.CALENDARIO) return;              /* ya montado */
  var D = window.__CAL_DATOS, TXT = window.__CAL_TXT;
  if (!D || !TXT) return;

  var EST = { eq: {}, soloCruce: false, texto: '' };
  D.orden.forEach(function (k) { EST.eq[k] = true; });

  /* El idioma puede venir de tres lados, en este orden:
       1. el que nos pasen con setLang() — es el caso de modelo_completo, que
          declara su LANG con 'let' y por eso NO queda colgado de window:
          leerlo de ahi no funciona y hay que recibirlo;
       2. lo que haya guardado la app en vb_lang;
       3. el idioma del dispositivo, y si no es uno de los tres, ingles. */
  var FORZADO = null;
  function idioma() {
    if (FORZADO && TXT[FORZADO]) return FORZADO;
    var l = (typeof window.LANG === 'string' && window.LANG) || '';
    if (!l) { try { l = (localStorage.getItem('vb_lang') || ''); } catch (e) {} }
    if (!l) { try { l = (navigator.language || '').slice(0, 2).toLowerCase(); } catch (e) {} }
    return TXT[l] ? l : (TXT.en ? 'en' : 'es');
  }
  function setLang(l) { FORZADO = (l && TXT[l]) ? l : null; }
  function t() { return TXT[idioma()]; }

  function esc(s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;')
      .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }
  /* El punto exacto que registra la federacion. Buscar por nombre y direccion
     devuelve a veces otra cosa a 300 m —probado—, asi que va por coordenadas. */
  function mapa(g) {
    return 'https://www.google.com/maps/search/?api=1&query=' + g.lat + ',' + g.lon;
  }
  function minutos(h) { return (+h.slice(0, 2)) * 60 + (+h.slice(3)); }

  /* ── EL CRUCE SE CALCULA SOBRE LO QUE SE ESTA VIENDO ────────────────────
     Si apagas un equipo, sus cruces dejan de ser cruces. Por eso esto corre
     despues de filtrar y no sobre la temporada entera. */
  function cruces(lista) {
    var dia = {};
    lista.forEach(function (g) { (dia[g.fecha] = dia[g.fecha] || []).push(g); });
    lista.forEach(function (g) {
      var v = dia[g.fecha], gm = minutos(g.hora);
      g._pisa = v.filter(function (o) {
        return o !== g && Math.abs(gm - minutos(o.hora)) < 120;
      }).map(function (o) { return D.equipos[o.eq].corto; });
      g._sede = v.filter(function (o) { return o.hid === g.hid; }).length > 1;
      g._nDia = v.length;
    });
    return dia;
  }
  function visibles() {
    var q = EST.texto.trim().toLowerCase();
    var base = D.juegos.filter(function (g) {
      if (!EST.eq[g.eq]) return false;
      if (q) {
        var h = (g.loc + ' ' + g.vis + ' ' + g.hall + ' ' + g.ciudad + ' ' + g.liga).toLowerCase();
        if (h.indexOf(q) < 0) return false;
      }
      return true;
    });
    cruces(base);
    if (!EST.soloCruce) return base;
    var fin = base.filter(function (g) { return g._pisa.length || g._sede; });
    cruces(fin);
    return fin;
  }

  function filas() {
    var T = t(), lista = visibles();
    if (!lista.length)
      return '<tr><td colspan="6" class="cal-vacio">' + esc(T.vacio) + '</td></tr>';

    var porDia = {};
    lista.forEach(function (g) { (porDia[g.fecha] = porDia[g.fecha] || []).push(g); });

    var h = '', mes = '', fecha = '';
    lista.forEach(function (g) {
      var d = new Date(g.fecha + 'T00:00:00');
      var mk = g.fecha.slice(0, 7);
      if (mk !== mes) {
        mes = mk;
        var nM = lista.filter(function (x) { return x.fecha.slice(0, 7) === mes; }).length;
        h += '<tr class="cal-mes"><td colspan="6"><b>' +
             esc(T.meses[d.getMonth()] + ' ' + d.getFullYear()) + '</b><span>' +
             nM + ' ' + esc(nM === 1 ? T.uno : T.varios) + '</span></td></tr>';
        fecha = '';
      }
      var nd = porDia[g.fecha].length, nuevo = (g.fecha !== fecha);
      if (nuevo) fecha = g.fecha;

      var E = D.equipos[g.eq];
      var mio = function (n) {
        var nuestro = n.indexOf('Axpo Volley Näfels') === 0;
        return '<span class="cal-eq' + (nuestro ? ' nos' : '') + '">' + esc(n) + '</span>';
      };
      var casa = g.loc.indexOf('Axpo Volley Näfels') === 0;
      /* casi siempre la competencia ES la liga del equipo; cuando no (la
         Supercup) hay que decirlo o se lee como un partido de liga */
      var copa = (g.liga !== g.eq)
        ? '<span class="cal-copa" title="' + esc(T.copa) + '">' + esc(g.liga) + '</span>' : '';
      var dow = T.dias[(d.getDay() + 6) % 7];

      h += '<tr class="cal-g' + (nd > 1 ? ' multi' : '') + (nuevo ? ' d0' : '') + '">';
      /* La fecha se escribe SIEMPRE, aunque la fila repita dia: en el telefono
         cada partido es una ficha suelta y sin fecha no se entiende. En
         pantalla ancha la repetida se oculta por CSS, que es donde la tabla
         agrupa por dia. */
      h += '<td class="cal-f' + (nuevo ? '' : ' cal-rep') + '">' +
            '<b>' + esc(T.fdia.replace('{d}', d.getDate()).replace('{m}', T.meses[d.getMonth()])) +
            '</b><i>' + esc(dow) + (nd > 1 ? ' · ' + nd + ' ' + esc(T.varios) : '') + '</i></td>';
      h += '<td class="cal-hora">' + esc(g.hora) + '</td>';
      h += '<td style="white-space:nowrap"><span class="cal-bd" style="background:' + E.bg +
             ';color:' + E.fg + '" title="' + esc('Axpo Volley Näfels — ' + T.ligas[g.eq]) +
             '">' + esc(E.corto) + '</span>' + copa + '</td>';
      h += '<td>' + mio(g.loc) +
             (casa ? '<span class="cal-casa" title="' + esc(T.casaTit) + '">' + esc(T.casa) + '</span>' : '') + '</td>';
      h += '<td>' + mio(g.vis) + '</td>';
      h += '<td class="cal-sede"><a href="' + mapa(g) + '" target="_blank" rel="noopener" title="' +
             esc(T.mapa + ': ' + g.calle + ', ' + g.ciudad) + '">' + esc(g.hall) + '</a><i>' +
             esc(g.ciudad) + '</i>';
      if (g._pisa.length)
        h += '<span class="cal-av pisa" title="' + esc(T.pisaTit) + '">&#9888; ' +
             esc(T.pisa + ' ' + g._pisa.join(', ')) + '</span>';
      if (g._sede)
        h += '<span class="cal-av sede" title="' + esc(T.sedeTit) + '">&#9679; ' +
             esc(T.sede) + '</span>';
      h += '</td></tr>';
    });
    return h;
  }

  function pintar() {
    var cuerpo = document.getElementById('cal-body');
    if (!cuerpo) return;
    cuerpo.innerHTML = filas();
    var c = document.getElementById('cal-cuenta');
    if (c) c.textContent = t().cuenta
      .replace('{n}', visibles().length).replace('{t}', D.juegos.length);
  }

  function html() {
    var T = t();
    var tg = D.orden.map(function (k) {
      var E = D.equipos[k];
      return '<button type="button" class="cal-tg' + (EST.eq[k] ? ' on' : '') +
             '" data-cal-eq="' + k + '" title="' + esc('Axpo Volley Näfels — ' + T.ligas[k]) + '">' +
             '<span class="pt" style="background:' + E.bg + '"></span>' + esc(E.corto) + '</button>';
    }).join('');

    var fuente = '<a href="https://www.volleyball.ch/de/game-center/club/914190/team/1" ' +
                 'target="_blank" rel="noopener">volleyball.ch</a>';

    return '<div class="cal-root" id="cal-nafels">' +
      '<h1 class="cal-h1">' + esc(T.tit) + '</h1>' +
      '<p class="cal-sub">' + esc(T.sub).replace('{fuente}', fuente)
          .replace('{fecha}', esc(D.generado)) + '</p>' +
      '<div class="cal-kpis">' +
        '<div class="cal-kpi"><b>' + D.juegos.length + '</b><span>' + esc(T.k1) + '</span></div>' +
        '<div class="cal-kpi"><b>' + D.nDias + '</b><span>' + esc(T.k2) + '</span></div>' +
        '<div class="cal-kpi"><b>' + D.nMulti + '</b><span>' + esc(T.k3) + '</span></div>' +
        '<div class="cal-kpi"><b>' + D.nCruce + '</b><span>' + esc(T.k4) + '</span></div>' +
      '</div>' +
      '<div class="cal-barra"><em>' + esc(T.equipos) + '</em>' + tg +
        '<button type="button" class="cal-tg cal-tg2' + (EST.soloCruce ? ' on' : '') +
          '" data-cal-cruce="1" title="' + esc(T.cruceTit) + '">&#9888; ' + esc(T.cruces) + '</button>' +
        '<input id="cal-busca" class="cal-busca" type="search" value="' + esc(EST.texto) +
          '" placeholder="' + esc(T.buscar) + '" aria-label="' + esc(T.buscarAria) + '">' +
      '</div>' +
      '<p class="cal-cuenta" id="cal-cuenta"></p>' +
      '<div class="cal-wrap"><table class="cal"><thead><tr>' +
        '<th>' + esc(T.cFecha) + '</th><th>' + esc(T.cHora) + '</th><th>' + esc(T.cEquipo) + '</th>' +
        '<th>' + esc(T.cLocal) + '</th><th>' + esc(T.cVisit) + '</th><th>' + esc(T.cSede) + '</th>' +
      '</tr></thead><tbody id="cal-body"></tbody></table></div>' +
      '<p class="cal-pie"><b>' + esc(T.pieTit) + '</b> ' + T.pie + '<br>' + esc(T.pie2) + '</p>' +
    '</div>';
  }

  var montado = false;
  function montar() {
    if (montado) return;
    montado = true;
    document.addEventListener('click', function (e) {
      var b = e.target && e.target.closest
            ? e.target.closest('[data-cal-eq],[data-cal-cruce]') : null;
      if (!b) return;
      if (b.hasAttribute('data-cal-eq')) {
        var k = b.getAttribute('data-cal-eq');
        EST.eq[k] = !EST.eq[k];
        b.classList.toggle('on', EST.eq[k]);
      } else {
        EST.soloCruce = !EST.soloCruce;
        b.classList.toggle('on', EST.soloCruce);
      }
      pintar();
    });
    document.addEventListener('input', function (e) {
      if (e.target && e.target.id === 'cal-busca') { EST.texto = e.target.value; pintar(); }
    });
  }

  window.CALENDARIO = { html: html, pintar: pintar, montar: montar,
                        setLang: setLang, idioma: idioma, estado: EST };

  /* Suelto: si la pagina trae el hueco, se dibuja solo. Dentro de
     modelo_completo no hay hueco y lo llama vCal(). */
  function solo() {
    var h = document.getElementById('cal-hueco');
    if (!h) return;
    h.innerHTML = html();
    montar(); pintar();
  }
  if (document.readyState === 'loading')
    document.addEventListener('DOMContentLoaded', solo);
  else solo();
})();

</script>
</head>
<body>
<div class="cal-idiomas">
  <button data-l="es" aria-pressed="false">ES</button>
  <button data-l="en" aria-pressed="false">EN</button>
  <button data-l="de" aria-pressed="false">DE</button>
</div>
<div id="cal-hueco"></div>
<script>
/* El selector de idioma de la version suelta. Adentro de modelo_completo no
   hace falta: alli manda el ES/DE/EN que ya tiene la cabecera. */
(function(){
  function actual(){
    var l=''; try{ l=localStorage.getItem('vb_lang')||''; }catch(e){}
    if(!l){ try{ l=(navigator.language||'').slice(0,2).toLowerCase(); }catch(e){} }
    return ({es:1,en:1,de:1})[l] ? l : 'en';
  }
  function poner(l){
    window.LANG = l;
    try{ localStorage.setItem('vb_lang', l); }catch(e){}
    document.documentElement.lang = l;
    document.querySelectorAll('.cal-idiomas button').forEach(function(b){
      b.setAttribute('aria-pressed', String(b.dataset.l===l));
    });
    var h=document.getElementById('cal-hueco');
    h.innerHTML = CALENDARIO.html(); CALENDARIO.montar(); CALENDARIO.pintar();
  }
  document.querySelectorAll('.cal-idiomas button').forEach(function(b){
    b.onclick=function(){ poner(b.dataset.l); };
  });
  poner(actual());
})();
</script>
</body>
