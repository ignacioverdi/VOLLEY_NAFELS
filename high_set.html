<script>
/* ══ HIGH SET ══════════════════════════════════════════════════════════════
   Solo el fundamento E (armado) con tipo H (pelota alta), solo nuestro club y
   solo la carpeta del ejercicio. En el DVW se ve asi:

       *11EH#K1F~3C~~~-1     E armado · H alta · # valoracion

   El puntaje ordena la tabla, pero se muestra tambien el PROMEDIO por armado:
   con este baremo el que mas arma gana casi siempre, y el promedio compara
   parejo a uno con 11 armados contra uno con 2.

   Las valoraciones (#, +, !, -, /, =) NO se traducen nunca: son estandar de
   DataVolley y van igual en los tres idiomas. Si se traducen sus etiquetas,
   que son texto comun.                                                      */

var CLUB = 'nafels';          /* en la PLANTILLA esto es {{club}} */

var BAREMO = [
  {ev:'#', pts: 2,   color:'var(--ev-pos)',   k:'hs_perfecto', txt:'perfecto'},
  {ev:'+', pts: 1,   color:'var(--ev-plus)',  k:'hs_bueno',    txt:'bueno'},
  {ev:'!', pts: 0,   color:'var(--ev-excl)',  k:'hs_neutro',   txt:'neutro'},
  {ev:'-', pts:-1,   color:'var(--ev-neg)',   k:'hs_malo',     txt:'malo'},
  {ev:'/', pts:-1.5, color:'var(--ev-slash)', k:'hs_vendida',  txt:'vendida'},
  {ev:'=', pts:-2,   color:'var(--ev-err)',   k:'hs_error',    txt:'error'}
];
var ORDEN = BAREMO.map(function(b){ return b.ev; });
var PTS   = {}; BAREMO.forEach(function(b){ PTS[b.ev] = b.pts; });
function baremoDe(ev){ return BAREMO.filter(function(b){ return b.ev === ev; })[0]; }

function fCorta(f){
  if(!f) return '';
  var q = String(f).split('-');
  return q.length === 3 ? (q[2]+'/'+q[1]+'/'+q[0].slice(2)) : String(f);
}
function num(n){ return (Math.round(n*10)/10).toString().replace('.',','); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, function(c){
  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }

/* Todos los armados de alta, ya filtrados, con su sesion */
function armados(){
  var D = (window.HIGH_SET_DATA && HIGH_SET_DATA.matches) || {};
  var out = [];
  Object.keys(D).forEach(function(cod){
    var m = D[cod] || {};
    (m.actions || []).forEach(function(a){
      if(a.skill !== 'E') return;
      if(a.ty    !== 'H') return;
      if(a.tm    !== CLUB) return;
      out.push({num:a.num, name:a.name, ev:a.ev,
                cod:cod, fecha:m.date || '', temp:m.season || ''});
    });
  });
  return out;
}

/* La foto sale de datos_equipo.js si esta; si no, el dorsal */
function fotoDe(nombre, dorsal){
  var E = (window.EQUIPO_DATA && EQUIPO_DATA.jugadores) || [];
  var j = E.filter(function(x){
    return (x.nombre && x.nombre === nombre) || String(x.num) === String(dorsal);
  })[0];
  return (j && j.foto) ? j.foto : null;
}

function llenarFiltros(A){
  var temps = {}, ses = {};
  A.forEach(function(a){ if(a.temp) temps[a.temp] = 1; ses[a.cod] = a.fecha; });

  var t = document.getElementById('f-temp');
  var ordT = Object.keys(temps).sort().reverse();
  t.innerHTML = '<option value="" data-t="hs_todas">Todas</option>' +
    ordT.map(function(x){ return '<option value="'+esc(x)+'">'+esc(x)+'</option>'; }).join('');
  if(ordT.length) t.value = ordT[0];

  var s = document.getElementById('f-ses');
  var ordS = Object.keys(ses).sort(function(a,b){
    return String(ses[b]).localeCompare(String(ses[a]));
  });
  s.innerHTML = '<option value="" data-t="hs_acumulado">Acumulado (todas)</option>' +
    ordS.map(function(c){ return '<option value="'+esc(c)+'">'+(fCorta(ses[c])||esc(c))+'</option>'; }).join('');
}

function pintarBaremo(){
  document.getElementById('baremo').innerHTML = BAREMO.map(function(b){
    return '<div class="bar-it"><b data-notr style="color:'+b.color+'">'+b.ev+'</b>'+
           '<span class="pts" data-notr>'+(b.pts>0?'+':'')+num(b.pts)+'</span>'+
           '<span data-t="'+b.k+'" style="color:var(--muted2);font-size:11px">'+b.txt+'</span></div>';
  }).join('');
}

function pintarPodio(lista){
  var wrap = document.getElementById('podio-wrap');
  var el   = document.getElementById('podio');
  if(lista.length < 3){ wrap.style.display = 'none'; return; }
  wrap.style.display = 'block';
  var vis = [lista[1], lista[0], lista[2]];     /* orden visual: 2° 1° 3° */
  var cls = ['p2','p1','p3'], lab = ['2°','1°','3°'];
  el.innerHTML = vis.map(function(j, i){
    if(!j) return '';
    var f = fotoDe(j.name, j.num);
    var av = f
      ? '<img src="'+esc(f)+'" alt="'+esc(j.name)+'">'
      : '<div class="podio-avatar-num">#'+esc(j.num)+'</div>';
    return '<div class="podio-item '+cls[i]+'">'+
             '<div class="podio-avatar">'+av+'</div>'+
             '<div class="podio-nombre">'+esc(j.name||('#'+j.num))+'</div>'+
             '<div class="podio-pts">'+j.tot+'</div>'+
             '<div class="podio-base">'+
               '<div class="podio-rank" data-notr>'+lab[i]+'</div>'+
               '<div class="podio-pts-base" data-notr>'+(j.pts>0?'+':'')+num(j.pts)+'</div>'+
             '</div>'+
           '</div>';
  }).join('');
  /* si la foto no carga, queda el dorsal en vez de un cuadro roto */
  Array.prototype.forEach.call(el.querySelectorAll('.podio-avatar img'), function(img){
    img.onerror = function(){
      var n = this.getAttribute('data-num') || '';
      this.parentElement.innerHTML = '<div class="podio-avatar-num">#' + n + '</div>';
    };
  });
}

function pintar(){
  var A     = armados();
  var temp  = document.getElementById('f-temp').value;
  var ses   = document.getElementById('f-ses').value;
  var minim = parseInt(document.getElementById('f-min').value, 10) || 1;
  if(temp) A = A.filter(function(a){ return a.temp === temp; });
  if(ses)  A = A.filter(function(a){ return a.cod  === ses;  });

  var out = document.getElementById('salida');

  if(!A.length){
    document.getElementById('podio-wrap').style.display = 'none';
    out.innerHTML = '<div class="vacio"><b data-t="hs_vacio_t">Todavía no hay sesiones del ejercicio.</b><br><br>'+
      '<span data-t="hs_vacio_d">Poné el .dvw del ejercicio en su carpeta, corré HACER_TODO y publicá.</span><br><br>'+
      '<code data-notr>DVW HIGH SET NAFELS 2026</code></div>';
    traducir(); return;
  }

  var J = {};
  A.forEach(function(a){
    var k = a.num;
    if(!J[k]){ J[k] = {num:a.num, name:a.name, tot:0, pts:0}; ORDEN.forEach(function(e){ J[k][e] = 0; }); }
    var j = J[k];
    j.tot++;
    if(PTS[a.ev] !== undefined){ j[a.ev]++; j.pts += PTS[a.ev]; }
  });

  /* Manda el PUNTAJE. Si dos empatan, decide el promedio por armado: con los
     mismos puntos, el que los hizo en menos armados fue mas eficiente.
     Si tambien empatan ahi, gana el que mas armo. */
  var lista = Object.keys(J).map(function(k){ return J[k]; })
    .filter(function(j){ return j.tot >= minim; })
    .sort(function(a,b){
      if(b.pts !== a.pts) return b.pts - a.pts;
      var pa = a.tot ? a.pts / a.tot : 0, pb = b.tot ? b.pts / b.tot : 0;
      if(pb !== pa) return pb - pa;
      return b.tot - a.tot;
    });

  if(!lista.length){
    document.getElementById('podio-wrap').style.display = 'none';
    out.innerHTML = '<div class="vacio" data-t="hs_sin_min">Ningún jugador llega al mínimo con este filtro.</div>';
    traducir(); return;
  }

  pintarPodio(lista);

  var sum = {tot:0, pts:0}; ORDEN.forEach(function(e){ sum[e] = 0; });
  lista.forEach(function(j){
    sum.tot += j.tot; sum.pts += j.pts;
    ORDEN.forEach(function(e){ sum[e] += j[e]; });
  });
  var promEq = sum.tot ? sum.pts / sum.tot : 0;

  var filas = lista.map(function(j, i){
    var pos = i + 1, prom = j.tot ? j.pts / j.tot : 0;
    return '<tr>'+
      '<td class="pos r'+pos+'" data-notr>'+pos+'</td>'+
      '<td class="izq jug" data-notr><span class="dorsal">'+esc(j.num)+'</span>'+esc(j.name||'')+'</td>'+
      ORDEN.map(function(e){
        var b = baremoDe(e);
        return '<td'+(j[e] ? ' style="color:'+b.color+';font-weight:600"' : ' class="cero"')+'>'+j[e]+'</td>';
      }).join('')+
      '<td class="total">'+j.tot+'</td>'+
      '<td class="punt '+(j.pts>=0?'bien':'mal')+'">'+(j.pts>0?'+':'')+num(j.pts)+'</td>'+
      '<td class="prom">'+(prom>0?'+':'')+num(prom)+'</td>'+
    '</tr>';
  }).join('');

  out.innerHTML =
    '<div class="tabla"><table>'+
      '<thead><tr><th></th><th class="izq" data-t="hs_jugador">Jugador</th>'+
        ORDEN.map(function(e){ return '<th data-notr style="color:'+baremoDe(e).color+'">'+e+'</th>'; }).join('')+
        '<th data-t="hs_armados">Armados</th><th data-t="hs_puntos">Puntos</th><th data-t="hs_prom">Prom.</th>'+
      '</tr></thead><tbody>'+filas+'</tbody>'+
      '<tfoot><tr><td></td><td class="izq" data-t="hs_equipo">Equipo</td>'+
        ORDEN.map(function(e){ return '<td>'+sum[e]+'</td>'; }).join('')+
        '<td>'+sum.tot+'</td><td>'+(sum.pts>0?'+':'')+num(sum.pts)+'</td>'+
        '<td>'+(promEq>0?'+':'')+num(promEq)+'</td>'+
      '</tr></tfoot></table></div>' + nota(A);
  traducir();
}

/* Aviso honesto: si casi todo cayo en la misma valoracion, la tabla no mide
   calidad. En este ejercicio no deberia pasar —se gradua armado por armado—,
   pero si el .dvw entra sin graduar, mejor que avise. */
function nota(A){
  var c = {}; A.forEach(function(a){ c[a.ev] = (c[a.ev]||0) + 1; });
  var top = Object.keys(c).sort(function(x,y){ return c[y]-c[x]; })[0];
  if(!top) return '';
  var pc = Math.round(100 * c[top] / A.length);
  if(pc < 85) return '';
  return '<div class="nota"><b>Ojo con leer este ranking como calidad.</b> '+
    'El '+pc+'% de los armados están valorados <code data-notr>'+esc(top)+'</code>, así que la tabla '+
    'está ordenando sobre todo por cantidad. Revisá que el ejercicio se haya scouteado '+
    'graduando cada armado y no con la valoración por defecto.</div>';
}

/* lang.js traduce lo que ya esta en pantalla. La tabla se dibuja despues, asi
   que hay que volver a pedirselo en cada repintado. */
function traducir(){
  try{ if(typeof applyLang === 'function') applyLang(); }catch(e){}
}
