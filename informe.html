<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Informe de partido</title>
<style>
:root{--bg:#0d1017;--sur:#141922;--card:#1a2029;--card2:#212936;--b:#2a3441;--b2:#38445a;
      --txt:#e8edf5;--mut:#8b97ab;--dim:#5f6b7f;--ok:#3ddc84;--bad:#ff5f6d;--warn:#e6a743;
      --loc:#e6a743;--vis:#4fc3f7}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--txt);font-family:system-ui,-apple-system,'Segoe UI',sans-serif}

.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:10px;flex-wrap:wrap;
     padding:12px 18px;background:var(--sur);border-bottom:1px solid var(--b)}
.top h1{margin:0;font-size:14px;letter-spacing:1.5px;text-transform:uppercase}
.crece{flex:1}
button,select{background:var(--card2);border:1px solid var(--b2);color:var(--txt);border-radius:8px;
       padding:7px 13px;font-size:12.5px;font-weight:600;cursor:pointer;font-family:inherit}
button:hover{border-color:var(--ok)}
button.pri{background:var(--ok);border-color:var(--ok);color:#0d1017}
#estado{font-size:12px;color:var(--dim)}

.hoja{max-width:1180px;margin:0 auto;padding:22px 18px 70px}
.cab{display:flex;align-items:flex-end;gap:18px;flex-wrap:wrap;
     border-bottom:2px solid var(--b2);padding-bottom:14px;margin-bottom:18px}
.cab .tit{font-size:24px;font-weight:800;letter-spacing:.5px}
.cab .sub{color:var(--mut);font-size:13px;margin-top:3px}
.marc{margin-left:auto;text-align:right}
.marc .res{font-size:30px;font-weight:800;letter-spacing:2px}
.marc .parc{color:var(--mut);font-size:12.5px;font-family:ui-monospace,monospace;margin-top:3px}

h2.eq{font-size:15px;letter-spacing:1px;text-transform:uppercase;margin:26px 0 10px;
      padding-left:10px;border-left:3px solid var(--loc)}
h2.eq.v{border-left-color:var(--vis)}

table{width:100%;border-collapse:collapse;font-size:12.5px}
th,td{padding:6px 7px;text-align:center;border-bottom:1px solid var(--b)}
th{font-size:10px;letter-spacing:.6px;text-transform:uppercase;color:var(--mut);font-weight:700;
   background:var(--card2);white-space:nowrap}
thead tr.grupos th{background:var(--card);color:var(--dim);border-bottom:2px solid var(--b2);font-size:10.5px}
td.jug{text-align:left;font-weight:700;white-space:nowrap}
td.num{color:var(--dim);font-family:ui-monospace,monospace}
tbody tr:hover{background:var(--card)}
tr.tot td{border-top:2px solid var(--b2);font-weight:800;background:var(--card2)}
.g{color:var(--ok)} .r{color:var(--bad)} .m{color:var(--dim)}
.nota{font-weight:800}
.sep{border-left:1px solid var(--b2)}

.pie{margin-top:26px;padding-top:14px;border-top:1px solid var(--b);color:var(--dim);font-size:11.5px;line-height:1.7}
.vacio{text-align:center;color:var(--dim);padding:60px 20px;font-size:14px;line-height:1.7}

@media print{
  body{background:#fff;color:#000}
  .top,.pie .noprint{display:none!important}
  .hoja{max-width:100%;padding:0}
  th{background:#eee!important;color:#000!important;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  tr.tot td{background:#f4f4f4!important;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  td,th{border-bottom:1px solid #ccc}
  .g{color:#0a7d3c!important} .r{color:#b3261e!important} .m{color:#777!important}
  h2.eq{border-left-color:#000}
  @page{size:A4 landscape;margin:12mm}
}
</style>
</head>
<body>

<div class="top">
  <h1>Informe de partido</h1>
  <select id="fset" onchange="pintar()"><option value="">Partido completo</option></select>
  <div class="crece"></div>
  <span id="estado"></span>
  <button onclick="traerDeLaNube()">Traer de la nube</button>
  <button onclick="compartir()">Compartir</button>
  <button class="pri" onclick="window.print()">Descargar PDF</button>
</div>

<div class="hoja" id="hoja">
  <div class="vacio">Buscando el partido…</div>
</div>

<script src="datos_seguros.js" onerror="void 0"></script>
<script src="firebase.js" onerror="void 0"></script>
<script>
/* ══════════════════════════════════════════════════════════════════════════
   INFORME DE PARTIDO
   --------------------------------------------------------------------------
   Mismo contenido que el report de DataVolley (manual 9.7.1): estadísticas
   por jugador de cada equipo, con la nota calculada con las fórmulas del
   manual (9.7.1.1), y la posibilidad de ver el partido entero o set por set.

   De dónde saca el partido:
     1) el que está abierto en ESTA computadora (el scout)
     2) si no hay, el que esté en la nube (para verlo desde la tablet o
        desde otra máquina, sin depender de la PC del scout)
   ══════════════════════════════════════════════════════════════════════════ */
var M = null;

function est(t,c){ var e=document.getElementById('estado'); e.textContent=t||''; e.style.color=c||'var(--dim)'; }
function esc(t){ return String(t==null?'':t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

/* ── de dónde viene el partido ─────────────────────────────────────────── */
function local(){
  try{ return JSON.parse(localStorage.getItem('pv_match')||'null'); }catch(e){ return null; }
}
function traerDeLaNube(){
  if(typeof FB_URL==='undefined' || typeof _fbSufijo!=='function'){ est('sin conexión','var(--bad)'); return; }
  est('buscando…');
  _fbSufijo().then(function(q){
    return fetch(FB_URL+'/pv_encurso.json'+q).then(function(r){ return r.json(); });
  }).then(function(d){
    if(!d){ est('no hay partidos en la nube','var(--warn)'); return; }
    var ks = Object.keys(d).filter(function(k){ return d[k] && d[k].M; });
    if(!ks.length){ est('no hay partidos en la nube','var(--warn)'); return; }
    ks.sort(function(a,b){ return (d[b].actualizado||0)-(d[a].actualizado||0); });
    var elegido = ks[0];
    if(ks.length>1){
      var lista = ks.map(function(k,i){
        var r=d[k].resumen||{};
        return (i+1)+') '+(r.home||'?')+' vs '+(r.away||'?')+(d[k].autor?'  ·  '+d[k].autor:'');
      }).join('\n');
      var n = prompt('¿Cuál querés?\n\n'+lista+'\n\nEscribí el número:', '1');
      if(!n) { est(''); return; }
      elegido = ks[Math.max(0, Math.min(ks.length-1, parseInt(n,10)-1))];
    }
    M = d[elegido].M;
    est('traído de la nube ✓','var(--ok)');
    armarSets(); pintar();
  }).catch(function(){ est('no pude conectarme','var(--bad)'); });
}

/* ── lectura de los códigos ────────────────────────────────────────────── */
/* Un código normalizado es posicional:  *01SQ#~~~15
     [0] equipo · [1..2] nº jugador · [3] destreza · [4] tipo · [5] evaluación   */
function leer(c){
  var s = c.c || '';
  if(s.length < 6) return null;
  return { lado: s[0]==='*' ? 'home' : 'away',
           num : parseInt(s.slice(1,3),10),
           sk  : s[3].toUpperCase(),
           ev  : s[5],
           set : c.set };
}
function jugadas(setSel){
  return (M.codes||[]).filter(function(c){
    if(c.k !== 'play') return false;
    if(setSel && String(c.set) !== String(setSel)) return false;
    return true;
  }).map(leer).filter(Boolean);
}

/* ── las notas, tal cual el manual 9.7.1.1 ─────────────────────────────── */
function notaSaque(x){
  if(!x.s_tot) return null;
  var v = (x.s_err*0 + x.s_mal*4 + x.s_pos*7 + x.s_med*8 + x.s_pt*10) / x.s_tot;
  return Math.max(5.5, v);
}
function notaRec(x){
  if(!x.r_tot) return null;
  var v = (x.r_err*(-3) + x.r_med*(-3) + x.r_mal*(-1) + x.r_pos*7 + x.r_perf*10) / x.r_tot;
  return Math.max(5.5, v);
}
function notaAtk(x){
  if(!x.a_tot) return null;
  var v = (x.a_err*0 + x.a_blo*0 + x.a_mal*5 + x.a_pos*5 + x.a_pt*10) / x.a_tot;
  return Math.max(5.5, v);
}
function notaBlq(x, sets){
  if(!sets) return null;
  if(x.b_pt >= sets*1)   return 8.5;
  if(x.b_pt >= sets*0.8) return 8;
  if(x.b_pt >= sets*0.5) return 7;
  return null;
}

/* ── el cálculo ────────────────────────────────────────────────────────── */
function calcular(setSel){
  var J = jugadas(setSel), eq = {home:{}, away:{}}, tot = {home:0, away:0};
  var sets = {};
  (M.codes||[]).forEach(function(c){ if(c.set) sets[c.set]=1; });
  var nSets = setSel ? 1 : Object.keys(sets).length || 1;

  function ficha(l,n){
    var t = eq[l];
    if(!t[n]) t[n] = {num:n, s_tot:0,s_err:0,s_pt:0,s_pos:0,s_med:0,s_mal:0,
                      r_tot:0,r_err:0,r_perf:0,r_pos:0,r_med:0,r_mal:0,
                      a_tot:0,a_err:0,a_blo:0,a_pt:0,a_pos:0,a_mal:0,
                      b_pt:0, b_err:0};
    return t[n];
  }
  J.forEach(function(a){
    if(!a.num && a.num!==0) return;
    var f = ficha(a.lado, a.num);
    if(a.sk==='S'){ f.s_tot++; tot[a.lado]++;
      if(a.ev==='=') f.s_err++; else if(a.ev==='#') f.s_pt++;
      else if(a.ev==='/') f.s_med++; else if(a.ev==='+') f.s_pos++; else f.s_mal++; }
    if(a.sk==='R'){ f.r_tot++;
      if(a.ev==='=') f.r_err++; else if(a.ev==='#') f.r_perf++;
      else if(a.ev==='+') f.r_pos++; else if(a.ev==='/') f.r_med++; else f.r_mal++; }
    if(a.sk==='A'){ f.a_tot++;
      if(a.ev==='=') f.a_err++; else if(a.ev==='/') f.a_blo++;
      else if(a.ev==='#') f.a_pt++; else if(a.ev==='+') f.a_pos++; else f.a_mal++; }
    if(a.sk==='B'){ if(a.ev==='#') f.b_pt++; if(a.ev==='=') f.b_err++; }
  });
  return {eq:eq, nSets:nSets};
}

/* ── dibujo ────────────────────────────────────────────────────────────── */
function pct(a,b){ return b ? Math.round(a*100/b) + '%' : '—'; }
function n1(v){ return v==null ? '—' : v.toFixed(1); }

function tabla(lado, datos, nSets, nombre){
  var t = datos.eq[lado], nums = Object.keys(t).map(Number).sort(function(a,b){return a-b;});
  if(!nums.length) return '<div class="vacio">Sin acciones cargadas para ' + esc(nombre) + '.</div>';

  var T = {s_tot:0,s_err:0,s_pt:0,r_tot:0,r_err:0,r_perf:0,r_pos:0,
           a_tot:0,a_err:0,a_blo:0,a_pt:0,b_pt:0,pts:0};
  var filas = nums.map(function(n){
    var f = t[n];
    var pts = f.s_pt + f.a_pt + f.b_pt;
    ['s_tot','s_err','s_pt','r_tot','r_err','r_perf','r_pos','a_tot','a_err','a_blo','a_pt','b_pt']
      .forEach(function(k){ T[k]+=f[k]; });
    T.pts += pts;

    var notas = [notaSaque(f), notaRec(f), notaAtk(f), notaBlq(f,nSets)].filter(function(x){ return x!=null; });
    var final = notas.length ? notas.reduce(function(a,b){return a+b;},0)/notas.length : null;

    var pl = plantel(lado, n);
    return '<tr>'
      + '<td class="num">' + n + '</td>'
      + '<td class="jug">' + esc(pl) + '</td>'
      + '<td class="sep">' + (pts||'—') + '</td>'
      + '<td class="sep">' + (f.s_tot||'—') + '</td><td class="r">' + (f.s_err||'—') + '</td>'
      + '<td class="g">' + (f.s_pt||'—') + '</td>'
      + '<td class="sep">' + (f.r_tot||'—') + '</td><td class="r">' + (f.r_err||'—') + '</td>'
      + '<td>' + pct(f.r_pos+f.r_perf, f.r_tot) + '</td><td class="g">' + pct(f.r_perf, f.r_tot) + '</td>'
      + '<td class="sep">' + (f.a_tot||'—') + '</td><td class="r">' + (f.a_err||'—') + '</td>'
      + '<td class="r">' + (f.a_blo||'—') + '</td><td class="g">' + (f.a_pt||'—') + '</td>'
      + '<td>' + pct(f.a_pt, f.a_tot) + '</td>'
      + '<td class="sep g">' + (f.b_pt||'—') + '</td>'
      + '<td class="sep nota">' + n1(final) + '</td>'
      + '</tr>';
  }).join('');

  var totFila = '<tr class="tot">'
    + '<td colspan="2" class="jug">TOTALES</td>'
    + '<td class="sep">' + T.pts + '</td>'
    + '<td class="sep">' + T.s_tot + '</td><td>' + T.s_err + '</td><td>' + T.s_pt + '</td>'
    + '<td class="sep">' + T.r_tot + '</td><td>' + T.r_err + '</td>'
    + '<td>' + pct(T.r_pos+T.r_perf, T.r_tot) + '</td><td>' + pct(T.r_perf, T.r_tot) + '</td>'
    + '<td class="sep">' + T.a_tot + '</td><td>' + T.a_err + '</td><td>' + T.a_blo + '</td>'
    + '<td>' + T.a_pt + '</td><td>' + pct(T.a_pt, T.a_tot) + '</td>'
    + '<td class="sep">' + T.b_pt + '</td><td class="sep">—</td></tr>';

  return '<table><thead>'
    + '<tr class="grupos"><th colspan="2"></th><th class="sep">Puntos</th>'
    + '<th colspan="3" class="sep">Saque</th><th colspan="4" class="sep">Recepción</th>'
    + '<th colspan="5" class="sep">Ataque</th><th class="sep">Bloqueo</th><th class="sep">Nota</th></tr>'
    + '<tr><th>#</th><th style="text-align:left">Jugador</th><th class="sep">Tot</th>'
    + '<th class="sep">Tot</th><th>Err</th><th>Pts</th>'
    + '<th class="sep">Tot</th><th>Err</th><th>Pos%</th><th>Perf%</th>'
    + '<th class="sep">Tot</th><th>Err</th><th>Blo</th><th>Pts</th><th>Pts%</th>'
    + '<th class="sep">Pts</th><th class="sep"></th></tr>'
    + '</thead><tbody>' + filas + totFila + '</tbody></table>';
}

function plantel(lado, num){
  try{
    var P = window.PLANTEL || window.PLANTEL_DATA || null;
    if(P && P.length){
      for(var i=0;i<P.length;i++) if(Number(P[i].num)===Number(num)) return P[i].nombre || ('#'+num);
    }
  }catch(e){}
  return '#' + num;
}

function armarSets(){
  var sel = document.getElementById('fset'), sets = {};
  (M.codes||[]).forEach(function(c){ if(c.set) sets[c.set]=1; });
  sel.innerHTML = '<option value="">Partido completo</option>'
    + Object.keys(sets).sort().map(function(s){ return '<option value="'+s+'">Set '+s+'</option>'; }).join('');
}

function pintar(){
  if(!M || !M.codes || !M.codes.length){
    document.getElementById('hoja').innerHTML =
      '<div class="vacio">No encontré un partido con acciones cargadas.<br><br>'
      + 'Si estás en la tablet o en otra computadora, tocá <b>Traer de la nube</b>.</div>';
    return;
  }
  var setSel = document.getElementById('fset').value;
  var d = calcular(setSel);
  var n = M.notas || {};
  var parciales = (M.parciales || []).map(function(p){ return p; }).join('  ');

  document.getElementById('hoja').innerHTML =
      '<div class="cab"><div>'
    +   '<div class="tit">' + esc(M.home.name) + '  <span class="m">vs</span>  ' + esc(M.away.name) + '</div>'
    +   '<div class="sub">' + [n.competencia, n.fase, n.fecha, n.hora].filter(Boolean).map(esc).join(' · ')
    +   (setSel ? '  ·  <b>Set ' + esc(setSel) + '</b>' : '  ·  Partido completo') + '</div>'
    + '</div>'
    + '<div class="marc"><div class="res">' + M.home.sets + ' – ' + M.away.sets + '</div>'
    +   '<div class="parc">' + esc(parciales) + '</div></div></div>'

    + '<h2 class="eq">' + esc(M.home.name) + '</h2>'   + tabla('home', d, d.nSets, M.home.name)
    + '<h2 class="eq v">' + esc(M.away.name) + '</h2>' + tabla('away', d, d.nSets, M.away.name)

    + '<div class="pie">'
    +   '<b>Cómo se calcula la nota</b> (manual DataVolley 9.7.1.1) — '
    +   'Saque: (=×0 +-×4 ++×7 +/×8 +#×10) / total · '
    +   'Recepción: (=×-3 +/×-3 +-×-1 ++×7 +#×10) / total · '
    +   'Ataque: (=×0 +/×0 +-×5 ++×5 +#×10) / total · '
    +   'Bloqueo: 8,5 / 8 / 7 según puntos de bloqueo por set. '
    +   'Ninguna nota baja de 5,5. La final es el promedio de las que corresponden.<br>'
    +   '<span class="noprint">Generado el ' + new Date().toLocaleString('es-AR') + '</span>'
    + '</div>';
}

function compartir(){
  var t = M ? (M.home.name + ' ' + M.home.sets + '-' + M.away.sets + ' ' + M.away.name) : 'Informe de partido';
  if(navigator.share){
    navigator.share({title:'Informe de partido', text:t, url:location.href})
      .catch(function(){});
  } else {
    try{ navigator.clipboard.writeText(location.href); est('link copiado ✓','var(--ok)'); }
    catch(e){ est('copiá el link de la barra'); }
  }
}

function arrancar(){
  M = local();
  if(M && M.codes && M.codes.length){ est('partido de esta PC'); armarSets(); pintar(); }
  else { est('no hay partido acá — probá "Traer de la nube"','var(--warn)'); pintar(); }
}
if(typeof _fbListo !== 'undefined' && _fbListo && _fbListo.then) _fbListo.then(arrancar).catch(arrancar);
else window.addEventListener('load', arrancar);
</script>
</body>
</html>
