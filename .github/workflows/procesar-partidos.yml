# =============================================================================
#  PROCESAR PARTIDOS — el robot que reemplaza al .bat del cliente
# -----------------------------------------------------------------------------
#  El entrenador arrastra su .dvw en la app. Este flujo lo levanta, lo procesa
#  y publica el resultado. El cliente no instala nada ni corre nada.
#
#  Se dispara de tres formas:
#    · cada 10 minutos            (para los que suben desde la app)
#    · cuando se sube un .dvw     (por si alguien lo pone directo)
#    · a mano desde la pestaña Actions
#
#  Un partido tarda unos segundos en procesarse, así que el gasto de minutos
#  es mínimo: los repos privados tienen 2.000 minutos gratis por mes.
# =============================================================================
name: Procesar partidos

on:
  schedule:
    - cron: '*/10 * * * *'
  push:
    paths:
      - '**/*.dvw'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: procesar-partidos
  cancel-in-progress: false

jobs:
  procesar:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Traer el repositorio
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # Los motores no usan librerías externas, pero si algún día hicieran
      # falta, este paso las instala sin romper nada cuando no hay archivo.
      - name: Dependencias (si hicieran falta)
        run: |
          if [ -f requirements.txt ]; then
            pip install --quiet -r requirements.txt
          fi

      - name: Recoger los partidos subidos desde la app y procesarlos
        env:
          FB_URL:      ${{ secrets.FB_URL }}
          FB_KEY:      ${{ secrets.FB_KEY }}
          ROBOT_MAIL:  ${{ secrets.ROBOT_MAIL }}
          ROBOT_CLAVE: ${{ secrets.ROBOT_CLAVE }}
          CLUB_ID:     ${{ secrets.CLUB_ID }}
        run: python procesar_pendientes.py

      # La llave del cifrado nunca vive en el repositorio: se pone acá, se usa,
      # y se borra antes de publicar. Sin esto, el motor no puede leer sus
      # propios datos y el ciclo se rompe.
      - name: Preparar la llave de los datos
        if: ${{ secrets.LLAVE_DATOS != '' }}
        env:
          LLAVE_DATOS: ${{ secrets.LLAVE_DATOS }}
        run: printf '%s' "$LLAVE_DATOS" > LLAVE.txt

      - name: Guardar la llave fuera del alcance
        if: always()
        run: rm -f LLAVE.txt

      - name: Publicar si cambió algo
        run: |
          git config user.name  "Asistente del club"
          git config user.email "actions@users.noreply.github.com"
          if [ -n "$(git status --porcelain -- . ':!LLAVE.txt')" ]; then
            git add -A
            git reset -- LLAVE.txt 2>/dev/null || true
            git commit -m "Partido procesado automáticamente"
            git push
            echo "Publicado."
          else
            echo "No hubo cambios para publicar."
          fi
