<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title data-t="Plan de Desarrollo Individual">Plan de Desarrollo Individual</title>
<!-- Las fuentes de la app: esta pantalla salia con la del sistema. -->
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow+Condensed:wght@300;400;600;700;800;900&display=swap" rel="stylesheet">
<style>
  /* == 'A TRABAJAR' NO ES UN ERROR =======================================
     Era rojo, y como TODOS los objetivos arrancan ahi, el dia que cargas
     el plan de un jugador la barra queda 100% roja y cada punto rojo: da
     la sensacion de que esta todo mal cuando en realidad no empezo.
     Pasa a gris: pendiente. El ambar y el verde cuentan el avance.     */
  :root{--bg:#07080f;--card:#0d0e1a;--card2:#12131f;--border:rgba(255,255,255,.07);
    --txt:#e2e8f0;--mut:#64748b;--r:#8ca0b8;--a:#f59e0b;--v:#22c55e;--red:#E8192C;}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{margin:0;background:var(--bg);color:var(--txt);font-family:'Barlow Condensed',sans-serif;padding-bottom:60px;font-size:15.5px}
  button,select,input,textarea{font-family:'Barlow Condensed',sans-serif}
  /* La lista de objetivos es texto: una columna muy ancha se lee mal. En
     vez de estirar la linea, en pantalla grande van DOS fundamentos por
     fila: se usa el ancho y se scrollea la mitad. */
  .wrap{max-width:1280px;margin:0 auto;padding:16px 20px}
  /* Con dos columnas de grilla, la fila la marca la tarjeta mas alta: al
     lado de Ataque -que puede tener diez objetivos- quedaba medio metro de
     vacio debajo de Armado. Con columnas de texto las tarjetas se acomodan
     una abajo de la otra y el navegador reparte las dos columnas parejas. */
  .skills{display:block}
  @media(min-width:1040px){ .skills{column-count:2;column-gap:14px} }
  a{color:inherit;text-decoration:none}
  .top{display:flex;align-items:center;gap:12px;margin-bottom:6px}
  .back{padding:5px 14px;border-radius:8px;border:1px solid rgba(255,255,255,.14);background:rgba(255,255,255,.04);
    color:var(--mut);font-size:10px;font-weight:700;letter-spacing:1px;text-transform:uppercase;white-space:nowrap}
  .back:hover{color:var(--txt);border-color:var(--red)}
  h1{font-family:'Bebas Neue',sans-serif;font-size:23px;margin:0;font-weight:400;letter-spacing:3px}
  /* En el celular 'Plan de Desarrollo Individual' entraba en tres
     renglones y empujaba todo el encabezado hacia abajo. */
  @media(max-width:480px){
    .wrap{padding:14px 14px}
    h1{font-size:18px;letter-spacing:1.5px;line-height:1.05}
  }
  .langsw{margin-left:auto;display:flex;gap:4px}
  .langsw button{background:transparent;border:1px solid var(--border);color:var(--mut);border-radius:7px;padding:4px 8px;font-size:11px;font-weight:800;cursor:pointer;font-family:inherit}
  .langsw button.on{background:rgba(232,25,44,.12);color:var(--red);border-color:rgba(232,25,44,.35)}
  .sub{color:var(--mut);font-size:13.5px;margin:2px 0 16px 2px}
  .selrow{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:16px}
  /* Los campos eran BLANCOS con texto negro en una app toda oscura: era
     lo primero que saltaba a la vista y no pasa en ninguna otra pantalla. */
  select,input[type=text]{background:var(--card2);color:var(--txt);border:1px solid rgba(255,255,255,.14);
    border-radius:9px;padding:9px 11px;font-size:14.5px;font-weight:600}
  select:focus,input[type=text]:focus{outline:none;border-color:var(--red)}
  .prog{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:14px 16px;margin-bottom:18px}
  .prog-bar{height:9px;border-radius:6px;background:#1e2130;overflow:hidden;display:flex;margin-top:8px}
  .prog-bar span{display:block;height:100%}
  .prog-lbl{display:flex;justify-content:space-between;font-size:13px;color:var(--mut)}
  .skill{background:var(--card);border:1px solid var(--border);border-radius:14px;overflow:hidden;
    margin-bottom:14px;break-inside:avoid;-webkit-column-break-inside:avoid;page-break-inside:avoid}
  /* Cuanto de ese fundamento ya esta consolidado, en su propio color. */
  .skill-prog{height:3px;background:#1e2130}
  .skill-prog span{display:block;height:100%;border-radius:0 2px 2px 0}
  .skill-head{padding:13px 16px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--border);font-weight:800;font-size:16px}
  .skill-ic{width:30px;height:30px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:16px}
  .skill-count{margin-left:auto;font-size:11px;color:var(--mut);font-weight:600}
  .items{padding:6px 12px 12px}
  .item{display:flex;gap:10px;align-items:flex-start;padding:11px 4px;border-bottom:1px solid var(--border)}
  .item:last-child{border-bottom:none}
  .state{flex-shrink:0;width:26px;height:26px;border-radius:50%;border:2px solid;display:flex;align-items:center;justify-content:center;font-size:11px;cursor:default;background:transparent}
  .state.ed{cursor:pointer}
  .item-body{flex:1;min-width:0}
  .item-txt{font-size:14.5px;line-height:1.4}
  .item-meta{display:flex;gap:8px;align-items:center;margin-top:5px;flex-wrap:wrap}
  .cat{font-size:9px;letter-spacing:.5px;text-transform:uppercase;padding:2px 7px;border-radius:20px;font-weight:700;background:rgba(255,255,255,.05);color:var(--mut)}
  .hist{display:flex;gap:3px;align-items:center}
  .hdot{width:7px;height:7px;border-radius:50%}
  .hist-lbl{font-size:9px;color:var(--mut)}
  .del{color:var(--mut);font-size:15px;padding:2px 6px;cursor:pointer;flex-shrink:0}
  .add{padding:10px 12px 4px;display:flex;flex-direction:column;gap:8px}
  .add-row{display:flex;gap:8px;flex-wrap:wrap}
  .add-row input{flex:1;min-width:120px}
  .btn{background:#1e2130;border:1px solid var(--border);color:var(--txt);border-radius:9px;padding:9px 13px;font-family:inherit;font-weight:700;font-size:13px;cursor:pointer}
  .btn.p{background:var(--red);color:#fff;border-color:var(--red)}
  .lib-toggle{width:100%;text-align:left;background:#1a1d2b}
  .lib-panel{max-height:300px;overflow-y:auto;border:1px solid var(--border);border-radius:10px;margin-top:8px;background:var(--card2)}
  .lib-row{display:flex;gap:9px;align-items:flex-start;padding:10px 11px;border-bottom:1px solid var(--border);cursor:pointer;font-size:13.5px;line-height:1.4}
  .lib-row:last-child{border-bottom:none}
  .lib-row:active,.lib-row:hover{background:rgba(255,255,255,.05)}
  .lib-row .lib-txt{flex:1;min-width:0}
  .lib-row .lib-add{color:var(--v);font-weight:800;font-size:16px;flex-shrink:0;line-height:1}
  .lib-row.dup{opacity:.42;cursor:default}
  .lib-row.dup .lib-add{color:var(--mut)}
  .lib-row .cat{flex-shrink:0;align-self:flex-start;margin-top:1px}
  .empty{color:var(--mut);font-size:13.5px;padding:10px 4px;font-style:italic}
  .roview{background:rgba(255,255,255,.04);border:1px solid var(--border);border-radius:20px;padding:4px 11px;font-size:10px;color:var(--mut);display:inline-flex;gap:5px;align-items:center}
  /* Al jugador no se le da el desplegable del plantel: se le dice quien es. */
  .quien{background:var(--card2);border:1px solid rgba(255,255,255,.14);border-radius:9px;
    padding:9px 11px;font-size:14.5px;font-weight:700;color:var(--txt)}
  /* == EL FOCO DE LA SEMANA ==============================================
     Con veinte objetivos cargados, un jugador no sabe por donde empezar.
     El entrenador marca dos o tres con la estrella y son los que aparecen
     arriba de todo, antes de los fundamentos. */
  .foco{background:linear-gradient(180deg,rgba(245,158,11,.10),rgba(245,158,11,.03));
    border:1px solid rgba(245,158,11,.30);border-radius:14px;padding:13px 16px;margin-bottom:18px}
  .foco-t{font-family:'Bebas Neue',sans-serif;font-size:16px;letter-spacing:2px;color:var(--a);margin-bottom:9px}
  .foco-i{display:flex;gap:9px;align-items:flex-start;padding:7px 0;border-bottom:1px solid rgba(255,255,255,.05)}
  .foco-i:last-child{border-bottom:none}
  .foco-d{width:8px;height:8px;border-radius:50%;flex-shrink:0;margin-top:6px}
  .foco-x{flex:1;min-width:0;font-size:14.5px;line-height:1.4}
  .foco-e{font-size:10px;font-weight:700;flex-shrink:0;margin-top:2px}
  .foco-vac{background:var(--card);border:1px dashed var(--border);border-radius:14px;
    padding:12px 16px;margin-bottom:18px;color:var(--mut);font-size:13.5px}
  .foco-av{color:var(--a);font-size:11.5px;margin-top:9px}
  .fstar{flex-shrink:0;font-size:15px;line-height:1;padding:2px 5px;color:var(--mut);cursor:pointer;user-select:none}
  .fstar:hover{color:var(--a)}
  .fstar.on{color:var(--a)}
  .fstar.ro{cursor:default}
  .legend{display:flex;gap:14px;font-size:11px;color:var(--mut);margin:0 0 16px 2px;flex-wrap:wrap}
  .legend span{display:inline-flex;gap:5px;align-items:center}
  .ldot{width:11px;height:11px;border-radius:50%;border:2px solid}
/* Los dos botones de PARTIDO / ENTRENAMIENTO: el mismo estilo que en la
   pantalla del jugador, para que sean el mismo boton y no dos parecidos. */
.obj-tfbtn{padding:5px 14px;border-radius:8px;border:1px solid rgba(255,255,255,.08);background:rgba(255,255,255,.04);color:#475569;font-size:11px;font-weight:800;letter-spacing:1.5px;cursor:pointer;text-transform:uppercase;transition:all .15s;font-family:'Barlow Condensed',sans-serif}
.obj-tfbtn.on.partido{background:rgba(232,25,44,.12);border-color:rgba(232,25,44,.4);color:#e8192c}
.obj-tfbtn.on.ent{background:rgba(34,197,94,.12);border-color:rgba(34,197,94,.4);color:#22c55e}
</style>

<script>
(function(){
  /* ---------- i18n ---------- */
  var LANG='es';
  try{ LANG = (typeof getLang==='function') ? getLang() : ((localStorage.getItem('vb_lang')||'es')); }catch(e){}
  if(['es','en','de'].indexOf(LANG)<0) LANG='es';

  var UI={
    es:{title:"Plan de Desarrollo Individual",subP:"Objetivos técnico-tácticos y progreso",subJ:function(n,ed){return "Jugador · "+n+(ed?"  ·  modo editor":"");},subNone:"Elegí un jugador para ver o cargar su plan",selPh:"— Elegí tu jugador —",overall:"Progreso general",consol:"consolidados",lastupd:"última actualización",noobj:"Sin objetivos cargados todavía.",obj:function(n){return n+" objetivo"+(n===1?"":"s");},libOpen:"📚 Elegir de la biblioteca",libClose:"📚 Ocultar biblioteca",custPh:"…o escribí un objetivo a mano",add:"Agregar",progress:"progreso:",remove:"¿Quitar este objetivo?",editor:"✎ modo editor",readonly:"👁 solo lectura",st:{r:"A trabajar",a:"En progreso",v:"Consolidado"},foco:"Foco de la semana",focoAyuda:"★ Marcá con la estrella los 2 o 3 objetivos de esta semana: al jugador le van a aparecer acá arriba, antes de todo lo demás.",focoMuchos:function(n){return "Tenés "+n+" objetivos en el foco. Con 2 o 3 alcanza: si son muchos, deja de ser un foco.";},focoPoner:"Poner en el foco de la semana",focoSacar:"Sacar del foco"},
    en:{title:"Individual Development Plan",subP:"Technical-tactical goals and progress",subJ:function(n,ed){return "Player · "+n+(ed?"  ·  editor mode":"");},subNone:"Choose a player to view or edit their plan",selPh:"— Choose your player —",overall:"Overall progress",consol:"consolidated",lastupd:"last update",noobj:"No goals added yet.",obj:function(n){return n+" goal"+(n===1?"":"s");},libOpen:"📚 Choose from the library",libClose:"📚 Hide library",custPh:"…or type a goal by hand",add:"Add",progress:"progress:",remove:"Remove this goal?",editor:"✎ editor mode",readonly:"👁 read only",st:{r:"To work on",a:"In progress",v:"Consolidated"},foco:"Focus of the week",focoAyuda:"★ Star the 2 or 3 goals for this week: the player will see them up here, before everything else.",focoMuchos:function(n){return "You have "+n+" goals in focus. Two or three is enough \u2014 too many and it stops being a focus.";},focoPoner:"Add to this week's focus",focoSacar:"Remove from focus"},
    de:{title:"Individueller Entwicklungsplan",subP:"Technisch-taktische Ziele und Fortschritt",subJ:function(n,ed){return "Spieler · "+n+(ed?"  ·  Editor-Modus":"");},subNone:"Wähle einen Spieler, um seinen Plan zu sehen oder zu bearbeiten",selPh:"— Wähle deinen Spieler —",overall:"Gesamtfortschritt",consol:"gefestigt",lastupd:"letzte Aktualisierung",noobj:"Noch keine Ziele hinzugefügt.",obj:function(n){return n+" Ziel"+(n===1?"":"e");},libOpen:"📚 Aus der Bibliothek wählen",libClose:"📚 Bibliothek ausblenden",custPh:"…oder ein Ziel eintippen",add:"Hinzufügen",progress:"Fortschritt:",remove:"Dieses Ziel entfernen?",editor:"✎ Editor-Modus",readonly:"👁 nur Lesen",st:{r:"Zu verbessern",a:"In Arbeit",v:"Gefestigt"},foco:"Fokus der Woche",focoAyuda:"★ Markiere die 2 oder 3 Ziele dieser Woche: der Spieler sieht sie hier oben, vor allem anderen.",focoMuchos:function(n){return "Du hast "+n+" Ziele im Fokus. Zwei oder drei reichen \u2014 zu viele, und es ist kein Fokus mehr.";},focoPoner:"In den Fokus der Woche",focoSacar:"Aus dem Fokus nehmen"}
  };
  function L(){ return UI[LANG]||UI.es; }

  /* La paleta validada del resto de la app: el mismo color de cada
     fundamento que en el panel, el plan de partido y el dashboard. */
  var SKILLS=[
    {k:'saque',   es:'Saque',    en:'Serve',     de:'Aufschlag', ic:'🎯',col:'#CE7C18'},
    {k:'recepcion',es:'Recepción',en:'Reception', de:'Annahme',  ic:'🛡',col:'#0E9F6E'},
    {k:'armado',  es:'Armado',   en:'Setting',   de:'Zuspiel',   ic:'🎽',col:'#0FA3B1'},
    {k:'ataque',  es:'Ataque',   en:'Attack',    de:'Angriff',   ic:'💥',col:'#0B84C4'},
    {k:'bloqueo', es:'Bloqueo',  en:'Block',     de:'Block',     ic:'🧱',col:'#8B5CF6'},
    {k:'defensa', es:'Defensa',  en:'Defense',   de:'Abwehr',    ic:'🤲',col:'#DC2A5A'},
    {k:'juego',   es:'Juego / Situaciones', en:'Game / Situations', de:'Spiel / Situationen', ic:'🧠',col:'#94a3b8'}
  ];
  var CATT={
    "Técnica":{en:"Technique",de:"Technik"},
    "Táctica":{en:"Tactics",de:"Taktik"},
    "Lectura":{en:"Reading",de:"Spiel lesen"},
    "Físico/Coordinación":{en:"Physical",de:"Physis"},
    "Mental":{en:"Mental",de:"Mental"},
    "Errores comunes":{en:"Common mistakes",de:"Häufige Fehler"},
    "Qué NO hacer":{en:"What NOT to do",de:"NICHT tun"}
  };
  function catL(c){ if(LANG==='es')return c; return (CATT[c]&&CATT[c][LANG])||c; }
  function corrText(c){ return c[LANG]||c.es||c.t||''; }

  /* ══ LOS OBJETIVOS DE LA BIBLIOTECA, EN EL IDIOMA DE QUIEN MIRA ══════════
     Al elegir uno de la biblioteca se guardaba el TEXTO ya traducido al
     idioma del momento. Despues no habia forma de mostrarlo en otro: un plan
     armado en castellano se veia en castellano aunque el jugador tuviera la
     app en aleman, y la biblioteca esta escrita en los tres idiomas.

     Ahora se guarda ademas la referencia (skill + posicion), y al pintar se
     busca el texto en el idioma actual.

     Para los que YA estaban guardados no hay referencia, asi que se los busca
     en la biblioteca por su texto, en cualquiera de los tres idiomas. Si
     aparece, se muestra traducido; si es uno escrito a mano, queda tal cual,
     que es lo correcto. */
  function objTexto(it){
    if(!it) return '';
    /* con referencia: directo */
    try{
      if(it.libSkill != null && it.libIx != null){
        var c0 = (CORR[it.libSkill]||[])[it.libIx];
        if(c0) return corrText(c0);
      }
    }catch(e){}
    /* sin referencia: se lo busca por el texto guardado */
    var t = it.texto || '';
    if(!t) return '';
    try{
      var listas = CORR[it.skill] ? [CORR[it.skill]] : [];
      if(!listas.length) for(var k in CORR) listas.push(CORR[k]);
      for(var i=0;i<listas.length;i++){
        /* se llamaba L y tapaba a la funcion L() de los textos */
        var lst = listas[i] || [];
        for(var j=0;j<lst.length;j++){
          var c = lst[j];
          if(c && (c.es===t || c.en===t || c.de===t)) return corrText(c);
        }
      }
    }catch(e){}
    return t;   /* escrito a mano: no se toca */
  }

  /* ---------- estado ---------- */
  /* Mismos colores que las variables de arriba: 'a trabajar' es gris
     -pendiente-, no rojo. El rojo en esta app significa error. */
  var ST={r:{col:'#8ca0b8'},a:{col:'#f59e0b'},v:{col:'#22c55e'}};
  var ORDER=['r','a','v'];
  /* En que orden se ven: primero lo que se esta trabajando. Arranca en 1
     y no en 0 porque el cero es 'falso' y el (||) de abajo lo pisaria. */
  var ORD_VIS={a:1,r:2,v:3};
  var CORR=window.CORRECCIONES||{};
  var OPEN={};
  var ED=false; try{ ED=((localStorage.getItem('vb_role')||'').toLowerCase()==='coach'); }catch(e){}
  var QP=new URLSearchParams(location.search);
  var NUM=(QP.get('num')||'').trim();
  var NOM=QP.get('n')||'';
  /* == CADA JUGADOR, SU PROPIO PLAN =====================================
     El desplegable traia el plantel entero: cualquier jugador podia elegir
     a un companero y leerle el plan. Al entrenador no le cambia nada.
     Al jugador, si la app sabe su numero -se guarda al iniciar sesion-,
     se le muestra el suyo aunque la direccion diga otro; y si no lo sabe,
     al menos ya no puede cambiar de jugador desde la pantalla. */
  var MI=''; try{ MI=(localStorage.getItem('vb_player_num')||'').trim(); }catch(e){}
  if(!ED && MI){
    if(!NUM){ NUM=MI; }
    else if(MI!==NUM){
      NUM=MI; NOM='';
      try{ history.replaceState(null,'','plan_desarrollo.html?num='+NUM); }catch(e){}
    }
  }
  var PATH='plan_desarrollo/'+NUM;
  var DATA={items:[]};

  /* ══ DE QUIEN SON LOS OBJETIVOS QUE SE DIBUJAN ARRIBA ═══════════════════
     La fila se dibuja sola para el jugador que inicio sesion. Pero cuando el
     entrenador abre el plan de OTRO (plan_desarrollo.html?num=12), la fila
     tiene que mostrar los objetivos de ESE, no los suyos.

     Se busca el nombre igual que lo busca objetivos_semanales.js —la misma
     expresion, nombre o apellido— para que las dos puntas digan lo mismo. */
  function _nombreDelNum(n){
    if(!n) return null;
    var fuentes=[];
    if(window.EQUIPO_DATA && window.EQUIPO_DATA.jugadores) fuentes.push(window.EQUIPO_DATA.jugadores);
    if(window.PLANTEL_NAFELS && window.PLANTEL_NAFELS.jugadores) fuentes.push(window.PLANTEL_NAFELS.jugadores);
    for(var f=0;f<fuentes.length;f++){
      var L=fuentes[f];
      for(var i=0;i<L.length;i++){
        if(String(L[i].num)===String(n)) return L[i].nombre || L[i].ap || null;
      }
    }
    return null;
  }
  function _pintarObjetivos(){
    try{
      var nom=_nombreDelNum(NUM);
      if(nom) window._objNombre=nom;
      /* La primera vez se arranca en el modo que el programa elegiria solo:
         el que tenga acciones esta semana, y si los dos tienen, partido. Asi
         lo primero que se ve nunca esta vacio. Despues manda el boton. */
      if(!window._objTipo && nom && window.OBJ_SEMANA && window.OBJ_SEMANA.modoConAcciones){
        try{ window._objTipo = window.OBJ_SEMANA.modoConAcciones(nom); }catch(e){}
      }
      _marcarTipo();
      if(window.OBJ_SEMANA && window.OBJ_SEMANA.render) window.OBJ_SEMANA.render();
    }catch(e){}
  }
  function _marcarTipo(){
    var fila=document.getElementById('obj-tipo-row');
    if(!fila) return;
    fila.style.display='flex';
    var t=window._objTipo==='entrenamiento'?'entrenamiento':'partido';
    [['partido','partido'],['entrenamiento','ent']].forEach(function(par){
      var b=document.getElementById('obj-tbtn-'+par[0]);
      if(!b) return;
      b.className='obj-tfbtn'+(par[0]===t?(' on '+par[1]):'');
    });
  }
  /* Global a proposito: lo llaman los botones desde el HTML. */
  window.objTipoPlan=function(tipo){
    window._objTipo=tipo;
    /* El resto del sistema comparte este filtro: si existe, se le avisa, para
       que al salir de aca el analisis y los cortes lleguen con lo mismo. */
    try{ if(typeof vbSetTipo==='function') vbSetTipo(tipo); }catch(e){}
    _marcarTipo();
    try{ if(window.OBJ_SEMANA && window.OBJ_SEMANA.render) window.OBJ_SEMANA.render(); }catch(e){}
  };

  function roster(){
    var raw=(typeof PLANTEL_NAFELS!=='undefined'&&PLANTEL_NAFELS)||window.PLANTEL_NAFELS||(typeof ((window.PLANTEL_NAFELS&&window.PLANTEL_NAFELS.jugadores)||window.CASLA_JUGADORES||[])!=='undefined'&&((window.PLANTEL_NAFELS&&window.PLANTEL_NAFELS.jugadores)||window.CASLA_JUGADORES||[]))||((window.PLANTEL_NAFELS&&window.PLANTEL_NAFELS.jugadores)||window.CASLA_JUGADORES||[])||null;
    var r=Array.isArray(raw)?raw:((raw&&(raw.jugadores||raw.lista))||[]);
    return (r||[]).map(function(p){
      var num=p.num!=null?String(p.num):String(((String(p.nombre||'').match(/^\d+/))||[''])[0]);
      var nom=p.ap?(p.ap+' '+(p.nombre||'')).trim():(p.nombre||'').replace(/^\d+\s*/,'').trim();
      nom=nom||('#'+num); return {num:num,nombre:nom};
    }).filter(function(p){return p.num;});
  }

  function today(){ var d=new Date(); return d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2); }
  function esc(s){ return (s||'').replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); }
  function uid(){ return 'i'+Date.now().toString(36)+Math.random().toString(36).slice(2,6); }
  function save(){ if(typeof fbSet==='function') fbSet(PATH, DATA); }

  function buildLangSw(){
    var el=document.getElementById('langsw');
    el.innerHTML=[['es','ES'],['en','EN'],['de','DE']].map(function(x){
      return '<button class="'+(LANG===x[0]?'on':'')+'" onclick="PD.lang(\''+x[0]+'\')">'+x[1]+'</button>';
    }).join('');
  }
  function buildSel(){
    var sel=document.getElementById('jugSel'); var R=roster();
    if(!ED){
      /* el jugador no elige: se le dice de quien es el plan y listo */
      var mio=R.filter(function(p){return p.num===NUM;})[0];
      if(mio) NOM=NOM||mio.nombre;
      sel.outerHTML='<div class="quien" id="jugSel">'
        + (NUM ? '#'+NUM+'  '+esc(NOM||('#'+NUM)) : esc(L().selPh)) + '</div>';
      return;
    }
    var opts='<option value="">'+L().selPh+'</option>';
    R.sort(function(a,b){return (+a.num)-(+b.num);}).forEach(function(p){
      opts+='<option value="'+p.num+'"'+(p.num===NUM?' selected':'')+'>#'+p.num+'  '+esc(p.nombre)+'</option>';
    });
    sel.innerHTML=opts;
    if(NUM && !NOM){ var f=R.filter(function(p){return p.num===NUM;})[0]; if(f) NOM=f.nombre; }
  }
  function buildLegend(){
    var s=L().st;
    document.getElementById('legend').innerHTML=
      '<span><i class="ldot" style="border-color:var(--r)"></i> '+s.r+'</span>'+
      '<span><i class="ldot" style="border-color:var(--a)"></i> '+s.a+'</span>'+
      '<span><i class="ldot" style="border-color:var(--v)"></i> '+s.v+'</span>';
  }

  function progress(){
    var all=DATA.items, n=all.length;
    var v=all.filter(function(i){return i.estado==='v';}).length;
    var a=all.filter(function(i){return i.estado==='a';}).length;
    var r=n-v-a, pct=n?Math.round(v/n*100):0, last='';
    all.forEach(function(i){(i.hist||[]).forEach(function(h){ if(h.f>last)last=h.f; });});
    document.getElementById('prog').innerHTML = n? (
      '<div class="prog"><div class="prog-lbl"><b style="color:var(--txt)">'+L().overall+'</b><span>'+v+'/'+n+' '+L().consol+' · '+pct+'%</span></div>'+
      '<div class="prog-bar"><span style="width:'+(v/n*100)+'%;background:var(--v)"></span><span style="width:'+(a/n*100)+'%;background:var(--a)"></span><span style="width:'+(r/n*100)+'%;background:var(--r)"></span></div>'+
      (last?'<div style="margin-top:8px"><span class="roview">🕑 '+L().lastupd+': '+last+'</span></div>':'')+'</div>'
    ) : '';
  }
  function histDots(i){
    var h=(i.hist||[]).slice(-8); if(!h.length) return '';
    return '<span class="hist"><span class="hist-lbl">'+L().progress+'</span>'+h.map(function(x){return '<i class="hdot" style="background:'+(ST[x.e]||ST.r).col+'" title="'+x.f+'"></i>';}).join('')+'</span>';
  }

  /* Los objetivos marcados, arriba de todo y fuera de los fundamentos. */
  function renderFoco(){
    var el=document.getElementById('foco'); if(!el) return;
    if(!NUM){ el.innerHTML=''; return; }
    var f=DATA.items.filter(function(i){ return i.foco; });
    if(!f.length){ el.innerHTML = ED ? '<div class="foco-vac">'+L().focoAyuda+'</div>' : ''; return; }
    var h='<div class="foco"><div class="foco-t">\u2605 '+L().foco+'</div>';
    f.forEach(function(i){
      var sk=SKILLS.filter(function(x){ return x.k===i.skill; })[0]||{col:'#64748b'};
      var st=ST[i.estado]||ST.r;
      h+='<div class="foco-i"><i class="foco-d" style="background:'+sk.col+'"></i>'
        +'<span class="foco-x">'+esc(objTexto(i))+'</span>'
        +'<span class="foco-e" style="color:'+st.col+'">'+(L().st[i.estado]||L().st.r)+'</span>'
        +(ED?'<span class="fstar on" onclick="PD.foco(\''+i.id+'\')" title="'+L().focoSacar+'">\u2605</span>':'')
        +'</div>';
    });
    if(ED && f.length>3) h+='<div class="foco-av">'+L().focoMuchos(f.length)+'</div>';
    el.innerHTML=h+'</div>';
  }

  function render(){
    _pintarObjetivos();
    document.getElementById('h1').textContent=L().title;
    document.getElementById('subt').textContent = NUM ? L().subJ(NOM||('#'+NUM), ED) : L().subNone;
    buildLegend(); progress(); renderFoco();
    var host=document.getElementById('skills');
    if(!NUM){ host.innerHTML=''; return; }
    host.innerHTML = SKILLS.map(function(s){
      var items=DATA.items.filter(function(i){return i.skill===s.k;});
      /* == LO QUE SE ESTA TRABAJANDO, ARRIBA ==============================
         Un jugador puede tener 27 objetivos en el plan. Salian en el orden
         en que se cargaron, asi que lo que esta EN PROGRESO podia quedar
         sexto y lo ya consolidado primero. Ahora: en progreso, despues a
         trabajar, y lo consolidado al final -que es lo que menos hay que
         mirar-. No se esconde nada, solo cambia el orden. */
      items.sort(function(a,b){ return (b.foco?1:0)-(a.foco?1:0)
                                    || (ORD_VIS[a.estado]||2)-(ORD_VIS[b.estado]||2); });
      /* Un fundamento sin objetivos no le dice nada al jugador: siete
         tarjetas y cuatro diciendo 'sin objetivos'. Al ENTRENADOR si se le
         muestran, porque es donde tiene que cargar. */
      if(!items.length && !ED) return '';
      var body = items.length ? items.map(function(i){
        var st=ST[i.estado]||ST.r, stl=(L().st[i.estado]||L().st.r);
        return '<div class="item">'+
          '<div class="state'+(ED?' ed':'')+'" style="border-color:'+st.col+';color:'+st.col+'"'+(ED?' onclick="PD.cycle(\''+i.id+'\')"':'')+' title="'+stl+'">'+(i.estado==='v'?'✓':'')+'</div>'+
          '<div class="item-body"><div class="item-txt">'+esc(objTexto(i))+'</div>'+
            '<div class="item-meta">'+(i.cat?'<span class="cat">'+esc(catL(i.cat))+'</span>':'')+'<span style="font-size:10px;color:'+st.col+';font-weight:700">'+stl+'</span>'+histDots(i)+'</div>'+
          '</div>'+
          (ED
            ? '<span class="fstar'+(i.foco?' on':'')+'" onclick="PD.foco(\''+i.id+'\')" title="'+(i.foco?L().focoSacar:L().focoPoner)+'">'+(i.foco?'\u2605':'\u2606')+'</span>'
              + '<span class="del" onclick="PD.del(\''+i.id+'\')" title="✕">✕</span>'
            : (i.foco ? '<span class="fstar on ro" title="'+L().foco+'">\u2605</span>' : ''))+
        '</div>';
      }).join('') : '<div class="empty">'+L().noobj+'</div>';

      var addBox='';
      if(ED){
        /* == EL NUMERO DEL BOTON DE LA BIBLIOTECA ===========================
           Decia '(43)' y abajo se veian 41 filas. La lista de la biblioteca
           tiene comas sueltas entre los bloques -',\n    ,'- y eso deja
           lugares VACIOS en el medio: length los cuenta, map los saltea.
           Se cuentan los que realmente hay. Los lugares vacios NO se sacan
           del archivo a proposito: cada objetivo cargado guarda su posicion
           en la lista, y si se corrieran los numeros, los planes que ya
           estan guardados apuntarian a otro objetivo. */
        var lib=(CORR[s.k]||[]), libN=0;
        lib.forEach(function(){ libN++; });
        /* == NO OFRECER DOS VECES EL MISMO OBJETIVO ========================
           El tilde de 'ya lo tiene' comparaba el TEXTO, y el texto guardado
           esta en el idioma en que se cargo el plan: mirando la biblioteca
           en aleman, un objetivo cargado en castellano no figuraba como
           puesto y se podia agregar de nuevo. Ahora se compara tambien por
           referencia -fundamento + posicion-, que no cambia de idioma. */
        var already={}, yaIx={};
        items.forEach(function(i){ already[i.texto]=1; if(i.libIx!=null) yaIx[i.libSkill+'|'+i.libIx]=1; });
        var rows=lib.map(function(c,ix){
          var txt=corrText(c), dup=already[txt]||yaIx[s.k+'|'+ix];
          return '<div class="lib-row'+(dup?' dup':'')+'"'+(dup?'':' onclick="PD.addLib(\''+s.k+'\','+ix+')"')+'>'+
            '<span class="cat">'+esc(catL(c.c))+'</span><span class="lib-txt">'+esc(txt)+'</span>'+
            '<span class="lib-add">'+(dup?'✓':'+')+'</span></div>';
        }).join('');
        addBox='<div class="add">'+
          '<button class="btn lib-toggle" onclick="PD.toggleLib(\''+s.k+'\')">'+(OPEN[s.k]?L().libClose:L().libOpen)+' ('+libN+')</button>'+
          '<div class="lib-panel" id="lib-'+s.k+'" style="display:'+(OPEN[s.k]?'block':'none')+'">'+rows+'</div>'+
          '<div class="add-row"><input type="text" id="cust-'+s.k+'" placeholder="'+L().custPh+'"><button class="btn p" onclick="PD.custom(\''+s.k+'\')">'+L().add+'</button></div>'+
        '</div>';
      }
      /* Antes decia '19 objetivos' y nada mas: no se sabia como venia ese
         fundamento sin contar los tildes a mano. */
      var nv=items.filter(function(i){return i.estado==='v';}).length;
      return '<div class="skill">'+
        '<div class="skill-head"><div class="skill-ic" style="background:'+s.col+'22;color:'+s.col+'">'+s.ic+'</div>'+s[LANG]+
          '<span class="skill-count" title="'+L().obj(items.length)+'">'+(items.length?nv+'/'+items.length:L().obj(0))+'</span></div>'+
        (items.length?'<div class="skill-prog"><span style="width:'+Math.round(nv/items.length*100)+'%;background:'+s.col+'"></span></div>':'')+
        '<div class="items">'+body+'</div>'+addBox+'</div>';
    }).join('');
  }

  window.PD={
    lang:function(l){ LANG=l; try{ localStorage.setItem('vb_lang',l); }catch(e){} if(typeof window.setLang==='function'){ try{ window.setLang(l); }catch(e){} } buildLangSw(); buildSel(); render(); },
    toggleLib:function(skill){ OPEN[skill]=!OPEN[skill]; render(); },
    addLib:function(skill,ix){ var c=(CORR[skill]||[])[ix]; if(!c)return; var txt=corrText(c);
      if(DATA.items.some(function(i){return i.skill===skill&&(i.texto===txt||(i.libIx!=null&&i.libSkill===skill&&i.libIx===ix));})) return;
      /* se guarda la referencia para poder mostrarlo en cualquier idioma */
      DATA.items.push({id:uid(),skill:skill,texto:txt,cat:c.c,libSkill:skill,libIx:ix,estado:'r',hist:[{f:today(),e:'r'}]}); OPEN[skill]=true; save(); render(); },
    custom:function(skill){ var inp=document.getElementById('cust-'+skill); var t=(inp.value||'').trim(); if(!t)return;
      inp.value=''; DATA.items.push({id:uid(),skill:skill,texto:t,cat:'',estado:'r',hist:[{f:today(),e:'r'}]}); save(); render(); },
    cycle:function(id){ var i=DATA.items.filter(function(x){return x.id===id;})[0]; if(!i)return;
      var ni=(ORDER.indexOf(i.estado)+1)%3; i.estado=ORDER[ni]; (i.hist=i.hist||[]).push({f:today(),e:i.estado}); save(); render(); },
    foco:function(id){ var i=DATA.items.filter(function(x){return x.id===id;})[0]; if(!i)return;
      i.foco=!i.foco; if(i.foco) i.focoF=today(); else delete i.focoF; save(); render(); },
    del:function(id){ if(!confirm(L().remove))return; DATA.items=DATA.items.filter(function(x){return x.id!==id;}); save(); render(); }
  };

  buildLangSw(); buildSel();
  var chip=document.getElementById('roChip');
  if(chip) chip.innerHTML = ED ? '<span class="roview" style="color:#22c55e">'+L().editor+'</span>' : '<span class="roview">'+L().readonly+'</span>';

  if(NUM && typeof fbGet==='function'){
    fbGet(PATH, function(d){ if(d && d.items) DATA=d; else if(Array.isArray(d)) DATA={items:d}; render(); });
    setTimeout(render,60);
  } else { render(); }
})();
</script>
