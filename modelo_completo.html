 porque:"No es una situación transitoria ni un problema de organización: es la estructura del club. En el U20 de esta temporada hay dos jugadores en edad Future 1, tres en Future 2, tres en Future 3 y siete que ya pasaron los dieciocho. Cuatro instructivos distintos en la misma hora de gimnasio. La respuesta no es elegir uno y aplicarlo a todos, porque eso deja a la mitad del grupo entrenando algo que no le corresponde. La respuesta es saber qué comparten los cuatro y qué hay que separar, y tener el criterio para decidirlo cada martes.",

  {n:"Ataque con dirección",cad:"Future 1 lo consolida · Future 2 y 3 lo afinan",int:"Todos pueden trabajar el mismo gesto con exigencia distinta.",pts:["Carrera siempre igual.","La muñeca decide.","Decisión antes del salto."],frase:"«Misma carrera, distinta muñeca.»",err:"Dar la misma consigna a los cuatro niveles.",arreglo:"Al de Future 1 pedile una dirección; al de Future 3, dos y contra bloqueo formado."},
  {n:"Defensa y transición",cad:"Es la brecha real con el vóley de mayores",int:"Los siete adultos del grupo son el mejor recurso que tenés: la transición se aprende jugando contra gente que la tiene.",pts:["Posición baja, peso adelante.","Salida inmediata al contraataque.","Aterrizar, girar, salir de la red."],frase:"«Defender es empezar a atacar.»",err:"Separar a los grandes de los chicos en los ejercicios de juego.",arreglo:"Mezclalos a propósito. Ahí el de Future 1 aprende de arrastre lo que no le podés explicar."},
  {n:"Saque bajo presión",cad:"Escala sola con el nivel",int:"El mismo ejercicio sirve para los cuatro niveles cambiando solo la consecuencia.",pts:["Mismo lanzamiento siempre.","Tasa de error acordada por jugador, no por grupo."],frase:"«Nadie falla un saque en el minuto diez.»",err:"Una sola exigencia de saque para todo el grupo.",arreglo:"A cada uno su número, escrito. El de Future 1 con 3 de 10 agresivos, el de Future 3 con 7."},
  {n:"Armado desde zaga",cad:"Future 1 lo necesita · Future 3 ya lo tiene",int:"Sostener que todos armen, aunque los de Future 3 ya estén especializados.",pts:["Frente alta y manos adelante antes del último paso.","Impulso de piernas.","Torso al destino."],frase:"«El que no arma hoy, no arma nunca.»",err:"Dejar que los de Future 3 se salten el bloque porque ya saben.",arreglo:"Ellos lo hacen igual, pero con pelota más difícil. No es repaso: es carga."}],
 tactica:[
  {n:"Cómo se parte la cancha",d:"Dos canchas con dos reglas distintas es la herramienta principal de este grupo, y conviene usarla la mitad de la sesión. No es dividir por edad: es dividir por lo que cada uno necesita ese día."},
  {n:"Cuándo NO se parte",d:"En el juego final se mezcla siempre. Un chico de Future 1 jugando con adultos aprende ritmo y transición en veinte minutos lo que no aprende en un mes de ejercicios."},
  {n:"Los siete de mayores no son un problema",d:"Son el recurso más valioso del grupo. Pero necesitan que alguien decida si están para desarrollarse o para sostener el equipo, porque no es lo mismo y cambia lo que se les pide."},
  {n:"El sistema que se juega",d:"El U20 compite con un sistema y es el que se entrena. Pero el de Future 1 tiene que entender la penetración en las seis rotaciones antes de especializarse, así que en los bloques reducidos se vuelve al 6-6 aunque en el partido se juegue 5-1."},
  {n:"Sin alibis",d:"En un grupo con cuatro niveles la cadena de culpas es más fácil de armar: el grande culpa al chico y el chico se achica. La regla de Velasco acá vale doble — nadie comenta la pelota que recibió, la resuelve."}],

ENSC.gen.bloques.push(
 {h:"Brasil: las catorce adaptaciones del proyecto de la Confederación",
  p:"La CBV publicó en 2021 un proyecto para estandarizar sus categorías de base, y en 2024 un estudio lo analizó entrevistando a cinco profesionales de la confederación —gente de las selecciones adultas y sub-19, con un promedio de diez años ahí adentro. Define catorce ajustes por franja etaria, de Sub-9 a Sub-21, agrupados en tres fases: <strong>Iniciación, Desarrollo y Rendimiento</strong>. No son recomendaciones: son reglas de competencia.",
  f:"Lo que en la mayoría de los clubes es criterio del entrenador, en Brasil es reglamento."},
 {h:"La regla que más nos falta: mínimo de jugadores por partido",
  p:"Brasil obliga a <strong>usar diez jugadores por partido</strong> en las fases de iniciación y desarrollo, y ocho en rendimiento. No es un mínimo de convocados: es de jugadores que efectivamente entran. El motivo es directo: el aprendizaje técnico y táctico depende de participar en situaciones reales de juego, no solo de entrenar, y sin esa regla el entrenador termina jugando con los siete de siempre.",
  f:"Regla para discutir con la dirigencia: en formativas, cuántos tienen que jugar sí o sí."},
 {h:"El partido se diseña para crear momentos críticos",
  p:"En la rama femenina Brasil obliga a jugar <strong>cinco sets de quince puntos, completos, gane quien gane</strong>. La razón que dan es de las mejores que leímos en todo el material: quince puntos se ajusta a la capacidad de concentración de un chico, y cinco sets lo exponen muchas más veces a sacar en 14 iguales o definir un set. El formato del partido no es una formalidad administrativa: es una herramienta de formación.",
  f:"Un set corto y muchos sets producen más momentos de presión que un partido largo."},
 {h:"Cuántas categorías se puede subir",
  p:"En iniciación, <strong>una sola categoría por encima</strong>. En desarrollo, hasta dos. Y en rendimiento vuelve a una sola. El fundamento es psicológico y emocional, no físico: un jugador necesita haber vivido su propia categoría para tomar buenas decisiones en los momentos críticos. Y la frase de los entrevistados que conviene tener a mano cuando alguien pide subir a un chico: <em>la infancia es una etapa para aprender y jugar, no para estresarse con competencias y con la necesidad de ganar</em>.",
  f:"Nuestra regla de segunda etapa tiene ahora un respaldo externo y una cota numérica."},
 {h:"El líbero temprano es el error que más nombran",
  p:"Fue la preocupación más repetida por los cinco entrevistados. El peligro concreto: al jugador más bajo lo mandan de líbero apenas llega y nunca más hace otra cosa. Y hay un segundo efecto que casi nadie ve — cuando aparece un líbero especializado, <strong>dos jugadores dejan de jugar en el fondo</strong> y nunca desarrollan recepción ni defensa. Por eso Brasil lo prohíbe hasta Sub-15 y recién lo habilita en Sub-17.",
  f:"Sin líbero, hasta el más alto tiene que recibir y defender."},
 {h:"El 5-1 especializa, el 4x2 con infiltración versatiliza",
  p:"Es un hallazgo de un estudio con entrenadores brasileños que vale citar entero: el sistema <strong>4x2 con infiltración aumenta la versatilidad</strong> del jugador porque le permite aprender aspectos de otros formatos y jugar en distintas posiciones, mientras que <strong>el 5-1 promueve la especialización de roles</strong>, sobre todo la del armador. Los dos son correctos; lo que hay que saber es qué produce cada uno y en qué momento conviene.",
  f:"El 4:4 con penetración de Rookie 2 no es un sistema menor: es la herramienta que fabrica jugadores completos."},
 {h:"Dos datos de investigación que cambian cómo se elige",
  p:"Primero: en un estudio con jugadores de vóley, <strong>los que tuvieron práctica diversificada y no se especializaron temprano fueron mayoría</strong> en los campeonatos estaduales de San Pablo y en la Superliga. Segundo, y más útil todavía para nuestra detección: a estas edades <strong>el rendimiento deportivo está más relacionado con la participación en prácticas sistemáticas que con el rendimiento físico</strong>. Elegir por altura o por salto a los trece años es elegir mal.",
  f:"El que entrena sistemáticamente le gana al que hoy salta más. Eso está medido."},
 {h:"Y el principio que ordena todo el proyecto brasileño",
  p:"Los autores lo dicen en una línea: <strong>la competencia en las categorías de base es parte del proceso de desarrollo deportivo y no el objetivo final</strong>. Las catorce adaptaciones existen para eso. Es el mismo principio que Swiss Volley puso en el centro de Smart Competitions cuando dejó de publicar resultados, y el mismo que Velasco llama no demonizar el error. Tres federaciones, tres caminos, la misma conclusión.",
  f:"Si el resultado del sábado manda sobre el plan de la temporada, el proyecto ya se rompió."});

ENSC_DE.gen.bloques.push(
{h:"Gegenprüfung: worin die drei Schulen übereinstimmen und worin nicht",
 p:"Die Abfolge dieser Anleitung wurde gegen das <strong>Trainerhandbuch Stufe I der FIVB</strong> geprüft, des Weltverbands, mit Kapiteln von Doug Beal — Olympiagold 1984 und später Geschäftsführer von USA Volleyball —, Yuri Chesnokov, Professor Hiroshi Toyoda von der Technischen Kommission und Yasutaka Matsudaira. Es gibt sehr starke Übereinstimmungen und drei Abweichungen, die man kennen sollte, statt sie zu verschweigen.",
 f:"Wo zwei Autoritäten nicht übereinstimmen, sagt das Dokument es. Es zu verstecken wäre der eigentliche Fehler."},
{h:"Worin alle drei ohne Abstriche übereinstimmen",
 p:"Dass mit <strong>Kleinfeldspielen ab dem ersten Tag</strong> unterrichtet wird — die FIVB schreibt 2:2, 3:3 und 4:4 auf kleinem Feld vor und nennt sie Einführungsspiele. Dass <strong>niemand zuschaut</strong>: Sie hält wörtlich fest, dass es bei Spielenden, die nur beobachten oder sitzen, keine Verbesserung gibt, und dass gleiche Teilnahmemöglichkeiten zu geben sind. Dass der <strong>Prozess mehr zählt als das Resultat</strong>: nicht nur Siege suchen, denn die Anstrengung im Training zählt mehr als das Wettkampfergebnis. Und dass der <strong>Block zuletzt kommt</strong>, nach der Angriffs- und der Serviceannahme. Unser Konzept setzt ihn in Rookie 3 und stimmt damit überein.",
 f:"Drei unabhängige Quellen kommen zum selben Schluss. Das ist keine Meinung mehr."},
{h:"Abweichung 1 — die Reihenfolge von Manchette und oberem Zuspiel",
 p:"Die konkreteste, und sie betrifft uns direkt. Die FIVB lehrt <strong>zuerst die Manchette</strong> — Wochen 3 bis 5 ihres Plans — und das obere Zuspiel erst in den Wochen 8 bis 10. Das Schweizer System, und unsere Anleitung mit ihm, macht es umgekehrt: zuerst fangen und werfen, dann das obere Zuspiel, und die Manchette erscheint als Hilfsmittel in Kids Volley 3. Beide Reihenfolgen werden von echten Autoritäten vertreten. Wir folgen der Schweizer, weil sie den Wettkampf des Vereins regelt, aber die Trainerperson soll wissen, dass es nicht die einzig gültige ist.",
 f:"Wenn ein Kind mit dem oberen Zuspiel nicht zurechtkommt, probiere zuerst die Manchette. Die FIVB nennt das die natürliche Reihenfolge."},
{h:"Abweichung 2 — früh spezialisieren oder nicht",
 p:"Beal schreibt, dass Spezialisierung den Weg zum Erfolg verkürzt und dass sich eine Mannschaft schneller entwickelt, wenn sie sich auf wenige Elemente konzentriert. Aber er nennt die Bedingung mit: <strong>es ist gefährlich, weil man von einem schmalen Satz an Fähigkeiten abhängt statt von einer breiten Basis</strong>. Das ist die direkte Antwort auf die Frage, ob man Schritte überspringen kann: Ja, man kann, und der Preis ist eine anfälligere Person. Das Schweizer System hat sich in Future 1 für das Gegenteil entschieden — ohne Libera, alle spielen zu — und unser Konzept auch.",
 f:"Die Abkürzung existiert und hat einen Namen: spezialisieren. Wisse, was du dafür bezahlst."},
{h:"Abweichung 3 — das FIVB-Handbuch unterrichtet in Teilen",
 p:"Seine Progressionen lauten «Armbewegung, dann Anlauf, dann Absprung, dann springen und fangen, dann springen und schlagen». Genau das ist das Teillernen, für das die Übersichtsarbeit zum motorischen Lernen keine einzige stützende Studie fand. Das FIVB-Handbuch ist von 2013 und methodisch hinter der amerikanischen Schule von McGown zurückgeblieben. <strong>Unsere Position: von der FIVB nehmen wir die Reihenfolge der Inhalte, von McGown die Methode, sie zu unterrichten.</strong>",
 f:"Was und wann: FIVB und Swiss Volley. Wie: motorisches Lernen."},
{h:"Was sich tatsächlich verkürzen lässt",
 p:"Die Reifung verkürzt sich nicht: Ein Kind im Wachstumsschub lässt sich nicht beschleunigen. Was sich beseitigen lässt, ist die Verschwendung, und davon gibt es viel. <strong>Ballkontakte pro Person</strong> statt Warteschlangen. <strong>Der ganze Spielzug</strong> statt isolierter Bewegungen, die nicht übertragen. <strong>Zufällige Reihenfolge</strong> statt zwanzigmal dasselbe, was besser aussieht und weniger bringt. <strong>Eine Regel</strong> statt einer Erklärung. Und die <strong>Messung im Oktober und März</strong>, die das verlorene Jahr des Entscheidens nach Augenmass verhindert. Ein Verein, der diese fünf Dinge tut, beschleunigt die Person nicht: Er hört auf, sie zu bremsen.",
 f:"Die echte Abkürzung ist nicht schneller zu trainieren. Es ist, sechzig Prozent des Trainings nicht mehr zu verlieren."},
{h:"Die italienische Schule: die Trainerperson ist eine Lehrperson",
 p:"Julio Velasco studierte Philosophie und wollte Gymnasiallehrer werden. Er brach das Studium sechs Prüfungen vor dem Abschluss ab und führte Italien später zur zum Team des Jahrhunderts gewählten Mannschaft, leitete ab 2019 die männlichen Nachwuchsnationalteams des italienischen Verbands und gewann 2024 in Paris Olympiagold und 2025 den Weltmeistertitel mit der Frauennationalmannschaft. Am Tag nach dem Gold erklärte er seine Methode in einem Satz: <strong>jede Trainerperson muss eine Lehrperson sein und dabei völlig vergessen, dass sie einmal gespielt hat.</strong> Dieser Satz ist die Prämisse dieses ganzen Reiters.",
 f:"Wenn deine Art zu erklären davon abhängt, wie du es selbst gemacht hast, unterrichtest du noch nicht."},
{h:"Die Alibi-Theorie und die Regel, die daraus folgt",
 p:"Die anwendbarste Idee aus dem gesamten Material. Velasco beschreibt sie so: Die Angreiferin verfehlt einen Schlag und gibt der Zuspielerin die Schuld; die Zuspielerin beschuldigt die Annahmespielerin; und so weiter. Niemand übernimmt Verantwortung. Seine Regel dagegen besteht aus einer Zeile und lässt sich morgen einführen: <strong>Angreiferinnen sprechen in keiner Weise über das Zuspiel, sie lösen es.</strong> Und das Prinzip dahinter: anderen die Verantwortung für das eigene Scheitern zuzuschieben ist der sicherste Weg in die Mittelmässigkeit. Aufhören, Schuldige zu suchen, und anfangen, Lösungen zu suchen.",
 f:"Vereinsregel ab Rookie 3: Niemand kommentiert den Ball, den er bekommen hat. Er löst ihn."},
{h:"Der Fehler wird nicht verteufelt",
 p:"Velasco war Vorläufer dessen, was heute Resilienz heisst: Der Fehler wird nicht gefürchtet und nicht bestraft, sondern verstanden und in eine Lerngelegenheit verwandelt. Es ist genau unser Identitätsgrundsatz Nummer 05 — der offensive Fehler wird getragen, der passive nicht — und dahinter steht jetzt der erfolgreichste Trainer der europäischen Volleyballgeschichte, nicht nur unser Entscheid.",
 f:"Das Ergebnis der Übung ist nicht der Punkt. Es ist die Entscheidung."},
{h:"Und ein Satz, der unseren Belastungsabschnitt korrigiert",
 p:"Zur Steuerung der Energie der Athletinnen ist Velasco unmissverständlich: <strong>die wichtigste Erholung einer Athletin ist nicht muskulär, sondern nerval und mental.</strong> Unser individuelles Belastungsblatt zählt Stunden, Sprünge und Wettkämpfe — alles körperliche Last. Die andere Hälfte fehlt. Zum Nachwuchs wurde er noch deutlicher: Ein Nachwuchskind führt ein härteres Leben als ein Profi, weil es zur Schule geht, Unterricht hat, manchmal Sprachkurse nimmt und danach trainiert, und das an sieben Tagen die Woche. Und er schloss: <em>lassen wir sie einen Moment atmen, dann werden sie mehr Lust haben zu trainieren und besser zu werden.</em>",
 f:"Die zwei freien Tage pro Woche sind kein Zugeständnis. Sie sind Training des Nervensystems."},
{h:"Abschliessender Vergleich der vier Schulen",
 p:"<strong>Die Schweiz</strong> liefert die Struktur: was auf jeder Stufe gespielt wird und wie nach Niveau statt nach Alter eingeteilt wird. <strong>Die Vereinigten Staaten</strong> liefern die Methode: ganze Bewegung, zufällige Reihenfolge, Kontaktdichte und die Evidenz des motorischen Lernens. <strong>Die FIVB</strong> liefert die Reihenfolge der Inhalte und den weltweiten Standard der Trainerausbildung. <strong>Italien</strong> liefert, was den anderen dreien fehlt: die Kultur. Die Trainerperson als Lehrperson, Verantwortung ohne Alibis, der Fehler als Arbeitsmaterial und die mentale Erholung als Teil des Plans. Die vier zusammen ergeben dieses Dokument.",
 f:"Schweizer Struktur, amerikanische Methode, FIVB-Reihenfolge, italienische Kultur."},
{h:"Brasilien: die vierzehn Anpassungen des Verbandsprojekts",
 p:"Der brasilianische Verband veröffentlichte 2021 ein Projekt zur Standardisierung seiner Nachwuchskategorien, und 2024 analysierte eine Studie dieses Projekt mit Interviews mit fünf Fachleuten des Verbands — Personen aus den Aktiv- und U19-Nationalteams, im Schnitt seit zehn Jahren dort. Es definiert vierzehn Anpassungen pro Altersgruppe, von U9 bis U21, gebündelt in drei Phasen: <strong>Einführung, Entwicklung und Leistung</strong>. Es sind keine Empfehlungen, es sind Wettkampfregeln.",
 f:"Was in den meisten Vereinen im Ermessen der Trainerperson liegt, ist in Brasilien Reglement."},
{h:"Die Regel, die uns am meisten fehlt: Mindestzahl eingesetzter Personen",
 p:"Brasilien verpflichtet dazu, in der Einführungs- und Entwicklungsphase <strong>zehn Personen pro Spiel einzusetzen</strong>, in der Leistungsphase acht. Es ist kein Mindestaufgebot, sondern die Zahl derer, die tatsächlich spielen. Die Begründung ist direkt: technisches und taktisches Lernen hängt an der Teilnahme an echten Spielsituationen, nicht nur am Training, und ohne diese Regel spielt die Trainerperson am Ende immer mit denselben sieben.",
 f:"Regel zur Diskussion mit dem Vorstand: Wie viele müssen im Nachwuchs auf jeden Fall spielen?"},
{h:"Das Spiel wird so gestaltet, dass kritische Momente entstehen",
 p:"In der Frauensparte schreibt Brasilien <strong>fünf Sätze à fünfzehn Punkte vor, vollständig, unabhängig vom Resultat</strong>. Die Begründung gehört zum Besten, was wir im ganzen Material gelesen haben: Fünfzehn Punkte entsprechen der Konzentrationsfähigkeit eines Kindes, und fünf Sätze setzen es viel häufiger der Situation aus, bei 14:14 zu servieren oder einen Satz zu entscheiden. Das Spielformat ist keine administrative Formalität, sondern ein Ausbildungswerkzeug.",
 f:"Ein kurzer Satz und viele Sätze erzeugen mehr Drucksituationen als ein langes Spiel."},
{h:"Wie viele Kategorien man aufsteigen darf",
 p:"In der Einführung <strong>nur eine Kategorie höher</strong>. In der Entwicklung bis zu zwei. Und in der Leistungsphase wieder nur eine. Die Begründung ist psychologisch und emotional, nicht körperlich: Eine Person muss ihre eigene Kategorie erlebt haben, um in kritischen Momenten gut zu entscheiden. Und der Satz der Befragten, den man parat haben sollte, wenn jemand ein Kind hochziehen will: <em>die Kindheit ist eine Phase zum Lernen und Spielen, nicht um sich mit Wettkämpfen und dem Zwang zu gewinnen zu stressen</em>.",
 f:"Unsere Regel zur zweiten Stufe hat jetzt eine externe Stütze und eine Zahl."},
{h:"Die frühe Libera ist der am häufigsten genannte Fehler",
 p:"Es war die meistgenannte Sorge aller fünf Befragten. Die konkrete Gefahr: Die kleinste Person wird sofort zur Libera gemacht und tut nie wieder etwas anderes. Und es gibt einen zweiten Effekt, den fast niemand sieht — sobald eine spezialisierte Libera da ist, <strong>hören zwei weitere Personen auf, im Hinterfeld zu spielen</strong>, und entwickeln weder Annahme noch Abwehr. Deshalb verbietet Brasilien sie bis U15 und erlaubt sie erst ab U17.",
 f:"Ohne Libera muss auch die Grösste annehmen und verteidigen."},
{h:"Das 5-1 spezialisiert, das 4x2 mit Penetration macht vielseitig",
 p:"Ein Befund aus einer Studie mit brasilianischen Trainerinnen und Trainern, den es sich lohnt ganz zu zitieren: Das System <strong>4x2 mit Penetration erhöht die Vielseitigkeit</strong>, weil es erlaubt, Aspekte anderer Spielformate zu lernen und auf verschiedenen Positionen zu spielen, während <strong>das 5-1 die Rollenspezialisierung fördert</strong>, vor allem die der Zuspielerin. Beide sind richtig; man muss wissen, was jedes erzeugt und wann es passt.",
 f:"Das 4:4 mit Penetration aus Rookie 2 ist kein kleineres System: Es ist das Werkzeug, das vollständige Spielerinnen macht."},
{h:"Zwei Forschungsbefunde, die verändern, wie ausgewählt wird",
 p:"Erstens: In einer Studie mit Volleyballspielenden waren <strong>jene mit vielseitiger Praxis und ohne frühe Spezialisierung in der Mehrheit</strong> in den Staatsmeisterschaften von São Paulo und in der Superliga. Zweitens, und für unsere Sichtung noch nützlicher: In diesem Alter hängt die sportliche Leistung <strong>stärker von der Teilnahme an systematischer Praxis ab als von der körperlichen Leistung</strong>. Mit dreizehn nach Körpergrösse oder Sprunghöhe auszuwählen heisst falsch auszuwählen.",
 f:"Wer systematisch trainiert, schlägt den, der heute höher springt. Das ist gemessen."},
{h:"Und das Prinzip, das das ganze brasilianische Projekt ordnet",
 p:"Die Autoren sagen es in einer Zeile: <strong>Der Wettkampf im Nachwuchs ist Teil des sportlichen Entwicklungsprozesses und nicht dessen Endziel.</strong> Die vierzehn Anpassungen existieren dafür. Es ist dasselbe Prinzip, das Swiss Volley ins Zentrum der Smart Competitions gestellt hat, als es aufhörte, Resultate zu publizieren, und dasselbe, das Velasco «den Fehler nicht verteufeln» nennt. Drei Verbände, drei Wege, dieselbe Schlussfolgerung.",
 f:"Wenn das Resultat vom Samstag über den Saisonplan bestimmt, ist das Projekt bereits gebrochen."});

ENSC_EN.gen.bloques.push(
{h:"Cross-check: where the three schools agree and where they do not",
 p:"The sequence in this guide was checked against the <strong>FIVB Level I Coaches Manual</strong>, the world federation's own, with chapters by Doug Beal — Olympic gold in 1984 and later CEO of USA Volleyball — Yuri Chesnokov, Professor Hiroshi Toyoda of the Technical Commission, and Yasutaka Matsudaira. There are very strong agreements and three disagreements worth knowing rather than hiding.",
 f:"Where two authorities disagree, the document says so. Hiding it would be the real error."},
{h:"What all three agree on, without exception",
 p:"That teaching happens through <strong>small-sided games from day one</strong> — the FIVB prescribes 2v2, 3v3 and 4v4 on a small court and calls them lead-up games. That <strong>nobody watches</strong>: it states in so many words that there is no improvement in players who only observe or sit, and that equal opportunities to participate must be given. That <strong>process matters more than result</strong>: do not chase victories alone, because effort in training matters more than the competitive result. And that <strong>blocking comes last</strong>, after spike reception and serve reception. Our framework places it in Rookie 3 and agrees.",
 f:"Three independent bodies reaching the same place. That is no longer opinion."},
{h:"Disagreement 1 — the order of the forearm pass and the overhead touch",
 p:"The most concrete one, and it hits us directly. The FIVB teaches <strong>the forearm pass first</strong> — weeks 3 to 5 of its plan — and the overhead touch only in weeks 8 to 10. The Swiss system, and our guide with it, does the opposite: catch and throw first, then the overhead touch, and the forearm pass appears as a resource in Kids Volley 3. Both orders are defended by real authorities. We follow the Swiss one because it governs the club's competition, but the coach should know it is not the only valid sequence.",
 f:"If a child does not take to the overhead touch, try the forearm pass first. The FIVB calls that the natural order."},
{h:"Disagreement 2 — specialise early or not",
 p:"Beal writes that specialisation shortens the road to success, and that a team develops faster by concentrating on a few elements rather than building a broad base. But he states the full condition: <strong>it is hazardous, because you depend on a narrow set of skills rather than a broad-based foundation</strong>. That is the direct answer to whether steps can be skipped: yes they can, and the price is a more fragile player. The Swiss system chose the opposite in Future 1 — no libero, everyone sets — and so does our framework.",
 f:"The shortcut exists and it has a name: specialise. Know what you are paying for it."},
{h:"Disagreement 3 — the FIVB manual teaches in parts",
 p:"Its progressions run «arm swing, then approach, then take-off, then jump and catch, then jump and hit». That is exactly the part teaching for which the motor-learning review found not a single supporting study. The FIVB manual is from 2013 and, on method, has fallen behind McGown's American school. <strong>Our position: from the FIVB we take the order of the content, from McGown the method for teaching it.</strong>",
 f:"What and when: FIVB and Swiss Volley. How: motor learning."},
{h:"What can genuinely be shortened",
 p:"Maturation cannot be shortened: a child in the growth spurt cannot be hurried. What can be eliminated is waste, and there is plenty. <strong>Ball contacts per player</strong> instead of queues. <strong>The whole rally</strong> instead of an isolated action that does not transfer. <strong>Random order</strong> instead of twenty identical repetitions that look better and deliver less. <strong>A rule</strong> instead of an explanation. And the <strong>October and March measurements</strong>, which prevent the year lost to deciding by eye. A club that does these five things does not accelerate the player: it stops slowing them down.",
 f:"The real shortcut is not training faster. It is no longer losing sixty per cent of the session."},
{h:"The Italian school: the coach is a teacher",
 p:"Julio Velasco studied philosophy and wanted to be a secondary school teacher. He left the degree six exams short, then took Italy to the side voted team of the century, led the Italian federation's men's youth national teams from 2019, and won Olympic gold in Paris 2024 and the 2025 world title with the women's national team. The day after the gold he explained his method in one sentence: <strong>every coach has to be a teacher, forgetting entirely that they were once a player.</strong> That sentence is the premise of this whole tab.",
 f:"If the way you explain depends on how you used to do it, you are not teaching yet."},
{h:"The alibi theory, and the rule that follows from it",
 p:"The most applicable idea in all the material we reviewed. Velasco describes it this way: the hitter misses a spike and blames the setter; the setter blames the passer; and so on. Nobody takes responsibility. His rule against it is one line and can be installed tomorrow: <strong>hitters do not talk about the set in any way, they solve it.</strong> And the principle behind it: putting the responsibility for our failures on others is the surest road to mediocrity. Stop looking for culprits and start looking for solutions.",
 f:"Club rule, from Rookie 3: nobody comments on the ball they received. They solve it."},
{h:"The error is not demonised",
 p:"Velasco anticipated what is now called resilience: the error is neither feared nor punished, it is understood and turned into a learning opportunity. It is exactly our identity principle 05 — the aggressive error is accepted, the passive one is not — and it now has behind it the most successful coach in European volleyball history, not only our own judgement.",
 f:"The outcome of the drill is not the point. The decision is."},
{h:"And a line that corrects our load section",
 p:"On managing athletes' energy, Velasco is blunt: <strong>an athlete's main recovery is not muscular, it is of the nervous and mental system.</strong> Our individual load sheet counts hours, jumps and competitions — all physical load. The other half is missing. On youth players he was even more direct: a youth player lives a harder life than a professional, because they go to school, attend classes, sometimes take language lessons and then train, seven days a week. And he finished: <em>let them breathe for a moment and you will see they want to train more and improve more.</em>",
 f:"The two rest days a week are not a concession. They are training for the nervous system."},
{h:"Final comparison of the four schools",
 p:"<strong>Switzerland</strong> provides the structure: what is played at each stage and how to classify by level rather than age. <strong>The United States</strong> provides the method: whole skill, random order, contact density and the motor-learning evidence. <strong>The FIVB</strong> provides the order of the content and the world standard for coach education. <strong>Italy</strong> provides what the other three lack: the culture. The coach as a teacher, responsibility without alibis, the error as working material, and mental recovery as part of the plan. The four together make this document.",
 f:"Swiss structure, American method, FIVB sequence, Italian culture."},
{h:"Brazil: the fourteen adaptations of the Confederation's project",
 p:"The Brazilian Confederation published a project in 2021 to standardise its youth categories, and in 2024 a study analysed it through interviews with five of the confederation's professionals — people from the senior and under-19 national teams, averaging ten years there. It defines fourteen adjustments per age band, from U9 to U21, grouped into three phases: <strong>Initiation, Development and Performance</strong>. They are not recommendations: they are competition rules.",
 f:"What in most clubs is the coach's judgement is, in Brazil, regulation."},
{h:"The rule we most lack: a minimum of players used per match",
 p:"Brazil requires <strong>ten players to be used per match</strong> in the initiation and development phases, and eight in performance. It is not a minimum squad: it is players who actually go on. The reason is direct — technical and tactical learning depends on taking part in real game situations, not only on training, and without that rule the coach ends up playing the same seven every week.",
 f:"A rule to take to the board: in youth volleyball, how many have to play, no matter what?"},
{h:"The match is designed to create critical moments",
 p:"On the women's side Brazil mandates <strong>five sets of fifteen points, played in full, whatever the result</strong>. The reason they give is among the best in all the material: fifteen points matches a child's attention span, and five sets expose them far more often to serving at 14-all or deciding a set. The match format is not an administrative formality: it is a development tool.",
 f:"A short set and many sets produce more pressure moments than one long match."},
{h:"How many categories a player may play up",
 p:"In initiation, <strong>one category above only</strong>. In development, up to two. And in performance, back to one. The reasoning is psychological and emotional, not physical: a player needs to have lived their own category in order to decide well in critical moments. And the line from the interviewees worth having ready when somebody asks to move a child up: <em>childhood is a stage for learning and playing, not for being stressed by competition and the need to win</em>.",
 f:"Our second-stage rule now has external backing and a number attached."},
{h:"The early libero is the error they name most",
 p:"It was the concern all five interviewees repeated most. The concrete danger: the shortest player is made a libero the moment they arrive and never does anything else. And there is a second effect almost nobody sees — once a specialised libero appears, <strong>two more players stop playing in the back court</strong> and never develop passing or defence. That is why Brazil bans it until U15 and only allows it from U17.",
 f:"Without a libero, even the tallest has to pass and dig."},
{h:"The 5-1 specialises, the 4x2 with penetration makes players versatile",
 p:"A finding from a study with Brazilian coaches worth quoting whole: the <strong>4x2 with penetration increases versatility</strong> because it lets the player learn aspects of other formats and play different positions, while <strong>the 5-1 promotes role specialisation</strong>, above all the setter's. Both are correct; what matters is knowing what each produces and when each fits.",
 f:"The 4v4 with penetration in Rookie 2 is not a lesser system: it is the tool that makes complete players."},
{h:"Two research findings that change how players are selected",
 p:"First: in a study with volleyball players, <strong>those who had diversified practice and were not specialised early were the majority</strong> in the São Paulo state championships and in the Superliga. Second, and even more useful for our identification: at these ages sporting performance <strong>relates more to taking part in systematic practice than to physical performance</strong>. Selecting on height or jump at thirteen is selecting badly.",
 f:"The one who trains systematically beats the one who jumps higher today. That has been measured."},
{h:"And the principle that orders the whole Brazilian project",
 p:"The authors put it in a line: <strong>competition in the youth categories is part of the sporting development process and not its end goal.</strong> The fourteen adaptations exist for that. It is the same principle Swiss Volley put at the centre of Smart Competitions when it stopped publishing results, and the same one Velasco calls not demonising the error. Three federations, three roads, the same conclusion.",
 f:"If Saturday's result governs the season plan, the project is already broken."});

ENSC_DE.u20 = {
 t:"U20: drei Stufen auf einem Feld", sub:"Sonderanleitung · für die Gruppe, die Future 1, 2 und 3 plus Aktivspieler mischt",
 obj:"Eine Gruppe zum Funktionieren bringen, in der vier verschiedene Niveaus zusammenkommen, ohne alle auf das schwächste herunterzuziehen und ohne die Jüngsten zu verlieren.",
 porque:"Das ist keine vorübergehende Lage und kein Organisationsproblem: Es ist die Struktur des Vereins. Im U20 dieser Saison stehen zwei Personen im Alter von Future 1, drei in Future 2, drei in Future 3 und sieben, die bereits über achtzehn sind. Vier verschiedene Anleitungen in derselben Hallenstunde. Die Antwort ist nicht, eine auszuwählen und auf alle anzuwenden, denn damit trainiert die Hälfte der Gruppe etwas, das ihr nicht entspricht. Die Antwort ist zu wissen, was die vier teilen und was getrennt gehört, und das Kriterium zu haben, es jeden Dienstag zu entscheiden.",
 tecnica:[
  {n:"Annahme gegen Wettkampfservice",cad:"Allen drei Stufen gemeinsam · niemand fällt heraus",int:"Die einzige Bewegung, die alle vier Altersbereiche auf demselben Anspruchsniveau brauchen, und die am stärksten darüber entscheidet, ob der Ballwechsel überhaupt stattfindet.",pts:["Spielbrett vorher geformt.","Körper hinter dem Ball.","Schultern lenken zur Zuspielerin."],frase:"«Trainiert wird mit dem Service vom Samstag, nicht mit einem leichteren.»",err:"Die Serviceintensität senken, damit die Jüngeren nicht leiden. Dann trainieren die Älteren gar nichts.",arreglo:"Gleiche Intensität für alle; den Jüngeren senkst du die Zone, nicht die Geschwindigkeit."},
  {n:"Angriff mit Richtung",cad:"Future 1 festigt ihn · Future 2 und 3 verfeinern ihn",int:"Alle können dieselbe Bewegung mit unterschiedlichem Anspruch bearbeiten.",pts:["Anlauf immer gleich.","Das Handgelenk entscheidet.","Entscheidung vor dem Sprung."],frase:"«Gleicher Anlauf, anderes Handgelenk.»",err:"Allen vier Niveaus dieselbe Vorgabe geben.",arreglo:"Von Future 1 verlangst du eine Richtung; von Future 3 zwei und gegen formierten Block."},
  {n:"Abwehr und Übergang",cad:"Der echte Abstand zum Aktivvolleyball",int:"Die sieben Erwachsenen der Gruppe sind deine beste Ressource: Den Übergang lernt man, indem man gegen Leute spielt, die ihn beherrschen.",pts:["Tiefe Position, Gewicht nach vorn.","Sofortiger Übergang in den Gegenangriff.","Landen, drehen, vom Netz weg."],frase:"«Verteidigen heisst anfangen anzugreifen.»",err:"Die Älteren in den Spielformen von den Jüngeren trennen.",arreglo:"Mische sie absichtlich. Dort lernt die Person aus Future 1 im Schlepptau, was du ihr nicht erklären kannst."},
  {n:"Service unter Druck",cad:"Skaliert von selbst mit dem Niveau",int:"Dieselbe Übung dient allen vier Niveaus, wenn nur die Konsequenz geändert wird.",pts:["Immer derselbe Wurf.","Fehlerquote pro Person vereinbart, nicht pro Gruppe."],frase:"«Niemand verfehlt ein Service in der zehnten Minute.»",err:"Eine einzige Serviceanforderung für die ganze Gruppe.",arreglo:"Jede Person mit ihrer eigenen Zahl, schriftlich. Future 1 mit 3 von 10 aggressiven Services, Future 3 mit 7."},
  {n:"Zuspiel aus dem Hinterfeld",cad:"Future 1 braucht es · Future 3 hat es schon",int:"Daran festhalten, dass alle zuspielen, auch wenn die aus Future 3 bereits spezialisiert sind.",pts:["Hohe Stirn und Hände vorne vor dem letzten Schritt.","Impuls aus den Beinen.","Oberkörper zum Ziel."],frase:"«Wer heute nicht zuspielt, spielt nie zu.»",err:"Die aus Future 3 den Block überspringen lassen, weil sie es schon können.",arreglo:"Sie machen ihn trotzdem, aber mit schwierigerem Ball. Es ist keine Wiederholung, es ist Belastung."}],
 tactica:[
  {n:"Wie das Feld geteilt wird",d:"Zwei Felder mit zwei verschiedenen Regeln sind das Hauptwerkzeug dieser Gruppe, und es lohnt sich, es die halbe Einheit lang zu nutzen. Nicht nach Alter teilen, sondern nach dem, was jede Person an diesem Tag braucht."},
  {n:"Wann NICHT geteilt wird",d:"Im Schlussspiel wird immer gemischt. Eine Person aus Future 1, die mit Erwachsenen spielt, lernt Tempo und Übergang in zwanzig Minuten, was sie in einem Monat Übungen nicht lernt."},
  {n:"Die sieben Aktiven sind kein Problem",d:"Sie sind die wertvollste Ressource der Gruppe. Aber jemand muss entscheiden, ob sie da sind, um sich zu entwickeln, oder um die Mannschaft zu tragen, denn das ist nicht dasselbe und ändert, was von ihnen verlangt wird."},
  {n:"Das System, das gespielt wird",d:"Das U20 spielt mit einem System, und das wird trainiert. Aber die Person aus Future 1 muss die Penetration in allen sechs Rotationen verstehen, bevor sie sich spezialisiert, also kehrt man in den Kleinfeldblöcken zum 6-6 zurück, auch wenn im Spiel 5-1 gespielt wird."},
  {n:"Keine Alibis",d:"In einer Gruppe mit vier Niveaus ist die Schuldkette leichter geknüpft: Der Ältere beschuldigt den Jüngeren und der Jüngere macht sich klein. Die Regel von Velasco gilt hier doppelt — niemand kommentiert den Ball, den er bekommen hat, er löst ihn."}],

  ["20","Bewegung des Blocks, auf zwei Feldern mit unterschiedlichem Anspruch."],
  ["20","Komplex, noch nach Niveau getrennt."],

  ["2","Abschluss: Es spricht eine der Jüngeren, nicht eine der Älteren."]],

  ["September-Oktober","Annahme gegen echtes Service, mit individuellem Anspruch. Die Bewegung, die die ganze Gruppe verbindet.","Messung im Oktober. Jede Person mit ihrer eigenen Annahmezahl, nicht einem Gruppenschnitt."],
  ["November-Dezember","Angriff mit Richtung und Abwehr-Übergang, im Spiel mit den Erwachsenen gemischt.","Die aus Future 1 halten das Tempo im gemischten Spiel, ohne sich zu verstecken."],
  ["Januar","Progressiver Wiedereinstieg. Belastung derer prüfen, die zusätzlich Liga spielen: Hier häuft es sich.","Individuelles Blatt aktuell für alle mit Ligaeinsätzen."],
  ["Februar-März","Zuspiel aus dem Hinterfeld und Service unter Druck, mit eigener Zahl pro Person. Überprüfung der Einstufung.","Messung im März. Wer steigt innerhalb derselben Gruppe eine Stufe auf."],

 errDT:[
  "Für den Durchschnitt der Gruppe trainieren. In einer Gruppe mit vier Niveaus nützt der Durchschnitt niemandem.",

 evalu:"Die Übertrittskriterien sind nicht die der Gruppe, sondern die der Stufe jeder einzelnen Person. Sie stehen in den Blättern von Future 1, 2 und 3. Nutze den Kader, um zu wissen, welche für wen gilt."

ENSC_EN.u20 = {
 t:"U20: three stages on one court", sub:"Special guide · for the group that mixes Future 1, 2 and 3 plus senior players",
 obj:"Make a group work where four different levels coexist, without dragging everyone down to the weakest and without losing the youngest.",
 porque:"This is neither temporary nor an organisational glitch: it is the club's structure. In this season's U20 there are two players of Future 1 age, three in Future 2, three in Future 3 and seven who are already over eighteen. Four different guides in the same gym hour. The answer is not to pick one and apply it to everybody, because that leaves half the group training something that does not belong to them. The answer is to know what the four share and what has to be separated, and to have the criteria to decide it every Tuesday.",
 tecnica:[
  {n:"Passing against a match serve",cad:"Common to all three stages · nobody is left out",int:"The only skill all four age bands need at the same level of demand, and the one that most determines whether the rally happens at all.",pts:["Platform formed early.","Body behind the ball.","Shoulders direct it to the setter."],frase:"«You train with Saturday's serve, not an easier one.»",err:"Lowering the serve intensity so the youngest do not suffer. Then the older ones train nothing at all.",arreglo:"Same intensity for everyone; for the youngest you lower the target zone, not the speed."},
  {n:"Attacking with direction",cad:"Future 1 consolidates it · Future 2 and 3 refine it",int:"Everyone can work the same action at a different level of demand.",pts:["Approach always the same.","The wrist decides.","Decision before the jump."],frase:"«Same approach, different wrist.»",err:"Giving the same instruction to all four levels.",arreglo:"Ask a Future 1 player for one direction; ask a Future 3 player for two, against a formed block."},
  {n:"Defence and transition",cad:"The real gap to the senior game",int:"The seven adults in the group are your best resource: transition is learned by playing against people who have it.",pts:["Low stance, weight forward.","Immediate transition into the counter-attack.","Land, turn, get off the net."],frase:"«Defending means starting to attack.»",err:"Separating the older from the younger in the game drills.",arreglo:"Mix them on purpose. That is where a Future 1 player picks up by osmosis what you cannot explain."},
  {n:"Serving under pressure",cad:"It scales by itself with the level",int:"The same drill serves all four levels by changing only the consequence.",pts:["The same toss every time.","Error rate agreed per player, not per group."],frase:"«Nobody misses a serve in the tenth minute.»",err:"A single serving standard for the whole group.",arreglo:"Each player with their own number, written down. Future 1 at 3 aggressive serves out of 10, Future 3 at 7."},
  {n:"Setting from the back row",cad:"Future 1 needs it · Future 3 already has it",int:"Holding the line that everyone sets, even though the Future 3 players are already specialised.",pts:["High forehead and hands forward before the last step.","Impulse from the legs.","Torso to the target."],frase:"«Whoever does not set today never sets.»",err:"Letting the Future 3 players skip the block because they already know it.",arreglo:"They do it anyway, but with a harder ball. It is not revision: it is load."}],
 tactica:[
  {n:"How the court is split",d:"Two courts with two different rules is the main tool for this group, and it is worth using for half the session. It is not splitting by age: it is splitting by what each player needs that day."},
  {n:"When NOT to split",d:"In the closing game they always mix. A Future 1 player playing with adults learns rhythm and transition in twenty minutes that they would not learn in a month of drills."},
  {n:"The seven senior players are not a problem",d:"They are the group's most valuable resource. But somebody has to decide whether they are there to develop or to hold the team together, because those are not the same and they change what is asked of them."},
  {n:"The system that gets played",d:"The U20 competes with one system and that is the one trained. But a Future 1 player has to understand penetration in all six rotations before specialising, so in the small-sided blocks you go back to the 6-6 even though the match is played 5-1."},
  {n:"No alibis",d:"In a group with four levels the chain of blame is easier to build: the older blames the younger and the younger shrinks. Velasco's rule counts double here — nobody comments on the ball they received, they solve it."}],

ENSC.gen.bloques.push(
{h:"Polonia: el error de medición que estamos cometiendo",
 p:"Es el hallazgo más incómodo de toda la investigación y nos toca de lleno. Un estudio con <strong>2.528 varones y 2.441 mujeres polacos de 14 y 15 años</strong>, del torneo de élite de su federación entre 2004 y 2015, identificó el <strong>efecto de la edad relativa</strong>: los nacidos en los primeros meses del año están sobrerrepresentados. Y el dato preciso que nos obliga a cambiar algo: entre los varones <em>no</em> seleccionados para el programa nacional, el trimestre de nacimiento explicaba diferencias significativas en <strong>talla, alcance de ataque y salto de bloqueo</strong>. Nuestra medición de octubre compara a un chico nacido en enero con uno nacido en diciembre como si tuvieran la misma edad. No la tienen: se llevan casi un año.",
 f:"Corrección al protocolo: junto a cada medición se anota el trimestre de nacimiento, y se compara contra los del mismo trimestre, no contra el promedio del año."},
{h:"Y por qué esto decide carreras",
 p:"Un chico nacido en diciembre que a los catorce mide cinco centímetros menos y salta menos que uno de enero no es peor jugador: es más chico. Si lo medimos sin corregir, sale abajo en la tabla, no va a la sichtung, y en dos años ya se fue del club. El efecto desaparece solo cuando termina la maduración, pero para entonces la selección ya ocurrió. Es exactamente el mismo mecanismo que hace que en Brasil el rendimiento a estas edades se relacione más con la práctica sistemática que con el rendimiento físico.",
 f:"Antes de decidir sobre un jugador de trece o catorce, mirá la fecha de nacimiento. Siempre."},
{h:"Polonia: la escala que consigue el volumen",
 p:"En la temporada 2023-24, <strong>cerca de 47.000 chicos</strong> participaron de un solo torneo juvenil polaco. El formato: de 7 a 13 años, cancha reducida, red baja, y competencia en 1:1, 2:2, 3:3 y 4:4, con el objetivo declarado de maximizar los contactos con la pelota. Es la quinta federación independiente que llega a lo mismo: pocos jugadores por cancha, cancha chica, muchos toques. Y agrega algo que ninguna de las otras dice tan claro — la exposición temprana a la competencia, en un ambiente que la sostiene, enseña a manejar la presión y a recuperarse del error.",
 f:"Suiza, Estados Unidos, la FIVB, Brasil y Polonia dicen lo mismo con palabras distintas."},
{h:"Francia y Polonia: la escuela como parte del plan, no como obstáculo",
 p:"Las dos potencias resolvieron la carrera dual con estructura y no con voluntarismo. Polonia tiene escuelas deportivas con <strong>diez horas semanales de entrenamiento</strong> frente a las tres de educación física de una escuela común. Francia organiza <strong>ocho o nueve polos regionales</strong> con horario escolar adaptado y dieciséis horas semanales de vóley y preparación física, evaluados cada año por el ministerio. Nuestro equivalente es la Talent Card de Swiss Olympic, y vale usarla: existe justamente para que la escuela acomode el horario.",
 f:"Si un jugador de Future 3 no puede entrenar por el horario escolar, hay un instrumento oficial para eso y casi nadie lo pide."},
{h:"Francia: el polo no se lleva al jugador del club",
 p:"El detalle de diseño que más nos sirve. En los polos franceses las jugadoras entrenan de lunes a viernes en la estructura federal y <strong>vuelven a su club el viernes</strong> para entrenar y competir el fin de semana, manteniendo su licencia en el club de origen. No es una elección entre el club y la federación: son las dos cosas a la vez. Es exactamente la relación que Näfels puede construir con la estructura regional de GSGL en vez de vivirla como una pérdida.",
 f:"Cuando un jugador nuestro entra al Talentpool, no lo perdemos. Es lo mismo que hace Francia."},
{h:"Francia: una frase para la conversación con las familias",
 p:"Está en el documento federal y conviene tenerla escrita: <strong>pertenecer a una selección nacional o a un polo no es una finalidad en sí misma, sino un medio funcional</strong> que debe favorecer que el jugador alcance su objetivo deportivo. Dicho de otro modo: entrar a la estructura no es el logro. Y el marco que usan tiene tres patas —deportiva, escolar y personal— con seguimiento médico, escolar y social permanente.",
 f:"La detección no es el premio. Es una herramienta."},
{h:"Estados Unidos: qué significa acelerar, institucionalmente",
 p:"USA Volleyball creó en 2021 un programa nacional de desarrollo cuya misión declarada es <strong>identificar, reclutar y acelerar el desarrollo</strong> de juveniles de alto potencial. Empieza a seleccionar en U16 en varones y <strong>U15 en mujeres</strong>, un año antes, lo que coincide con que la maduración femenina es más temprana. Es la respuesta institucional a tu pregunta sobre acortar pasos: no se acorta el contenido, se adelanta el <em>entorno</em> — juntar a los de más potencial en un ambiente de entrenamiento de nivel alto y evaluarlos ahí.",
 f:"Acelerar es cambiar el entorno del jugador, no saltearle etapas."});

ENSC_DE.gen.bloques.push(
{h:"Polen: der Messfehler, den wir gerade machen",
 p:"Der unbequemste Befund der ganzen Recherche, und er trifft uns voll. Eine Studie mit <strong>2.528 Jungen und 2.441 Mädchen aus Polen im Alter von 14 und 15 Jahren</strong>, aus dem Elite-Turnier ihres Verbands zwischen 2004 und 2015, wies den <strong>Relativen Alterseffekt</strong> nach: die in den ersten Monaten des Jahres Geborenen sind überrepräsentiert. Und der Befund, der uns zum Handeln zwingt: Bei den <em>nicht</em> für das nationale Programm ausgewählten Jungen erklärte das Geburtsquartal signifikante Unterschiede bei <strong>Körpergrösse, Angriffsreichweite und Blocksprung</strong>. Unsere Oktobermessung vergleicht ein im Januar geborenes Kind mit einem vom Dezember, als wären sie gleich alt. Sie sind es nicht: Es liegt fast ein Jahr dazwischen.",
 f:"Korrektur am Protokoll: Zu jeder Messung wird das Geburtsquartal notiert, und verglichen wird innerhalb desselben Quartals, nicht gegen den Jahresdurchschnitt."},
{h:"Und warum das über Laufbahnen entscheidet",
 p:"Ein im Dezember geborenes Kind, das mit vierzehn fünf Zentimeter kleiner ist und weniger hoch springt als eines vom Januar, ist nicht schlechter: Es ist jünger. Messen wir ohne Korrektur, landet es unten in der Tabelle, geht nicht zur Sichtung, und zwei Jahre später ist es weg. Der Effekt verschwindet erst mit dem Ende der Reifung, aber bis dahin ist die Auswahl längst erfolgt. Es ist derselbe Mechanismus, der in Brasilien dazu führt, dass die Leistung in diesem Alter stärker mit systematischer Praxis zusammenhängt als mit körperlicher Leistung.",
 f:"Bevor du über eine dreizehn- oder vierzehnjährige Person entscheidest, schau auf das Geburtsdatum. Immer."},
{h:"Polen: die Grössenordnung, die das Volumen erzeugt",
 p:"In der Saison 2023-24 nahmen <strong>rund 47.000 Kinder</strong> an einem einzigen polnischen Nachwuchsturnier teil. Das Format: 7 bis 13 Jahre, kleines Feld, tiefes Netz, Wettkampf in 1:1, 2:2, 3:3 und 4:4, mit dem erklärten Ziel, möglichst viele Ballkontakte zu erzeugen. Es ist der fünfte unabhängige Verband, der zum selben Schluss kommt: wenige Personen pro Feld, kleines Feld, viele Kontakte. Und er fügt etwas hinzu, das keiner der anderen so deutlich sagt — frühe Wettkampferfahrung in einem tragenden Umfeld lehrt, mit Druck umzugehen und sich vom Fehler zu erholen.",
 f:"Die Schweiz, die USA, die FIVB, Brasilien und Polen sagen dasselbe mit anderen Worten."},
{h:"Frankreich und Polen: die Schule als Teil des Plans, nicht als Hindernis",
 p:"Beide Nationen haben die duale Laufbahn mit Struktur gelöst und nicht mit gutem Willen. Polen hat Sportschulen mit <strong>zehn Trainingsstunden pro Woche</strong> gegenüber drei Stunden Sportunterricht an einer normalen Schule. Frankreich betreibt <strong>acht bis neun regionale Zentren</strong> mit angepasstem Stundenplan und sechzehn Wochenstunden Volleyball und Athletik, jährlich vom Ministerium evaluiert. Unser Gegenstück ist die Talent Card von Swiss Olympic, und sie lohnt sich: Sie existiert genau dafür, dass die Schule den Stundenplan anpasst.",
 f:"Wenn eine Person in Future 3 wegen des Stundenplans nicht trainieren kann, gibt es dafür ein offizielles Instrument, und fast niemand beantragt es."},
{h:"Frankreich: das Zentrum nimmt die Person dem Verein nicht weg",
 p:"Das Konstruktionsdetail, das uns am meisten nützt. In den französischen Zentren trainieren die Spielerinnen von Montag bis Freitag in der Verbandsstruktur und <strong>kehren am Freitag in ihren Verein zurück</strong>, um am Wochenende zu trainieren und zu spielen, mit der Lizenz weiterhin im Stammverein. Es ist keine Wahl zwischen Verein und Verband: Es ist beides gleichzeitig. Genau diese Beziehung kann Näfels zur regionalen Struktur der GSGL aufbauen, statt sie als Verlust zu erleben.",
 f:"Wenn eine Person von uns in den Talentpool kommt, verlieren wir sie nicht. Frankreich macht es genauso."},
{h:"Frankreich: ein Satz für das Gespräch mit den Familien",
 p:"Er steht im Verbandsdokument und sollte festgehalten werden: <strong>die Zugehörigkeit zu einer Nationalmannschaft oder einem Zentrum ist kein Selbstzweck, sondern ein funktionales Mittel</strong>, das der Person helfen soll, ihr sportliches Ziel zu erreichen. Anders gesagt: Der Eintritt in die Struktur ist nicht die Leistung. Und der Rahmen, den sie verwenden, steht auf drei Beinen — sportlich, schulisch und persönlich — mit durchgehender medizinischer, schulischer und sozialer Begleitung.",
 f:"Die Sichtung ist nicht der Preis. Sie ist ein Werkzeug."},
{h:"Die USA: was Beschleunigen institutionell bedeutet",
 p:"USA Volleyball schuf 2021 ein nationales Entwicklungsprogramm, dessen erklärte Aufgabe es ist, Nachwuchspersonen mit hohem Potenzial zu <strong>identifizieren, zu rekrutieren und ihre Entwicklung zu beschleunigen</strong>. Die Auswahl beginnt bei den Jungen in U16 und bei den Mädchen in <strong>U15</strong>, ein Jahr früher, was damit übereinstimmt, dass die weibliche Reifung früher einsetzt. Es ist die institutionelle Antwort auf die Frage nach dem Abkürzen: Nicht der Inhalt wird gekürzt, sondern das <em>Umfeld</em> vorgezogen — die mit dem höchsten Potenzial in einem Trainingsumfeld auf hohem Niveau zusammenbringen und sie dort beurteilen.",
 f:"Beschleunigen heisst, das Umfeld der Person zu ändern, nicht ihr Stufen zu überspringen."});

ENSC_EN.gen.bloques.push(
{h:"Poland: the measurement error we are making",
 p:"The most uncomfortable finding of the whole search, and it hits us directly. A study of <strong>2,528 boys and 2,441 girls in Poland aged 14 and 15</strong>, from their federation's elite tournament between 2004 and 2015, identified the <strong>relative age effect</strong>: those born in the early months of the year are over-represented. And the precise finding that forces a change on us: among the boys <em>not</em> selected for the national programme, birth quarter explained significant differences in <strong>height, spike reach and block jump</strong>. Our October measurement compares a child born in January with one born in December as though they were the same age. They are not: almost a year separates them.",
 f:"Correction to the protocol: record the birth quarter alongside every measurement, and compare within the same quarter rather than against the year's average."},
{h:"And why this decides careers",
 p:"A child born in December who at fourteen is five centimetres shorter and jumps less than one born in January is not a worse player: they are younger. Measure without correcting and they come out at the bottom of the table, do not go to the trial, and two years later they have left the club. The effect only disappears when maturation ends, but by then the selection has already happened. It is the same mechanism that makes performance at these ages relate more to systematic practice than to physical performance in Brazil.",
 f:"Before deciding about a thirteen- or fourteen-year-old, look at the date of birth. Always."},
{h:"Poland: the scale that produces the volume",
 p:"In the 2023-24 season, <strong>close to 47,000 children</strong> took part in a single Polish youth tournament. The format: ages 7 to 13, reduced court, low net, and competition in 1v1, 2v2, 3v3 and 4v4, with the declared aim of maximising ball contacts. It is the fifth independent federation to arrive at the same place: few players per court, small court, many touches. And it adds something none of the others states as clearly — early exposure to competition, in a supportive environment, teaches players to handle pressure and to bounce back from errors.",
 f:"Switzerland, the United States, the FIVB, Brazil and Poland say the same thing in different words."},
{h:"France and Poland: school as part of the plan, not an obstacle",
 p:"Both nations solved the dual career with structure rather than goodwill. Poland runs sport schools with <strong>ten hours of training a week</strong> against three hours of physical education in a normal school. France runs <strong>eight or nine regional centres</strong> with an adapted school timetable and sixteen weekly hours of volleyball and physical preparation, assessed annually by the ministry. Our equivalent is the Swiss Olympic Talent Card, and it is worth using: it exists precisely so that the school adjusts the timetable.",
 f:"If a Future 3 player cannot train because of the school timetable, there is an official instrument for that and almost nobody asks for it."},
{h:"France: the centre does not take the player away from the club",
 p:"The design detail that helps us most. In the French centres the players train Monday to Friday in the federal structure and <strong>return to their club on Friday</strong> to train and compete at the weekend, keeping their licence at the home club. It is not a choice between club and federation: it is both at once. That is exactly the relationship Näfels can build with the GSGL regional structure instead of experiencing it as a loss.",
 f:"When one of our players enters the Talentpool, we do not lose them. France does the same thing."},
{h:"France: a line for the conversation with families",
 p:"It is in the federal document and worth writing down: <strong>belonging to a national team or a centre is not an end in itself but a functional means</strong> that should help the player reach their own sporting goal. Put another way: getting into the structure is not the achievement. And the framework they use stands on three legs — sporting, academic and personal — with continuous medical, academic and social support.",
 f:"Identification is not the prize. It is a tool."},
{h:"The United States: what accelerating means institutionally",
 p:"In 2021 USA Volleyball created a national development programme whose declared mission is to <strong>identify, recruit and accelerate the development</strong> of high-potential junior athletes. Selection begins at U16 for boys and <strong>U15 for girls</strong>, a year earlier, which matches female maturation arriving sooner. It is the institutional answer to the question about taking shortcuts: the content is not shortened, the <em>environment</em> is brought forward — gather the highest-potential players in a high-level training environment and assess them there.",
 f:"Accelerating means changing the player's environment, not skipping their stages."});

      <section class="bloque"><h3>${S("eTac")}</h3>
        ${(c2.tactica||[]).map(x=>`<details class="plg"><summary>${x.n}</summary><div class="plg-c"><p>${x.d}</p></div></details>`).join("")}</section>
      <div class="ens-dos">
        <section class="bloque"><h3>${S("eFis")}</h3><p>${c2.fis}</p></section>
        <section class="bloque"><h3>${S("eMen")}</h3><p>${c2.men}</p></section></div>
      <section class="bloque"><h3>${S("eSes")}</h3>
        <p>${S("eSesP")}</p>
        <div class="tabla-envoltura"><table><thead><tr><th>${S("eMin")}</th><th>${S("eQue")}</th></tr></thead><tbody>
        ${(c2.sesion||[]).map(x=>`<tr><td class="num"><strong>${x[0]}</strong></td><td>${x[1]}</td></tr>`).join("")}
        </tbody></table></div></section>
      <section class="bloque"><h3>${S("eAnio")}</h3>
        <p>${S("eAnioP")}</p>
        <div class="tabla-envoltura"><table><thead><tr><th>${S("eCua")}</th><th>${S("eTra")}</th><th>${S("eCtr")}</th></tr></thead><tbody>
        ${(c2.anio||[]).map(x=>`<tr><td class="num"><strong>${x[0]}</strong></td><td>${x[1]}</td><td>${x[2]||""}</td></tr>`).join("")}
        </tbody></table></div></section>
      ${D().etapas[ENS_CAT] ? `<section class="bloque"><h3>${S("eEst")}</h3>
        <p>${S("eEstP")}</p>
        <div class="tabla-envoltura"><table><thead><tr><th>${S("eCri")}</th><th>${S("estDom")}</th><th>${S("estComp")}</th></tr></thead><tbody>
        ${D().etapas[ENS_CAT].est.map(e=>`<tr><td><strong>${e[0]}</strong></td><td>${e[1]}</td><td class="est-c">${e[2]||""}</td></tr>`).join("")}
        </tbody></table></div></section>` : ""}
      <section class="bloque"><h3>${S("eErr")}</h3>
        <p>${S("eErrP")}</p>
        ${(c2.errDT||[]).map(x=>`<div class="err-dt">${x}</div>`).join("")}</section>
      <section class="bloque"><h3>${S("eEva")}</h3><p>${c2.evalu}</p></section>
      ${(c2.rec&&c2.rec.length)?`<section class="bloque"><h3>${S("eRec")}</h3>
        ${c2.rec.map(r=>`<div class="rec"><a href="${r.u}" target="_blank" rel="noopener">${r.t}</a></div>`).join("")}</section>`:""}`;
  } else {
    const et = ETAPAS[ENS_CAT];
    cuerpo = `<div class="ens-obj" style="--c:${et.c}"><span>Objetivo de la etapa</span><p>${c.obj}</p></div>
      <section class="bloque"><h3>${S("eEnt")}</h3>
        <p>Lo que la etapa siguiente da por sabido. Cómo se llega es decisión tuya.</p>
        <ul>${c.ent.map(x=>`<li>${x}</li>`).join("")}</ul></section>
      <section class="bloque"><h3>${S("eExp")}</h3>
        <p>Se usan tal cual y siempre las mismas: es lo que hace que un cambio de entrenador no cueste medio año.</p>
        ${c.dec.map(x=>`<div class="frase">${x}</div>`).join("")}</section>
      <section class="bloque"><h3>${S("eEje")}</h3><p>${c.ej}</p></section>
      <section class="bloque"><h3>${S("eErr2")}</h3><p>${c.err}</p></section>
      <div class="ens-dos">
        <section class="bloque"><h3>${S("eFis")}</h3><p>${c.fis}</p></section>
        <section class="bloque"><h3>${S("eMen")}</h3><p>${c.men}</p></section></div>`;
  }

  const aviso = (LANG!=="es" && EC()===ENSC) ? `<div class="nota aviso">Diese Sektion liegt vorerst nur auf Spanisch vor · This section is currently available in Spanish only.</div>` : "";

  return `<div class="enc"><div class="eyebrow">${c.sub}</div><h2>${c.t}</h2></div>${aviso}
    <div class="ens-nav no-imprimir">${nav}</div>${cuerpo}${imprimir()}`;
}

/* ── Pantalla de entrada por perfil ── */
let PERFIL = null;
const PERFILES = {
 dt:  ["play","ens","ejer","matriz","m","f","carga","plantel","herr"],
 dir: ["resumen","juego","play","ens","ejer","matriz","m","f","comp","carga","plantel","staff","herr","plan","foda","ref"],
 fam: ["resumen","juego","play","comp","ref"]
};
const INI = {es:{
 t:"¿Con qué venís?",
 p:"Elegí tu perfil y el documento se ordena para vos. Podés cambiarlo cuando quieras desde arriba.",
 dt:["Entreno un grupo","Vas directo a tu categoría: tu objetivo de la temporada, qué enseñar, cuándo, y tu plantel.","Elegí tu grupo"],
 dir:["Dirigencia y coordinación","El proyecto completo: modelo de juego, plan de temporada, carga, cuerpo técnico y FODA."],
 fam:["Vengo a conocer el club","Qué es este proyecto, cómo jugamos y cómo se compite en Suiza."],
 mix:"Grupo mezclado: cuatro niveles en una cancha", et1:"etapa", etN:"etapas", vol:"Cambiar perfil", per:{dt:"Entrenador",dir:"Dirigencia",fam:"Visitante"},
 todo:"Ver todo el documento"
}};
INI.de={t:"Womit kommst du?",p:"Wähle dein Profil, und das Dokument ordnet sich für dich. Du kannst es jederzeit oben wechseln.",
 dt:["Ich trainiere eine Gruppe","Direkt zu deiner Kategorie: dein Saisonziel, was zu unterrichten ist, wann, und dein Kader.","Wähle deine Gruppe"],
 dir:["Vorstand und Koordination","Das vollständige Projekt: Spielmodell, Saisonplan, Belastung, Trainerstab und SWOT."],
 fam:["Ich möchte den Verein kennenlernen","Was dieses Projekt ist, wie wir spielen und wie in der Schweiz gespielt wird."],
 mix:"Gemischte Gruppe: vier Niveaus auf einem Feld", et1:"Stufe", etN:"Stufen", vol:"Profil wechseln", per:{dt:"Trainerperson",dir:"Vorstand",fam:"Besuch"}, todo:"Das ganze Dokument ansehen"};
INI.en={t:"What brings you here?",p:"Pick your profile and the document arranges itself for you. You can change it any time from the top.",
 dt:["I coach a group","Straight to your category: your objective for the season, what to teach, when, and your roster.","Pick your group"],
 dir:["Board and coordination","The full project: playing model, season plan, load, coaching staff and SWOT."],
 fam:["I want to know the club","What this project is, how we play and how competition works in Switzerland."],
 mix:"Mixed group: four levels on one court", et1:"stage", etN:"stages", vol:"Change profile", per:{dt:"Coach",dir:"Board",fam:"Visitor"}, todo:"See the whole document"};
window.setPerfil = function(p,cat){
  PERFIL = p;
  if(p==="dt" && cat){ ENS_CAT = cat; VISTA = "ens"; }
  else if(p==="dt"){ VISTA = "ens"; }
  else VISTA = "resumen";
  guardarPerfil(); aplicarPerfil(); render(); window.scrollTo(0,0);
};
window.volverInicio = function(){ PERFIL=null; VISTA="inicio"; guardarPerfil(); aplicarPerfil(); render(); window.scrollTo(0,0); };
window.verTodo = function(){ PERFIL="dir"; VISTA="resumen"; aplicarPerfil(); render(); window.scrollTo(0,0); };
function aplicarPerfil(){
  const nav=document.querySelector("nav.solapas"); if(nav) nav.hidden = (VISTA==="inicio");
  const permitidas = PERFIL ? PERFILES[PERFIL] : null;
  document.querySelectorAll(".solapa").forEach(function(b){
    b.hidden = permitidas ? permitidas.indexOf(b.dataset.v)<0 : false;
  });
  document.querySelectorAll(".grupo-nav").forEach(function(g){
    let vis=false, n=g.nextElementSibling;
    while(n && !n.classList.contains("nav-grupo")){ if(n.classList.contains("solapa") && !n.hidden) vis=true; n=n.nextElementSibling; }
    g.hidden = !vis;
  });
}
/* Equipos reales del club: el entrenador entra por el suyo, no por nuestra etapa */
const CLUBES = [
 {id:"kids", nom:"Kids Volley", edad:"5–10", c:"#D9B300", etapas:["kv1","kv2","kv3"]},
 {id:"ku16", nom:"KU16",        edad:"11–14", c:"#EE4655", etapas:["r1","r2","r3"]},
 {id:"u18",  nom:"U18",         edad:"15–17", c:"#8E3374", etapas:["f1","f2"]},
 {id:"u20",  nom:"U20",         edad:"15–20", c:"#0E2A8A", etapas:["u20","f1","f2","f3"]}
];
function guardarPerfil(){ try{ localStorage.setItem("naefels.perfil", PERFIL||""); localStorage.setItem("naefels.cat", ENS_CAT||""); }catch(e){} }
function leerPerfil(){ try{ const p=localStorage.getItem("naefels.perfil"); if(p){ PERFIL=p; const c=localStorage.getItem("naefels.cat");
  if(p==="dt"){ if(c) ENS_CAT=c; VISTA="ens"; } else VISTA="resumen"; } }catch(e){} }

function vInicio(){
  const i = INI[LANG] || INI.es;
  const eq = CLUBES.map(function(cl){
    const filas = cl.etapas.map(function(id){
      const nom = id==="u20" ? (ENSC[id]?ENSC[id].t.split(":")[0]:"U20") : D().etapas[id].e.split("·")[0].trim();
      const sub = id==="u20" ? i.mix : (D().etapas[id].n||"");
      return `<button class="et-row" onclick="setPerfil('dt','${id}')"><b>${nom}</b><span>${sub}</span><i>\u2192</i></button>`;
    }).join("");
    return `<details class="eq" style="--c:${cl.c}">
      <summary><div class="eq-h"><span class="eq-e">${cl.edad}</span><b>${cl.nom}</b>
        <span class="eq-n">${cl.etapas.length} ${cl.etapas.length===1?i.et1:i.etN}</span></div></summary>
      <div class="eq-c">${filas}</div></details>`;
  }).join("");
  return `<div class="ini">
    <div class="ini-top"><h2>${i.t}</h2><p class="ini-p">${i.p}</p></div>
    <div class="ini-dt">
      <div class="ini-eti"><span>01</span>${i.dt[0]}</div>
      <p class="ini-sub">${i.dt[1]}</p>
      <div class="eq-wrap">${eq}</div>
    </div>
    <div class="ini-dos">
      <button class="ini-card" onclick="setPerfil('dir')"><div class="ini-eti"><span>02</span>${i.dir[0]}</div><p>${i.dir[1]}</p><i class="fl">&rarr;</i></button>
      <button class="ini-card" onclick="setPerfil('fam')"><div class="ini-eti"><span>03</span>${i.fam[0]}</div><p>${i.fam[1]}</p><i class="fl">&rarr;</i></button>
    </div>
    <p class="no-imprimir ini-todo"><a onclick="verTodo()">${i.todo} \u2192</a></p>
  </div>`;
}

function render(){
  tema(); pintarEstaticos();
  const esEt = (VISTA==="m"||VISTA==="f");
  document.getElementById("ruta").hidden = !esEt;
  if(esEt) pintarRuta();
  const vs = {inicio:vInicio, ejer:vEjer, play:vPlay, resumen:vResumen, juego:vJuego, matriz:vMatriz, comp:vComp, carga:vCarga, plantel:vPlantel, staff:vStaff, herr:vHerr, plan:vPlan, foda:vFoda, ens:vEns, ref:vRef};
  aplicarPerfil();
  document.getElementById("contenido").innerHTML = (PERFIL && VISTA!=="inicio" ? '<div class="perfil-bar no-imprimir"><span>'+((INI[LANG]||INI.es).per[PERFIL])+'</span><a onclick="volverInicio()">'+((INI[LANG]||INI.es).vol)+'</a></div>' : "") + (esEt ? vEtapa(VISTA) : vs[VISTA]());
  document.querySelectorAll(".solapa").forEach(b=>b.setAttribute("aria-selected", String(b.dataset.v===VISTA)));
  enlazarConfig();
}
document.querySelectorAll(".solapa").forEach(b=>b.onclick=()=>{ VISTA=b.dataset.v; render(); });
document.querySelectorAll(".idioma").forEach(b=>b.onclick=()=>{
  if(b.disabled) return; LANG=b.dataset.lang;
  document.querySelectorAll(".idioma").forEach(x=>x.setAttribute("aria-pressed",String(x===b)));
  render();
});
if(!PLANTEL.length){ PLANTEL = PLANTEL_INICIAL.map(function(j){return Object.assign({},j);}); plSeq = PLANTEL.length+1; }
leerPerfil();
render();
iniciarDB();
</script>
