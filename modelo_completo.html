    {n:"Sets cortos, muchos sets",o:"Multiplicar los momentos críticos sin alargar el entrenamiento.",a:"Sets a quince puntos, completos, gane quien gane.",r:"Se juegan todos los sets aunque uno gane los tres primeros. Cada set arranca de cero.",esc:"Sirve igual en todos los levels. En L5, sets a siete.",e:"Cortar cuando el resultado ya está definido. El objetivo no era el resultado."},
    {n:"Arrancar abajo",o:"Entrenar la cabeza en desventaja, que es donde se decide el partido.",a:"El juego empieza 18-22 en contra.",r:"El equipo que remonta suma doble. El que va arriba no puede administrar: si no cierra en cinco puntos, pierde.",esc:"L4 empezar 5-8 · L3 10-14 · L2 y L1 18-22 y situaciones de set point.",e:"Usarlo siempre con los mismos equipos. Se alterna quién arranca abajo."},
    {n:"Todos juegan",o:"Que el aprendizaje llegue a todos y no a los siete de siempre.",a:"Juego con marcador y rotación obligatoria de plantel.",r:"Se usan diez jugadores sí o sí. Un punto no cuenta si en la cancha hay alguien que ya jugó dos rotaciones seguidas sin salir.",esc:"Sirve en todos los levels. En L1 y L2 pueden ser ocho.",e:"Sacar la regla los días de partido amistoso. Ahí es cuando más se nota."},
    {n:"El índice del equipo",o:"Medir cuántas acciones necesita el equipo para hacer un punto, y perseguir ese número.",a:"Se juega normal y alguien anota cuántos rallies hicieron falta por cada punto propio, en recepción y en saque.",r:"El objetivo de la semana es bajar el índice, no ganar el juego.",esc:"L3 en adelante. Antes, el número no significa nada.",e:"Convertirlo en estadística que nadie mira. Se dice en voz alta al final de la sesión."}]}]
}};
EJ.de={t:"Übungssammlung", sub:"Nach Spielsituation. Jede Übung mit ihrer Regel, wie sie über die Levels skaliert, und dem Fehler der Trainerperson.",
 p:"Sie sind nicht nach Technik geordnet, sondern nach <strong>Situation</strong>, denn so wählt man eine Einheit aus. Jede Übung trainiert die ganze Bewegung im Spielzug: keine isoliert eine Technik vom Spiel, aus dem Grund, der in der allgemeinen Anleitung steht. Die wichtigste Spalte ist <strong>die Regel</strong>: Sie erzeugt das Verhalten, ohne dass die Trainerperson es erklären muss.",
 fuente:"Wo es fertig gezeichnete Formen gibt",
 fuenteP:"Swiss Volley hat einen eigenen Planer mit einer Bibliothek von Trainingsformen: Die Trainerperson erfindet und zeichnet sie nicht mehr selbst, sondern kombiniert sie. Die erste Anlaufstelle.",
 lab:{o:"Wofür",a:"Aufbau",r:"Die Regel",esc:"Wie es skaliert",e:"Der Fehler der Trainerperson"},
 bloques:[
  {h:"Einstieg · Ballkontakte und Aufwärmen mit Ball",
   d:"Nie Runden durch die Halle. Aufgewärmt wird mit Ball, denn es ist der Moment des Tages mit den meisten Kontakten pro Minute.",
   ej:[
    {n:"Drei Bälle, ein Reifen",o:"Maximale Kontaktdichte und unter den Ball kommen, bevor er berührt wird.",a:"Dreiergruppen mit einem Ball pro zwei Personen. Ein Reifen auf dem Boden in vier Metern Entfernung. Gespielt wird, den Ball zu dritt über den Reifen hinweg zu halten.",r:"Fällt der Ball, beginnt die Gruppe die Zählung neu. Der Tagesrekord wird notiert und am nächsten Dienstag angegriffen.",esc:"L5 fangen und werfen · L4 oberes Zuspiel · L3 zwischen Fingern und Manchette wechseln, je nach Ball · L2 und L1 mit langer Verschiebung zwischen den Kontakten.",e:"Eine Reihe bilden, damit die Trainerperson wirft. Mit einem Ball pro zwei schaut sie nur zu."},
    {n:"Landungen im Spiel",o:"Die Landung auf zwei Füssen mit ausgerichtetem Knie täglich verankern, ohne dass es nach Prävention aussieht.",a:"Tiefer Kasten oder Linie am Boden. Sie springen, landen, und der Ball kommt sofort danach, damit sie weiterspielen müssen.",r:"Der Sprung zählt nicht, wenn die landende Person nicht bereit ist, den nächsten Ball zu spielen.",esc:"L5 vom Boden, ohne Kasten · L4 tiefer Kasten · L3 Blocksprung und Landung · L2 und L1 Landung nach dem Angriff mit Drehung und Weg vom Netz.",e:"Es als isolierten Block am Anfang machen und nie wieder erwähnen. Es gehört ins Spiel."},
    {n:"Verschiebungsspiegel",o:"Kurze Schritte, Bremsen vor dem Kontakt und im Gleichgewicht ankommen.",a:"Zu zweit, einander gegenüber. Eine wirft nach links und rechts und zwingt zur Verschiebung; die andere spielt zurück und kehrt in die Mitte.",r:"Es zählen nur Bälle, die mit ruhigen Füssen gespielt werden. Wer in Bewegung berührt, zählt nicht.",esc:"L5 fängt und kehrt zurück · L4 Manchette · L3 mit echtem Service von der anderen Seite · L2 und L1 mit zwei Richtungen und Übergang in die Abwehr.",e:"Bequem werfen. Der Ball muss weit fallen: Kommt er ohne Bewegung an, trainiert es nichts."},
    {n:"Countdown der Mannschaft",o:"Die Einheit mit Druck beginnen und mit billigem Fehler.",a:"Die ganze Gruppe, ein Ball, Ziel sind X Kontakte, ohne dass er fällt.",r:"Es wird vom Gruppenrekord rückwärts gezählt. Fällt der Ball, wird nicht alles neu gestartet: Es gehen fünf verloren. Der Fehler kostet, löscht aber nicht.",esc:"L5 Ziel 15 · L4 Ziel 30 mit drei Pflichtkontakten · ab L3 mit Netz dazwischen und Rotation.",e:"Bei jedem Fall auf null zurücksetzen. Das lehrt, nicht zu riskieren."}]},
  {h:"K1 in-system · Annahme # oder +",
   d:"Die Zuspielerin spielt den zweiten Ball mit höchstens einem Schritt und mit allen drei Optionen. Die bequemste Situation und die, die dem Spiel am wenigsten gleicht — sie nimmt also weniger Zeit ein, als man denkt.",
   ej:[
    {n:"Annahme, Zuspiel, Angriff verkettet",o:"Die Grundübung von allen: die beste Annahme-, die beste Zuspiel- und die beste Angriffsübung zugleich.",a:"Bequemes Service der Trainerperson oder Freeball. Annahme, Zuspiel und vollständiger Angriff. Der Ball endet, wie ein Punkt endet.",r:"Der Punkt zählt nur bei drei Kontakten und wenn der Angriff in einer vorher angesagten Zone landet.",esc:"L5 fangen-werfen-aus dem Stand schlagen · L4 Sprungangriff ohne Richtungsvorgabe · L3 mit gewählter Richtung · L2 mit zwei Zuspieloptionen · L1 mit echtem Block gegenüber.",e:"Die Übung nach dem Zuspiel abbrechen. Endet der Ball nicht, ist es nicht der Spielzug."},
    {n:"Die Mitte existiert",o:"Dass die Zuspielerin die Mitte als ständige Bedrohung einbaut und nicht als Notlösung.",a:"Bequeme Annahme, die Mitte ist in jeder Wiederholung verfügbar.",r:"Von je drei Spielzügen muss mindestens einer über die Mitte gehen. Sonst wird die Serie wiederholt.",esc:"L4 die Mitte erscheint nur und bekommt keinen Ball · L3 bekommt einen hohen Ball in der Mitte · L2 erstes Tempo nah · L1 mit offenen Tempi.",e:"Es ans Ende der Einheit legen, wenn alle müde sind und die Mitte nicht mehr springt."},
    {n:"Sicherung ist Pflicht",o:"Verankern, dass die Mannschaft die angreifende Person begleitet — das gewinnt die meisten langen Ballwechsel.",a:"Derselbe vollständige Spielzug, aber die Trainerperson oder eine Mitspielerin blockt und bringt den Ball ins eigene Feld zurück.",r:"Holt die Mannschaft den geblockten Ball, zählt er doppelt. War niemand in der Sicherung, ist der Punkt verloren, auch wenn der Ball ins Aus ging.",esc:"L5 und L4 eine Mitspielerin simuliert den Block von einem Stuhl aus · L3 echter Einerblock · L2 und L1 Doppelblock.",e:"Die Sicherung mit Worten einfordern. Sie wird mit dem Doppelpunkt installiert, nicht mit der Erinnerung."},
    {n:"Vier Angreiferinnen, sechs Rotationen",o:"Dass sich die Mannschaft immer mit allen Optionen präsentieren kann, in allen Rotationen.",a:"Die vollständige Rotation wird gespielt; alle zwei Spielzüge wird rotiert.",r:"In jeder Rotation müssen vor dem Rotieren mindestens zwei verschiedene Personen angegriffen haben.",esc:"L4 zwei Angreiferinnen im 4:4 · L3 drei auf ganzem Feld · L2 drei immer am Netz im 6-2 · L1 mit Hinterfeldangriff.",e:"Nur rotieren, wenn es gut läuft. Die Rotation ist fix: Es wird trotzdem rotiert."}]},
  {h:"K1 semi-system · Annahme !",
   d:"Die Zuspielerin hat noch Optionen, aber nicht alle. Die häufigste Situation im Nachwuchs und die am wenigsten trainierte, weil sie nicht schön aussieht.",
   ej:[
    {n:"Das Service vom Samstag",o:"Die Annahme gegen echtes Service halten, ohne die Intensität der Übung zu senken.",a:"Wettkampfservice von der Grundlinie. Annahme, Zuspiel und Angriff mit dem, was übrig bleibt.",r:"Die Servicegeschwindigkeit wird nie gesenkt. Kommt die Gruppe nicht zurecht, verkleinert man die Annahmezone oder nimmt eine Annahmespielerin dazu.",esc:"L5 nicht anwendbar · L4 zwei Annahmespielerinnen und weiches Service von oben · L3 drei Annahmespielerinnen und echtes Service · L2 und L1 mit Sprungservice.",e:"Weicher servieren, damit die Übung gelingt. Damit hörst du auf zu trainieren, was du trainieren wolltest."},
    {n:"Zuspiel mit einem Schritt zu viel",o:"Gut zuspielen, obwohl der Körper noch ankommt — was fast immer der Fall sein wird.",a:"Die Trainerperson spielt den Ball bewusst zwei Meter neben die Zuspielerin.",r:"Es zählt nur, wenn der Ball mit Höhe herauskommt. Ein flacher Ball heisst, sie kam ohne Beine an, und zählt nicht.",esc:"L4 mit zugeworfenem Ball · L3 aus echter Annahme mit Penetration · L2 und L1 mit Abmachung über Höhe und Abstand pro Angreiferin.",e:"Die Hände korrigieren. Fast immer liegt das Problem im Startzeitpunkt, nicht im Kontakt."},
    {n:"Zwei Optionen, nicht vier",o:"Gut entscheiden mit begrenzten Optionen — das ist die Definition von semi-system.",a:"Provozierte Annahme !. Die Mitte fällt per Regel aus dem Spielzug.",r:"Die Zuspielerin muss laut ansagen, zu welcher der zwei Optionen sie geht, bevor sie den Ball berührt.",esc:"L4 zwei Angreiferinnen, sie wählt eine · L3 wählt und sagt an · L2 wählt ohne Ansage und die Angreiferin liest es · L1 mit dem gegnerischen Block, der ebenfalls liest.",e:"Zulassen, dass die Zuspielerin immer dieselbe Aussenangreiferin bedient. Es wird notiert, wohin jeder Ball ging."},
    {n:"Leiter der drei Qualitäten",o:"Dass die Mannschaft erkennt, in welcher Situation sie ist, und den Anspruch des Angriffs ändert.",a:"Die Trainerperson serviert abwechselnd in drei Qualitäten, ohne anzusagen: bequem, unbequem und sehr schwierig.",r:"Je nach Qualität hat die Mannschaft die Erlaubnis, hart anzugreifen, sicher anzugreifen oder hoch und tief zurückzuspielen. Falsch wählen kostet den Punkt, auch wenn der Ball drin landet.",esc:"L4 zwei Qualitäten · L3 drei · L2 und L1 drei Qualitäten und zusätzlich die Wahl der Zone im gegnerischen Feld.",e:"Nur den Punkt belohnen. Hier wird die Entscheidung belohnt."}]},
  {h:"K1 out-of-system · Annahme -",
   d:"Die Zuspielerin kommt nicht hin. Jemand anderes spielt zu, oder es wird mit den Armen zugespielt. Hier zeigt sich, ob die Mannschaft verstanden hat, dass alle zuspielen.",
   ej:[
    {n:"Die Zuspielerin ist nicht da",o:"Dass jede zuspielen kann, wenn der Ball nicht ankommt, und zwar brauchbar.",a:"Provozierte schlechte Annahme. Die Zuspielerin fällt per Regel aus dem Spielzug und berührt mit der Hand das Netz.",r:"Es spielt die Nächststehende zu. Es wird notiert, wer jeden Ball zugespielt hat, und am Ende der Woche müssen alle vorkommen.",esc:"L4 es spielt zu, wer nah ist, so gut es geht · L3 mit gezielter Manchette · L2 und L1 mit derselben Höhe und Distanz wie die Stammzuspielerin.",e:"Die Grossen die Übung überspringen lassen, weil «sie nicht zuspielen». Genau deshalb."},
    {n:"Hoher und tiefer Ball",o:"Gegen formierten Block angreifen, ohne den Punkt zu verschenken.",a:"Hoher Ball nach aussen, mit bereits stehendem Doppelblock gegenüber.",r:"Es zählt der Angriff, der in den letzten drei Metern landet oder über die Blockhände geht. Wer den Armzug verkürzt und ins Aus schlägt, verliert doppelt.",esc:"L4 ohne Block, nur Tiefe · L3 Einerblock · L2 Doppelblock · L1 Doppelblock mit Abwehr dahinter.",e:"Den harten Schlag feiern. Das Kriterium ist, wo er landet, nicht wie hart er war."},
    {n:"Recyceln",o:"Verstehen, dass manchmal der beste Spielzug ist, gut zurückzuspielen und neu zu beginnen.",a:"Provozierte unmögliche Situation: Ball sehr weit weg, keine Zeit.",r:"Die Mannschaft gewinnt den Punkt, wenn der Ball hoch und tief zurückkommt und die Mannschaft in der Abwehr neu geordnet steht. Greifen sie an und verlieren, zählt es nicht.",esc:"L4 hoch zurückspielen · L3 hoch und tief · L2 zwischen recyceln und angreifen wählen · L1 recyceln und den nächsten Ballwechsel gewinnen.",e:"Beibringen, dass Zurückspielen feige ist. Gut recyceln ist eine Entscheidung, kein Verzicht."},
    {n:"Drei Kontakte oder nichts",o:"Dass der Spielzug auch bei der schlechtesten Annahme existiert.",a:"Freies Spiel mit aggressivem Service.",r:"Der Punkt zählt nicht, wenn die Mannschaft keine drei Kontakte erreicht hat. Der Direktball ist Punkt für den Gegner, auch wenn er drin landet.",esc:"L5 mit zugeworfenem Ball · L4 mit weichem Service · ab L3 mit echtem Service.",e:"Die Regel aufheben, wenn es eng wird. Genau dann muss sie halten."}]},
  {h:"K2 Übergang · wir sind es, die servieren",
   d:"Block, Abwehr und Gegenangriff. Der grösste Unterschied zwischen Nachwuchs und Aktiven, und fast nie als Ganzes trainiert.",
   ej:[
    {n:"Jede Abwehr endet im Angriff",o:"Die Gewohnheit ausreissen, den Ball nur hochzuholen und hinüberzuspielen.",a:"Die Trainerperson greift von einem Stuhl oder vom Boden ins eigene Feld an. Die Mannschaft verteidigt und kontert.",r:"Ein abgewehrter Ball, der ohne drei Kontakte zurückgeht, zählt nicht. Punkt nur mit Gegenangriff.",esc:"L5 nicht anwendbar · L4 Abwehr und aufgebautes Rückspiel · L3 Abwehr, Zuspiel und Angriff aus dem Stand · L2 und L1 mit vollständigem Übergang und Sprungangriff.",e:"Abwehr als Selbstzweck trainieren. Die Abwehr ist der Beginn eines Angriffs."},
    {n:"Landen, drehen, weg",o:"Der Übergang der blockenden Person, wo am meisten Zeit verloren geht.",a:"Sie blocken, landen, und der nächste Ball kommt sofort, damit sie aus drei Metern angreifen müssen.",r:"Es wird gestoppt: Von der Landung bis zum Armzug dürfen nicht mehr als zwei Sekunden vergehen.",esc:"L3 ohne Ball, nur die Bewegung · L2 mit hohem Ball · L1 mit echtem Ball und Block gegenüber.",e:"Sie blocken lassen und dann dem Ball nachschauen. Der Block endet, wenn sie vom Netz weg sind."},
    {n:"Ein Block, der lenkt",o:"Dass der Block den Ball ins gegnerische Feld oder dorthin lenkt, wo unsere Abwehr steht, und nicht zur Decke.",a:"Feste Angreiferin aus einer Zone. Doppelblock mit angesagter Referenz.",r:"Es zählt nur der Block, der den Ball drin zurückbringt oder ihn dorthin ablenkt, wo eine abwehrende Person stand. Ein Block, der touchiert und ins Aus geht, zählt nicht.",esc:"L4 Hände über dem Netz und sonst nichts · L3 zum Angriffspunkt schliessen · L2 lesend mit Call · L1 mit den fünf Calls des Playbooks.",e:"Blockpunkte zählen. Gezählt wird der Block, der den Ball spielbar lässt."},
    {n:"Freeball, sofortiger Angriff",o:"Sich beim einfachen Ball nicht entspannen — dort werden die meisten Punkte verschenkt.",a:"Die Trainerperson schickt mitten in einer Serie ohne Ansage einen Freeball.",r:"Der Freeball muss in einem Sprungangriff enden. Spielt die Mannschaft ihn hoch zurück, verliert sie den Punkt.",esc:"L4 Freeball mit Angriff aus dem Stand · L3 im Sprung · L2 und L1 mit eingebauter Mitte.",e:"Ansagen, dass ein Freeball kommt. Der Witz ist, dass er auftaucht."}]},
  {h:"Vollständiges Spiel · das Spiel mit seinem Rhythmus",
   d:"Das Spielformat ist ein Ausbildungswerkzeug, keine Formalität. Was hier geändert wird, sind nicht die Übungen, sondern die Regeln.",
   ej:[
    {n:"Kurze Sätze, viele Sätze",o:"Kritische Momente vervielfachen, ohne das Training zu verlängern.",a:"Sätze auf fünfzehn Punkte, vollständig, unabhängig davon, wer gewinnt.",r:"Es werden alle Sätze gespielt, auch wenn eine Seite die ersten drei gewinnt. Jeder Satz beginnt bei null.",esc:"Gilt auf allen Levels gleich. Auf L5 Sätze auf sieben.",e:"Abbrechen, wenn das Resultat feststeht. Das Ziel war nicht das Resultat."},
    {n:"Im Rückstand beginnen",o:"Den Kopf im Rückstand trainieren — dort entscheidet sich das Spiel.",a:"Das Spiel beginnt bei 18:22 Rückstand.",r:"Die Mannschaft, die aufholt, zählt doppelt. Die führende darf nicht verwalten: Schliesst sie nicht in fünf Punkten ab, verliert sie.",esc:"L4 bei 5:8 beginnen · L3 bei 10:14 · L2 und L1 bei 18:22 und in Satzball-Situationen.",e:"Immer dieselben Mannschaften nehmen. Es wechselt, wer im Rückstand beginnt."},
    {n:"Alle spielen",o:"Dass das Lernen alle erreicht und nicht nur die immer gleichen sieben.",a:"Spiel mit Resultat und verpflichtender Rotation des Kaders.",r:"Es werden auf jeden Fall zehn Personen eingesetzt. Ein Punkt zählt nicht, wenn jemand auf dem Feld steht, der bereits zwei Rotationen ohne Wechsel gespielt hat.",esc:"Gilt auf allen Levels. Auf L1 und L2 können es acht sein.",e:"Die Regel an Testspieltagen aufheben. Genau dann fällt es am meisten auf."},
    {n:"Die Kennzahl der Mannschaft",o:"Messen, wie viele Aktionen die Mannschaft für einen Punkt braucht, und diese Zahl verfolgen.",a:"Es wird normal gespielt, und jemand notiert, wie viele Ballwechsel pro eigenem Punkt nötig waren, in Annahme und im Service.",r:"Das Wochenziel ist, die Kennzahl zu senken, nicht das Spiel zu gewinnen.",esc:"Ab L3. Davor sagt die Zahl nichts aus.",e:"Daraus eine Statistik machen, die niemand ansieht. Sie wird am Ende der Einheit laut gesagt."}]}]};
EJ.en={t:"Drill library", sub:"By game situation. Each one with its rule, how it scales across levels, and the coach's own error.",
 p:"They are ordered by <strong>situation</strong> rather than by skill, because that is how a session gets chosen. Every drill trains the whole skill inside the rally: none isolates a technique from the game, for the reason set out in the general guide. The column that matters most is <strong>the rule</strong>: it produces the behaviour without the coach having to explain it.",
 fuente:"Where to find ready-drawn forms",
 fuenteP:"Swiss Volley has its own planner with a library of training forms: the coach no longer invents and draws them, they combine them. That is the first stop.",
 lab:{o:"What for",a:"Set-up",r:"The rule",esc:"How it scales",e:"The coach's error"},
 bloques:[
  {h:"Opening · contacts and warm-up with a ball",
   d:"Never laps around the gym. The warm-up is done with balls, because it is the moment of the day with the most contacts per minute you will get.",
   ej:[
    {n:"Three balls, one hoop",o:"Maximum contact density and getting under the ball before touching it.",a:"Groups of three with one ball per two. A hoop on the floor four metres away. They play to keep the ball alive between the three, passing over the hoop.",r:"If the ball drops, the group restarts the count. The day's record goes on the board and gets attacked next Tuesday.",esc:"L5 catch and throw · L4 overhead touch · L3 alternate hands and forearms depending on the ball · L2 and L1 with a long movement between contacts.",e:"Forming a line so the coach can toss. With one ball per two, the coach only watches."},
    {n:"Landings inside the game",o:"Install landing on two feet with the knee aligned, every day, without it looking like injury prevention.",a:"A low box or a line on the floor. They jump, land, and the ball arrives immediately afterwards so they have to keep playing.",r:"The jump does not count if whoever lands is not ready to play the next ball.",esc:"L5 from the floor, no box · L4 low box · L3 block jump and landing · L2 and L1 landing after an attack with a turn and clearing the net.",e:"Doing it as an isolated block at the start and never mentioning it again. It belongs inside the game."},
    {n:"Movement mirror",o:"Short steps, braking before contact and arriving balanced.",a:"In pairs, facing each other. One throws to either side, forcing movement; the other plays it back and returns to the middle.",r:"Only balls played with the feet still count. Touched on the move, it does not count.",esc:"L5 catches and returns · L4 forearm pass · L3 with a real serve from the other side · L2 and L1 with two directions and an exit into defence.",e:"Throwing it comfortably. The ball has to land away from them: if it arrives without them moving, it trains nothing."},
    {n:"Team countdown",o:"Start the session with pressure and with a cheap error.",a:"The whole group, one ball, the aim is X contacts without it dropping.",r:"You count down from the group's record. If it drops, you do not restart everything: you lose five. The error costs but does not erase.",esc:"L5 target 15 · L4 target 30 with three compulsory contacts · from L3 with a net between and rotation.",e:"Resetting to zero every time it drops. That teaches them not to take risks."}]},
  {h:"K1 in-system · # or + pass",
   d:"The setter plays the second ball moving one step or less and with all three options open. The most comfortable situation and the one least like a match, so it takes up less time than you would think.",
   ej:[
    {n:"Pass, set and hit chained",o:"The base drill of them all: the best passing drill, the best setting drill and the best hitting drill at once.",a:"A comfortable serve from the coach or a free ball. Pass, set and a complete attack. The ball terminates the way a point terminates.",r:"The point only counts with three contacts and if the attack lands in a zone called beforehand.",esc:"L5 catch-throw-hit from standing · L4 jump attack with no direction required · L3 with a chosen direction · L2 with two setting options · L1 with a real block opposite.",e:"Cutting the drill after the set. If the ball does not terminate, it is not the rally."},
    {n:"The middle exists",o:"That the setter builds the middle in as a constant threat rather than a fallback.",a:"A comfortable pass with the middle available on every repetition.",r:"Every three rallies, at least one has to go to the middle. If it did not, the series is repeated.",esc:"L4 the middle only shows and gets no ball · L3 gets a high ball in the middle · L2 close first tempo · L1 with the tempos open.",e:"Leaving it to the end of the session, when they are tired and the middle stops jumping."},
    {n:"Compulsory coverage",o:"Install the team following the attacker, which is what wins the most long rallies.",a:"The same complete rally, but the coach or a teammate blocks and returns the ball into your own court.",r:"If the team recovers the blocked ball, it counts double. If nobody was covering, the point is lost even if the ball landed out.",esc:"L5 and L4 a teammate simulates the block from a chair · L3 a real single block · L2 and L1 a double block.",e:"Asking for coverage with words. It gets installed with the double point, not with the reminder."},
    {n:"Four attackers, six rotations",o:"That the team can always present itself with every option, in every rotation.",a:"The full rotation is played; every two rallies you rotate.",r:"In each rotation at least two different players have to attack before rotating.",esc:"L4 two attackers in 4v4 · L3 three on the full court · L2 three always at the net in the 6-2 · L1 with the back-row attack included.",e:"Only rotating when it goes well. The rotation is fixed: you rotate anyway."}]},
  {h:"K1 semi-system · ! pass",
   d:"The setter still has options but not all of them. The most frequent situation in youth volleyball and the least trained, because it does not look good.",
   ej:[
    {n:"Saturday's serve",o:"Hold the reception against a real serve, without lowering the drill's intensity.",a:"A match serve from the baseline. Pass, set and attack with whatever is left.",r:"You never lower the serve speed. If the group cannot cope, you shrink the passing zone or add a passer.",esc:"L5 not applicable · L4 two passers and a soft overhand serve · L3 three passers and a real serve · L2 and L1 with a jump serve.",e:"Serving softer so the drill works. That is the moment you stopped training what you set out to train."},
    {n:"Setting one step late",o:"Set well even though the body is still arriving, which is what will happen nearly every time.",a:"The coach sends the ball deliberately two metres away from the setter.",r:"It only counts if the ball comes out with height. A flat ball means they arrived without legs and does not count.",esc:"L4 off a tossed ball · L3 from a real pass with penetration · L2 and L1 with an agreed height and distance per attacker.",e:"Correcting the hands. Nearly always the problem is the moment of departure, not the contact."},
    {n:"Two options, not four",o:"Decide well with limited options, which is the definition of semi-system.",a:"A provoked ! pass. The middle is out of the rally by rule.",r:"The setter has to call out loud which of the two options they are going to, before touching the ball.",esc:"L4 two attackers, they pick one · L3 pick and announce · L2 pick without announcing and the attacker reads it · L1 with the opposing block reading it too.",e:"Letting the setter always feed the same pin. You record where every ball went."},
    {n:"Ladder of three qualities",o:"That the team recognises which situation it is in and changes the ambition of the attack.",a:"The coach serves alternating three qualities without announcing them: comfortable, uncomfortable and very hard.",r:"Depending on the quality, the team has permission to hit hard, to hit safe, or to return high and deep. Choosing wrong costs the point even if the ball lands in.",esc:"L4 two qualities · L3 three · L2 and L1 three qualities plus choosing which zone of the opponent's court.",e:"Rewarding only the point. Here you reward the decision."}]},
  {h:"K1 out-of-system · - pass",
   d:"The setter cannot get there. Somebody else sets, or the set is made with the forearms. This is where you see whether the team understood that everyone sets.",
   ej:[
    {n:"The setter is not there",o:"That anyone can set when the ball does not arrive, with a usable ball.",a:"A provoked bad pass. The setter is out of the rally by rule, touching the net with one hand.",r:"Whoever is nearest sets. You record who set each ball and by the end of the week everyone has to appear.",esc:"L4 whoever is near sets, however they can · L3 with a directed forearm set · L2 and L1 with the same height and distance as the first-choice setter.",e:"Letting the tall ones skip the drill because «they do not set». That is exactly why."},
    {n:"High and deep",o:"Attack against a formed block without giving the point away.",a:"A high ball to the pin, with a double block already formed opposite.",r:"The attack counts if it lands in the last three metres or goes off the block's hands. Closing the swing and sending it out loses the point double.",esc:"L4 no block, depth only · L3 single block · L2 double block · L1 double block with defence behind.",e:"Celebrating the big swing. The criterion is where it landed, not how hard it was."},
    {n:"Recycle",o:"Understand that sometimes the best play is to return it well and start again.",a:"A provoked impossible situation: ball a long way out, no time.",r:"The team wins the point if the ball comes back high, deep and with the team already reorganised in defence. If they attack and lose it, it does not count.",esc:"L4 return it high · L3 high and deep · L2 choose between recycling and attacking · L1 recycle and win the next rally.",e:"Teaching that returning the ball is cowardly. Recycling well is a decision, not a surrender."},
    {n:"Three contacts or nothing",o:"That the rally exists even off the worst pass.",a:"Free play with an aggressive serve.",r:"The point does not count if the team did not reach three contacts. Returning first time is a point for the opponent even if the ball lands in.",esc:"L5 off a tossed ball · L4 with a soft serve · L3 and above with a real serve.",e:"Lifting the rule when the game gets hard. That is exactly when it has to hold."}]},
  {h:"K2 transition · we are the ones serving",
   d:"Block, defence and counter-attack. The biggest gap between a junior and a senior player, and almost never trained whole.",
   ej:[
    {n:"Every dig ends in an attack",o:"Pull out by the root the habit of digging the ball and sending it back over.",a:"The coach attacks from a chair or from the floor into your own court. The team digs and counters.",r:"A dug ball that goes back over without three contacts does not count. Point only if there was a counter-attack.",esc:"L5 not applicable · L4 dig and a built return · L3 dig, set and standing attack · L2 and L1 with a full transition and jump attack.",e:"Training defence as an end in itself. Defence is the start of an attack."},
    {n:"Land, turn, clear",o:"The blocker's transition, which is where most time gets lost.",a:"They block, land, and the next ball arrives immediately so they have to attack from three metres.",r:"It gets timed: no more than two seconds from the landing to the arm swing.",esc:"L3 without a ball, movement only · L2 with a high ball · L1 with a real ball and a block opposite.",e:"Letting them block and then watch the ball. The block ends once they have cleared the net."},
    {n:"A block that directs",o:"That the block sends the ball into the opponent's court or towards our own defender, not at the ceiling.",a:"A fixed attacker from one zone. A double block with the reference called.",r:"Only the block that returns the ball in, or deflects it towards where a defender was standing, counts. A block that touches and goes out does not count.",esc:"L4 hands over the net and nothing else · L3 close to the point of attack · L2 reading with a call · L1 with the playbook's five calls.",e:"Counting stuff blocks. What you count is the block that leaves the ball playable."},
    {n:"Free ball, immediate attack",o:"Not relaxing on the easy ball, which is where the most points get given away.",a:"The coach sends a free ball without warning in the middle of a series.",r:"The free ball has to end in a jump attack. If the team returns it high, they lose the point.",esc:"L4 free ball with a standing attack · L3 jumping · L2 and L1 with the middle involved.",e:"Announcing that a free ball is coming. The point is that it appears."}]},
  {h:"Full game · the match with its rhythm",
   d:"The match format is a development tool, not a formality. What changes here is not the drills but the rules.",
   ej:[
    {n:"Short sets, many sets",o:"Multiply the critical moments without lengthening the session.",a:"Sets to fifteen points, played in full, whoever wins.",r:"Every set is played even if one side wins the first three. Each set starts from zero.",esc:"It works the same at every level. At L5, sets to seven.",e:"Stopping once the result is settled. The result was not the objective."},
    {n:"Start behind",o:"Train the head when behind, which is where the match is decided.",a:"The game starts 18-22 down.",r:"The team that comes back scores double. The team ahead cannot manage the clock: if they do not close it out in five points, they lose.",esc:"L4 start 5-8 · L3 10-14 · L2 and L1 18-22 and set-point situations.",e:"Always using the same teams. You alternate who starts behind."},
    {n:"Everyone plays",o:"That the learning reaches everyone and not just the same seven.",a:"A game with a score and compulsory squad rotation.",r:"Ten players are used, no exceptions. A point does not count if somebody on court has already played two rotations in a row without coming off.",esc:"It works at every level. At L1 and L2 it can be eight.",e:"Dropping the rule on friendly-match days. That is when it shows most."},
    {n:"The team's index",o:"Measure how many actions the team needs to win a point, and chase that number.",a:"You play normally and somebody records how many rallies each of your own points took, in reception and in serving.",r:"The week's objective is to lower the index, not to win the game.",esc:"From L3 on. Before that the number means nothing.",e:"Turning it into a statistic nobody looks at. It gets said out loud at the end of the session."}]}]};

/* 24 ejercicios de la biblioteca del club · sesiones filmadas de entrenadores de élite */
const EJC = {
es:[
{b:"K0",n:"Nine ball serving",c:"Kevin Burch",o:"Competir saque contra recepción con escala de calidad de pase y presión extra sobre el primer saque.",a:"Sacadores de un lado, receptores del otro. Cada pase se evalúa en escala de tres.",r:"Primero a cinco. Pase 2 o 3 es punto de la recepción; 1 o peor, del saque. Error en el primer saque: derrota automática. Ace en el primero: victoria automática.",esc:"L4 escala de dos calidades y sin muerte súbita · L3 escala completa · L2 y L1 con la regla del primer saque.",e:"Dejar que el primer saque sea uno más. Toda la presión del ejercicio vive ahí."},
{b:"K0",n:"Saque con objetivo de velocidad",c:"Dave Shondell",o:"Sacar por encima de una velocidad propia bajo presión, gestionando el error.",a:"Radar y pantalla visible. Cada jugador con su velocidad objetivo.",r:"Cinco saques por encima del objetivo. El error vuelve a cero; el saque adentro por debajo del objetivo no borra lo acumulado.",esc:"L3 sin radar, objetivo por zona cantada · L2 con radar y objetivo propio · L1 distinguiendo saque de potencia del saque de primer punto de set.",e:"Un solo objetivo para todos. Cada uno tiene el suyo, escrito."},
{b:"K0",n:"Zona roja",c:"Kevin Burch",o:"Meter presión desde la línea de saque en el final del set.",a:"Seis contra seis, con el marcador arrancado cerca del final.",r:"Error en el primer saque del juego: derrota automática. Dos errores seguidos: derrota. Ace en el primero o dos aces seguidos: victoria.",esc:"L3 solo la regla del primer saque · L2 y L1 con las cuatro reglas.",e:"Calibrar mal el marcador inicial. Se ajusta al nivel de cada lado."},
{b:"K1i",n:"Mariposa con marcador a más treinta",c:"Liam Sketcher",o:"Convertir la mariposa clásica en entrada en calor de ataque con estándar medible.",a:"Mariposa clásica, con bloqueo puesto la mayoría de los días. El entrenador solo lleva el marcador.",r:"Ataque bueno que mata y no toca la cinta suma uno. El error resta uno. Bloqueo punto suma uno. El blanco es más treinta.",esc:"L4 sin bloqueo y blanco en más quince · L3 con bloqueo · L2 y L1 desde free ball, más rápido y con blanco más alto.",e:"Dejar que el sacador afloje. Si la pelota no llega donde va, el marcador no avanza."},
{b:"K1i",n:"Cuatro pelotas, cuatro pelotas",c:"César Hernández González",o:"Organizar el seis contra seis en secuencias fijas para instalar situaciones tácticas concretas.",a:"Seis contra seis. El entrenador alimenta desde el costado. Pizarrón con puntos y errores por jugador.",r:"Bloques de cuatro pelotas, cada bloque con su objetivo. Con marcador suele arrancar 19-19. Reglas de más uno y menos uno según lo que se premia.",esc:"L4 bloques de dos · L3 de cuatro · L2 con la regla de no repetir atacante · L1 con restricciones de zona.",e:"Cambiar el objetivo del bloque a mitad de camino. Cada cuatro pelotas tiene una sola idea."},
{b:"K1i",n:"BBA",c:"Luka Slabe",o:"Premiar la matada de primera pelota y el side-out rápido, con saque en vivo.",a:"Seis contra seis completos, saque en vivo de los dos lados, por pares de rotaciones. Pizarrón visible.",r:"Matar de recepción vale 3. Matar en la primera transición, 3. Más adelante en el rally, 2 y después 1. El saque errado no cuenta y lo reemplaza una pelota fácil.",esc:"L3 dos escalones de puntaje · L2 y L1 el puntaje completo con decaimiento.",e:"Meter pelotas todo el tiempo. El saque tiene que ser en vivo, aunque el vóley salga feo."},
{b:"K1i",n:"Juego de puntas: dos seguidas",c:"Kevin Hambly",o:"Que las puntas encuentren cómo anotar uno contra uno contra el bloqueo.",a:"Seis contra seis. La defensa cambia de configuración entre pelota y pelota para obligar a mirar.",r:"La punta suma solo si anota las dos seguidas: la de sistema y la de fuera de sistema. La defensa suma con dos paradas.",esc:"L3 una sola pelota, sin encadenar · L2 las dos seguidas · L1 con reciclaje incluido.",e:"Aceptar el pelotazo al medio. Se pega contra los dos últimos dedos de la mano externa del bloqueo."},
{b:"K1s",n:"Batalla de saque y recepción",c:"Alessandro Lodi",o:"Enfrentar sacadores y receptores con puntaje que hace que cada serie valga todo.",a:"Dos receptores en cancha, nunca tres, en escena definida 5-6 o 1-6. Un tercero espera afuera. Tres o cuatro sacadores del otro lado.",r:"Los receptores necesitan cuatro recepciones buenas seguidas para el punto grande. Cualquiera por debajo de positiva corta la serie. Los sacadores, tres buenos seguidos.",esc:"L4 dos receptores y saque de arriba suave · L3 saque real · L2 y L1 variando escena y posición de saque.",e:"Poner tres receptores. Con dos controlás cuántas repeticiones hace cada uno."},
{b:"K1s",n:"Recepción con puntaje progresivo hasta veinte",c:"César Hernández González",o:"Trabajar la conexión entre los dos receptores con un objetivo que castiga el error.",a:"Siempre dos receptores. El entrenador saca desde zona uno replicando el saque del rival del fin de semana.",r:"Perfecta suma uno; dos positivas seguidas suman uno. La ! es neutra. Dos negativas seguidas restan uno. Slash o ace hace caer al escalón anterior.",esc:"L3 objetivo diez · L2 objetivo quince · L1 objetivo veinte con el saque del rival.",e:"Sacar cualquier saque. Se replica el que van a enfrentar el sábado."},
{b:"K1s",n:"Batalla de saque y pase",c:"Tuomas Sammelvuo",o:"Competir saque contra recepción con la mayor variación posible de sacadores, zonas y trayectorias.",a:"Dos receptores por vez, un tercero rotando. Tres o cuatro sacadores desde las dos puntas.",r:"Cuatro recepciones buenas seguidas es punto grande. Tres saques buenos seguidos también.",esc:"L4 un solo sacador y una zona · L3 dos zonas · L2 y L1 con las dos puntas y trayectorias distintas.",e:"Sacar cinco minutos siempre a la zona 5. La variación es lo que hace aprender."},
{b:"K1s",n:"Side-out a 18 antes de 8",c:"Francesco Petrella",o:"Llevar el side-out al 75 por ciento alternando saque con efecto y flotante, como en el partido.",a:"Seis contra seis. Un equipo recibe, el otro saca. Seis pelotas por rotación: cuatro de side-out y dos de saque.",r:"Solo cuenta el side-out: hay que llegar a 18 antes de perder 8. El equipo que saca tiene un saque de bono por sacador para que no se gane por error de saque.",esc:"L3 objetivo 12 antes de 8 · L2 15 antes de 8 · L1 18 antes de 8 con alternancia spin-flotante.",e:"Dejar que el side-out se gane por errores de saque del rival. Para eso está el saque de bono."},
{b:"K1s",n:"Vóley del Opuesto",c:"Tuomas Sammelvuo y Alessandro Lodi",o:"Encadenar side-outs bajo presión y entrenar la capacidad de volver a cero.",a:"Seis contra seis con equipos mezclados, nunca titulares contra suplentes. Todos los rallies empiezan con saque.",r:"El objetivo es seis side-outs seguidos, ajustable al nivel. Se pierde todo y se empieza de nuevo. Cada diez minutos, dos free balls de bono por equipo.",esc:"L3 objetivo tres seguidos · L2 cuatro · L1 seis o siete con pelota de bono.",e:"Calibrar mal el objetivo. Si el juego termina en doce minutos promedio, el número está mal."},
{b:"K1o",n:"Armado fuera de sistema desde seis metros",c:"Dave Shondell",o:"Armar y atacar fuera de sistema de manera agresiva, en vez de regalarle una pelota fácil al rival.",a:"Un entrenador en cada extremo. Bloqueo real del otro lado. Se juega en las dos direcciones.",r:"El armado fuera de sistema tiene que quedar a un metro adentro de la antena y medio metro de la red. A dos metros y medio no cuenta.",esc:"L3 solo llegar con la pelota jugable · L2 con la referencia de distancia · L1 con bloqueo real y tiro fuerte contra la mano.",e:"Aceptar el armado separado. Es exactamente lo que no se quiere."},
{b:"K1o",n:"Armado desde zona uno con aro de tempo",c:"Guillermo Naranjo Hernández",o:"Volumen de armado saliendo de pelotas que llegan desde zona uno, controlando además la altura.",a:"Un aro de ubicación y, entre ese aro y la central, un segundo aro colgado a la altura elegida.",r:"La pelota tiene que pasar por el aro de tempo para llegar al de ubicación.",esc:"L3 solo el aro de ubicación · L2 los dos aros · L1 eligiendo la altura según el atacante.",e:"Colgar el aro y no explicar para qué. Se saca a la zona uno porque vuelve legible el armado a la central."},
{b:"K1o",n:"Dos toques",c:"César Hernández González",o:"Elegir bien cuando la pelota llega en dos contactos: atacar, tirar el tip, buscar el bloqueo o mandar free ball.",a:"El entrenador ataca desde la red sobre un defensor. El equipo defiende y solo tiene dos contactos.",r:"Con dos toques no se puede crear un error. Prioridad: quedarse con la pelota; si no, un tip que saque a un atacante del sistema.",esc:"L3 defensa y devolución alta · L2 con elección entre tip y ataque · L1 con el tip como arma, no como salvavidas.",e:"Permitir la free ball cómoda. Nunca se regala una pelota para que el rival ataque tranquilo."},
{b:"K2",n:"Cinco o nada",c:"Lauren Bertolacci",o:"Forzar el ataque de la central en transición y castigar la pelota que cae sin que nadie la toque.",a:"Seis contra seis. Tres centrales rotando. Se mete una pelota dirigida del otro lado.",r:"Juego a cinco. La primera pelota va obligatoriamente a la central. Punto de central en transición vale dos. Si la pelota toca el piso sin que nadie la toque, se vuelve a cero.",esc:"L3 sin la regla del cero · L2 con ella · L1 con bloqueo uno contra uno obligatorio.",e:"Usarlo largo. Es muy intenso para las centrales: bloques cortos."},
{b:"K2",n:"Defensa y transición en bloques de doce",c:"Luka Slabe",o:"Dar volumen alto de transición a un lado y entrenar el trabajo de ojos del otro.",a:"Los dos lados completos, uno defensivo y otro ofensivo. Armadora y central fijas en cada lado.",r:"No se juega el rally hasta el final: la pelota defendida vuelve enseguida. Cambio de centrales cada doce pelotas y de lado cada veinticuatro.",esc:"L3 bloques de seis · L2 de doce · L1 con sobrecarga de la bloqueadora del lado derecho.",e:"Defender pegado a la red. Se defiende alto y separado, dando la cara a la pelota."},
{b:"K2",n:"Defensa de equipo con llamadas",c:"Kevin Hambly",o:"Instalar el sistema de bloqueo-defensa: cómo se ve un front, un commit y una trampa, y cómo cambia la defensa detrás de cada uno.",a:"Seis contra seis. Un entrenador detrás de la zona defensiva trabajando la ubicación de las zagueras.",r:"Se juega a quince paradas. Una parada es un ataque en ritmo o un bloqueo punto; un ataque sin ritmo no cuenta. La llamada la hace la central, no el entrenador.",esc:"L2 dos llamadas · L1 las cinco del playbook.",e:"Cantar vos las llamadas. Si las canta el entrenador, el jugador no aprende a leer."},
{b:"K2",n:"Ejercicio de tres pelotas",c:"John Cook",o:"Trabajar la lectura del bloqueo en tres situaciones encadenadas: saque en vivo, transición y fuera de sistema.",a:"Seis contra seis con sparrings que tienen la consigna de pegarle al bloqueo. Pantallas a los dos lados.",r:"No se juega hasta el final: es un ejercicio de bloqueo. Tres repeticiones y se rota. Al salir, el jugador mira su repetición en la pantalla.",esc:"L3 una sola situación · L2 dos · L1 las tres encadenadas.",e:"Dar feedback a todos. Acá el feedback va casi todo a las bloqueadoras."},
{b:"K2",n:"Cuatro defensas con primer tiempo y pelota a la cuatro",c:"César Hernández González",o:"Volumen de toques defensivos alternando ataques de primer tiempo y de zona cuatro.",a:"Tres atacantes en la red del lado del entrenador. Defensores enfrente. El entrenador decide quién ataca.",r:"Cuentan las cuatro pelotas que el equipo pueda armar y atacar, o sea lo bastante altas dentro de la propia cancha.",esc:"L3 secuencia conocida · L2 secuencia oculta · L1 con transición a contraataque real.",e:"Empezar con secuencia oculta. Al principio se avisa, para que miren la pelota y no piensen."},
{b:"J",n:"Seis pelotas",c:"Tom Black",o:"Paso intermedio entre la tutoría y el seis contra seis competitivo: se compite, pero se sigue enseñando.",a:"Seis contra seis, con el cuerpo técnico repartido por áreas: uno mira los ojos de las bloqueadoras, otro las defensoras.",r:"Gana quien se lleva cuatro de las seis pelotas. Tres juegos de cuatro para la ronda. Saque errado: pelota de bono y el rally no cuenta. Empate tres a tres: money ball.",esc:"L3 cuatro pelotas · L2 seis · L1 seis con money ball.",e:"Mirar la pelota. Acá el cuerpo técnico mira a los jugadores, no al vóley."},
{b:"J",n:"Seis contra seis con puntaje asimétrico",c:"Francesco Petrella",o:"Mejorar las situaciones muy alejadas de la red y el bloqueo-defensa contra pelota alta, controlando la exigencia.",a:"Seis contra seis recorriendo las rotaciones en orden invertido. Un equipo saca con efecto adentro para generar fuera de sistema real.",r:"Solo un equipo puede anotar; el otro juega para evitarlo. El que anota tiene que llegar a quince antes de que el otro llegue a ocho o nueve.",esc:"L2 umbrales anchos · L1 umbrales ajustados al porcentaje que se quiere exigir.",e:"Usar umbrales fijos. Se calibran según la exigencia que buscás esa semana."},
{b:"E",n:"Uno contra uno de dedos en una franja",c:"Steven Vanmedegael",o:"Encender piernas y espalda antes del bloque de saque, con un juego de control que obliga a correr adelante y atrás.",a:"Se juega sobre una sola franja del piso, un sexto del ancho de la cancha. La línea de tres puntos de básquet es el fondo.",r:"Solo toque de dedos, ningún otro contacto. El que pierde cambia de lado.",esc:"L4 en pareja · L3 uno contra uno · L2 y L1 dos contra dos en dos franjas.",e:"Hacerlo después del saque. Va antes: es lo que entra en calor la espalda."},
{b:"E",n:"Mini juego de cierre de entrada en calor",c:"Tuomas Sammelvuo",o:"Cerrar la entrada en calor con algo competitivo que encienda al grupo.",a:"Duelos de uno contra uno o dos contra dos en espacios reducidos, adentro de los tres metros o en cancha completa.",r:"Reglas que el entrenador cambia día a día. Cinco minutos, no más.",esc:"Sirve en todos los levels. En L5, atrapar y lanzar.",e:"Estirarlo. No es trabajo técnico: es activación y clima."}]
};

EJC.de=[
{b:"K0",n:"Nine ball serving",c:"Kevin Burch",o:"Service gegen Annahme im Duell, mit Qualitätsskala für die Annahme und zusätzlichem Druck auf das erste Service.",a:"Servierende auf der einen Seite, Annehmende auf der anderen. Jede Annahme wird auf einer Dreierskala bewertet.",r:"Erste auf fünf. Annahme 2 oder 3 ist Punkt für die Annahme; 1 oder schlechter für das Service. Fehler beim ersten Service: automatische Niederlage. Ass beim ersten: automatischer Sieg.",esc:"L4 Zweierskala ohne Sudden Death · L3 vollständige Skala · L2 und L1 mit der Regel zum ersten Service.",e:"Das erste Service als eines von vielen behandeln. Der ganze Druck der Übung liegt genau dort."},
{b:"K0",n:"Service mit Geschwindigkeitsziel",c:"Dave Shondell",o:"Über der eigenen Zielgeschwindigkeit servieren, unter Druck und mit Fehlersteuerung.",a:"Radar und sichtbarer Bildschirm. Jede Person mit ihrer eigenen Zielgeschwindigkeit.",r:"Fünf Services über dem Ziel. Ein Fehler setzt auf null zurück; ein Service im Feld unter dem Ziel löscht das Angesammelte nicht.",esc:"L3 ohne Radar, Ziel über angesagte Zone · L2 mit Radar und eigenem Ziel · L1 mit Unterscheidung von Powerservice und Service zum Satzbeginn.",e:"Ein einziges Ziel für alle. Jede hat ihr eigenes, schriftlich."},
{b:"K0",n:"Rote Zone",c:"Kevin Burch",o:"Druck von der Grundlinie am Satzende erzeugen.",a:"Sechs gegen sechs, mit einem Spielstand nahe am Satzende.",r:"Fehler beim ersten Service des Spiels: automatische Niederlage. Zwei Fehler in Folge: Niederlage. Ass beim ersten oder zwei Asse in Folge: Sieg.",esc:"L3 nur die Regel zum ersten Service · L2 und L1 mit allen vier Regeln.",e:"Den Anfangsstand falsch kalibrieren. Er wird ans Niveau beider Seiten angepasst."},
{b:"K1i",n:"Schmetterling mit Ziel plus dreissig",c:"Liam Sketcher",o:"Den klassischen Schmetterling in ein Angriffs-Aufwärmen mit messbarem Standard verwandeln.",a:"Klassischer Schmetterling, meistens mit Block. Die Trainerperson führt nur den Punktestand.",r:"Ein guter Angriff, der tötet und die Netzkante nicht berührt, zählt eins. Fehler zieht eins ab. Blockpunkt zählt eins. Ziel ist plus dreissig.",esc:"L4 ohne Block, Ziel plus fünfzehn · L3 mit Block · L2 und L1 aus dem Freeball, schneller und mit höherem Ziel.",e:"Die servierende Person nachlassen lassen. Landet der Ball nicht, wo er hin soll, bewegt sich der Punktestand nicht."},
{b:"K1i",n:"Vier Bälle, vier Bälle",c:"César Hernández González",o:"Das Sechs gegen Sechs in feste Sequenzen ordnen, um konkrete taktische Situationen zu verankern.",a:"Sechs gegen sechs. Die Trainerperson füttert von der Seite. Tafel mit Punkten und Fehlern pro Person.",r:"Blöcke zu vier Bällen, jeder Block mit eigenem Ziel. Mit Resultat startet man meist bei 19:19. Plus-eins- und Minus-eins-Regeln je nachdem, was belohnt wird.",esc:"L4 Blöcke zu zwei · L3 zu vier · L2 mit der Regel, dieselbe Angreiferin nicht zu wiederholen · L1 mit Zonenbeschränkungen.",e:"Das Ziel des Blocks mittendrin ändern. Jede Viererserie hat genau eine Idee."},
{b:"K1i",n:"BBA",c:"Luka Slabe",o:"Den Kill aus dem ersten Ball und das schnelle Side-out belohnen, mit Service aus dem Spiel heraus.",a:"Volles Sechs gegen sechs, Service von beiden Seiten, nach Rotationspaaren. Sichtbare Tafel.",r:"Kill aus der Annahme zählt 3. Kill im ersten Übergang 3. Später im Ballwechsel 2 und danach 1. Ein Servicefehler zählt nicht und wird durch einen einfachen Ball ersetzt.",esc:"L3 zwei Punktstufen · L2 und L1 die vollständige Wertung mit Abnahme.",e:"Ständig Bälle einwerfen. Das Service muss aus dem Spiel kommen, auch wenn das Volleyball unschön aussieht."},
{b:"K1i",n:"Aussenspiel: zwei in Folge",c:"Kevin Hambly",o:"Dass die Aussenangreiferinnen Wege finden, eins gegen eins gegen den Block zu punkten.",a:"Sechs gegen sechs. Die Abwehr wechselt zwischen den Bällen die Formation, um zum Hinschauen zu zwingen.",r:"Die Aussenangreiferin punktet nur, wenn sie zwei in Folge trifft: die aus dem System und die ausserhalb. Die Abwehr punktet mit zwei Stopps.",esc:"L3 ein einzelner Ball, ohne Kette · L2 zwei in Folge · L1 mit Recycling.",e:"Den harten Schlag in die Mitte akzeptieren. Geschlagen wird gegen die letzten zwei Finger der Aussenhand des Blocks."},
{b:"K1s",n:"Duell Service gegen Annahme",c:"Alessandro Lodi",o:"Servierende und Annehmende direkt gegeneinander, mit einer Wertung, die jede Serie entscheidend macht.",a:"Zwei Annahmespielerinnen im Feld, nie drei, in fester Szene 5-6 oder 1-6. Eine dritte wartet draussen. Drei oder vier Servierende gegenüber.",r:"Die Annahme braucht vier gute Annahmen in Folge für den grossen Punkt. Alles unter positiv unterbricht die Serie. Das Service braucht drei gute in Folge.",esc:"L4 zwei Annehmende und weiches Service von oben · L3 echtes Service · L2 und L1 mit wechselnder Szene und Serviceposition.",e:"Drei Annehmende aufstellen. Mit zweien steuerst du, wie viele Wiederholungen jede bekommt."},
{b:"K1s",n:"Annahme mit fortschreitender Wertung bis zwanzig",c:"César Hernández González",o:"Die Verbindung zwischen den zwei Annahmespielerinnen mit einem Ziel erarbeiten, das den Fehler bestraft.",a:"Immer zwei Annehmende. Die Trainerperson serviert aus Position eins und bildet das Service des Wochenendgegners nach.",r:"Perfekt zählt eins; zwei positive in Folge zählen eins. Das ! ist neutral. Zwei negative in Folge ziehen eins ab. Slash oder Ass wirft auf die vorige Stufe zurück.",esc:"L3 Ziel zehn · L2 Ziel fünfzehn · L1 Ziel zwanzig mit dem Service des Gegners.",e:"Irgendein Service spielen. Nachgebildet wird das, dem sie am Samstag begegnen."},
{b:"K1s",n:"Duell Service und Annahme",c:"Tuomas Sammelvuo",o:"Service gegen Annahme mit grösstmöglicher Variation an Servierenden, Zonen und Flugbahnen.",a:"Zwei Annehmende gleichzeitig, eine dritte rotiert. Drei oder vier Servierende von beiden Aussenpositionen.",r:"Vier gute Annahmen in Folge sind ein grosser Punkt. Drei gute Services in Folge ebenfalls.",esc:"L4 eine servierende Person und eine Zone · L3 zwei Zonen · L2 und L1 von beiden Aussenpositionen mit verschiedenen Flugbahnen.",e:"Fünf Minuten immer in die Zone 5 servieren. Die Variation ist das, was lernen lässt."},
{b:"K1s",n:"Side-out auf 18 vor 8",c:"Francesco Petrella",o:"Das Side-out auf fünfundsiebzig Prozent bringen, im Wechsel von Sprung- und Flatterservice wie im Spiel.",a:"Sechs gegen sechs. Eine Mannschaft nimmt an, die andere serviert. Sechs Bälle pro Rotation: vier Side-out und zwei Service.",r:"Gezählt wird nur das Side-out: 18 erreichen, bevor 8 verloren gehen. Die servierende Mannschaft hat ein Bonusservice pro Person, damit nicht durch Servicefehler gewonnen wird.",esc:"L3 Ziel 12 vor 8 · L2 15 vor 8 · L1 18 vor 8 im Wechsel Sprung-Flatter.",e:"Das Side-out durch gegnerische Servicefehler gewinnen lassen. Dafür gibt es das Bonusservice."},
{b:"K1s",n:"Volleyball der Diagonalen",c:"Tuomas Sammelvuo und Alessandro Lodi",o:"Side-outs unter Druck aneinanderreihen und lernen, wieder bei null anzufangen.",a:"Sechs gegen sechs mit gemischten Teams, nie Stamm gegen Ersatz. Alle Ballwechsel beginnen mit Service.",r:"Ziel sind sechs Side-outs in Folge, ans Niveau anpassbar. Man verliert alles und beginnt neu. Alle zehn Minuten zwei Bonus-Freebälle pro Team.",esc:"L3 Ziel drei in Folge · L2 vier · L1 sechs oder sieben mit Bonusball.",e:"Das Ziel falsch kalibrieren. Endet das Spiel im Schnitt nach zwölf Minuten, stimmt die Zahl nicht."},
{b:"K1o",n:"Zuspiel ausserhalb des Systems aus sechs Metern",c:"Dave Shondell",o:"Ausserhalb des Systems aggressiv zuspielen und angreifen, statt dem Gegner einen einfachen Ball zu schenken.",a:"Eine Trainerperson an jedem Ende. Echter Block gegenüber. Es wird in beide Richtungen gespielt.",r:"Das Zuspiel ausserhalb des Systems muss einen Meter innerhalb der Antenne und einen halben Meter vom Netz landen. Zweieinhalb Meter vom Netz zählt nicht.",esc:"L3 nur einen spielbaren Ball hinbringen · L2 mit der Distanzvorgabe · L1 mit echtem Block und hartem Schlag gegen die Hand.",e:"Das abgesetzte Zuspiel akzeptieren. Genau das will man nicht."},
{b:"K1o",n:"Zuspiel aus Position eins mit Tempo-Reifen",c:"Guillermo Naranjo Hernández",o:"Volumen im Zuspiel aus Bällen, die aus Position eins kommen, und dabei die Höhe kontrollieren.",a:"Ein Reifen für die Platzierung und dazwischen ein zweiter Reifen auf gewählter Höhe.",r:"Der Ball muss durch den Tempo-Reifen, um den Platzierungsreifen zu erreichen.",esc:"L3 nur der Platzierungsreifen · L2 beide Reifen · L1 mit gewählter Höhe je nach Angreiferin.",e:"Den Reifen aufhängen und nicht erklären wozu. In die Position eins wird serviert, weil es das Zuspiel zur Mitte lesbar macht."},
{b:"K1o",n:"Zwei Kontakte",c:"César Hernández González",o:"Richtig wählen, wenn der Ball in zwei Kontakten kommt: angreifen, Lob, den Block suchen oder einen Freeball schicken.",a:"Die Trainerperson greift vom Netz auf eine abwehrende Person an. Die Mannschaft hat nur zwei Kontakte.",r:"Mit zwei Kontakten darf kein Fehler entstehen. Priorität: den Ball behalten; sonst ein Lob, der eine Angreiferin aus dem System nimmt.",esc:"L3 Abwehr und hohes Rückspiel · L2 mit Wahl zwischen Lob und Angriff · L1 mit dem Lob als Waffe, nicht als Rettungsanker.",e:"Den bequemen Freeball zulassen. Nie einen Ball verschenken, den der Gegner in Ruhe angreift."},
{b:"K2",n:"Fünf oder nichts",c:"Lauren Bertolacci",o:"Den Angriff der Mitte im Übergang erzwingen und jeden Ball bestrafen, der unberührt zu Boden fällt.",a:"Sechs gegen sechs. Drei Mittelblockerinnen rotieren. Ein gezielter Ball kommt von der anderen Seite.",r:"Spiel auf fünf. Der erste Ball geht zwingend zur Mitte. Ein Punkt der Mitte im Übergang zählt doppelt. Berührt der Ball unberührt den Boden, geht es zurück auf null.",esc:"L3 ohne die Null-Regel · L2 mit ihr · L1 mit verpflichtendem Eins-gegen-eins-Block.",e:"Es lange laufen lassen. Für die Mitte ist es sehr intensiv: kurze Blöcke."},
{b:"K2",n:"Abwehr und Übergang in Zwölferblöcken",c:"Luka Slabe",o:"Einer Seite hohes Übergangsvolumen geben und der anderen die Blickarbeit trainieren.",a:"Beide Seiten vollständig, eine defensiv und eine offensiv. Zuspielerin und Mitte pro Seite fest.",r:"Der Ballwechsel wird nicht ausgespielt: Der abgewehrte Ball geht sofort zurück. Wechsel der Mitte alle zwölf Bälle, Seitenwechsel alle vierundzwanzig.",esc:"L3 Blöcke zu sechs · L2 zu zwölf · L1 mit Überlastung der Blockerin auf der rechten Seite.",e:"Am Netz klebend verteidigen. Verteidigt wird hoch und vom Netz abgesetzt, mit dem Gesicht zum Ball."},
{b:"K2",n:"Mannschaftsabwehr mit Calls",c:"Kevin Hambly",o:"Das Block-Abwehr-System verankern: wie ein Front, ein Commit und eine Falle aussehen und wie sich die Abwehr dahinter ändert.",a:"Sechs gegen sechs. Eine Trainerperson hinter der Abwehrzone arbeitet an der Position der Hinterfeldspielerinnen.",r:"Gespielt wird auf fünfzehn Stopps. Ein Stopp ist ein Angriff im Rhythmus oder ein Blockpunkt; ein Angriff ohne Rhythmus zählt nicht. Den Call macht die Mitte, nicht die Trainerperson.",esc:"L2 zwei Calls · L1 die fünf aus dem Playbook.",e:"Die Calls selbst rufen. Ruft die Trainerperson, lernt die Person nicht zu lesen."},
{b:"K2",n:"Drei-Ball-Übung",c:"John Cook",o:"Das Blocklesen in drei verketteten Situationen erarbeiten: Service aus dem Spiel, Übergang und ausserhalb des Systems.",a:"Sechs gegen sechs mit Sparringpartnern, die die Vorgabe haben, den Block anzuschlagen. Bildschirme auf beiden Seiten.",r:"Es wird nicht ausgespielt: Es ist eine Blockübung. Drei Wiederholungen, dann wird rotiert. Draussen schaut sich die Person ihre Wiederholung am Bildschirm an.",esc:"L3 eine einzige Situation · L2 zwei · L1 die drei verkettet.",e:"Allen Rückmeldung geben. Hier geht die Rückmeldung fast ausschliesslich an die Blockenden."},
{b:"K2",n:"Vier Abwehren mit erstem Tempo und Ball nach aussen",c:"César Hernández González",o:"Volumen an Abwehrkontakten im Wechsel von Angriffen im ersten Tempo und über aussen.",a:"Drei Angreiferinnen am Netz auf der Seite der Trainerperson. Abwehrende gegenüber. Die Trainerperson entscheidet, wer angreift.",r:"Gezählt werden die vier Bälle, die die Mannschaft aufbauen und angreifen kann, also hoch genug im eigenen Feld.",esc:"L3 bekannte Reihenfolge · L2 verdeckte Reihenfolge · L1 mit Übergang in echten Gegenangriff.",e:"Mit verdeckter Reihenfolge beginnen. Am Anfang wird angesagt, damit sie den Ball ansehen und nicht nachdenken."},
{b:"J",n:"Sechs Bälle",c:"Tom Black",o:"Zwischenschritt zwischen Lernform und wettkämpferischem Sechs gegen Sechs: Es wird gewertet, aber weiter unterrichtet.",a:"Sechs gegen sechs, der Trainerstab nach Bereichen verteilt: eine schaut auf die Augen der Blockenden, eine auf die Abwehr.",r:"Es gewinnt, wer vier der sechs Bälle holt. Drei Spiele zu vier für die Runde. Servicefehler: Bonusball, der Ballwechsel zählt nicht. Bei drei zu drei: Money Ball.",esc:"L3 vier Bälle · L2 sechs · L1 sechs mit Money Ball.",e:"Auf den Ball schauen. Hier schaut der Trainerstab auf die Spielenden, nicht auf das Volleyball."},
{b:"J",n:"Sechs gegen sechs mit asymmetrischer Wertung",c:"Francesco Petrella",o:"Situationen weit weg vom Netz und Block-Abwehr gegen hohen Ball verbessern, mit gesteuertem Anspruch.",a:"Sechs gegen sechs, die Rotationen in umgekehrter Reihenfolge. Eine Mannschaft serviert mit Effet ins Feld, um echtes Out-of-system zu erzeugen.",r:"Nur eine Mannschaft kann punkten; die andere spielt, um es zu verhindern. Die punktende muss fünfzehn erreichen, bevor die andere acht oder neun erreicht.",esc:"L2 weite Schwellen · L1 Schwellen, die an die gewünschte Quote angepasst sind.",e:"Feste Schwellen verwenden. Sie werden nach dem Anspruch der Woche kalibriert."},
{b:"E",n:"Eins gegen eins nur mit den Fingern auf einer Bahn",c:"Steven Vanmedegael",o:"Beine und Rücken vor dem Serviceblock aufwecken, mit einem Ballkontrollspiel, das zum Vor- und Zurücklaufen zwingt.",a:"Gespielt wird auf einer einzigen Bodenbahn, einem Sechstel der Feldbreite. Die Dreipunktlinie des Basketballfelds ist die Grundlinie.",r:"Nur oberes Zuspiel, kein anderer Kontakt. Wer verliert, wechselt die Seite.",esc:"L4 zu zweit · L3 eins gegen eins · L2 und L1 zwei gegen zwei auf zwei Bahnen.",e:"Es nach dem Service machen. Es gehört davor: Es wärmt den Rücken auf."},
{b:"E",n:"Minispiel zum Abschluss des Aufwärmens",c:"Tuomas Sammelvuo",o:"Das Aufwärmen mit etwas Wettkämpferischem abschliessen, das die Gruppe anzündet.",a:"Duelle eins gegen eins oder zwei gegen zwei auf kleinem Raum, innerhalb der drei Meter oder auf ganzem Feld.",r:"Regeln, die die Trainerperson täglich ändert. Fünf Minuten, nicht mehr.",esc:"Gilt auf allen Levels. Auf L5 fangen und werfen.",e:"Es in die Länge ziehen. Es ist keine Technikarbeit, sondern Aktivierung und Stimmung."}];

{b:"K0",n:"Nine ball serving",c:"Kevin Burch",o:"Serving against passing with a pass-quality scale and extra pressure on the first serve.",a:"Servers on one side, passers on the other. Every pass is graded on a three-point scale.",r:"First to five. A 2 or 3 pass is a point for the passers; a 1 or worse for the servers. A missed first serve: automatic loss. An ace on the first: automatic win.",esc:"L4 two-grade scale, no sudden death · L3 full scale · L2 and L1 with the first-serve rule.",e:"Treating the first serve as one more. The whole pressure of the drill lives there."},
{b:"K0",n:"Serving to a speed target",c:"Dave Shondell",o:"Serving above your own speed target under pressure, managing the error.",a:"Radar and a visible screen. Every player with their own target speed.",r:"Five serves above the target. A miss resets to zero; a serve in below target does not erase what you have built.",esc:"L3 no radar, target by called zone · L2 radar and individual target · L1 separating the power serve from the first serve of a set.",e:"One target for everyone. Each player has their own, written down."},
{b:"K0",n:"Red zone",c:"Kevin Burch",o:"Putting pressure on from the service line at the end of a set.",a:"Six on six, starting from a score close to the end of a set.",r:"A missed first serve of the game: automatic loss. Two misses in a row: loss. An ace on the first, or two aces in a row: win.",esc:"L3 only the first-serve rule · L2 and L1 with all four rules.",e:"Setting the starting score badly. It is calibrated to the level of each side."},
{b:"K1i",n:"Butterfly to plus thirty",c:"Liam Sketcher",o:"Turning the classic butterfly into an attacking warm-up with a measurable standard.",a:"Classic butterfly, with a block up on most days. The coach only keeps score.",r:"A good attack that kills and does not clip the tape scores one. An error takes one off. A block point scores one. The target is plus thirty.",esc:"L4 no block, target plus fifteen · L3 with a block · L2 and L1 off a free ball, faster and with a higher target.",e:"Letting the server ease off. If the ball does not go where it should, the score does not move."},
{b:"K1i",n:"Four balls, four balls",c:"César Hernández González",o:"Organising six on six into fixed sequences to install concrete tactical situations.",a:"Six on six. The coach feeds from the side. A board with points and errors per player.",r:"Blocks of four balls, each block with its own objective. With a score it usually starts 19-19. Plus-one and minus-one rules according to what is being rewarded.",esc:"L4 blocks of two · L3 of four · L2 with the rule of not repeating the same attacker · L1 with zone restrictions.",e:"Changing the block's objective halfway through. Each set of four balls has one idea."},
{b:"K1i",n:"BBA",c:"Luka Slabe",o:"Rewarding the first-ball kill and the fast side-out, with live serving.",a:"Full six on six, live serving from both sides, worked in pairs of rotations. Visible board.",r:"A kill off the pass scores 3. A kill in the first transition, 3. Later in the rally, 2 and then 1. A missed serve does not count and is replaced by an easy ball.",esc:"L3 two scoring tiers · L2 and L1 the full decaying score.",e:"Feeding balls all the time. The serve has to be live, even if the volleyball comes out ugly."},
{b:"K1i",n:"Pin hitters: two in a row",c:"Kevin Hambly",o:"Getting the outside hitters to find ways to score one against one versus the block.",a:"Six on six. The defence changes its configuration between balls to force them to look.",r:"The hitter only scores if they get two in a row: the in-system one and the out-of-system one. The defence scores with two stops.",esc:"L3 a single ball, not chained · L2 two in a row · L1 with recycling included.",e:"Accepting the hard swing down the middle. You hit against the last two fingers of the block's outside hand."},
{b:"K1s",n:"Serve and pass battle",c:"Alessandro Lodi",o:"Putting servers and passers directly against each other with a score that makes every run matter.",a:"Two passers on court, never three, in a set scene of 5-6 or 1-6. A third waits outside. Three or four servers opposite.",r:"The passers need four good passes in a row for the big point. Anything below positive breaks the run. The servers need three good ones in a row.",esc:"L4 two passers and a soft overhand serve · L3 a real serve · L2 and L1 varying the scene and the serving position.",e:"Putting three passers on. With two you control how many reps each one gets."},
{b:"K1s",n:"Passing with a progressive score to twenty",c:"César Hernández González",o:"Working the connection between the two passers with a target that punishes the error.",a:"Always two passers. The coach serves from zone one, replicating the weekend opponent's serve.",r:"A perfect pass scores one; two positives in a row score one. The ! is neutral. Two negatives in a row take one off. A slash or ace drops you to the previous tier.",esc:"L3 target ten · L2 target fifteen · L1 target twenty with the opponent's serve.",e:"Serving any old serve. You replicate the one they will face on Saturday."},
{b:"K1s",n:"Serve and pass duel",c:"Tuomas Sammelvuo",o:"Serving against passing with the widest possible variation of servers, zones and trajectories.",a:"Two passers at a time, a third rotating. Three or four servers from both pins.",r:"Four good passes in a row is a big point. Three good serves in a row likewise.",esc:"L4 one server and one zone · L3 two zones · L2 and L1 from both pins with different trajectories.",e:"Serving five minutes to zone 5 every time. The variation is what makes them learn."},
{b:"K1s",n:"Side-out to 18 before 8",c:"Francesco Petrella",o:"Taking the side-out to seventy-five per cent, alternating spin and float serves as in a match.",a:"Six on six. One team receives, the other serves. Six balls per rotation: four side-out and two serving.",r:"Only the side-out counts: reach 18 before losing 8. The serving team gets a bonus serve per server so the side-out is not won on serving errors.",esc:"L3 target 12 before 8 · L2 15 before 8 · L1 18 before 8 alternating spin and float.",e:"Letting the side-out be won on the opponent's serving errors. That is what the bonus serve is for."},
{b:"K1s",n:"Opposite's volleyball",c:"Tuomas Sammelvuo and Alessandro Lodi",o:"Chaining side-outs under pressure and training the ability to go back to zero.",a:"Six on six with mixed teams, never starters against subs. Every rally begins with a serve.",r:"The target is six consecutive side-outs, adjustable to the level. You lose everything and start again. Every ten minutes, two bonus free balls per team.",esc:"L3 target three in a row · L2 four · L1 six or seven with a bonus ball.",e:"Setting the target badly. If the game ends in twelve minutes on average, the number is wrong."},
{b:"K1o",n:"Out-of-system setting from six metres",c:"Dave Shondell",o:"Setting and attacking out of system aggressively instead of handing the opponent an easy ball.",a:"A coach at each end. A real block opposite. Played in both directions.",r:"The out-of-system set has to land a metre inside the antenna and half a metre off the net. Two and a half metres off the net does not count.",esc:"L3 just deliver a playable ball · L2 with the distance reference · L1 with a real block and a hard swing against the hand.",e:"Accepting the set that is off the net. It is exactly what you do not want."},
{b:"K1o",n:"Setting from zone one with a tempo hoop",c:"Guillermo Naranjo Hernández",o:"Volume of setting off balls arriving from zone one, while controlling the height.",a:"A placement hoop and, between it and the middle, a second hoop hung at a chosen height.",r:"The ball has to travel through the tempo hoop to reach the placement hoop.",esc:"L3 only the placement hoop · L2 both hoops · L1 choosing the height by attacker.",e:"Hanging the hoop and not explaining why. They serve to zone one because it makes the set to the middle readable."},
{b:"K1o",n:"Two contacts",c:"César Hernández González",o:"Choosing well when the ball arrives in two contacts: attack, tip, use the block, or send a free ball.",a:"The coach attacks from the net onto a defender. The team has only two contacts.",r:"With two contacts you cannot create an error. Priority: keep the ball; if not, a tip that takes an attacker out of system.",esc:"L3 dig and a high return · L2 choosing between tip and attack · L1 with the tip as a weapon, not a lifeline.",e:"Allowing the comfortable free ball. Never hand over a ball the opponent can attack in peace."},
{b:"K2",n:"Five or nothing",c:"Lauren Bertolacci",o:"Forcing the middle's attack in transition and punishing any ball that lands untouched.",a:"Six on six. Three middles rotating. A directed ball comes from the other side.",r:"Game to five. The first ball must go to the middle. A middle's point in transition is worth two. If the ball lands untouched, back to zero.",esc:"L3 without the zero rule · L2 with it · L1 with a compulsory one-on-one block.",e:"Running it long. It is very intense for the middles: short blocks."},
{b:"K2",n:"Defence and transition in blocks of twelve",c:"Luka Slabe",o:"Giving one side a high volume of transition and training the other side's eye work.",a:"Both sides complete, one defensive and one offensive. Setter and middle fixed on each side.",r:"The rally is not played out: the dug ball goes straight back. Middles change every twelve balls, sides every twenty-four.",esc:"L3 blocks of six · L2 of twelve · L1 with overload on the right-side blocker.",e:"Defending glued to the net. You defend high and off the net, facing the ball."},
{b:"K2",n:"Team defence with calls",c:"Kevin Hambly",o:"Installing the block-defence system: what a front, a commit and a trap look like, and how the defence behind each one changes.",a:"Six on six. A coach behind the defensive zone working the back-row positioning.",r:"Played to fifteen stops. A stop is an attack in rhythm or a block point; an attack without rhythm does not count. The call is made by the middle, not the coach.",esc:"L2 two calls · L1 the five from the playbook.",e:"Making the calls yourself. If the coach calls, the player never learns to read."},
{b:"K2",n:"Three-ball drill",c:"John Cook",o:"Working block reading in three chained situations: live serve, transition and out of system.",a:"Six on six with sparring partners told to hit the block. Screens on both sides.",r:"It is not played out: it is a blocking drill. Three reps and rotate. On the way out, the player watches their rep on the screen.",esc:"L3 a single situation · L2 two · L1 the three chained.",e:"Giving feedback to everyone. Here the feedback goes almost entirely to the blockers."},
{b:"K2",n:"Four digs with quick and outside ball",c:"César Hernández González",o:"Volume of defensive touches alternating quick attacks and attacks from zone four.",a:"Three attackers at the net on the coach's side. Defenders opposite. The coach decides who attacks.",r:"What counts are the four balls the team can set and attack, that is, high enough inside their own court.",esc:"L3 known sequence · L2 hidden sequence · L1 with transition into a real counter-attack.",e:"Starting with a hidden sequence. At first you announce it, so they watch the ball instead of thinking."},
{b:"J",n:"Six balls",c:"Tom Black",o:"A middle step between teaching form and competitive six on six: you compete, but you keep teaching.",a:"Six on six, with the staff spread by area: one watching the blockers' eyes, another the defenders.",r:"Whoever takes four of the six balls wins. Three games of four to win the round. A missed serve: bonus ball and the rally does not count. Three-all: money ball.",esc:"L3 four balls · L2 six · L1 six with money ball.",e:"Watching the ball. Here the staff watches the players, not the volleyball."},
{b:"J",n:"Six on six with asymmetric scoring",c:"Francesco Petrella",o:"Improving situations far off the net and block-defence against the high ball, with controlled demand.",a:"Six on six, running the rotations in reverse order. One team serves with spin into the court to generate real out-of-system.",r:"Only one team can score; the other plays to prevent it. The scoring team has to reach fifteen before the other reaches eight or nine.",esc:"L2 wide thresholds · L1 thresholds tuned to the percentage you want to demand.",e:"Using fixed thresholds. They are calibrated to the demand you are after that week."},
{b:"E",n:"One on one with hands on a single strip",c:"Steven Vanmedegael",o:"Waking up the legs and the back before the serving block, with a ball-control game that forces running forward and back.",a:"Played on a single strip of floor, a sixth of the court's width. The basketball three-point line is the baseline.",r:"Overhead contact only, nothing else. Whoever loses changes side.",esc:"L4 in pairs · L3 one on one · L2 and L1 two on two across two strips.",e:"Doing it after serving. It goes before: it is what warms up the back."},
{b:"E",n:"Closing mini-game of the warm-up",c:"Tuomas Sammelvuo",o:"Closing the warm-up with something competitive that fires the group up.",a:"One-on-one or two-on-two duels in small spaces, inside the three metres or on the full court.",r:"Rules the coach changes from day to day. Five minutes, no more.",esc:"Works at every level. At L5, catch and throw.",e:"Stretching it out. It is not technical work: it is activation and atmosphere."}];

const EJ_KEYS=["E","K1i","K1s","K1o","K2","J"];

{n:"1:1, 2:2 y 3:3 en cancha reducida",f:"Brasil · CBV",o:"Que cada chico resuelva muchas veces por minuto. Cuantos menos hay en la cancha, más veces le toca.",a:"Canchas de 6×3 a 12×4,5 metros con red de 1,80 a 2,20 m. Tantas canchas como entren en el gimnasio.",r:"Prohibida la pelota de primera y prohibido el bloqueo. El saque es lanzado, de toque o de abajo.",esc:"L5 1:1 y 2:2 con atrapar y lanzar · L4 3:3 con el primer contacto jugado.",e:"Armar una sola cancha grande con veinte chicos. Con cuatro canchas chicas, cada uno toca cuatro veces más."},
{n:"Rey de la cancha en cancha chica",f:"Gold Medal Squared",o:"Competencia continua con máxima densidad, y resolver grupos desparejos sin improvisar.",a:"Equipos de dos en media cancha. Hay configuración para 8, 10, 12, 14 y 16 jugadores.",r:"El equipo que gana se queda; el que pierde sale y entra el que espera. Después de cada ronda se mezclan los equipos.",esc:"L5 atrapar y lanzar · L4 tres contactos obligatorios · L3 en adelante, cancha completa.",e:"Dejar los mismos equipos toda la sesión. Se mezclan después de cada ronda."},
{n:"Parcours de colchonetas para el saque",f:"mobilesport",o:"Derivar el saque de abajo del lanzamiento que el chico ya sabe hacer.",a:"Colchonetas o aros como blancos a distancias crecientes desde la red.",r:"Se avanza de blanco solo cuando entran tres seguidos. El que falla vuelve al anterior.",esc:"L5 lanzando con las dos manos · L4 saque de abajo desde media cancha · L3 desde el fondo.",e:"Poner a todos en la línea de fondo el primer día. Se acerca el blanco, no se baja la exigencia."},
{n:"La pelota no toca el piso",f:"Playbook NLA",o:"Instalar la frase del primer equipo desde el primer día, y que sea medible.",a:"Juego libre en cancha chica, grupos de tres o cuatro.",r:"Se cuenta cuántas pelotas cayeron sin que nadie se moviera a buscarlas. El objetivo del día es bajar ese número, no ganar.",esc:"L5 y L4 con atrapar permitido · L3 en adelante, todo jugado.",e:"Contar los puntos. Acá se cuentan las pelotas que cayeron sin que nadie fuera."},
{n:"Todos tienen una tarea",f:"Japón · JVA",o:"Que con treinta chicos y una cancha no haya nadie parado.",a:"Estaciones simultáneas: una cancha chica jugando, una pared con toques, un aro de precisión, una fila de aterrizajes.",r:"Se rota por tiempo, no por resultado. Nadie espera turno en ninguna estación.",esc:"Sirve en L5 y L4 tal cual. En L3 las estaciones pasan a ser situaciones de juego.",e:"Dejar una estación donde se espera. Si hay cola, esa estación está mal armada."},
{n:"Atrapar arriba, lanzar arriba",f:"Kessel · Minivolley",o:"Que las manos estén donde van a estar cuando aprenda el toque de arriba.",a:"De a dos, una pelota cada pareja, sin red o con red baja.",r:"Solo vale si atrapó por encima de la cabeza y lanzó desde arriba. Atrapar contra el pecho no cuenta.",esc:"L5 el ejercicio completo · L4 se reemplaza el atrapar por el toque y se mantiene el lanzamiento.",e:"Corregir con palabras. Si atrapa contra el pecho, subí la pelota: la altura corrige sola."},
{n:"Tres toques o no vale",f:"Brasil · CBV",o:"Que la regla produzca la construcción, sin que el entrenador la pida.",a:"Juego 3:3 o 4:4 en cancha reducida.",r:"El punto no cuenta si el equipo no llegó a tres contactos. Devolver de primera es punto para el rival.",esc:"L5 con el segundo contacto atrapado · L4 todo jugado.",e:"Levantar la regla cuando se pone difícil. Justo ahí es donde enseña."},
{n:"Aterrizajes en el juego de entrada",f:"mobilesport",o:"Instalar la caída sobre dos pies con la rodilla alineada, todos los días.",a:"Cajón bajo o línea. Saltan, caen, y hay una pelota esperando.",r:"El salto no cuenta si el que cae no queda listo para la pelota siguiente.",esc:"L5 desde el piso · L4 desde cajón bajo · L3 salto de bloqueo.",e:"Hacerlo como bloque de prevención aparte. Va adentro del juego de entrada."},
{n:"La pelota cae lejos",f:"Polonia",o:"Que muevan los pies antes que los brazos, que es el error universal de la edad.",a:"De a dos o de a tres, el que lanza tiene que hacer caer la pelota lejos del que recibe.",r:"Solo cuentan las pelotas jugadas con los pies quietos. Si tocó estirándose, no suma.",esc:"L5 atrapa · L4 juega de arriba o de abajo según venga.",e:"Lanzar cómodo para que salga bien. Si llega sin moverse, no entrenó nada."},
{n:"Elegí el hueco",f:"Playbook NLA",o:"El comienzo de la intención táctica: mirar antes de mandar la pelota.",a:"Dos zonas marcadas con conos en el campo rival.",r:"Se canta la zona antes de golpear. Si acierta, punto doble. Si no cantó, no suma aunque caiga adentro.",esc:"L5 con autoelevación y golpe de pie · L4 con ataque en salto.",e:"Premiar la potencia. Se premia la intención cumplida."},
{n:"Cuenta del equipo",f:"Polonia",o:"Empezar la sesión con presión y con el error barato.",a:"Todo el grupo, una pelota, sin red o con red baja.",r:"Se cuenta hacia atrás desde el récord del grupo. Si cae, se pierden cinco, no se reinicia todo.",esc:"L5 objetivo 15 · L4 objetivo 30 con tres toques.",e:"Volver a cero cada vez que cae. Eso enseña a no arriesgar."},
{n:"Mini torneo de cinco minutos",f:"Polonia",o:"Exposición temprana a la competencia en un ambiente que la sostiene.",a:"Tantas canchas chicas como entren, equipos de dos o tres, rotación cada cinco minutos.",r:"Se juega con marcador. El que pierde rota de cancha. Nadie queda afuera nunca.",esc:"L5 2:2 con atrapar · L4 3:3 jugado.",e:"Armar llaves de eliminación. El que pierde tiene que seguir jugando, no mirar."}]};
