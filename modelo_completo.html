 kv3:{t:"Drei Kontakte",sub:"Kids Volley 3 · 5 bis 10 Jahre",
  obj:"Dass der vollständige Spielzug erscheint: annehmen, zuspielen, angreifen.",
  porque:"Es ist die letzte Stufe, bevor das Fangen verschwindet, und damit das letzte Sicherheitsnetz. Verlässt das Kind diese Stufe mit drei aufgebauten Kontakten, wird Rookie 1 ein Übergang und kein Sprung. Verlässt es sie mit dem Direktrückspiel, schleppt es dieses Verhalten jahrelang mit, weil Zurückspielen kurzfristig funktioniert.",
  tecnica:[
   {n:"Oberes Zuspiel mit Ziel",cad:"Kommt aus Kids 2 · wird in Rookie 1 gefestigt",int:"Dass der Ball irgendwo ankommt, nicht nur sauber weggeht.",pts:["Der Oberkörper zeigt vor dem Kontakt zum Ziel.","Genug Höhe, damit die Mitspielerin Zeit hat."],frase:"«Wo soll dieser Ball ankommen?»",err:"Sauberer Kontakt ohne Richtung: Die Mitspielerin muss immer rennen.",arreglo:"Physische Ziele: ein Reifen, eine sitzende Mitspielerin, eine markierte Zone."},
   {n:"Eigenzuspiel und Angriff aus dem Stand",cad:"Entsteht hier · führt zum Sprungangriff in Rookie 2",int:"Der Keim des Schmetterballs, mit dem Ball unter eigener Kontrolle.",pts:["Der Ball wird nach vorne und oben gespielt.","Schlag mit offener Hand und gestrecktem Arm.","Die Lücke wird vor dem Schlag gewählt."],frase:"«Wähle die Lücke, bevor du schlägst.»",err:"Sie schlagen, ohne zu schauen, wohin.",arreglo:"Zwei markierte Zonen, und sie sagt vor dem Schlag an, welche."},
   {n:"Manchette als Hilfsmittel",cad:"Wird hier eingeführt · ist die Annahme in Rookie",int:"Den tiefen oder schnellen Ball lösen, der nicht oben gespielt werden kann.",pts:["Feste Spielbrett, Arme zusammen.","Körper hinter dem Ball.","Impuls aus den Beinen."],frase:"«Kommt er tief, Arme; kommt er hoch, Hände.»",err:"Sie nehmen für alles die Manchette, weil sie sich sicherer fühlt.",arreglo:"Regel: Der erste Kontakt ist oben, wenn der Ball hoch kommt."},
   {n:"Service von unten mit Richtung",cad:"Kommt aus Kids 2 · wird in Rookie 1 gefestigt",int:"Dass das Service beginnt zu wählen, wo der Ball landet.",pts:["Dieselbe Bewegung wie immer.","Der Körper zeigt zur Zone.","Die Zone wird vorher angesagt."],frase:"«Sag an, wohin es geht, bevor du servierst.»",err:"Sie servieren immer in die Mitte.",arreglo:"Zwei markierte Zonen und Punkte für die angesagte Zone."},
   {n:"Landung nach dem Angriff",cad:"Kommt aus Kids 1 · bleibt immer",int:"Jetzt wo geschlagen wird, wird die Landung zur Risikobewegung.",pts:["Zwei Füsse, Knie in Linie.","Federt ab und ist bereit für den nächsten Ball."],frase:"«Du landest und spielst weiter.»",err:"Sie landen unausgeglichen und sind aus dem Ballwechsel draussen.",arreglo:"Nach jedem Angriff kommt sofort ein weiterer Ball."}],
  tactica:[{n:"Aufbau über drei Kontakte",d:"Ziel der Mannschaft wird der Spielzug, nicht der Punkt. Getragen von der Regel, nicht von der Ansprache."},
   {n:"Grundsicherung",d:"Wer die Angreiferin begleitet. Die günstigste kollektive Gewohnheit und die, die am meisten Ballwechsel gewinnt."},
   {n:"Die Lücke wählen",d:"Vor dem Rückspiel wird geschaut, wo niemand steht. Der Beginn der taktischen Absicht."},
   {n:"Nach dem Service den Raum besetzen",d:"Wer serviert, kehrt an den Platz zurück. Das Feld ist gedeckt, bevor der Ball zurückkommt."},
   {n:"Während des Ballwechsels sprechen",d:"«Ich», «du», «kommt». Drei Wörter und immer dieselben."}],
  sesion:[["15","Einstiegsspiel: Koordination und Landungen in Spielform."],["22","Erste Bewegung des Blocks, mit Zielvorgabe."],["20","Zweite Bewegung des Blocks, mit Gegenwirkung."],["23","Spiel 3:3 mit der Drei-Kontakte-Regel."],["10","Freies Spiel und Abschluss."]],
  anio:[["August","Gruppe bilden und die Drei-Kontakte-Regel ab dem ersten Tag erklären.","Sie verstehen die Regel, auch wenn sie sie noch nicht schaffen."],
   ["September-Oktober","Oberes Zuspiel mit Ziel. Alles mit physischem Ziel: Reifen, Zone, Mitspielerin.","Körpergrösse. Die Mitspielerin muss für das Zuspiel nicht rennen."],
   ["November-Dezember","Eigenzuspiel und Angriff aus dem Stand, dazu Manchette als Hilfsmittel.","Wählt die Lücke vor dem Schlag. Nutzt die Manchette passend, ohne Aufforderung."],
   ["Januar","Progressiver Wiedereinstieg im Spiel 3:3.","Der Dreier-Aufbau hat die Pause überstanden."],
   ["Februar-März","Service von unten mit Richtung und Landung nach dem Angriff. Die Stufe wird abgeschlossen.","Körpergrösse. Sagt die Zone vor dem Service an."],
   ["April","Abschluss. Es ist der Übergang zu Rookie: erklären, was sich ändert.","Die Mehrheit baut im freien Spiel drei Kontakte auf."]],
  errDT:["Das Direktrückspiel akzeptieren, wenn es im Spiel eng wird. Genau dann muss die Regel gehalten werden.","Den Angriff ohne vorangehende Annahme trainieren. Isolierter Angriff überträgt sich nicht.","Das Spiel ans Ende legen und die Zeit nicht mehr haben."],
  fis:"Eigenzuspiel und Angriff aus dem Stand: die Schlagbewegung erscheint.",
  men:"Selbstständigkeit: Material wird mit der Gruppe aufgebaut und weggeräumt.",
  evalu:"Körpergrösse alle drei Monate."},

 r1:{t:"Alles gespielt",sub:"Rookie 1 · 11 bis 14 Jahre · entspricht U13 im Vereinsleitfaden",
  obj:"Dass das Fangen verschwindet und das Spiel trotzdem möglich bleibt.",
  porque:"Das Fangen verschwindet und alles wird gespielt. Es ist zugleich die breiteste Eintrittstür des Vereins: Das Reglement lässt Rookie bis U18 zu, also kann ein Fünfzehnjähriger, der noch nie gespielt hat, hier einsteigen, ohne gegen Gleichaltrige mit sechs Jahren Vorsprung anzutreten. Die Trainerperson wird fast sicher sehr unterschiedliche Niveaus in derselben Gruppe haben, und das ist normal und kein zu behebender Mangel.",
  tecnica:[
   {n:"Annahme mit Manchette",cad:"Kommt aus Kids 3 · entwickelt sich in Rookie 2 und 3",int:"Den Spielzug am Leben halten, wenn das Service kommt.",pts:["Spielbrett geformt, bevor der Ball ankommt.","Körper dahinter, nicht daneben.","Die Schultern lenken den Ball, nicht die Arme."],frase:"«Bring das Spielbrett zum Ball, nicht den Ball zum Spielbrett.»",err:"Sie korrigieren mit den Armen, weil sie mit den Füssen zu spät kamen.",arreglo:"Immer mit Verschiebung. Nie Annahme im Stand."},
   {n:"Oberes Zuspiel zum Aufbau",cad:"Kommt aus Kids 3 · führt zur Penetration in Rookie 2",int:"Einer Mitspielerin einen angreifbaren Ball geben.",pts:["Genug Höhe und Abstand zum Netz.","Der Oberkörper zeigt zur Angreiferin."],frase:"«Der Oberkörper ist der Kompass.»",err:"Sie spielen zu nah ans Netz und die Angreiferin kann nicht anlaufen.",arreglo:"Mindestabstand auf dem Boden markieren."},
   {n:"Angriff aus dem Stand mit Richtung",cad:"Kommt aus Kids 3 · wird hier gefestigt",int:"Vor dem Schlag wählen, wohin der Ball geht.",pts:["Offene Hand und gestreckter Arm.","Kontakt vor dem Körper.","Die Richtung wird vorher gewählt."],frase:"«In welche Lücke hast du geschlagen?»",err:"Sie schlagen hart in die Mitte.",arreglo:"Markierte Zonen und Doppelpunkte für die gewählte Zone."},
   {n:"Sprungangriff",cad:"Wird hier eingeführt · entwickelt sich in Rookie 2 und 3",int:"Beginnen, über das Netz anzugreifen.",pts:["Anlauf mit Rhythmus, anfangs auch mit zwei Schritten.","Armzug vor dem Absprung.","Kontakt oben und vor dem Körper."],frase:"«Zuerst gut springen, dann hart schlagen.»",err:"Sie springen und schlagen mit gebeugtem Arm.",arreglo:"Angriff von einem tiefen Kasten, um den Arm zu isolieren."},
   {n:"Feldabwehr",cad:"Wird hier eingeführt · entwickelt sich bis Future 1",int:"Dass der schwierige Ball mit gestelltem Körper geholt wird.",pts:["Tiefe Position, Gewicht nach vorn.","Hände aussen und vor dem Körper.","Kommt gestellt an, nicht gestreckt."],frase:"«Verteidigt wird mit den Beinen, nicht mit den Armen.»",err:"Sie werfen sich hin, bevor sie versuchen hinzukommen.",arreglo:"Zuerst gehend ankommen: Das Fallen kommt viel später dazu."}],
  tactica:[{n:"Aufbau über drei Kontakte",d:"Die Zusatzpunktregel für vier Angriffe ins gegnerische Feld belohnt genau das. Nutze die Regel des Reglements statt eine eigene zu erfinden."},
   {n:"Rollen im 3:3",d:"Wer annimmt, wer zuspielt, wer angreift — und dass es in jeder Rotation wechselt."},
   {n:"Sicherung des eigenen Angriffs",d:"Wird hier eingeführt: Greift eine an, begleiten die anderen. Das bleibt für den Rest der Laufbahn Pflicht."},
   {n:"Lesen des ersten Kontakts",d:"Die Angreiferin startet nach dem, was sie in der Annahme sieht, nicht wenn die Zuspielerin schon gespielt hat."},
   {n:"Raumbesetzung",d:"Zu dritt hat jede eine Zone und eine Verantwortung beim Zurückkehren."}],
  sesion:[["18","Präventionsblock und Koordination. Landungen, Abbremsen und Richtungswechsel."],["20","Erste Bewegung des Blocks, ganz und mit maximaler Kontaktdichte."],["18","Zweite Bewegung des Blocks, im vollständigen Spielzug."],["20","Kleinfeldspiel mit einer Regel, die zur Bewegung des Blocks zwingt."],["12","Spiel mit Resultat."],["2","Abschluss: eine Idee, gesagt von einer Spielerin."]],
  anio:[["August","Nach Niveau einteilen. Du wirst grosse Unterschiede haben: Baue zwei Felder mit unterschiedlichen Regeln.","Gruppe eingeteilt, niemand nach unten nivelliert."],
   ["September-Oktober","Annahme mit Manchette und oberes Zuspiel zum Aufbau. Beide sind die Basis von allem Folgenden.","Messung im Oktober. Hält den Spielzug bei den meisten Annahmen am Leben."],
   ["November-Dezember","Angriff aus dem Stand mit Richtung und Sprungangriff. Der Sprung kommt dazu.","Wählt eine Richtung und setzt sie um. Springt, ohne den Rhythmus zu verlieren."],
   ["Januar","Progressiver Wiedereinstieg. Die Belastung kehrt nicht sprunghaft zurück.","Niemand mit Beschwerden beim Wiedereinstieg."],
   ["Februar-März","Feldabwehr. Und Überprüfung der Niveaueinteilung: wer steigt auf.","Messung im März gegen Oktober. Kommt gestellt in die Abwehr."],
   ["April","Abschluss und Stufenentscheid.","Die Mehrheit erreicht regelmässig drei Kontakte."]],
  errDT:["Wer spät zum Volleyball kommt, wird behandelt, als wäre er im Rückstand. Er ist die Hauptzielgruppe dieser Stufe.","Bei grossen Unterschieden nach unten nivellieren. Zwei Felder mit zwei Regeln lösen, was ein Feld nicht kann.","Die Technik erklären, statt die Spielregel zu ändern."],
  fis:"Bereits strukturierter Präventionsblock: Landungen, Abbremsen und Richtungswechsel.",
  men:"Der ideale Einstieg für alle, die spät zum Volleyball kommen. Niemand soll sich im Rückstand fühlen.",
  evalu:"Erste vollständige Messung im Oktober und Vergleich im März."}
});
Object.assign(ENSC_DE,{
 r2:{t:"Die Penetration erscheint",sub:"Rookie 2 · 11 bis 14 Jahre · entspricht U13 im Vereinsleitfaden",
  obj:"Die Penetration aus Position 1 installieren — das Mechanismus, auf dem das gesamte übrige Schweizer System aufbaut.",
  porque:"Das ist die Angelstufe der ganzen Ausbildung, und die Trainerperson sollte das vorher wissen. Was hier gelernt wird — dass die Zuspielerin von hinten einläuft und dass in jeder Rotation wechselt, wer zuspielt — ist wörtlich der Mechanismus des 6-6 in Future 1, des 6-2 in Future 2 und des 5-1 in Future 3. Wer Rookie 2 ohne Penetration verlässt, schleppt das Problem drei Stufen mit. Es ist zugleich der Moment, in dem die Mehrheit in den Wachstumsschub kommt: Man unterrichtet eine neue und schwierige Bewegung genau dann, wenn der Körper am wenigsten koordiniert ist. Beides zusammen erklärt, warum diese Stufe mehr Geduld verlangt als jede andere.",
  tecnica:[
   {n:"Penetration aus Position 1",cad:"Entsteht hier · ist der Mechanismus von 6-6, 6-2 und 5-1",int:"Dass die hintere Person rechtzeitig ans Netz kommt, um zuzuspielen, ohne vor dem Service gesehen zu werden.",pts:["Startet, wenn das gegnerische Service das Netz überquert, nicht wenn die Annahme schon weg ist.","Gerader Weg in die Zone 2-3, nicht diagonal zum Ball.","Kommt an und stoppt vor dem Kontakt: Der letzte Schritt ist ein Bremsschritt.","Schultern beim Ankommen bereits zur Zone 4 ausgerichtet."],frase:"«Geh früher los, lauf nicht schneller.»",err:"Sie starten spät und gleichen mit Tempo aus. Sie erreichen den Ball, aber in Bewegung, und das Zuspiel wird zu lang oder zu kurz. Das Problem liegt nicht in den Händen, sondern im Startzeitpunkt.",arreglo:"Den Weg ohne Ball trainieren, getaktet gegen das Service. Zehn Starts in Folge, nur auf die Füsse schauen."},
   {n:"Oberes Zuspiel in der Verschiebung",cad:"Kommt aus Rookie 1 · wird in Future 1 gefestigt",int:"Gut zuspielen, auch wenn der Körper noch ankommt — was fast immer der Fall sein wird.",pts:["Hohe Stirn und Hände vor dem Gesicht vor dem letzten Schritt.","Impuls aus den Beinen, nicht aus den Armen.","Der Oberkörper zeigt zum Ziel des Zuspiels."],frase:"«Der Oberkörper ist der Kompass.»",err:"Sie spielen mit den Armen, weil sie ohne Beine ankommen. Erkennbar daran, dass der Ball flach herauskommt.",arreglo:"Übungen, bei denen der Ball immer in der Verschiebung angenommen wird. Auf dieser Stufe nie im Stand zuspielen."},
   {n:"Annahme mit zwei Annahmespielerinnen",cad:"Kommt aus Rookie 1 · führt zu den drei Annahmespielerinnen in Rookie 3",int:"Die Breite des 4:4-Feldes zu zweit decken, ohne zu kollidieren und ohne die Mitte freizulassen.",pts:["Jede deckt ihre Hälfte, der Ball in der Mitte gehört der, die nach innen geht.","Es wird vor der Berührung gerufen, nicht währenddessen.","Das Spielbrett zeigt zum Ziel, nicht zum Service."],frase:"«Wer nach innen geht, nimmt ihn. Die andere ruft und macht Platz.»",err:"Beide gehen, oder keine geht. Ein Problem der Absprache, nicht der Technik.",arreglo:"Die Regel wird vor der Übung vereinbart und die ganze Saison ohne Ausnahme angewendet."},
   {n:"Sprungangriff",cad:"Kommt aus Rookie 1 · wird in Rookie 3 gefestigt",int:"Vom Angriff aus dem Stand zum Sprungangriff, den das Reglement der Stufe mit einem Zusatzpunkt belohnt.",pts:["Dreischritt-Anlauf mit immer gleichem Rhythmus.","Armzug vor dem Absprung.","Kontakt oben und vor dem Körper, mit gestrecktem Arm.","Landung auf beiden Füssen mit ausgerichtetem Knie."],frase:"«Drei Schritte, immer dieselben.»",err:"Zweischritt-Anlauf und Kontakt hinter dem Kopf. Der häufigste Fehler der Stufe und der, der später am meisten begrenzt.",arreglo:"Zuerst Anlauf ohne Ball, mit einer Bodenmarkierung für den Bremsschritt."},
   {n:"Manchette als Zuspiel",cad:"Kommt aus Kids 3 · bleibt immer",int:"Den zweiten Kontakt lösen, wenn die Annahme die Zuspielerin nicht erreicht — im 4:4 ständig der Fall.",pts:["Festes Spielbrett und Winkel zur Angreiferin.","Impuls aus den Beinen, das Spielbrett schlägt nicht.","Ein Ziel wird vor dem Kontakt gewählt."],frase:"«Wenn du nicht mit den Händen hinkommst, spielst du mit den Armen zu. Aber du spielst zu.»",err:"Sie spielen den Ball ins gegnerische Feld zurück, wenn die Annahme misslingt. Der dritte Kontakt geht verloren.",arreglo:"Regel im Spiel: Erreicht die Mannschaft keine drei Kontakte, zählt der Punkt nicht."}],
  tactica:[{n:"Wer zuspielt und wer angreift in jeder Rotation",d:"Zu viert spielt jede irgendwann zu. Vor dem Service muss klar sein, wer in dieser Rotation einläuft und wer angreift. Wird laut gesagt, bis es von selbst geht."},
   {n:"Sicherung des eigenen Angriffs",d:"Greift eine an, begleiten die anderen drei auf zwei Metern, tief und mit offenen Händen. Die günstigste kollektive Gewohnheit und die, die auf dieser Stufe die meisten langen Ballwechsel gewinnt."},
   {n:"Lesen des ersten Kontakts",d:"Die Angreiferin startet nach dem, was sie in der Annahme sieht. Wartet sie auf das Zuspiel, kommt sie überall zu spät."},
   {n:"Raumbesetzung im 4:4",d:"Zwei vorne und zwei hinten, und wer einläuft, hinterlässt eine Lücke, die jemand decken muss."},
   {n:"System 4:4 mit Penetration",d:"Diesen Austausch zu verstehen ist der Beginn des Systemdenkens."}],
  sesion:[["20","Präventionsblock. Landungen und exzentrische Kraft: Viele sind im Wachstumsschub."],["20","Erste Bewegung des Blocks, ganz und mit maximaler Kontaktdichte."],["18","Zweite Bewegung des Blocks, im vollständigen Spielzug."],["18","Kleinfeldspiel 4:4 mit erzwungener Penetration."],["12","Spiel mit Resultat."],["2","Abschluss: eine Idee, gesagt von einer Spielerin."]],
  anio:[["August","Erklären, was Penetration ist und warum sie drei Stufen weiter zählt. Alle messen: Du wirst Kinder im Wachstumsschub haben.","Sie wissen, wofür sie das trainieren."],
   ["September-Oktober","Penetration aus Position 1. Absolute Priorität und das grösste Volumen des Jahres.","Messung im Oktober. Startet rechtzeitig und kommt bei den meisten guten Annahmen ruhig an."],
   ["November-Dezember","Oberes Zuspiel in der Verschiebung und Annahme zu zweit. Die Penetration bleibt in jeder Einheit.","Sie teilen das Feld ohne Kollision. Spielen im Ankommen zu, nicht im Stand."],
   ["Januar","Progressiver Wiedereinstieg, und Achtung bei denen, die über die Pause gewachsen sind. Im Januar nachmessen.","Gestaffelte Belastung. Niemand mit anhaltenden Knieschmerzen."],
   ["Februar-März","Sprungangriff und Manchette als Zuspiel. Das Repertoire der Stufe wird abgeschlossen.","Messung im März. Nutzt den Sprungangriff im Spiel, nicht nur in der Übung."],
   ["April","Abschluss. Wer geht nach Rookie 3 und wer wiederholt die Stufe — nach Niveau, nicht nach Alter.","Penetration funktioniert: Das ist die Bedingung für den Übertritt."]],
  errDT:["Die Hände beim Zuspiel korrigieren, wenn das Problem der Startzeitpunkt ist. Schau auf die Füsse, bevor du auf die Hände schaust.","Das Sprungvolumen im Wachstumsschub erhöhen, weil man «die Zeit nutzen» will. Es ist umgekehrt: Es sinkt.","Die Geduld mit der vorübergehenden Unbeholfenheit verlieren. Sie ist vorhersehbar und vergeht, wenn du sie nicht bestrafst."],
  fis:"Die Mehrheit kommt hier in den Wachstumsschub. Landungen und exzentrische Kraft haben Priorität, und das Sprungvolumen <strong>sinkt</strong>, statt zu steigen. Die Koordination zerfällt vorübergehend und vorhersehbar: Die Technik wird gehalten, nicht mehr verlangt. Körpergrösse alle drei Monate.",
  men:"Die geteilte Verantwortung erscheint: Zu viert versteckt sich niemand und alle spielen irgendwann zu. Es ist auch das Alter, in dem der Ausstieg beginnt, also endet die Einheit immer im Spiel.",
  evalu:"Messung im Oktober und März, und Körpergrösse alle drei Monate, weil hier der Wachstumsschub die Belastung bestimmt."},

 r3:{t:"Das ganze Feld",sub:"Rookie 3 · 11 bis 14 Jahre · zwischen U13 und U15 des Leitfadens",
  obj:"Der Sprung auf das ganze Feld und die erste nach Geschlecht getrennte Stufe.",
  porque:"Es ist der Sprung auf das ganze Feld und die erste nach Geschlecht getrennte Stufe, also der Punkt, an dem die beiden Sparten wirklich Unterschiedliches brauchen. Es ist auch das Alter mit dem höchsten Ertrag der regionalen Sichtung: Wer gut in Rookie 3 ankommt, ist ein echter Kandidat für den Talentpool. Und in der Frauensparte ist es das Fenster, in dem neuromuskuläres Training wirklich schützt — über achtzehn tut es das nicht mehr.",
  tecnica:[
   {n:"Service von oben von der Grundlinie",cad:"Entsteht hier · entwickelt sich in Future 1 und führt zum Sprungservice in Future 2",int:"Dass das Service den Ballwechsel zu unseren Gunsten eröffnet und keine Formalität ist.",pts:["Gleichmässiger Wurf nach vorne.","Kontakt oben mit gestrecktem Arm.","Der Körper geht nach vorne mit."],frase:"«Das Service eröffnet den Ballwechsel zu unseren Gunsten oder gar nicht.»",err:"Sie servieren weich, um keinen Fehler zu machen, und geben die Initiative ab.",arreglo:"Vor der Serie eine akzeptierte Fehlerquote vereinbaren. Ohne das servieren alle zu vorsichtig."},
   {n:"Dreischritt-Anlauf",cad:"Kommt aus dem Sprungangriff in Rookie 2 · wird in Future 1 gefestigt",int:"Der Rhythmus des Angriffs, der im Wachstumsschub zerfällt.",pts:["Immer gleicher Rhythmus: Ausrichten, Bremsen, Schliessen.","Absenken des Schwerpunkts und Armzug.","Kontakt oben und vor dem Körper."],frase:"«Drei Schritte, immer dieselben.»",err:"Zweischritt-Anlauf und Kontakt hinter dem Kopf.",arreglo:"Bodenmarkierung für den Bremsschritt, und Anlauf ohne Ball davor."},
   {n:"Technischer Block",cad:"Entsteht hier · entwickelt sich in Future 1 und führt zum lesenden Block in Future 2",int:"Über dem Netz erscheinen und formiert ankommen.",pts:["Hände penetrieren, Daumen oben.","Vertikaler Sprung, nicht nach vorne.","Die Verschiebung endet vor dem Sprung."],frase:"«Der Blocksprung geht nach oben, nicht nach vorne.»",err:"Sie springen nach vorne und berühren das Netz.",arreglo:"Zuerst von einem Kasten aus, um die Hände von der Verschiebung zu trennen."},
   {n:"Annahme mit drei Annahmespielerinnen",cad:"Kommt von den zwei Annahmespielerinnen in Rookie 2 · ist die Formation für den Rest der Laufbahn",int:"Die Breite des ganzen Feldes auf drei verteilen.",pts:["Jede deckt ihre Zone, es wird vor der Berührung gerufen.","Der Ball in der Mitte gehört der, die nach innen geht.","Das Spielbrett zeigt zur Zuspielerin, nicht zum Service."],frase:"«Wer nach innen geht, nimmt ihn.»",err:"Es gehen zwei oder keine.",arreglo:"Die Regel wird vorher vereinbart und die ganze Saison nicht geändert."},
   {n:"Feldabwehr auf ganzem Feld",cad:"Kommt aus Rookie 1 · wird in Future 1 ohne Libera gefestigt",int:"Ein Feld decken, das nun doppelt so gross ist.",pts:["Grundposition nach dem, wohin der Gegner angreifen wird.","Gewicht nach vorn und Bewegung zum Ball.","Die Abwehr endet im Gegenangriff, nicht im Rückspiel."],frase:"«Verteidigen heisst anfangen anzugreifen.»",err:"Sie holen den Ball und spielen ihn auf die andere Seite.",arreglo:"Jede Abwehrübung endet im Angriff, ohne Ausnahme."}],
  tactica:[{n:"Spiel 6:6 auf ganzem Feld",d:"Wird hier eingeführt. Verstehen, dass sich Verantwortung anders verteilt, je nachdem wie viele im Feld stehen."},
   {n:"System 6-6 mit Penetration",d:"Wird hier eingeführt, drei Stufen bevor es das offizielle System von Future 1 ist. Sie sollen es kommen sehen."},
   {n:"Das 5-1 wird erklärt",d:"Bis zum Spielen ist es noch weit, aber es wird ab dem Erscheinen des ganzen Feldes benannt und erklärt. Man kann in Future 3 nichts festigen, das nie gesehen wurde."},
   {n:"Sicherung des eigenen Angriffs",d:"Kommt aus Rookie und wird hier mit sechs Personen entwickelt: Drei begleiten, die anderen zwei decken das Hinterfeld."},
   {n:"Regionale Sichtung",d:"Alle passenden Profile gehen zur Sichtung. Ohne Ausnahme und ohne dass es davon abhängt, ob die Trainerperson daran denkt."},
   {n:"Keine Alibis: den Ball, den du bekommst, löst du",d:"Velascos Regel, an den Verein angepasst: Niemand kommentiert die Annahme, die er bekommen hat, er löst sie. Wird hier eingeführt und bis zur ersten Mannschaft gehalten. Sie unterbricht die Schuldkette, bevor sie entsteht."}],
  sesion:[["20","Präventionsblock. In der Frauensparte vollständiges neuromuskuläres Programm."],["20","Erste Bewegung des Blocks, mit hohem Volumen."],["18","Zweite Bewegung des Blocks, in der Spielsituation."],["17","Kleinfeldspiel 6:6 mit einer Regel, die zum Schwerpunkt zwingt."],["13","Spiel mit Resultat und echten Rotationen."],["2","Abschluss: eine Idee, gesagt von einer Spielerin."]],
  anio:[["August","Gruppen bereits nach Geschlecht getrennt bilden. In der Frauensparte startet das neuromuskuläre Programm in der ersten Woche.","Gruppen stehen, Präventionsprogramm läuft."],
   ["September-Oktober","Service von oben von der Grundlinie, mit hohem Volumen. Und Annahme mit drei Annahmespielerinnen.","Messung im Oktober. Regionale Sichtung GSGL: alle Profile anmelden. 7 von 10 Services im Feld."],
   ["November-Dezember","Dreischritt-Anlauf und technischer Block. Jetzt kommt das ganze Feld wirklich an.","Stabiler Dreischritt-Rhythmus. Hände über dem Netz beim Block."],

 f1:{t:"Alle machen alles",sub:"Future 1 · 15 bis 17 Jahre · entspricht U15 im Vereinsleitfaden",
  obj:"Die letzte Stufe ohne Libera und ohne Spezialisierung nutzen. Was hier nicht gelernt wird, wird nie mehr gelernt.",
  porque:"Es ist die letzte Stufe ohne Libera und ohne Spezialisierung, und die kommt nie wieder. Eine Zuspielerin, die auch verteidigt, und eine Mittelblockerin, die auch annimmt, entstehen hier oder gar nicht. Die Trainerperson wird Druck von den Spielenden selbst bekommen, sich zu früh zu spezialisieren — die Grossen wollen nicht zuspielen und die Kleinen nicht blocken — und ihre Aufgabe ist, diesem Druck die ganze Saison standzuhalten und zu erklären, warum.",
  tecnica:[
   {n:"Zuspiel aus dem Hinterfeld in der Verschiebung",cad:"Kommt aus der Penetration in Rookie 2 · führt zum spezialisierten Zuspiel in Future 2",int:"Dass jede zuspielen kann, wenn der Ball die Zuspielerin nicht erreicht.",pts:["Hohe Stirn und Hände vorne vor dem letzten Schritt.","Impuls aus den Beinen.","Der Oberkörper zeigt zum Ziel."],frase:"«Wer heute nicht zuspielt, spielt nie zu.»",err:"Die Grossen meiden den zweiten Kontakt.",arreglo:"Regel: In jeder Rotation spielt jemand anderes zu, und es wird notiert."},
   {n:"Annahme gegen Service von oben",cad:"Kommt aus Rookie 3 · wird hier gefestigt",int:"Die Annahme mit echtem Wettkampfservice halten.",pts:["Spielbrett vorher geformt.","Körper hinter dem Ball.","Schultern lenken zur Zuspielerin."],frase:"«Trainiert wird mit dem Service vom Samstag, nicht mit einem leichteren.»",err:"Die Trainerperson senkt die Serviceintensität, damit die Übung besser aussieht.",arreglo:"Nie. Die Intensität bleibt, und wenn nötig wird eine andere Variable gesenkt."},
   {n:"Block auf ganzem Feld",cad:"Kommt aus Rookie 3 · führt zum lesenden Block in Future 2",int:"Timing und Verschiebung gegen hohes Netz.",pts:["Vollständige Verschiebung, die vor dem Sprung endet.","Hände über dem Netz.","Stabilität in der Luft."],frase:"«Komm formiert an, nicht fliegend.»",err:"Sie springen in der Seitwärtsbewegung und zerfallen in der Luft.",arreglo:"Zwei Schritte mit obligatorischem Stopp vor dem Sprung."},
   {n:"Gefestigter Sprungangriff",cad:"Kommt aus Rookie 2 und 3 · wird hier gefestigt",int:"Dass Anlauf und Schlag unter echter Blockgegenwehr funktionieren.",pts:["Stabiler Rhythmus, auch wenn das Zuspiel nicht perfekt ist.","Kontakt hoch und vorne.","Ausgeglichene Landung, bereit weiterzuspielen."],frase:"«Dein Anlauf ändert sich nicht, weil der Ball schlecht kommt.»",err:"Sie passen den Anlauf an das Zuspiel an, statt den Schlag anzupassen.",arreglo:"Absichtlich unperfekte Zuspiele, mit der Vorgabe, den Anlauf gleich zu halten."},
   {n:"Abwehr ohne Libera",cad:"Kommt aus Rookie 3 · wird hier gefestigt und danach nie wieder so trainiert",int:"Dass alle sechs verteidigen, auch die, die sich später spezialisieren.",pts:["Alle in Grundposition.","Niemand geht wegen seiner Grösse raus.","Übergang in den Gegenangriff."],frase:"«Niemand verlässt das Feld wegen seiner Grösse.»",err:"Die Mittelblockerinnen weichen aus Gewohnheit aus dem Hinterfeld.",arreglo:"Das Reglement der Stufe erlaubt keine Libera: Nutze das als Argument."}],
  tactica:[{n:"Penetration in allen sechs Rotationen",d:"Das ganze System stützt sich darauf und duldet keine Ausnahmen. Die Rotation wird vor jedem Punkt angesagt."},
   {n:"Grundabwehr ohne Libera",d:"Alle sechs verteidigen. Es ist die letzte Stufe, auf der das Pflicht ist, und darum die letzte Gelegenheit."},
   {n:"Vollständiges System 6-6",d:"Es ist das offizielle System dieser Stufe und wird gefestigt, indem man es die ganze Saison spielt."},
   {n:"Das 6-2 wird eingeführt",d:"Eine Stufe bevor es offiziell ist. Sie sollen in Future 2 ankommen und es verstehen, nicht entdecken."},
   {n:"Lesen der gegnerischen Zuspielerin",d:"Wird hier eingeführt: erst den ersten Kontakt, dann die Zuspielerin ansehen und vor dem Sprung entscheiden."}],
  sesion:[["20","Präventionsblock. In der Frauensparte vollständiges neuromuskuläres Programm."],["20","Erste Bewegung des Blocks, mit hohem Volumen für alle."],["20","Komplexe K1 und K2 verkettet."],["17","Spiel mit taktischer Vorgabe."],["11","Spiel mit Resultat und Konsequenz."],["2","Abschluss: eine Spielerin sagt, was sie mitnimmt."]],
  anio:[["August","Von Anfang an erklären, warum es auf dieser Stufe keine Libera gibt und alle zuspielen. Du wirst Widerstand bekommen: Komm ihm zuvor.","Sie verstehen den Grund, nicht nur die Regel."],
   ["September-Oktober","Zuspiel aus dem Hinterfeld für alle, mit schriftlicher Erfassung, wie oft jede zugespielt hat.","Messung im Oktober. Alle haben in allen Rotationen mindestens einmal zugespielt."],
   ["November-Dezember","Annahme gegen echtes Service von oben und Penetration in allen sechs Rotationen.","50% der Annahmen im System bei 20 Wettkampfservices."],

   ["Februar-März","Block auf ganzem Feld und Abwehr ohne Libera. Das 6-2 wird mit Blick auf nächstes Jahr eingeführt.","Messung im März. Alle sechs verteidigen, niemand geht wegen seiner Grösse raus."],
   ["April","Abschluss. Entwicklungstest und Talentpool werden konkret: Einzelgespräch.","Jede und jeder mit einem Plan fürs Folgejahr."]],
  errDT:["Dem Druck nachgeben, früh zu spezialisieren. Der Fehler, der die Person langfristig am meisten begrenzt.","Die Serviceintensität in Annahmeübungen senken, damit es besser aussieht.","Im Training eine Libera einsetzen, «weil wir sie im Spiel ohnehin haben». Auf dieser Stufe erlaubt das Reglement sie nicht, und die Stufe existiert genau deswegen."],
  fis:"Bei der Mehrheit ist das Kraftfenster offen: progressive Belastung mit Kontrolle.",

 f2:{t:"Zwei Zuspielerinnen",sub:"Future 2 · 15 bis 17 Jahre · zwischen U15 und U17 des Leitfadens",
  obj:"Das 6-2: verteilte Spezialisierung, mit immer drei Angreiferinnen am Netz.",
  porque:"Die Spezialisierung erscheint, aber verteilt: zwei Zuspielerinnen pro Jahrgang statt einer. Für einen kleinen Verein ist das kein taktisches Detail, sondern ein struktureller Vorteil — fällt eine aus, spielt die Mannschaft weiter. Und es ist die Stufe, auf der die Person taktisch selbst zu denken beginnt: Die Arbeit der Trainerperson wechselt vom Sagen, was zu tun ist, zum Fragen, was sie gesehen haben.",
  tecnica:[
   {n:"Spezialisiertes Zuspiel aus dem Hinterfeld",cad:"Kommt aus dem Zuspiel in Future 1 · führt zum 5-1 in Future 3",int:"Zwei Spielerinnen mit konzentriertem Zuspielvolumen.",pts:["Weg und ausgeglichenes Ankommen.","Konstanter Abstand zum Netz.","Immer derselbe Ball für dieselbe Angreiferin."],frase:"«Jede Angreiferin hat ihren Ball, und du kennst ihn.»",err:"Jedes Zuspiel kommt anders und die Angreiferin kann nicht antizipieren.",arreglo:"Schriftliche Abmachung mit jeder Angreiferin: Höhe, Abstand und Tempo."},
   {n:"Angriff mit Richtungswechsel",cad:"Kommt aus dem Sprungangriff in Future 1 · wird in Future 3 gefestigt",int:"Diagonal, longline und Lob aus demselben Anlauf.",pts:["Der Anlauf ist immer gleich.","Das Handgelenk entscheidet die Richtung.","Die Entscheidung fällt vor dem Sprung."],frase:"«Gleicher Anlauf, anderes Handgelenk.»",err:"Sie ändern den Anlauf je nach Schlag und der Block liest es.",arreglo:"Filme die drei Varianten und zeig sie ihnen: Man sieht es sofort."},
   {n:"Lesender Block",cad:"Kommt vom technischen Block in Future 1 · entwickelt sich in Future 3",int:"Vom Reagieren zum Antizipieren.",pts:["Erst den ersten Kontakt, dann die Zuspielerin ansehen.","Vor dem Sprung entscheiden.","Zum Angriffspunkt hin schliessen."],frase:"«Entscheide vor dem Sprung, nicht in der Luft.»",err:"Sie schauen die ganze Zeit den Ball an und kommen zu spät.",arreglo:"Übung, in der sie vor dem Kontakt der Zuspielerin laut ansagen, was sie tun werden."},
   {n:"Hinterfeldangriff",cad:"Entsteht hier · entwickelt sich in Future 3",int:"Eine Angriffsoption hinzufügen, die den gegnerischen Block zwingt, sich aufzuteilen.",pts:["Anlauf von hinter der Drei-Meter-Linie.","Absprung vor der Linie.","Kontakt hoch und vorne."],frase:"«Der Hinterfeldangriff läuft früher an, nicht schneller.»",err:"Sie treten auf die Linie, weil sie zu spät starten.",arreglo:"Bodenmarkierung einen Meter dahinter, um den frühen Start zu erzwingen."},
   {n:"Sprungservice",cad:"Entsteht hier · entwickelt sich in Future 3",int:"Die Serviceanforderung erhöhen, wenn der Körper es verträgt.",pts:["Gleichmässiger Wurf nach vorne.","Anlauf mit stabilem Rhythmus.","Kontakt oben, mit dem Körper in der Luft."],frase:"«Der Wurf ist neunzig Prozent des Sprungservices.»",err:"Sie arbeiten am Schlag und vernachlässigen den Wurf.",arreglo:"Serien nur mit Wurf, ohne Schlag, mit einer Bodenmarkierung."}],
  tactica:[{n:"Vollständiges System 6-2",d:"Drei Angreiferinnen in allen sechs Rotationen, mit ihren Sicherungen und Übergängen. Es ist das offizielle System der Stufe."},

   {n:"Sicherungen und Übergänge im 6-2",d:"Mit immer drei Angreiferinnen am Netz ändert sich die Sicherung in jeder Rotation. Das wird an diesem System am meisten vernachlässigt."},

   ["April","Abschluss. Duale Laufbahn: mit jeder über Schule und Volleyball sprechen.","Studien- und Trainingsplan fürs Folgejahr vereinbart."]],

 f3:{t:"Eine Zuspielerin",sub:"Future 3 · 15 bis 17 Jahre · entspricht U17 im Vereinsleitfaden",

   {n:"Abwehr und Übergang auf Aktivniveau",cad:"Kommt aus Future 1 · ist der echte Unterschied zu den Aktiven",int:"Die Lücke zwischen Junior und Aktiv liegt hier mehr als im Angriff.",pts:["Tiefe Position, Gewicht nach vorn.","Sofortiger Übergang in den Gegenangriff.","Landen, drehen, vom Netz weg."],frase:"«Der Unterschied zu den Aktiven liegt nicht im Angriff, sondern im Übergang.»",err:"Sie verteidigen gut und greifen danach nicht an.",arreglo:"Jede Abwehrübung endet im Angriff."},
   {n:"Sprungservice unter Druck",cad:"Kommt aus Future 2 · wird hier gefestigt",int:"Das aggressive Service halten, wenn das Spiel eng ist.",pts:["Immer derselbe Wurf, auch bei 23:23.","Vereinbarte und eingehaltene Fehlerquote."],frase:"«Niemand verfehlt ein Service in der zehnten Minute.»",err:"Sie nehmen das Service in den wichtigen Momenten zurück.",arreglo:"Serviceserien am Ende des Trainings, müde und mit Konsequenz."},
   {n:"Gefestigter lesender Block",cad:"Kommt aus Future 2 · wird hier gefestigt",int:"Lesen, entscheiden und schliessen gegen Angreiferinnen auf Aktivniveau.",pts:["Lesen des ersten Kontakts und der Zuspielerin.","Schliessen zum Angriffspunkt.","Hände zum Feld ausgerichtet, nicht zur Decke."],frase:"«Der Block deckt nicht ab: er lenkt.»",err:"Sie springen zum Abdecken, ohne die Hände auszurichten.",arreglo:"Übung, in der nur der Block zählt, der den Ball ins gegnerische Feld zurückbringt."}],

const ENSC_EN = {
 gen:{
  t:"How we teach at this club",
  sub:"General guide · the methodological basis shared by all nine groups",
  p:"This tab does not tell you how to run your session. It sets out <strong>what the player has to learn at each stage, why, and under what principles it is taught</strong>. Two coaches can run completely different sessions and both be right, as long as they respect these principles and the players leave the stage understanding the same things.",
  bloques:[
   {h:"Where this methodology comes from",
    p:"We did not invent it. It rests on three bodies of work that agree with each other more than you would expect. The <strong>Swiss framework</strong>, which defines what is played at each stage. The <strong>American school of motor learning</strong>, built by Carl McGown, PhD in motor learning at Brigham Young University, together with Doug Beal and Marv Dunphy — Olympic gold in 1984 and 1988 — in the Gold Medal Squared system, and by John Kessel, for thirty years Director of Sport Development at USA Volleyball. And the <strong>four pillars</strong> of the club's own project: technical, tactical, physical and mental.",
    f:"Where all three agree, it stops being an opinion and becomes the state of the knowledge."},
   {h:"The skill is not broken into parts",
    p:"This is the most important principle and the most uncomfortable, because it runs against how nearly all of us learned to coach. The review of the literature found <strong>not a single study</strong> favouring part teaching over whole-skill teaching, and several show that part training produces negative transfer: the player learns something that later gets in the way. The reason is neurological — the brain is not a serial processor that reassembles the pieces you taught separately.",
    f:"There is no «technique first, then we play». The whole skill is trained from day one. Blocked practice only in the first minutes of something new, and always of the complete skill."},
   {h:"Simplify the environment, not the skill",
    p:"This is the way out, and it is exactly what the Swiss system does. If the player is a beginner, do not break the skill down: reduce the information in the environment. <strong>Lower net, smaller court, fewer players, lighter ball.</strong> That sentence appears in McGown's paper as the example for coaching children, and it is literally the definition of Kids Volley and Rookie. Smart Competitions is the American motor-learning doctrine turned into a competition system.",
    f:"Reduce the information in the environment. Never reduce the skill."},
   {h:"Random beats blocked",
    p:"Repeating the same action many times in a row makes the player look better <em>during</em> practice and worse in the match. Random order does the opposite: they look worse in practice and retain far more. The result is replicated in volleyball, badminton, baseball, basketball, tennis and football, and the explanation is that variable practice strengthens the brain connections involved in motor learning while blocked repetition has no measurable effect on them. And one finding hits us directly: <strong>the effect of random practice is stronger in children than in adults.</strong>",
    f:"If a drill looks good, be suspicious. Real progress looks ugly while it is happening."},
   {h:"The best passing drill is pass, set and hit",
    p:"The line is Marv Dunphy's, Olympic champion in 1988: the best passing drill is pass-set-hit, the best setting drill is pass-set-hit, the best hitting drill is pass-set-hit. The reason is specificity — the benefits of a training stimulus only show up when that stimulus reproduces the movements of the sport. A coach standing on a box hitting at diggers is not a stimulus that exists in a match, and therefore trains very little.",
    f:"If the action does not occur that way in a match, you are training something else."},
   {h:"The seven checks before you set a drill",
    p:"This list comes from the Gold Medal Squared notebook and is the most practical thing in the whole body of material. Before running a drill, check: the <strong>position and movement</strong> of the players on court; their <strong>orientation to the net</strong>; the <strong>sequence of actions</strong> and its timing; the <strong>stimulus they react to</strong>, which must be the one that occurs in a match; <strong>how it is scored</strong> and what gets rewarded; that the ball <strong>terminates naturally</strong> the way a rally terminates; and the <strong>timing, type and amount of feedback</strong> you give.",
    f:"If a drill fails three of the seven, do not fix it: replace it."},
   {h:"No lines",
    p:"This is the practical consequence of everything above and the easiest indicator to audit. A player standing in a line waiting for the coach to toss a ball is learning nothing, and is also taking a contact away from somebody else. Kessel writes this for programmes with twelve to thirty-six children and a single coach, which is exactly our situation. On the session observation sheet: if a line of more than four is waiting anywhere, the drill is badly built.",
    f:"Count ball contacts per player over five minutes. That is the number that really measures a session."},
   {h:"What the coach does with this",
    p:"Read the guide for your category before the first week, choose your own drills, and use the resources to see the finished skill on video. The only non-negotiables are these principles and the <strong>exit standards</strong> for your stage, which appear further down this page and are read directly from the stage sheet."}],
  tabla:"Category equivalences",
  tablaP:"The club's documents are written in U13, U15, U17, U19 and U21. Swiss Volley organises play into Kids, Rookie and Future, and the club's registered teams are called U14, U16, U18 and U20. These are three names for the same age groups and they coexist, so the table stays visible and every coach can find their group in the column they know.",
  th:["Stage of the framework","Club guide","Registered team","Age","Note"]},

 kv1:{t:"Catch and throw",sub:"Kids Volley 1 · ages 5 to 10",
  obj:"That the child touches the ball a great many times and wants to come back next Tuesday.",
  porque:"It is the first time this child has ever touched a volleyball, and the only thing that decides whether they carry on next year is whether they enjoyed it. Catch and throw is not an arbitrary simplification: it lets them build rallies from day one without the frustration of the ball always hitting the floor. The motor-learning evidence says not to break the skill down but to take information out of the environment — and that is exactly what this stage is: small court, low net, light ball, three players.",
  tecnica:[
   {n:"Catching above the head",cad:"Starts here · leads to overhead setting in Kids 2",int:"So the hands are where they will need to be once overhead setting arrives.",pts:["Hands above the head, forming a triangle.","Elbows out, not tucked to the body.","The ball is visible between the hands before contact."],frase:"«Hands up before the ball gets there, not after.»",err:"They catch against the chest. That child will play with low hands for years.",arreglo:"Higher, softer balls. If they catch at the chest, raise the ball rather than the volume of the correction."},
   {n:"Two-handed throw from above",cad:"Starts here · becomes the set in Kids 3 and Rookie 1",int:"So the throwing action is the same one that later becomes the set.",pts:["Released from above the head.","Leg extension, not arm extension.","The body faces where the ball is going."],frase:"«Extend your legs, not your arms.»",err:"They throw from the chest, like a basketball pass.",arreglo:"Give them a high target: a hoop, a mark on the wall."},
   {n:"Getting under the ball",cad:"Starts here · underpins all later passing",int:"So the feet move before the hands do.",pts:["Short steps, no crossing the legs.","Arrive and stop before contact.","End up underneath, not beside."],frase:"«You go to the ball, do not reach for it.»",err:"They reach from where they are standing. The universal error of this age.",arreglo:"Games where the ball always lands away from them."},
   {n:"First overhead touch",cad:"Introduced here · developed in Kids 2 and 3",int:"A first feel for the ball with the fingers, without yet asking them to play with it.",pts:["High forehead.","Hands in front of the face.","The ball is visible between the hands."],frase:"«Look at the ball between your hands.»",err:"They contact with the palms together.",arreglo:"Gentle self-passes before any ball arrives from someone else."},
   {n:"Landing well",cad:"Starts here · stays all the way to the first team",int:"So landing is part of how we play rather than a medical obligation.",pts:["Lands on both feet.","Knee in line with the toes.","Absorbs by bending, does not land stiff."],frase:"«We land well.»",err:"They land with the knee collapsing inward. At this age it does not hurt, which is exactly why it gets corrected now.",arreglo:"Drops from a low box, every day, inside the opening game."}],
  tactica:[
   {n:"Sharing the space in 3v3",d:"Two in front, one behind. Understanding that the court is covered together, not one patch each."},
   {n:"Calling for the ball out loud",d:"It is taught here or never. At this age shouting is not yet embarrassing."},
   {n:"Covering the gap left by whoever goes",d:"When one goes for the ball, someone takes their place. The first team idea they understand."},
   {n:"A high ball buys time",d:"If it is ours, it goes high and central. If we send it over, it goes fast and into a gap. The whole playing idea in one sentence."},
   {n:"Returning to position",d:"After every action, back to your place. Without it, 3v3 turns into three children chasing a ball."}],
  sesion:[["15","Opening game: catching, throwing, running, jumping and landing. No lines."],["20","First skill of the block, at maximum volume. Several balls, groups of two or three."],["20","Second skill of the block, inside the game and with a low net."],["25","3v3 game under the rules of the stage. They really play."],["10","Free play and close. You watch and do not correct."]],
  anio:[["August","Form the group. Introduce yourself to the families with the club sheet.","Everyone knows everyone's name."],
   ["September-October","Catching above the head and getting under the ball. These two carry everything else.","Height measured. 8 out of 10 caught with the hands, not the chest."],
   ["November-December","Two-handed throw from above, and landing well. Landing goes into the opening game every day.","Throws 4 metres to a teammate. Lands on two feet without being reminded."],
   ["January","Gentle restart. Back through playing, nothing new.","That they all come back."],
   ["February-March","First overhead touch, without yet demanding they play with it.","Height. Sees the ball between the hands before contact."],
   ["April","Close through playing. Conversation with every family.","The real indicator: how many sign up for next year."]],
  errDT:["Correcting too much. At this age the coach who talks most teaches least.","Forming lines because they are easier to control. The error that destroys the most contacts.","Wanting the skill to look pretty. Form settles by itself; what you protect is that they want to come back."],
  fis:"Coordination, balance and landings in game form. No external loads.",
  men:"That they enjoy it and come back. At this age the following year's registration is the only real indicator.",
  evalu:"Nothing is measured yet apart from height every three months."},

 kv2:{t:"First volleyball contact",sub:"Kids Volley 2 · ages 5 to 10",
  obj:"That the first played contact appears without the game falling apart.",
  porque:"The first played contact arrives and with it the first real frustration: the ball drops. That is why the rules keep the second contact as a catch, and why the coach has to resist demanding three contacts too early. The aim of the stage is for the overhead touch to enter the game without the game collapsing.",
  tecnica:[
   {n:"Overhead touch as the first contact",cad:"Comes from Kids 1 · consolidated in Kids 3",int:"Being able to play the ball coming from the other side without catching it.",pts:["High forehead and hands in front of the face.","Contact above, not at chest height.","Impulse from leg extension."],frase:"«High forehead, hands in front of your face.»",err:"They contact with hands at the chest and the ball goes backwards.",arreglo:"The ball must be visible between the hands before contact. If they cannot see it, the hands are wrong."},
   {n:"Controlled catch and throw",cad:"Comes from Kids 1 · disappears in Rookie 1",int:"Keeping the rally alive while the rest is being learned.",pts:["Catches high and throws high to a teammate.","Does not rush the throw."],frase:"«The second contact saves the rally. Do not rush it.»",err:"They throw fast and flat to get rid of the problem.",arreglo:"Rule: the throw has to clear a high marker."},
   {n:"Underhand serve",cad:"Introduced here · consolidated in Rookie 1",int:"Putting the ball in play with an action they already know: an underarm throw.",pts:["Ball held, not tossed.","The arm swings like a pendulum.","The body goes forward with it."],frase:"«It is the same movement as throwing a ball underarm.»",err:"They toss the ball up first and miss it.",arreglo:"The ball stays in the other hand until the strike."},
   {n:"Lateral movement",cad:"Comes from Kids 1 · leads to passing in Rookie",int:"Arriving balanced, the condition for everything else.",pts:["Short steps without crossing.","Stops before contact."],frase:"«Arrive still.»",err:"They arrive running and play the ball on the move.",arreglo:"A drill where they have to touch the floor before playing."},
   {n:"Landing well",cad:"Comes from Kids 1 · stays forever",int:"Holding the landing now that jumps are appearing.",pts:["Two feet, knee in line.","Absorbs by bending."],frase:"«We land well.»",err:"Knee collapsing inward on landing.",arreglo:"Daily, in the opening block, inside the game."}],
  tactica:[{n:"Roles inside the 3v3",d:"Who goes to the ball and who covers. Sharing responsibility begins."},
   {n:"Playing the second ball to a teammate",d:"The idea of building rather than returning. The seed of the three contacts."},
   {n:"Taking position before the serve",d:"Everyone knows where they stand before the ball comes into play."},
   {n:"Calling before you touch",d:"«Mine» is said before, not during. The communication rule for the whole career."},
   {n:"Following the attacker",d:"Whoever does not touch still moves. Nobody stands and watches."}],
  sesion:[["15","Opening game: coordination, jumps and landings in game form."],["22","First skill of the block, many repetitions with individual correction."],["20","Second skill of the block, in the game with a low net."],["23","3v3 game under the rules of the stage."],["10","Free play and close."]],
  anio:[["August","Reunion and placement. Who is coming up from Kids 1 and who is new.","Group set."],
   ["September-October","Overhead touch as first contact, with plenty of volume inside the game.","Height. Uses the touch in the game, not only in the drill."],
   ["November-December","Underhand serve and lateral movement. The serve is compulsory at this stage.","6 out of 10 serves in court. Arrives still before contact."],
   ["January","Progressive restart. The touch is revisited, nothing new is added.","Nobody lost the skill over the break."],
   ["February-March","Controlled catch and throw, and landing. Refining what is already there.","Height. 10 controlled contacts in a row."],
   ["April","Close and stage decision for next year.","Individual conversation and entry in the player file."]],
  errDT:["Demanding three contacts before the rules ask for them. It breaks the stage.","Giving the technical correction out loud to the whole group. At this age you correct one at a time and quietly.","Cutting the free play at the end because time ran out. That is the part that brings them back."],
  fis:"Jumps and landings in game form. Hand-eye coordination.",
  men:"Cooperation begins: you play with the other, you do not hand them the problem.",
  evalu:"Height every three months."},

 kv3:{t:"Three contacts",sub:"Kids Volley 3 · ages 5 to 10",
  obj:"That the complete rally appears: pass, set, attack.",
  porque:"It is the last stage before catching disappears, and therefore the last safety net. If the child leaves here building three contacts, Rookie 1 will be a transition rather than a jump. If they leave returning the ball first time, they will carry that habit for years, because returning works in the short term.",
  tecnica:[
   {n:"Overhead touch with a target",cad:"Comes from Kids 2 · consolidated in Rookie 1",int:"So the ball arrives somewhere, not just leaves cleanly.",pts:["The torso faces the target before contact.","Enough height for the teammate to have time."],frase:"«Where do you want that ball to arrive?»",err:"Clean contact with no direction: the teammate always has to run.",arreglo:"Physical targets: a hoop, a seated teammate, a marked zone."},
   {n:"Self-pass and standing attack",cad:"Starts here · leads to the jump attack in Rookie 2",int:"The seed of the spike, with the ball under their own control.",pts:["The ball is played forward and up.","Strike with an open hand and a straight arm.","The gap is chosen before the strike."],frase:"«Choose the gap before you hit it.»",err:"They hit without looking where it is going.",arreglo:"Two marked zones, and they call which one before hitting."},
   {n:"Forearm pass as a resource",cad:"Introduced here · becomes passing in Rookie",int:"Solving the low or fast ball that cannot be played overhead.",pts:["Firm platform, arms together.","Body behind the ball.","Impulse from the legs."],frase:"«Low, use your arms; high, use your hands.»",err:"They use the forearm pass for everything because it feels safer.",arreglo:"Rule: the first contact is overhead when the ball comes high."},
   {n:"Underhand serve with direction",cad:"Comes from Kids 2 · consolidated in Rookie 1",int:"So the serve begins to choose where it lands.",pts:["Same action as always.","The body faces the zone.","The zone is called beforehand."],frase:"«Say where it is going before you serve.»",err:"They always serve down the middle.",arreglo:"Two marked zones and points for the called zone."},
   {n:"Landing from the attack",cad:"Comes from Kids 1 · stays forever",int:"Now that there is a strike, the landing becomes the risky action.",pts:["Two feet, knee in line.","Absorbs and is ready for the next ball."],frase:"«You land and you keep playing.»",err:"They land off balance and are out of the rally.",arreglo:"Another ball comes immediately after every attack."}],
  tactica:[{n:"Building over three contacts",d:"The team's aim becomes the rally, not the point. Held by the rule, not by the talk."},
   {n:"Basic coverage",d:"Who follows the attacker. The cheapest collective habit to install and the one that wins the most rallies."},
   {n:"Choosing the gap",d:"Before sending the ball over, look for where nobody is. The beginning of tactical intention."},
   {n:"Occupying space after the serve",d:"Whoever serves returns to their place. The court is covered before the ball comes back."},
   {n:"Talking during the rally",d:"«Mine», «yours», «coming». Three words, always the same ones."}],
  sesion:[["15","Opening game: coordination and landings in game form."],["22","First skill of the block, with a target."],["20","Second skill of the block, with opposition."],["23","3v3 game with the three-contact rule."],["10","Free play and close."]],
  anio:[["August","Form the group and explain the three-contact rule from day one.","They understand the rule, even if they cannot do it yet."],
   ["September-October","Overhead touch with a target. Everything with a physical target: hoop, zone, teammate.","Height. The teammate does not have to run for the set."],
   ["November-December","Self-pass and standing attack, plus the forearm pass as a resource.","Chooses the gap before hitting. Uses the forearm pass when appropriate, unprompted."],
   ["January","Progressive restart playing 3v3.","The three-contact build survived the break."],
   ["February-March","Underhand serve with direction and landing from the attack. The stage closes.","Height. Calls the zone before serving."],
   ["April","Close. This is the move to Rookie: explain what changes.","Most of them build three contacts in free play."]],
  errDT:["Accepting the first-time return when the game gets hard. That is exactly when the rule has to hold.","Training the attack without a preceding pass. Isolated attacking does not transfer.","Leaving the game to the end and running out of time."],
  fis:"Self-pass and standing attack: the striking action appears.",
  men:"Autonomy: they set up and put away equipment with the group.",
  evalu:"Height every three months."}
};
Object.assign(ENSC_EN,{
 r1:{t:"Everything played",sub:"Rookie 1 · ages 11 to 14 · equivalent to U13 in the club guide",
  obj:"That catching disappears and the game remains possible.",
  porque:"Catching disappears and everything is played. It is also the widest entrance door the club has: the rules admit Rookie up to U18, so a fifteen-year-old who has never played can start here without being exposed to peers with six years' head start. The coach will almost certainly have very different levels in the same group, and that is normal rather than a fault to be fixed.",
  tecnica:[
   {n:"Serve receive with the forearm pass",cad:"Comes from Kids 3 · developed in Rookie 2 and 3",int:"Keeping the rally alive when the serve arrives.",pts:["Platform formed before the ball arrives.","Body behind it, not beside it.","The shoulders direct the ball, not the arms."],frase:"«Take the platform to the ball, not the ball to the platform.»",err:"They correct with the arms because they arrived late with the feet.",arreglo:"Always with movement. Never passing from a standing start."},
   {n:"Overhead set to build",cad:"Comes from Kids 3 · leads to setter penetration in Rookie 2",int:"Giving a teammate a ball they can attack.",pts:["Enough height and distance from the net.","The torso faces the attacker."],frase:"«The torso is the compass.»",err:"They set tight to the net and the attacker cannot approach.",arreglo:"Mark the minimum distance on the floor."},
   {n:"Standing attack with direction",cad:"Comes from Kids 3 · consolidated here",int:"Choosing where the ball goes before striking it.",pts:["Open hand and straight arm.","Contact in front of the body.","The direction is chosen beforehand."],frase:"«Which gap did you hit?»",err:"They hit hard down the middle.",arreglo:"Marked zones and double points for the chosen zone."},
   {n:"Jump attack",cad:"Introduced here · developed in Rookie 2 and 3",int:"Starting to attack above the net.",pts:["Approach with rhythm, even two steps at first.","Arm swing before take-off.","Contact high and in front."],frase:"«Jump well first, hit hard later.»",err:"They jump and strike with a bent arm.",arreglo:"Attack from a low box to isolate the arm."},
   {n:"Floor defence",cad:"Introduced here · developed through to Future 1",int:"So the difficult ball is dug with the body in position.",pts:["Low stance, weight forward.","Hands out and in front of the body.","Arrives in position, not stretched."],frase:"«You defend with your legs, not your arms.»",err:"They dive before trying to get there.",arreglo:"Have them arrive walking first: falling is added much later."}],
  tactica:[{n:"Building over three contacts",d:"The bonus-point rule for four attacks into the opponent's court already rewards exactly this. Use the rule from the regulations instead of inventing one."},
   {n:"Roles in the 3v3",d:"Who passes, who sets, who attacks, and that it changes every rotation."},
   {n:"Covering your own attacker",d:"Introduced here: when one attacks, the others follow. It stays compulsory for the rest of their career."},
   {n:"Reading the first contact",d:"The attacker starts on what they see in the pass, not once the setter has touched the ball."},
   {n:"Occupying space",d:"With three on court, each has a zone and a responsibility when returning to it."}],
  sesion:[["18","Prevention block and coordination. Landings, decelerations and changes of direction."],["20","First skill of the block, whole, at maximum contact density."],["18","Second skill of the block, inside the full rally."],["20","Small-sided game with a rule that forces the skill of the block."],["12","Game with a score."],["2","Close: one idea, spoken by a player."]],
  anio:[["August","Place them by level. You will have wide differences: build two courts with different rules.","Group placed, nobody levelled down."],
   ["September-October","Serve receive and overhead set to build. These two are the basis of everything that follows.","October measurement. Keeps the rally alive on most receptions."],
   ["November-December","Standing attack with direction and jump attack. The jump arrives.","Chooses a direction and executes it. Jumps without losing rhythm."],
   ["January","Progressive restart. Load does not jump straight back.","Nobody with complaints on returning."],
   ["February-March","Floor defence. And review of the level placement: who moves up.","March measurement against October. Arrives in position to dig."],
   ["April","Close and stage decision.","Most of them reach three contacts consistently."]],
  errDT:["Treating the late starter as though they were behind. They are the main audience for this stage.","Levelling down when the differences are wide. Two courts with two rules solve what one court cannot.","Explaining the technique instead of changing the rule of the game."],
  fis:"Already structured prevention block: landings, decelerations and changes of direction.",
  men:"The ideal entry point for anyone arriving late to volleyball. Nobody should feel behind.",
  evalu:"First full measurement in October and comparison in March."},

 r2:{t:"Penetration appears",sub:"Rookie 2 · ages 11 to 14 · equivalent to U13 in the club guide",
  obj:"Installing setter penetration from position 1, the mechanism the rest of the Swiss system rests on.",
  porque:"This is the hinge stage of the whole pathway and the coach should know it before starting. What is learned here — that the setter comes in from the back and that who sets changes every rotation — is literally the mechanism of the 6-6 in Future 1, the 6-2 in Future 2 and the 5-1 in Future 3. A player who leaves Rookie 2 without penetration drags the problem through three stages. It is also the moment when most of them enter the growth spurt, so you are teaching a new and difficult skill exactly when the body is least coordinated. Together, those two things explain why this stage demands more patience than any other.",
  tecnica:[
   {n:"Penetration from position 1",cad:"Starts here · it is the mechanism of the 6-6, the 6-2 and the 5-1",int:"So the back-court player reaches the net in time to set, without being seen before the serve.",pts:["Leaves as the opposing serve crosses the net, not once the pass is already away.","Straight route into zone 2-3, not diagonally towards the ball.","Arrives and brakes before contact: the last step is a braking step.","Shoulders already facing zone 4 on arrival."],frase:"«Leave earlier, do not run faster.»",err:"They leave late and compensate by sprinting. They reach the ball but arrive moving, and the set comes out long or short. The problem is not in the hands: it is in the moment they leave.",arreglo:"Train the route without a ball, timed against the serve. Ten departures in a row, watching only the feet."},
   {n:"Overhead setting on the move",cad:"Comes from Rookie 1 · consolidated in Future 1",int:"Setting well even while the body is still arriving, which is what will happen nearly every time.",pts:["High forehead and hands in front of the face before the last step.","Impulse from the legs, not the arms.","The torso faces the target of the set."],frase:"«The torso is the compass.»",err:"They set with the arms because they arrive without legs. You can see it in the flat trajectory.",arreglo:"Drills where the player always receives the ball while moving. Never set from standing at this stage."},
   {n:"Serve receive with two passers",cad:"Comes from Rookie 1 · leads to the three passers in Rookie 3",int:"Covering the width of the 4v4 court between two, without colliding and without leaving the middle open.",pts:["Each covers their half; the middle ball belongs to whoever moves inward.","Called before the touch, not during.","Platform aimed at the target, not at the serve."],frase:"«Whoever moves inward takes it. The other calls and clears.»",err:"Both go, or neither goes. It is an agreement problem, not a technical one.",arreglo:"The rule is agreed before the drill and applied without exception all season."},
   {n:"Jump attack",cad:"Comes from Rookie 1 · consolidated in Rookie 3",int:"Moving from the standing attack to the jump attack, which the rules of this stage reward with a bonus point.",pts:["Three-step approach with the same rhythm every time.","Arm swing before take-off.","Contact high and in front, arm extended.","Landing on both feet with the knee aligned."],frase:"«Three steps, always the same ones.»",err:"Two-step approach and contact behind the head. The most common error of the stage and the one that limits them most later.",arreglo:"Approach without a ball first, with a floor mark for the braking step."},
   {n:"Forearm pass as a set",cad:"Comes from Kids 3 · stays forever",int:"Solving the second contact when the pass does not reach the setter, which in 4v4 happens constantly.",pts:["Firm platform angled towards the attacker.","Impulse from the legs; the platform does not swing.","A target is chosen before contact."],frase:"«If you cannot get there with your hands, you set with your arms. But you set.»",err:"They send the ball back over when the pass goes wrong. The third contact is lost.",arreglo:"Rule in the game: if the team does not reach three contacts, the point does not count."}],
  tactica:[{n:"Who sets and who attacks in each rotation",d:"With four players everyone sets at some point. Before the serve it has to be clear who penetrates in that rotation and who stays as attacker. Said out loud until it becomes automatic."},
   {n:"Covering your own attacker",d:"When one attacks, the other three follow at two metres, low and with open hands. The cheapest collective habit and the one that wins the most long rallies at this stage."},
   {n:"Reading the first contact",d:"The attacker starts on what they see in the pass. If they wait for the set, they are late to everything."},
   {n:"Occupying space in 4v4",d:"Two front and two back, and whoever penetrates leaves a gap someone has to cover."},
   {n:"The 4v4 system with penetration",d:"Understanding that exchange is the beginning of thinking in systems."}],
  sesion:[["20","Prevention block. Landings and eccentric strength: many are in the growth spurt."],["20","First skill of the block, whole and at maximum contact density."],["18","Second skill of the block, inside the full rally."],["18","Small-sided 4v4 with penetration enforced."],["12","Game with a score."],["2","Close: one idea, spoken by a player."]],
  anio:[["August","Explain what penetration is and why it matters three stages ahead. Measure everyone: you will have children in the growth spurt.","They know what they are training for."],
   ["September-October","Penetration from position 1. Absolute priority and the largest volume of the year.","October measurement. Leaves on time and arrives still on most good passes."],
   ["November-December","Overhead setting on the move and serve receive with two passers. Penetration stays in every session.","They split the court without colliding. They set while arriving, not from standing."],
   ["January","Progressive restart, and watch those who grew over the break. Re-measure height in January.","Staggered load. Nobody with persistent knee pain."],
   ["February-March","Jump attack and forearm pass as a set. The stage's repertoire closes.","March measurement. Uses the jump attack in the game, not only in drills."],
   ["April","Close. Who moves to Rookie 3 and who repeats the stage — by level, not by age.","Penetration working: that is the condition for moving up."]],
  errDT:["Correcting the hands on the set when the problem is the moment of departure. Look at the feet before the hands.","Raising jump volume during the growth spurt because «we should make the most of it». It is the opposite: it comes down.","Losing patience with the temporary clumsiness. It is predictable and it passes, provided you do not punish it."],
  fis:"Most of them enter the growth spurt here. Landings and eccentric strength are the priority, and jump volume <strong>goes down</strong> rather than up. Coordination will fall apart temporarily and predictably: hold the technique, do not demand more. Height every three months.",
  men:"Shared responsibility appears: with four on court nobody hides and everyone sets at some point. It is also the age when drop-out begins, so the session always ends by playing.",
  evalu:"October and March measurements, and height every three months, because here the growth spurt governs the load."},

 r3:{t:"The full court",sub:"Rookie 3 · ages 11 to 14 · between U13 and U15 in the guide",
  obj:"The jump to the full court, and the first stage played with genders separated.",
  porque:"It is the jump to the full court and the first stage separated by gender, so it is where the two branches genuinely start to need different things. It is also the age at which regional identification pays off most: a player who arrives well at Rookie 3 is a real candidate for the Talentpool. And on the women's side it is the window in which neuromuscular work genuinely protects — above eighteen it no longer does.",
  tecnica:[
   {n:"Overhand serve from the baseline",cad:"Starts here · developed in Future 1 and leads to the jump serve in Future 2",int:"So the serve opens the rally in our favour rather than being a formality.",pts:["Consistent toss in front.","Contact high with a straight arm.","The body goes forward with it."],frase:"«The serve opens the rally in our favour or it does not open it at all.»",err:"They serve softly to avoid errors and hand over the initiative.",arreglo:"Agree an acceptable error rate before the series. Without it, everyone serves soft."},
   {n:"Three-step approach",cad:"Comes from the jump attack in Rookie 2 · consolidated in Future 1",int:"The rhythm of the attack, which is what falls apart during the growth spurt.",pts:["Always the same rhythm: orient, brake, close.","Lowering the centre of gravity and the arm swing.","Contact high and in front."],frase:"«Three steps, always the same ones.»",err:"Two-step approach and contact behind the head.",arreglo:"Floor mark for the braking step, and approach without a ball first."},
   {n:"Technical block",cad:"Starts here · developed in Future 1 and leads to the reading block in Future 2",int:"Appearing over the net with the hands and arriving formed.",pts:["Hands penetrating, thumbs up.","Vertical jump, not forward.","The footwork finishes before the jump."],frase:"«The block jump goes up, not forward.»",err:"They jump forward and touch the net.",arreglo:"Block from a bench first, to isolate the hands from the footwork."},
   {n:"Serve receive with three passers",cad:"Comes from the two passers in Rookie 2 · the formation for the rest of their career",int:"Sharing the width of the full court between three.",pts:["Each covers their zone, called before the touch.","The middle ball belongs to whoever moves inward.","The platform aims at the setter, not at the serve."],frase:"«Whoever moves inward takes it.»",err:"Two go, or nobody goes.",arreglo:"The rule is agreed beforehand and not changed all season."},

 f1:{t:"Everyone does everything",sub:"Future 1 · ages 15 to 17 · equivalent to U15 in the club guide",

   {n:"Receiving the overhand serve",cad:"Comes from Rookie 3 · consolidated here",int:"Holding the reception against a real match serve.",pts:["Platform formed early.","Body behind the ball.","Shoulders direct it to the setter."],frase:"«You train with Saturday's serve, not an easier one.»",err:"The coach lowers the serve intensity so the drill looks better.",arreglo:"Never. Hold the intensity and lower a different variable if you need to."},

   {n:"Defending without a libero",cad:"Comes from Rookie 3 · consolidated here and never trained this way again",int:"So all six defend, including those who will later specialise.",pts:["All in base position.","Nobody comes off for their height.","Transition into the counter-attack."],frase:"«Nobody leaves the court because of their height.»",err:"The middles drift out of the back court out of habit.",arreglo:"The rules of this stage do not allow a libero: use that as the argument."}],

ENSC.gen.bloques.push(
 {h:"Doble chequeo: dónde coinciden las tres escuelas y dónde no",
  p:"La secuencia de esta guía se contrastó contra el <strong>Manual de Entrenadores Nivel I de la FIVB</strong>, la federación internacional, con capítulos de Doug Beal —oro olímpico 1984 y luego director ejecutivo de USA Volleyball—, Yuri Chesnokov, el profesor Hiroshi Toyoda de la Comisión Técnica y Yasutaka Matsudaira. Hay coincidencias muy fuertes y hay tres desacuerdos que conviene conocer en vez de tapar.",
  f:"Cuando dos autoridades no coinciden, el documento lo dice. Esconderlo sería el verdadero error."},
 {h:"En qué coinciden las tres, sin fisuras",
  p:"Que se enseña con <strong>juegos reducidos desde el primer día</strong> — la FIVB manda 2:2, 3:3 y 4:4 en cancha chica y lo llama juegos de iniciación. Que <strong>nadie mira</strong>: dice textualmente que no hay mejora en los jugadores que solo observan o están sentados, y que hay que dar oportunidades iguales de participar. Que el <strong>proceso vale más que el resultado</strong>: no buscar solo victorias, porque el esfuerzo en el entrenamiento importa más que el resultado de la competencia. Y que el <strong>bloqueo va último</strong>, después de la recepción de ataque y la recepción de saque. Nuestro modelo lo ubica en Rookie 3 y coincide.",
  f:"Tres cuerpos independientes llegando a lo mismo. Eso ya no es opinión."},
 {h:"Desacuerdo 1 — el orden de la manchette y el toque de dedos",
  p:"Es el más concreto y nos toca de lleno. La FIVB enseña <strong>primero la manchette</strong> —semanas 3 a 5 de su plan— y el toque de arriba recién en las semanas 8 a 10. El sistema suizo, y nuestra guía con él, hace lo contrario: primero atrapar y lanzar, después el toque de arriba, y la manchette aparece como recurso en Kids Volley 3. Los dos órdenes están defendidos por autoridades reales. Nosotros seguimos el suizo porque es el que rige la competencia del club, pero el entrenador tiene que saber que no es la única secuencia válida.",
  f:"Si un chico no engancha con el toque de arriba, probá la manchette antes. La FIVB dice que ese es el orden natural."},
 {h:"Desacuerdo 2 — especializar temprano o no",
  p:"Beal escribe que la especialización acorta el camino al éxito, y que un equipo se desarrolla más rápido concentrándose en pocos elementos en vez de construir una base amplia. Pero agrega la condición completa: <strong>es peligroso, porque dependés de un conjunto estrecho de habilidades en vez de una base amplia</strong>. Es la respuesta directa a la pregunta de si se pueden acortar pasos: sí se puede, y el precio es un jugador más frágil. El sistema suizo eligió lo contrario en Future 1 —sin líbero, todos arman— y nuestro modelo también.",
  f:"El atajo existe y tiene nombre: especializar. Sabé lo que estás pagando antes de tomarlo."},
 {h:"Desacuerdo 3 — el manual de la FIVB enseña por partes",
  p:"Las progresiones del manual van «movimiento de brazo, después carrera, después despegue, después saltar y atrapar, después saltar y golpear». Eso es exactamente la enseñanza por partes que la revisión de aprendizaje motor no encontró respaldada en ningún estudio. El manual de la FIVB es de 2013 y en método quedó atrás de la escuela americana de McGown. <strong>Nuestra posición: tomamos de la FIVB el orden de los contenidos y de McGown el método para enseñarlos.</strong>",
  f:"Qué enseñar y cuándo: FIVB y Swiss Volley. Cómo enseñarlo: aprendizaje motor."},
 {h:"Lo que sí se puede acortar",
  p:"No se acorta la maduración: un chico en pico de crecimiento no se apura. Lo que sí se elimina es el desperdicio, y ahí hay mucho. <strong>Contactos por jugador</strong> en vez de filas. <strong>Jugada entera</strong> en vez de gesto aislado que no transfiere. <strong>Aleatorio</strong> en vez de repetir veinte veces lo mismo, que se ve mejor y rinde peor. <strong>Una regla</strong> en vez de una explicación. Y la <strong>medición de octubre y marzo</strong>, que evita el año perdido en decidir a ojo. Un club que hace estas cinco cosas no acelera al jugador: deja de frenarlo.",
  f:"El atajo real no es entrenar más rápido. Es dejar de perder el sesenta por ciento del entrenamiento."});

RECURSOS.push({g:"Federación Internacional · la autoridad máxima", l:[
 {t:"FIVB — Manual de Entrenadores Nivel I (PDF completo)", u:"https://www.vq.org.au/wp-content/uploads/2018/03/FIVB-Level-1-Coaches-Manual-2013.pdf", d:"El manual oficial de la federación internacional. Capítulos de Doug Beal, Yuri Chesnokov, el profesor Hiroshi Toyoda y Philippe Blain. Trae el plan de contenidos semana por semana para principiantes: 22 semanas, dos días por semana, dos horas por día. Es la referencia contra la que contrastamos nuestra secuencia."},

ENSC.gen.bloques.push(
 {h:"La escuela italiana: el entrenador es un maestro",
  p:"Julio Velasco estudió filosofía y quería ser profesor de secundaria. Dejó la carrera a seis materias del título, y después llevó a Italia a ser la selección votada como equipo del siglo, dirigió las selecciones juveniles masculinas de la federación italiana desde 2019, y ganó el oro olímpico en París 2024 y el mundial de 2025 con la selección femenina. Al día siguiente del oro explicó su método en una frase: <strong>todo entrenador tiene que ser un maestro, olvidándose por completo de que fue jugador.</strong> Esa frase es la premisa de esta solapa entera.",
  f:"Si tu manera de explicar depende de cómo lo hacías vos cuando jugabas, todavía no estás enseñando."},
 {h:"La teoría de los alibis, y la regla que sale de ella",
  p:"Es la idea más aplicable de todo el material que revisamos. Velasco la describe así: el atacante falla un remate y culpa al armador; el armador acusa al receptor; y así sucesivamente. Nadie se hace cargo. Su regla contra eso es de una sola línea y se puede instalar mañana: <strong>los atacantes no hablan del pase de ninguna manera, lo resuelven.</strong> Y el principio detrás: atribuir a otros la responsabilidad de nuestros fracasos es el camino más seguro hacia la mediocridad. Dejar de buscar culpables y empezar a buscar soluciones.",
  f:"Regla del club, desde Rookie 3: nadie comenta la pelota que recibió. La resuelve."},
 {h:"El error no se demoniza",
  p:"Velasco fue precursor de lo que hoy se llama resiliencia: el error no se teme ni se castiga, se entiende y se convierte en ocasión de aprendizaje. Es exactamente nuestro principio de identidad número 05 —el error agresivo se banca, el pasivo no— y ahora tiene detrás al entrenador más ganador de la historia del vóley europeo, no solo nuestro criterio.",
  f:"El resultado del ejercicio no es el punto. Es la decisión."},
 {h:"Y una frase que corrige nuestra sección de carga",
  p:"Sobre la gestión de la energía de las atletas, Velasco es tajante: <strong>el descanso principal de un atleta no es muscular, es del sistema nervioso y mental.</strong> Nuestra ficha de carga individual cuenta horas, saltos y competencias, que son carga física. Le falta la otra mitad. Sobre los juveniles fue todavía más directo: un chico de formativas hace una vida más dura que un profesional, porque va a la escuela, cursa, a veces toma clases de idioma y después entrena, y entrena o juega siete días sobre siete. Y remató: <em>dejémoslos respirar un momento y vamos a ver que van a tener más ganas de entrenar y de mejorar.</em>",
  f:"Los dos días libres de la semana no son una concesión. Son entrenamiento del sistema nervioso."},
 {h:"Comparación final de las cuatro escuelas",
  p:"<strong>Suiza</strong> aporta la estructura: qué se compite en cada etapa y cómo se clasifica por nivel y no por edad. <strong>Estados Unidos</strong> aporta el método: gesto entero, aleatorio, densidad de contactos y evidencia de aprendizaje motor. <strong>La FIVB</strong> aporta el orden de los contenidos y el estándar mundial de formación de entrenadores. <strong>Italia</strong> aporta lo que a las otras tres les falta: la cultura. El entrenador como maestro, la responsabilidad sin alibis, el error como material de trabajo y el descanso mental como parte del plan. Las cuatro juntas son este documento.",
  f:"Estructura suiza, método americano, secuencia FIVB, cultura italiana."});

ENSC.u20 = {
 t:"U20: tres etapas en una cancha", sub:"Instructivo especial · para el grupo que mezcla Future 1, 2 y 3 más jugadores de mayores",
