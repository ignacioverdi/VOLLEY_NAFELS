rama:{
 m:{intro:"In dieser Sparte durchläuft die Mehrheit den Wachstumsschub während Rookie 2 und 3. In dieser Zeit gerät die Koordination vorübergehend und vorhersehbar durcheinander, und die Patellasehne arbeitet nahe an ihrer Toleranzgrenze. Die richtige Antwort ist nicht, mehr zu fordern: Es geht darum, die Technik zu halten und das Knie zu schützen, während sich der Körper neu ordnet.",
    fis:"Fokus auf Landungskontrolle und exzentrische Kraft während des Schubs, Kraftfenster ab Future 1. Die Toleranz gegenüber Unbeholfenheit gehört zur Methode, sie ist kein Zugeständnis.",
    nota:"<strong>Sechs Aktivmannschaften.</strong> Bei den Männern stellt der Verein NLA, 1., 2., 2. B, 3. und 4. Liga sowie Mannschaften U20, U18, U16 und U14. Das ist eine dichte Leiter: Für jedes reale Niveau gibt es eine Stufe, und man kann Schritt für Schritt aufsteigen statt zu springen. Der grösste Vorteil des Vereins und zugleich sein grösstes Überlastungsrisiko — siehe Wettkampf und individuelles Belastungsblatt.",
    red:"Die Netzhöhe der Männer steigt auf jeder Future-Stufe: 2,24 m, 2,30 m und 2,35 m. Die Reichweiten-Standards müssen dieser Progression folgen."},
 f:{intro:"In dieser Sparte hat die Mehrheit den Wachstumsschub bei Erreichen von Rookie 3 bereits hinter sich, und das Kraftfenster öffnet sich früher. Es ist zugleich der Abschnitt mit dem höchsten Kreuzbandrisiko der gesamten Ausbildung, mit einem entscheidenden Befund: Die Schutzwirkung neuromuskulären Trainings ist zwischen 14 und 18 Jahren am stärksten und verschwindet über 18. Was hier nicht gemacht wird, lässt sich später nicht nachholen.",
    fis:"Neuromuskuläres Programm auf allen Stufen verbindlich und durchgehend: Landung nach dem Angriff mit ausgerichtetem Knie, Abbremsen und Richtungswechsel, ischiocrurale Muskulatur und Hüfte. Es schützt nicht nur das Knie, es verbessert auch die Sprunghöhe — es ist keine Steuer auf die Hallenzeit.",
    nota:"<strong>Die Spitze bei den Frauen ist die 1. Liga, und der Weg funktioniert bereits.</strong> Die Frauensparte stellt U14 und zwei U16 sowie drei Aktivmannschaften: 4., 3. und 1. Liga. Da es keine U18 und U20 gibt, übernehmen die 4. und die 3. Liga diese Funktion: Sie sind die reale Brücke zwischen Nachwuchs und erster Mannschaft. Der Beweis steht im Kader der 1. Liga, in dem bereits Spielerinnen der Jahrgänge 2008 und 2009 stehen.",
    red:"Die Netzhöhe der Frauen bleibt auf allen drei Future-Stufen bei 2,18 m. Die Progression kommt also nicht vom Netz, sondern vom Spielniveau: Die Standards müssen etwas anderes messen."},
 mixto:"Bis und mit Rookie 2 wird ohne Geschlechtertrennung gespielt. Die beiden Sparten dieses Dokuments teilen auf diesen Stufen die technischen und taktischen Inhalte; unterschiedlich ist von Anfang an die Athletik, denn die Reifung wartet nicht auf das Reglement."
},
comp:{
 eyebrow:"Wo wer spielt",
 titulo:"Wettkampf",
 intro:"Swiss Volley hat den Nachwuchswettkampf mit dem Projekt Smart Competitions neu geordnet, und der Wandel ist tiefgreifend: Das Spielniveau wird weitgehend vom kalendarischen Alter entkoppelt. Das zu verstehen ist das, was den Verein davor bewahrt, aus dem System zu fallen.",
 verif:"<strong>Wo wir heute stehen, überprüft.</strong> Die Region <strong>GSGL ist noch nicht auf Smart Competitions umgestellt</strong>: Sie organisiert ihre Turniere nach Alterskategorien in beiden Geschlechtern, mit Kids Volley in drei Niveaus und Jugendspielrunden im Format 6-6, auf Basis des regionalen Nachwuchskonzepts von 2019. Vereine können sich für die ganze Meisterschaft oder nur für einzelne Turniere anmelden. Deshalb heissen unsere Mannschaften U14, U16, U18 und U20: Das ist die in der Region gültige Bezeichnung. Gleichzeitig hat Swiss Volley die <strong>definitive Einführung der Smart Competitions für alle Regionen ab 2028/29</strong> beschlossen, und das Projekt läuft in den vorangehenden Regionen als Pilot. Dieses Dokument beschreibt beides mit Absicht: Gespielt wird heute nach den Kategorien der GSGL, die technischen Inhalte sind bereits nach Kids, Rookie und Future aufgebaut — dorthin geht das gesamte System. <span class=\"dato\">[Jede Saison prüfen, ob die GSGL den Pilot öffnet]</span>",
 b1:"Was sich geändert hat",
 p1:[["Eingeteilt wird nach Niveau, nicht nach Alter","Es gibt nur Richtalter. Die Haupteinteilung erfolgt nach dem Spielniveau der Person und der Mannschaft, und die Trainerin meldet die Mannschaft über eine Selbsteinschätzung mit einem Instrument des Verbands an."],
     ["Im Breitensport gibt es keine Meisterschaft mehr","Es werden einzelne Halbtagesturniere über das Jahr verteilt organisiert. Eine Mannschaft verpflichtet sich für ein Turnier, nicht für eine ganze Saison, und kann zwischen den Turnieren die Stufe wechseln."],
     ["Resultate werden nicht publiziert","Sie haben keine Konsequenzen für die folgenden Turniere. Der Fokus liegt erklärtermassen auf dem Prozess und nicht auf dem Ergebnis."],
     ["Die Mannschaften pfeifen selbst","Im Kids Volley gibt es keine Schiedsrichter. In Rookie und Future wechseln sich die spielenden Mannschaften ab."],
     ["Alle spielen","Es gibt Mindestspielzeiten und eine Höchstzahl pro Mannschaft. In Future maximal elf Personen, alle mit ähnlicher Spielzeit."],
     ["Näfels ist genau die Zielgruppe dieses Systems","Smart Competitions richtet sich an Kinder und Jugendliche vom Kids-Volley-Alter bis U18, die ein- bis zweimal pro Woche trainieren. Das ist die wörtliche Beschreibung unserer Gruppen. Es ist kein System für einen anderen Vereinstyp: Es ist für diesen gedacht."],
     ["Definitive Einführung 2028/29","Swiss Volley hat die definitive Einführung der Smart Competitions für alle Regionen ab der Saison 2028/29 beschlossen. Bis dahin geht jede Region ihr eigenes Tempo. Auf dieser Struktur aufzubauen ist keine Wette, sondern ein Vorsprung."],
     ["Das Höchstalter ist nicht das Zielalter","Jede Kategorie hat ein Kernalter und eine deutlich höher liegende Zulassungsgrenze: Kids bis U14, Rookie bis U18 und Future bis U23. Dieser Spielraum existiert für Späteinsteigende. Wer mit sechzehn erst anfängt, spielt Rookie und nicht Future — und das ist kein Rückschritt, sondern das passende Niveau."]],
 b2:"Der parallele Weg für alle, die mehr trainieren",
 p2:"Für alle, die dreimal pro Woche oder häufiger trainieren, bleibt ein ergebnisorientierter Wettkampfweg nach Altersklassen bestehen: die <strong>Youth Volley Days</strong> an vier Wochenenden pro Jahr und die <strong>Nachwuchs-Schweizermeisterschaft</strong>. Beide sind in U14, U16 und U18 gegliedert. Die Kategorien U19/U20 und U23 bestehen weiter, ebenso die regionalen und nationalen Ligen.",
 p2b:"Der Zugang zur Schweizermeisterschaft führt über regionale Qualifikationsturniere, und jeder Verein kann pro Kategorie eine Mannschaft melden.",
 b3:"Was das für Näfels bedeutet",
 p3:[["Zwei Wege, nicht einer","Der grösste Teil des Vereins spielt in Kids, Rookie und Future nach Niveau. Wer dreimal pro Woche oder mehr trainiert, kommt mit den Youth Volley Days und der Qualifikation zur Schweizermeisterschaft dazu. Wer welchen Weg geht, muss ausdrücklich entschieden werden."],
     ["Die Einteilung nach Niveau ist ein fachlicher Entscheid","Eine Mannschaft auf die richtige Stufe zu setzen liegt in der Verantwortung der Trainerin und kann danebengehen. Eine falsch eingeteilte Mannschaft spielt eine ganze Saison unausgeglichene Spiele — genau das, was das System verhindern will."],
     ["Flexibilität, die man nutzen sollte","Zwischen Turnieren die Stufe wechseln zu können ist ein Werkzeug: Wer während der Saison wächst, steigt auf; wer zu kurz gegriffen hat, steigt ohne Drama ab."],
     ["Die grösste Eintrittstür, die wir je hatten","Die hohe Zulassungsgrenze macht Rookie zum natürlichen Weg für alle, die spät zum Volleyball kommen, bis siebzehn. Der Verein kann diese Jugendlichen gezielt ansprechen, ohne ihnen versprechen zu müssen, gegen Gleichaltrige mit sechs Jahren Vorsprung anzutreten. Ein Rekrutierungsargument, das es vorher nicht gab."]],
 nota:"<strong>Noch zu bestätigen.</strong> Das Projekt wird phasenweise, Region für Region, eingeführt. Dieses Dokument ist auf der Zielstruktur geschrieben, auf die das gesamte Schweizer System zuläuft.",
 b4:"Die Wettkampfleiter des Vereins",
 b4p:"Das ist die reale Struktur des Vereins, Mannschaft für Mannschaft überprüft. Näfels hat keine Leiter, Näfels hat <strong>neun Aktivmannschaften</strong>, sechs bei den Männern und drei bei den Frauen, dazu sieben Nachwuchsmannschaften. Wer im Nachwuchs spielt, kann parallel in einer Aktivmannschaft spielen. Das ist keine administrative Ausnahme: Es ist die zweite Entwicklungsachse und muss geplant werden.",
 b4p2:"Es ist genau das Modell, das Italien mit Club Italia institutionalisiert hat — Jugendliche entwickeln, indem sie gegen Erwachsene spielen statt nur gegen Gleichaltrige — mit dem Unterschied, dass es hier nicht aufgebaut werden muss: Es existiert bereits. Es fehlt nur die Planung statt der Zufälligkeit.",
 ligas:[
  {t:"4. Liga",s:"Erster Kontakt mit dem Aktivvolleyball · in beiden Sparten vorhanden",c:"#FA844E",
   d:"Die Einstiegsstufe. Die Jugendlichen treffen auf Erwachsene, auf wöchentliche Spiele und auf einen Rhythmus, der nicht dem eines Halbtagesturniers entspricht. Bei den Frauen übernimmt sie zusätzlich die Funktion, die bei den Männern U18 und U20 abdecken: Sie ist das natürliche Ziel nach U16."},
  {t:"3. Liga",s:"Regelmässiger Wettkampf · in beiden Sparten vorhanden",c:"#EE4655",
   d:"Zweite Stufe. Man ist nicht mehr die Ergänzung, sondern trägt Verantwortung für das Ergebnis. Hier zeigt sich, ob das technische Niveau gegen erwachsene Gegnerinnen hält."},
  {t:"2. Liga und 2. Liga B",s:"Nur Männer · zwei Mannschaften",c:"#C93F60",
   d:"Zwei Mannschaften auf derselben Stufe zu haben ist ein enormer organisatorischer Vorteil: Jeder Spieler kann dort eingeteilt werden, wo er hingehört, ohne dass jemand ohne Spielzeit bleibt. Der Abschnitt mit dem meisten verfügbaren Platz der gesamten Männerstruktur."},
  {t:"1. Liga",s:"Vorstufe zum Profibereich · Spitze der Frauensparte",c:"#8E3374",
   d:"Hohes Wettkampfniveau und Belastung auf Aktivniveau. Für einen Spieler auf Future 3 die bestmögliche Vorbereitung; für eine Spielerin ist es das Ziel, denn die erste Frauenmannschaft spielt hier. Die gesamte Frauensparte zielt auf dieses Feld."},
  {t:"NLA",s:"Das Ziel der Männersparte",c:"#0E2A8A",
   d:"Die Spitze der Pyramide, in derselben Halle. Ein Kind aus dem Kids Volley muss sie spielen sehen, und ein Spieler auf Future 3 muss mit ihnen trainieren können, sobald er so weit ist."}],
 bE:"Die Mannschaften des Vereins",
 bEp:"Aktive und Nachwuchs zusammengezählt stellt der Verein sechzehn lizenzierte Mannschaften, dazu die Männerriege und das Kids-Volley-Programm. Das ist die Landkarte, auf der die Nachwuchskoordination arbeitet.",
 bEth:["Sparte","Aktive","Nachwuchs"],
 bEf:[["Männer","NLA · 1. Liga · 2. Liga · 2. Liga B · 3. Liga · 4. Liga","U20 · U18 · U16 · U14"],
      ["Frauen","1. Liga · 3. Liga · 4. Liga","U16-1 · U16-2 · U14"]],
 bEn:"<strong>Drei Erkenntnisse aus dieser Tabelle, die das Projekt verändern.</strong> Erstens: Mit sechs Aktivmannschaften bei den Männern gibt es für jedes reale Niveau eine Stufe, von der 4. Liga bis zur NLA — eine dichte und seltene Leiter. Zweitens: Bei den Frauen gibt es keine U18 und U20, weshalb die <strong>4. und die 3. Liga diese Funktion übernehmen</strong>; das ist keine Lücke, sondern eine Brücke, die bereits funktioniert und die man als solche benennen sollte. Drittens: Im Kader der 1. Liga der Frauen stehen Spielerinnen der Jahrgänge 2008 und 2009, also Juniorinnen in der ersten Mannschaft. Die zweite Achse ist kein Vorschlag dieses Dokuments: Sie existiert und wird bereits genutzt.",
 bEd:"<span class=\"dato\">[Kids Volley: Anzahl Gruppen und Kinder — zu ergänzen]</span> Der Verein hat ein Kids-Volley-Programm und eine Volleyballschule mit Unterstützung der Kantonalbank, was in der Liste der lizenzierten Mannschaften nicht erscheint.",
 b5:"Wo jede Stufe spielt",
 b5p:"<strong>Alle Stufen spielen Wettkämpfe.</strong> Jede hat ihren eigenen Kreislauf, und einige können zusätzlich eine Aktivmannschaft dazunehmen. Das sind zwei verschiedene Spalten und sie sollten nicht verwechselt werden: Die erste ist das, was der Person aufgrund ihrer Stufe zusteht; die zweite ist eine Ergänzung, über die der Verein entscheidet.",
 b5th:["Ausbildungsstufe","Eigener Wettkampf","Aktivliga","Herkunft des Ligakriteriums"],
 b5f:[["Kids Volley 1-2-3","Regionale Kids-Volley-Spieltage und Mobiliar Kids Volley Days, offen für alle Niveaus ohne Qualifikation","Keine",1,"In der Alterskategorie U14 und jünger besteht keine Spielberechtigung in Aktivmannschaften"],
      ["Rookie 1-2","Turniere der Smart Competitions · regionale Nachwuchsmeisterschaft · Schweizermeisterschaft U14","Keine",2,"Reglement nach Alter, dazu ein Ausbildungskriterium für alle, die U14 bereits hinter sich haben"],
      ["Rookie 3","Turniere der Smart Competitions · regionale Meisterschaft · Schweizermeisterschaft U14 oder U16 · Youth Volley Days","Keine oder ausnahmsweise",0,"Kein Reglement. Nur mit schriftlichem Bericht und verstärkter Belastungskontrolle"],
      ["Future 1","Turniere der Smart Competitions · regionale Meisterschaft · Schweizermeisterschaft U16 oder U18 · Youth Volley Days","4. oder 3. Liga",0,"Erster Kontakt mit den Aktiven. Ein Wettkampf pro Wochenende"],
      ["Future 2","Turniere der Smart Competitions · regionale Meisterschaft · Schweizermeisterschaft U18 oder U20 · Youth Volley Days","3. oder 2. Liga",0,"Nach Niveau und Reifegrad, nicht nach Alter"],
      ["Future 3","Turniere der Smart Competitions · regionale Meisterschaft · Schweizermeisterschaft U20, U23 oder SAR","2. oder 1. Liga · Training mit NLA",0,"Die Brücke: Hier entscheidet sich der Übergang"]],
 b5n:"<strong>Drei reglementarische Präzisierungen.</strong> Die Nachwuchs-Schweizermeisterschaft wird nach Geschlechtern getrennt in U14, U16, U18, U20, U23 und SAR ausgetragen, und jede Region hat Anrecht auf einen Startplatz pro Kategorie und Geschlecht. Die regionalen Meisterschaften organisiert jeder Regionalverband, je nach Region als Meisterschaft oder in Turnierform. Und zu den Aktivligen: Eine Nachwuchsperson darf in höchstens zwei Aktivligen eingesetzt werden — bei mehr Einsätzen bleibt die Spielberechtigung nur für die zwei höchsten — und pro Liga nur in einer Mannschaft qualifiziert sein. Spiele in einer Mannschaft der regionalen Talentförderung zählen nicht an diese Obergrenze.",
 b5n2:"<span class=\"dato\">[Genaues Format der regionalen Meisterschaft in der GSGL für diese Saison — zu bestätigen: unterschiedlich je nach Region und je nach Stand der Smart Competitions]</span>",
 bN:"Zwei Bezeichnungssysteme nebeneinander",
 bNp:"Der Verein benennt seine Mannschaften nach Alter — U14, U16, U18, U20 — weil die GSGL ihre Turniere heute so organisiert, in allen Kategorien und in beiden Geschlechtern. Swiss Volley stellt dagegen auf eine Einteilung nach Niveau um: Kids, Rookie und Future. <strong>Das ist kein Widerspruch: Es sind zwei Momente desselben Systems.</strong> Solange die GSGL den Pilot nicht öffnet, spielt der Verein nach Alter; die technischen Inhalte dieses Dokuments sind bereits nach Niveau geschrieben, so wie es spätestens ab 2028/29 funktionieren wird. Wenn die Umstellung kommt, muss das Konzept nicht neu geschrieben werden: Es müssen nur die Mannschaften neu angemeldet werden.",
 b6:"Die beiden Sparten im Vergleich",
 b6p:"Beide Sparten haben eine zweite Achse und beide haben ein sichtbares Ziel im Verein: NLA bei den Männern, 1. Liga bei den Frauen. Der Unterschied liegt in der Zahl der Zwischenstufen, nicht im Vorhandensein des Wegs. <span class=\"dato\">[Genaue Zusammensetzung der Frauen-Aktivmannschaften dieser Saison — mit dem Verein zu ergänzen]</span> Sie zu kennen ist wichtig, weil sie bestimmt, ab welcher Stufe eine Spielerin Aktivminuten sammeln kann.",
 b7:"Sommer",
 b7p:"Die Sommermonate liegen ausserhalb dieses Konzepts: Der Verein führt in dieser Zeit heute keinen Nachwuchsbetrieb. Es bleibt als <strong>Empfehlung</strong> stehen, nicht als Verpflichtung: Swiss Volley integriert Beachvolleyball in den Nachwuchswettkampfkalender, und die Fachliteratur stützt, dieselbe Sportart nicht länger als acht Monate pro Jahr zu betreiben. Ein Sommerblock im Sand würde beides abdecken. Vermerkt für den Zeitpunkt, an dem der Verein die Struktur dafür hat."
},
juego:{
 eyebrow:"Wie wir spielen wollen",
 titulo:"Spielidentität",
 intro:"Ein Lehrplan ohne Spielidentität ist eine Inhaltsliste. Diese sechs Grundsätze beantworten eine einfache Frage: Wenn jemand eine Mannschaft aus Näfels spielen sieht, ohne den Verein zu kennen — woran erkennt er sie? Es sind keine Leitbildfloskeln, sondern technische Entscheide, die im Feld sichtbar sind und trainiert werden.",
 marca:"<strong>Eine Mannschaft aus Näfels erkennt man daran, dass der Ball nicht fällt, dass immer über drei Kontakte gespielt wird und dass alle alles machen.</strong> Wir sind nicht die Mannschaft, die am härtesten schlägt. Wir sind die Mannschaft, die weiterspielt, wenn der Ballwechsel schwierig wird.",
 aviso:"Diese Grundsätze sind ein Vereinsentscheid und werden jede Saison überprüft. Sie bauen auf dem auf, was das Schweizer System ohnehin vorgibt — frühe Penetration, ein ganzer Abschnitt ohne Libera und ohne Spezialisierung, Prozess vor Ergebnis — und machen daraus Identität statt Pflicht.",
 pr:[
  ["01","Der erste Kontakt entscheidet",
   "Bei wenigen Hallenstunden ist Annahme und Abwehr die Fähigkeit, die am stärksten bestimmt, ob der Ballwechsel überhaupt stattfindet. Eine Mannschaft, die nicht annimmt, greift nie an — und kann den Angriff nicht einmal trainieren, weil sie gar nicht dazu kommt.",
   "Im Feld: Die Mannschaft erreicht regelmässig drei Kontakte, auch bei schwierigen Bällen.",
   "Im Training: Hohes Annahmevolumen, immer mit Wettkampfservice. Ein schwächeres Service im Training zahlt man am Samstag."],
  ["02","Alle spielen zu",
   "Das Schweizer System schreibt es in Future 1 vor — System 6-6, ohne Libera, alle rotieren durch alle Positionen — und wir übernehmen es als Identität, nicht als Formalität. In einem kleinen Verein ist es zudem eine Notwendigkeit: Pro Jahrgang nur eine Zuspielerin auszubilden ist eine strukturelle Schwäche.",
   "Im Feld: Jede Person spielt aus dem Hinterfeld zu, wenn der erste Ball die Zuspielerin nicht erreicht.",
   "Im Training: Oberes Zuspiel in der Verschiebung und ausserhalb der Idealposition, für alle, auf allen Stufen."],
  ["03","Es wird immer gesichert",
   "Die Mannschaft, die sichert, gewinnt die langen Ballwechsel, und die langen Ballwechsel entscheiden Juniorenspiele. Es ist die kollektive Gewohnheit, die am günstigsten zu trainieren ist und am wenigsten trainiert wird.",
   "Im Feld: Wenn eine angreift, begleiten drei. Ohne dass jemand es rufen muss.",
   "Im Training: Als Regel in den Kleinfeldspielen, nicht als isolierte Übung. Verankert ab Kids Volley 3."],
  ["04","Angegriffen wird mit Richtung, nicht mit Kraft",
   "In diesem Alter gewinnt Richtung mehr Punkte als Wucht, und sie schont zusätzlich Schulter und Knie. Wer nur hart schlägt, hat keine Mittel mehr, sobald ein organisierter Block steht.",
   "Im Feld: Mindestens zwei Richtungen aus demselben Anlauf gelöst.",
   "Im Training: Die Entscheidung vor dem Absprung. Korrigiert wird, wohin sie geschaut hat, nicht wie fest sie geschlagen hat."],
  ["05","Der offensive Fehler wird getragen, der passive nicht",
   "Die praktische Übersetzung des Grundsatzes Prozess vor Ergebnis, den Swiss Volley ins Zentrum der Smart Competitions gestellt hat. Ein einfaches Service im Spiel ist ein verschenkter Punkt; ein offensives Service, das rausgeht, ist der Preis für gutes Spiel.",
   "Im Feld: Immer Wettkampfservice, mit einer vorher vereinbarten Fehlerquote.",
   "Im Training: Die richtige Entscheidung wird gelobt, auch wenn das Ergebnis schlecht ist; die passive Entscheidung wird korrigiert, auch wenn der Punkt gemacht wurde."],
  ["06","Man landet gut",
   "Die Landung ist ein technischer Grundsatz, keine medizinische Auflage. So verstanden hört Prävention auf, eine Steuer auf die Hallenzeit zu sein, und wird Teil davon, wie wir spielen — und genau das sorgt dafür, dass sie tatsächlich gemacht wird.",
   "Im Feld: Ausgerichtetes Knie bei der Landung nach Angriff und Block, auch unter Ermüdung und im dritten Satz.",
   "Im Training: Im Eingangsblock jeder Einheit, überprüft durch das Filmen eines Ballwechsels am Trainingsende."]],
 b2:"Die gemeinsame Sprache",
 b2p:"Ein Wort pro Begriff, dasselbe von Kids Volley bis zur ersten Mannschaft. Genau das sorgt dafür, dass eine Person nach einem Stufenwechsel den neuen Trainer ab der ersten Minute versteht, statt ein halbes Jahr mit Übersetzen zu verlieren. Und es ist die Grundlage der spanischen und englischen Fassung: Wird das Vokabular nicht vor der Übersetzung fixiert, laufen die drei Versionen bei der ersten Korrektur auseinander.",
 b2r:"<strong>Übersetzungsregel.</strong> Die als fix gekennzeichneten Begriffe werden nicht übersetzt: Sie stehen in allen drei Fassungen gleich. Talentsichtung oder Entwicklungstest zu übersetzen zerstört die Nachvollziehbarkeit zu den Verbandsdokumenten und wirkt unprofessionell.",
 b2th:["Spanisch","Deutsch","Englisch","Verwendung"],
 b2fijo:"Fix",b2libre:"Wird übersetzt"
},

carga:{
 eyebrow:"Querschnittthema · gilt für beide Sparten",
 titulo:"Individuelle Belastung",
 intro:"Jeder Trainer plant seine Gruppe, und er plant sie gut. Aber wer in zwei oder drei Strukturen trainiert, sammelt vier oder fünf Reize an — und diese Zahl steht auf keinem Blatt. Dieser Abschnitt existiert, damit es diese Zahl gibt und damit sie eine verantwortliche Person hat.",
 b1:"Individuelles Belastungsblatt",
 b1p:"Eine Zeile pro Person, zu Monatsbeginn aktualisiert. Ein Total, eine verantwortliche Person: die Nachwuchskoordination. Das Dokument, das es heute in keinem Verein der Region gibt.",
 th:["Name","Strukturen","Std./Woche","Wettkämpfe/Monat","Total","Situation"],
 filas:[["Spielerin A","Rookie 3","3","1 Turnier","3 Std. · 2 Reize","Zu wenig — zweite Gruppe ergänzen","alerta"],
        ["Spieler B","Future 1 + 3. Liga","6,5","1 Turnier + 4 Spiele","6,5 Std. · 4 Reize","Im Bereich","ok"],
        ["Spieler C","Future 2 + 2. Liga + NLA","10,5","2 Turniere + 4 Spiele","10,5 Std. · 7 Reize","Über der Obergrenze — diese Woche überprüfen","critico"]],
 nota:"Der Fall von Spieler C entsteht von selbst, ohne dass jemand ihn beschliesst: Es ist der Junge, der Leistung bringt und den alle haben wollen. Er ist in zwei Nachwuchsstrukturen und zusätzlich in zwei Aktivmannschaften, mit Spiel an fast jedem Wochenende und sieben Reizen derselben Art, ohne Kraftarbeit. Niemand hat entschieden, dass er zehneinhalb Stunden trainiert: Es hat sich aufsummiert. Die Patellasehnentendinopathie ist die dominierende Überlastungsverletzung des Knies im Volleyball, und in einer Kohorte über elf Jahre gab einer von fünf Spielern, die sie im Jugendalter entwickelten, das Wettkampfvolleyball auf.",
 b2:"Bewilligung für eine zweite Stufe",
 b2p:"Wird schriftlich bewilligt, nicht aus Sympathie und nicht wegen des Notstands am Samstag. Fünf Bedingungen, alle gleichzeitig.",
 cond:[["Ausbildungsgrund festgehalten","Es wird aufgeschrieben, was die Person braucht, das ihre Stufe nicht bietet. Wenn der Grund ist, dass der anderen Mannschaft Leute fehlen, ist es kein Grund."],
       ["Wochenobergrenze eingehalten","Die Summe aller Strukturen bleibt im Bereich der Herkunftsstufe, nicht der Zielstufe."],
       ["Ein Wettkampf pro Wochenende","Einer. Angehäufte Spiele wiegen schwerer als angehäufte Trainings, weil im Spiel niemand die Intensität reguliert."],
       ["Zwei vollständig freie Tage","Ohne Volleyball und ohne Kraftraum. Sie werden festgelegt und eingehalten."],
       ["Erfassung und monatliche Überprüfung","Unterschrift der Nachwuchskoordination. Die Bewilligung verfällt, sie ist nicht dauerhaft."],
       ["Wer zusätzlich in einer Liga spielt, zählt doppelt","Wer in einer Aktivmannschaft spielt, hat seine zweite Achse bereits abgedeckt. Zusätzlich eine zweite Nachwuchsstufe zu geben heisst dreifach anhäufen und ist fast nie gerechtfertigt."]],
 b2n:"<strong>Und eine reglementarische Grenze.</strong> Für den Meisterschaftsweg meldet jeder Verein eine Mannschaft pro Kategorie, und für Personen, die in mehreren Mannschaften erscheinen, gelten Einschränkungen. In mehreren Gruppen zu trainieren ist der Mechanismus des Konzepts; in mehreren Mannschaften zu spielen ist etwas anderes und muss vor jeder Anmeldung gegen das geltende Reglement geprüft werden. <span class=\"dato\">[Mit dem Reglement der laufenden Saison prüfen]</span>",
 b3:"Der richtige Zähler: Sprünge, nicht Stunden",
 b3p:"Im Volleyball ist die Belastung Sprung und Schlagarm. Wer in drei Gruppen spielt, kann sein Sprungvolumen verdoppeln, ohne dass es irgendwo auffällt. Die Fachliteratur nennt je nach Niveau und Position sehr unterschiedliche Zahlen und zeigt bei Nachwuchskadern deutliche Unterschiede zwischen Männern und Frauen bei Sprüngen und Belastung pro Einheit. Deshalb werden die eigenen Zahlen gezählt und nicht kopiert.",
 b3th:["Art der Einheit","Sprünge","Angriffe mit Maximalintensität","Herkunft"],
 b3filas:[["Technikeinheit","zu zählen","zu zählen"],["Einheit mit Spiel","zu zählen","zu zählen"],["Halbtagesturnier","zu zählen","zu zählen"]],
 b3nota:"<strong>So wird ergänzt:</strong> zwei Einheiten jeder Art, eine Person mit Handzähler. Eine halbe Stunde Arbeit pro Feld, und der Verein hat seine eigene Tabelle. Das ist mehr wert als jeder Wert aus einer Studie in einem anderen Kontext.",
 b4:"Steigerungsregel",
 b4p:"Das Wochentotal steigt gegenüber den Vorwochen nicht sprunghaft. Besondere Aufmerksamkeit gilt den Rückkehren: nach Weihnachten, nach einer Verletzung, zu Saisonbeginn. Die Belastungsspitze nach einer Pause ist der Punkt, an dem Leute kaputtgehen — nicht das dauerhaft hohe Volumen."
},

staff:{
 eyebrow:"Was das Konzept trägt, wenn die Personen wechseln",
 titulo:"Trainerteam und Schutz der Jugendlichen",
 intro:"Ein geschriebenes Konzept, das niemand trägt, stirbt im November. Dieser Abschnitt legt fest, wer was macht, mit welcher Ausbildung und nach welchen Verhaltensregeln.",
 b1:"Struktur und Verantwortlichkeiten",
 roles:[["Nachwuchskoordination","Trägerin des Konzepts. Bewilligt die zweiten Stufen, führt die Belastungsblätter, beobachtet Trainings, entscheidet über die Einteilung nach Niveau und ist gegenüber dem Vorstand verantwortlich. Eine Funktion, kein Ehrentitel: Sie braucht zugeteilte Stunden."],
        ["Stufentrainer:in","Setzt das Stufenblatt um, erfasst Präsenzen und Messungen und nimmt an der Wochensitzung teil. Entscheidet nicht allein über die Belastung einer Person, die mit einer anderen Gruppe geteilt wird."],
        ["Athletikverantwortliche:r","Kann extern oder stufenübergreifend sein. Definiert und aktualisiert die Athletikstufen und die Heimprogramme."],
        ["Daten- und Videoverantwortliche:r","Neue Rolle. Verbindet das, was in der ersten Mannschaft bereits existiert, mit dem Nachwuchs: Messungen, kurze Videos und Spielerprofile."]],
 b2:"Trainerausbildung",
 b2p:"Das Konzept funktioniert nicht, wenn es jede Trainerin nach eigenem Gutdünken auslegt. Drei Verpflichtungen: alle Trainer:innen mit der ihrer Stufe entsprechenden und aktuellen J+S-Anerkennung; ein interner Ausbildungstag zu Saisonbeginn, um das Konzept auf das Feld zu bringen; und eine wöchentliche Sitzung von dreissig Minuten mit fixer Traktandenliste — Belastung der geteilten Personen, ein konkreter Fall und ein technischer Gedanke der Woche.",
 b2r:"Externe Referenz: USA Volleyball verlangt von jeder Trainerperson im Juniorenverein einen Basiskurs, dazu eine Kindesschutz-Zertifizierung, die vor jedem Kontakt mit Athlet:innen abgeschlossen sein muss, und eine Überprüfung des Strafregisters für alle.",
 b2s:"Und eine Verpflichtung aus dem neuen System: Smart Competitions enthält einen Ehrenkodex für Trainer:innen und Eltern, der die Werte des Schweizer Sports und die Idee ausgeglichener Spiele, der Teilnahme aller und des Prozesses vor dem Ergebnis aufnimmt. Ihn zu unterzeichnen gehört zum Eintritt in das System.",
 b3:"Die gemeinsame Sprache",
 b3p:"Ein Wort pro Begriff, dasselbe von Kids Volley bis zur ersten Mannschaft. Das vollständige Glossar mit den Entsprechungen auf Spanisch und Englisch und der Regel, welche Begriffe nicht übersetzt werden, steht im Abschnitt Identität. Die Pflicht des Trainerteams ist, es zu verwenden: Benennt jede Trainerin die Dinge anders, verliert die Person bei jedem Stufenwechsel ein halbes Jahr mit Übersetzen.",
 b4:"Ethik und Kindesschutz",
 b4p:"Kein Nachwuchsdokument darf heute ohne diesen Abschnitt in Umlauf gehen. Vier Mindestregeln, ab morgen anwendbar, abgestimmt auf die Ethik-Charta des Schweizer Sports:",
 etica:[["Nie allein","Keine Trainerperson bleibt mit einer minderjährigen Person allein in Garderobe, auf Reisen oder in geschlossener Halle. Immer zwei Erwachsene oder offene Tür."],
        ["Sichtbare Kommunikation","Nachrichten an minderjährige Spieler:innen laufen über Gruppenkanäle oder mit der Familie im Kopie. Nie privat."],
        ["Meldeweg","Eine bezeichnete Person ausserhalb des Trainerteams, an die sich Jugendliche oder Familien wenden können. Publiziert und bekannt."],
        ["Bild","Schriftliche Zustimmung der Familie für Fotos und Video, jederzeit widerrufbar ohne Begründung."]],
 b5:"Eltern",
 b5p:"Es sind die Eltern, die ein Kind mit den besten Absichten in drei Strukturen anmelden. Ein einseitiges Blatt zu Saisonbeginn — wie viele Stunden angemessen sind, warum es zwei Ruhetage gibt, warum der Verein manchmal Nein sagt und warum Turnierresultate nicht publiziert werden — verhindert den grössten Teil der Konflikte, bevor sie entstehen. Es wird unterschrieben abgegeben."
},
herr:{
 eyebrow:"Was am Montagmorgen gebraucht wird",
 titulo:"Werkzeuge",
 intro:"Ein Konzept, das nicht auf Papier kommt, wird nicht angewendet. Diese fünf Stücke machen aus dem Dokument tägliche Arbeit. Alle passen auf ein Blatt und alle sind dafür gedacht, ohne Computer am Feldrand benutzt zu werden.",
 b1:"Testbatterie",
 b1p:"Zweimal pro Jahr, Oktober und März, auf allen Stufen und in beiden Sparten. Die Körpergrösse läuft separat: alle drei Monate, denn sie ordnet die Person ihrer Athletikstufe zu. Das Werkzeug mit Verfalldatum: Wird der Oktober verpasst, fehlen die Ausgangswerte der ganzen Saison.",
 b1th:["Was gemessen wird","Wie","Material","Häufiger Fehler"],
 b1f:[
  ["Körpergrösse","Stehend an der Wand, ohne Schuhe, Fersen zusammen, Blick geradeaus.","Massband an der Wand","Mit Schuhen messen oder das Kind nach oben schauen lassen."],
  ["Spannweite","Arme im Kreuz an der Wand ausgestreckt, Fingerspitze zu Fingerspitze.","Massband","Den Rücken nicht richtig anlegen."],
  ["Standreichweite","Stehend, ein Arm nach oben gestreckt, Schulter angehoben, Fersen am Boden.","Markierte Wand oder Messgerät","Die Ferse abheben lassen: Das bläht den Wert auf und zerstört den Vergleich."],
  ["Angriffsreichweite","Mit Anlauf wird der höchstmögliche Punkt einhändig berührt.","Sprungmessgerät oder markierte Wand","Zwischen Oktober und März die Anlaufart ändern."],
  ["Blockreichweite","Ohne Anlauf, Sprung aus dem Stand, beidhändig.","Messgerät oder Wand","Einen Schritt davor erlauben."],
  ["Sprunghöhe (CMJ)","Sprung mit Ausholbewegung, Hände in der Hüfte, drei Versuche, der beste zählt.","Sprung-App oder Messplatte","Zwischen den Messungen eine andere App verwenden."],
  ["Landungskontrolle","Absprung von einem tiefen Kasten. Beobachtet wird, ob das Knie nach innen kippt. Notiert wird gut, mittel oder schlecht.","Ein Kasten von 30 cm und ein Handy zum Filmen","Aus dem Gedächtnis notieren statt zu filmen."],
  ["Service","Zehn Services in eine angesagte Zone. Notiert wird, wie viele im Feld und wie viele in der Zone landen.","Hütchen","Die Zone zwischen den Messungen ändern."],
  ["Annahme","Zwanzig Annahmen gegen Wettkampfservice. Notiert wird, wie viele im System bleiben.","Nichts","Die Serviceintensität senken, damit die Zahl schöner aussieht."]],
 b1n:"<strong>Die drei goldenen Regeln.</strong> Gleiches Protokoll, gleiche messende Person, gleiche Trainingszeit. Ein Methodenwechsel erzeugt eine falsche Verbesserung, und eine falsche Verbesserung ruiniert einen Entscheid über einen Menschen. Muss man zwischen gut messen und alle messen wählen, misst man gut bei denen, die möglich sind.",
 b1p2:"Das Erfassungsblatt führt eine Zeile pro Person und diese Spalten: Name, Jahrgang, Stufe, Aktivmannschaft falls vorhanden, und eine Spalte pro Messung. Es wird von Saison zu Saison aufbewahrt: Erst nach zwei Saisons hat der Verein eigene Referenzwerte und muss nicht mehr schätzen.",
 b2:"Heimprogramm",
 b2p:"Fünfzehn Minuten, dreimal pro Woche, nur mit dem eigenen Körpergewicht und ohne Ausrüstung. Wird zu Saisonbeginn ausgedruckt abgegeben und einmal pro Monat in der Halle mit der Gruppe überprüft, damit es niemand ein halbes Jahr lang falsch macht. Der Teil des Trainings mit dem höchsten Ertrag der ganzen Ausbildung und die einzige Möglichkeit, die Wochendosis zu erreichen, die die Fachliteratur mit einer echten Risikoreduktion verbindet.",
 b2th:["Block","Was gemacht wird","Wie lange"],
 b2f:[["Beweglichkeit","Sprunggelenk an der Wand, Hüfte und Brustwirbelsäule.","3 Minuten"],
      ["Landungen","Von einer tiefen Stufe mit ausgerichtetem Knie landen. Zuerst beidbeinig, danach einbeinig.","4 Minuten"],
      ["Ischiocrurale Muskulatur","Exzentrische Arbeit mit Partner:in oder festem Widerlager, langsam gesteigert.","3 Minuten"],
      ["Hüfte und Rumpf","Brücken, seitliche Abduktion, kurze Planks.","3 Minuten"],
      ["Gleichgewicht","Einbeinstand mit geschlossenen Augen und mit Störreiz.","2 Minuten"]],
 b2n:"<strong>Angepasst wird an die Athletikstufe, nicht an die Kategorie.</strong> Vor dem Wachstumsschub liegt der Fokus auf Koordination und Gleichgewicht; während des Schubs auf exzentrischer Arbeit und Landungskontrolle; danach kann die Belastung gesteigert werden. Und bei den Frauen ist das Programm auf keiner Stufe freiwillig.",
 b3:"Spielerprofil",
 b3p:"Eines pro Person, es begleitet sie von Kids Volley bis zur ersten Mannschaft. Das Dokument, mit dem eine neue Trainerin ein Kind in fünf Minuten versteht statt in drei Monaten. Und der Ort, an dem das Datensystem des Vereins in den Nachwuchs kommt, ohne dass es Scouting braucht.",
 b3th:["Block","Was enthalten ist"],
 b3f:[["Identifikation","Name, Jahrgang, Eintrittsjahr, Schule, Kontakt der Familie."],
      ["Werdegang","Stufen und Mannschaften pro Saison, inklusive Aktivliga falls vorhanden."],
      ["Messungen","Alle Messungen von Oktober und März, als Reihe. Die Reihe zählt mehr als der Einzelwert."],
      ["Wachstum","Körpergrösse alle drei Monate und aktuelle Athletikstufe."],
      ["Belastung","Wochenstunden und Wettkämpfe, mit monatlicher Historie."],
      ["Verletzungen","Was, wann, wie viele Ausfalltage, wie die Rückkehr verlief."],
      ["Verband","Teilnahme an der Talentsichtung, Aufnahme in den Talentpool, Talent Card falls vorhanden."],
      ["Ziele","Zwei pro Saison, mit der Person aufgeschrieben und mit ihr überprüft."],
      ["Trainernotizen","Kurz und datiert. Früheres wird nicht gelöscht."]],
 b4:"Trainingsbeobachtung",
 b4p:"Ein Blatt, um in jede Gruppe zu gehen und immer dasselbe zu beobachten. Das Arbeitsinstrument der Koordination, gedacht zur Begleitung und nicht zur Kontrolle: Es wird noch am selben Tag mit der Trainerperson besprochen. Zehn Minuten Beobachtung genügen.",
 b4f:[["Wurde der Präventionsblock vollständig gemacht?","Ja oder nein, und wie viele Minuten tatsächlich."],
      ["Dichte","Qualitative Ballkontakte pro Person in einem Fenster von fünf Minuten. Gezählt, nicht geschätzt."],
      ["Warteschlangen","Stand irgendwo eine Reihe mit mehr als vier Wartenden?"],
      ["Saisonschwerpunkt","Ist einer der fünf Schwerpunkte der Stufe aufgetaucht?"],
      ["Sprache","Wurden die Begriffe des Glossars verwendet oder die der Trainerperson?"],
      ["Korrektur","Wurde die Entscheidung korrigiert oder nur die Bewegung?"],
      ["Abschluss","Hat eine Spielerin gesprochen oder nur die Trainerperson?"],
      ["Landungen","Ist jemand mit einwärts kippendem Knie gelandet, ohne dass es korrigiert wurde?"]],
 b4n:"Das Ergebnis wird nicht abgelegt, es wird besprochen. Eine Beobachtung, die nicht in einem fünfminütigen Gespräch endet, ist eine Formalität.",
 b5:"Elternblatt",
 b5p:"Eine Seite, unterschrieben zu Saisonbeginn abgegeben. Es sind die Eltern, die ein Kind mit den besten Absichten in drei Strukturen anmelden. Dieses Blatt verhindert den grössten Teil der Konflikte, bevor sie entstehen.",
 b5f:[["Wie viele Stunden angemessen sind","Der Bereich der Stufe des Kindes und das Total über alle Strukturen."],
      ["Warum zwei Ruhetage","Und warum das kein Mangel an Einsatz ist."],
      ["Warum der Verein manchmal Nein sagt","Zu einer zweiten Mannschaft, zu einer dritten Struktur, zu einem weiteren Turnier."],
      ["Warum Resultate nicht publiziert werden","Das Schweizer Nachwuchssystem ist bewusst prozessorientiert. Das erklärt man besser, bevor gefragt wird."],
      ["Wie über einen Stufenwechsel entschieden wird","Nach Niveau und schriftlichen Kriterien, nicht nach Alter und nicht nach Sympathie."],
      ["An wen man sich wenden kann","Die bezeichnete Person ausserhalb des Trainerteams, bei jedem Problem."],
      ["Was von der Familie erwartet wird","Bringen, abholen, begleiten und nicht von der Tribüne aus coachen. Der Ehrenkodex der Smart Competitions gilt auch für die Eltern."]]
},

plan:{
 eyebrow:"Vom Dokument zur Praxis",
 titulo:"Umsetzung",
 intro:"Ein Konzept wird in einer Sitzung bewilligt und in drei Jahren umgesetzt. Das sind die drei Phasen, geordnet nach dem, was sie kosten. Die erste kostet nichts und verändert am meisten.",
 b0:"Saisonkalender",
 b0p:"Die Schweizer Saison läuft von September bis April. Das ist der Makrozyklus des Vereins, mit den Fenstern, die sich nicht verschieben lassen, und den organisatorischen Terminen, die man gerne vergisst, bis es zu spät ist.",
 b0th:["Wann","Ausbildungsfokus","Wettkampf","Organisation"],
 b0f:[
  ["August","Gruppenbildung und Einteilung nach Niveau","—","Interner Trainertag · Mannschaftsanmeldung · Elternblatt"],
  ["September","Verankerung der Saisonschwerpunkte","Erste Turniere · Ligastart","Belastungsblätter erfasst und bewilligt"],
  ["Oktober","Hohes technisches Volumen","Regionale Turniere","<strong>Messung 1</strong> · regionale Talentsichtung GSGL"],
  ["November","Schwerpunkte in der Spielsituation","Wettkampfblock","Erste Trainingsbeobachtungen · monatliche Belastungsprüfung"],
  ["Dezember","Festigung","Wettkampfblock","Bericht an den Vorstand · Abgabe des Heimprogramms für die Pause"],
  ["Weihnachten","Unterbruch","—","Niemand trainiert täglich. Das Heimprogramm hält das Minimum"],
  ["Januar","<strong>Progressive Rückkehr</strong>","Wiederbeginn","Die Belastung kehrt nicht sprunghaft auf das Dezemberniveau zurück: Hier gehen die meisten kaputt"],
  ["Februar","Taktik und Entscheidung","Wettkampfblock 2","Überprüfung der Niveaueinteilung: wer auf- und wer absteigt"],

 b0n:"<strong>Zwei Termine, die sich nicht verschieben.</strong> Die Oktobermessung, weil ohne Ausgangswerte die ganze Saison ohne Daten bleibt. Und die regionale Talentsichtung, weil sie die Tür zum Talentpool ist und einmal im Jahr stattfindet. Alles andere lässt sich verschieben.",

       ["Woche 2","Erhebung: Wer trainiert heute in mehr als einer Struktur. Die Zahl, die niemand hat.","Trainer:innen"],

foda:{
 eyebrow:"Interner Anhang · zirkuliert nicht ausserhalb von Trainerteam und Vorstand",
 titulo:"Strategische Analyse",
 intro:"Diese Analyse betrachtet den Verein, nicht das Dokument. Sie ist zum Entscheiden geschrieben, nicht zur Illustration: Jede Schwäche und jedes Risiko hat eine strategische Verknüpfung und eine Massnahme mit verantwortlicher Person im Plan der ersten 90 Tage.",
 aviso:"<strong>Eingeschränkte Verwendung.</strong> Sätze wie «nicht alle Trainer:innen haben die nötige Ausbildung» sind zutreffend und intern. Dieser Anhang wird nicht an Familien abgegeben und nicht der institutionellen Präsentation beigelegt.",
 f:{t:"Stärken",c:"#76B82A",l:[
   ["Eine NLA-Mannschaft im eigenen Haus","Die Spitze der Pyramide ist sichtbar und erreichbar. Kaum ein Ausbildungsverein des Landes kann das bieten."],
   ["Neun Aktiv- und sieben Nachwuchsmannschaften","Sechs Männermannschaften bis zur NLA und drei Frauenmannschaften bis zur 1. Liga. Für jedes reale Niveau gibt es eine Stufe, im selben Verein. Das Modell, das Italien mit Club Italia von Grund auf bauen musste, steht hier bereits."],
   ["Daten- und Videokompetenz bereits vorhanden","Sie existiert und funktioniert in der ersten Mannschaft. Sie in den Nachwuchs zu skalieren erfordert keinen Einkauf, nur einen Entscheid."],
   ["Einheitliche technische Leitung des gesamten Nachwuchses","Eine verantwortliche Person für neun Stufen und beide Sparten. Die Voraussetzung dafür, dass ein gemeinsames Konzept überhaupt möglich ist."],
   ["Region mit aktiver Talentstruktur","Die Talentsichtung der GSGL funktioniert, mit Standorten in Jona und Chur, und dahinter steht ein nationaler Weg."]]},
 o:{t:"Chancen",c:"#F2A623",l:[
   ["Die hohe Zulassungsgrenze von Rookie","Erlaubt es, Jugendliche bis siebzehn zu gewinnen, die nie gespielt haben, ohne sie gegen Gleichaltrige mit sechs Jahren Vorsprung zu stellen. Eine neue Eintrittstür."],
   ["Smart Competitions belohnt das, was wir können","Das System bewertet neu Teilnahme, Verbleib und Prozess. Ein Verein mit einem geschriebenen Ausbildungskonzept steht besser da als einer, der nur Turniere gewinnen kann."],
   ["School Volley als Kanal in die Schulen","Offizieller Weg des Verbands, um Kinder dort zu erreichen, wo sie sind, ohne davon abzuhängen, dass die Familie Volleyball bereits kennt."],
   ["Der Referenzverein des Kantons im Nachwuchs sein","Glarus ist klein. Wer als Erster ein seriöses Konzept publiziert, setzt den Massstab und gewinnt die Familien."],
   ["Wir sind bereits Turnierort","Der Verein hat im September eine Jugendspielrunde der GSGL und im Dezember ein Kids-Volley-Turnier organisiert. Die Fähigkeit ist bewiesen: Es fehlt, sie zur Politik zu machen, mit einem festen Turnierkalender pro Saison. Das bringt Mannschaften, Familien, Einnahmen und regionale Sichtbarkeit zu geringen Kosten."]]},
 d:{t:"Schwächen",c:"#E8593C",l:[
   ["Keine Frauenmannschaften U18 und U20","Die Frauensparte springt von U16 direkt zu den Aktiven. Heute fangen die 4. und die 3. Liga diesen Sprung auf, und es funktioniert; es bedeutet aber, dass eine Siebzehnjährige gegen Erwachsene spielt, ohne eine eigene Zwischenstufe ihres Alters. Es ist zu entscheiden, ob das so bleibt oder abgedeckt wird."],
   ["Drei Wochenstunden pro Gruppe","Unter dem empfohlenen Bereich auf fast allen Stufen. Ausgeglichen wird über Mehrfachzugehörigkeit und Aktivliga, aber das ist ein Ausgleich, keine Lösung."],
   ["Niemand kannte die Gesamtbelastung","Das individuelle Belastungsblatt entsteht genau deshalb, weil diese Zahl auf keinem Blatt stand."],
   ["Ungleiche Ausbildung des Trainerteams","Die J+S-Anerkennung ist nicht nach Stufen erfasst, und es gibt keinen schriftlichen Aktualisierungsplan."],
   ["Keine eigenen Daten","Es gibt keine Referenzwerte des Vereins, weil systematisch nie gemessen wurde. Die erste Ausgangsbasis ist die vom Oktober."],
   ["Koordination ohne zugeteilte Stunden","Hängt die Funktion vom guten Willen ab, stirbt das Konzept im November."]]},
 a:{t:"Risiken",c:"#3B8BD4",l:[
   ["Kleines Einzugsgebiet","Glarus hat wenig Bevölkerung und mehrere Sportarten konkurrieren um dieselben Kinder. Die Grundbeschränkung des gesamten Projekts."],
   ["Ausstieg im Jugendalter","Der Höhepunkt der Abmeldungen fällt mit Rookie und dem Beginn von Future zusammen. Genau der Moment, in dem das System am meisten fordert."],
   ["Überlastung durch angehäufte Strukturen","Nachwuchs plus Aktivliga plus Turniere. Die Patellasehnentendinopathie im Jugendalter beendete bei einem von fünf Betroffenen die Laufbahn."],
   ["Trainerwechsel","Ohne gemeinsame Sprache und ohne geschriebene Stufenblätter beginnt jede Kategorie bei jedem Wechsel von vorne."],
   ["Unvollständiger Übergang zu Smart Competitions","Das System wird Region für Region eingeführt. Auf der falschen Struktur zu planen kostet eine Saison."],
   ["Abhängigkeit von Freiwilligen","Das strukturelle Risiko des gesamten Schweizer Breitensports, das der Verband selbst als einen der gesellschaftlichen Wandel benennt, der ihn zur Anpassung zwingt."]]},
 b2:"Verknüpfte Strategien",
 b2p:"Eine SWOT ohne Verknüpfungen ist Dekoration. Diese sechs Strategien verbinden eine Stärke oder Chance mit einer konkreten Schwäche oder einem Risiko, und alle haben eine Entsprechung im Plan.",
 cr:[
  ["Die NLA gegen den Ausstieg einsetzen","Stärke + Risiko","Der Höhepunkt der Abmeldungen liegt bei Rookie. Dass diese Jugendlichen gratis an die NLA-Spiele kommen, Bälle holen und einmal pro Saison mit der ersten Mannschaft trainieren, ist die günstigste Massnahme zur Bindung, die es gibt."],
  ["Die Spitze bei den Frauen sichtbar machen","Stärke + Risiko","Die erste Frauenmannschaft in der 1. Liga ist das Ziel der ganzen Sparte und muss ab Kids Volley benannt werden: offene Spiele, Spielerinnen der ersten Mannschaft, die in den Trainings der Mädchen auftauchen, und eine Spielerin auf Future 3, die mit ihnen trainiert, sobald sie so weit ist. Gegen den Ausstieg im Jugendalter wirkt ein sichtbares Ziel mehr als jede Rede."],
  ["Rekrutierung über School Volley und späten Rookie-Einstieg","Chance + Risiko","Gegen das kleine Einzugsgebiet: über den offiziellen Kanal in die Schulen und Rookie für alle, die spät kommen. Das erweitert den Trichter, ohne um dieselben Kinder zu konkurrieren."],
  ["Daten der ersten Mannschaft als Rekrutierungsvorteil","Stärke + Risiko","Kein Nachbarverein kann einer Familie anbieten, dass ihr Kind ein eigenes Profil, zwei Messungen pro Jahr und Video bekommt. Das ist ein Argument bei der Vereinswahl, nicht nur ein technisches Werkzeug."],
  ["Belastungsblatt gegen Überlastung","Schwäche + Risiko","Das einzige Gegenmittel gegen angehäufte Strukturen ist, dass es ein Total mit einer verantwortlichen Person gibt. Kostet nichts und ist die erste Massnahme des Plans."],
  ["Geschriebene Stufenblätter gegen Trainerwechsel","Schwäche + Risiko","Wer geht, nimmt sein Wissen mit; ein Stufenblatt bleibt. Die gemeinsame Sprache und die Blätter sind die Versicherung gegen Fluktuation."]],
 b3:"Rekrutierung: wie der Verein wächst",
 b3p:"Bei einem kleinen Einzugsgebiet zählen Bindung und Rekrutierung genauso viel wie die Ausbildung. Vier Kanäle, geordnet nach Kosten.",
 cap:[["School Volley","Offizieller Weg des Verbands in die Schulen, mit angepassten 3:3-Spielformen und vereinfachten Regeln. Der günstigste Kanal und derjenige, der Kinder erreicht, in deren Familie niemand Volleyball spielt."],
      ["Rookie für Späteinsteigende","Die Zulassung bis U18 erlaubt einen würdigen Einstieg für Fünfzehn- und Sechzehnjährige. Man muss es laut sagen: Heute weiss niemand, dass das geht."],
      ["Eigene Turniere","Halbtagesturniere zu organisieren ist im neuen System leicht. Es bringt Mannschaften, Familien und Einnahmen und setzt den Verein auf die regionale Landkarte."],
      ["Die NLA als Magnet","Spiele offen für den Nachwuchs, Spieler der ersten Mannschaft, die in den Kindertrainings auftauchen. Kostet null Franken und kann von keinem Nachbarverein kopiert werden."]],
 b4:"Was zu entscheiden ist",
 b4p:"Drei Entscheide, die nicht technisch sind und die dieses Dokument dem Vorstand nicht abnehmen kann.",
 dec:[["Ob eine Frauenmannschaft U18 geschaffen wird","Heute decken die 4. und die 3. Liga diese Altersspanne ab. Ein U18 der Frauen gäbe eine eigene Altersstufe, konkurriert aber um dieselben Spielerinnen und dieselben Hallenzeiten. Ein Ressourcenentscheid, kein technischer."],
      ["Entschädigte Stunden für die Koordination","Wie viele und aus welchem Budget. Ohne das wird Phase 1 nur halb umgesetzt und Phase 2 beginnt nie."],
      ["Priorität zwischen den beiden Wegen","Wie viele Personen auf den Weg nach Niveau ausgerichtet werden und wie viele auf den Meisterschaftsweg nach Alter. Ein Identitätsentscheid des Vereins, keine Betriebsfrage."]]
},

ref:{
 eyebrow:"Woher jede Angabe stammt",
 titulo:"Grundlagen",
 intro:"Dieses Konzept wird nicht aus dem Nichts erfunden: Es übernimmt den verbindlichen Schweizer Rahmen und ergänzt ihn um das, was zwei der solidesten Ausbildungssysteme der Welt tun. Jedes steuert etwas anderes und Konkretes bei.",
 b1:"Bezugsrahmen nach Land",
 paises:[
  {t:"Schweiz · Swiss Volley und Swiss Olympic",o:"Für uns verbindlich",
   p:["Die Kategorien, Spielsysteme, Netzhöhen und Teilnahmeregeln dieses Dokuments stammen aus den <strong>Smart Competitions</strong>, dem Nachwuchswettkampfsystem, das Swiss Volley im Rahmen des gleichnamigen Projekts von Swiss Olympic entwickelt hat, unter dem Leitgedanken von mehr Teilnahme und stärkeren Persönlichkeiten für bessere künftige Leistung.",
      "Das <strong>Rahmenkonzept FTEM</strong> gliedert die Laufbahn in Phasen: Wer nicht als Talent identifiziert wurde, ist in Foundation; T1 bis T4 reichen von der regionalen Sichtung bis zu den Leistungszentren auf NLA-Niveau. Die jährliche Beurteilung folgt dem <strong>PISTE</strong>-Modell.",
      "Die regionale <strong>Talentsichtung</strong> öffnet den <strong>Talentpool</strong>, der Zugang zu den Ausbildungsstrukturen, zu Schulungsmodulen und zum Athletikprogramm des Verbands mit seinen Test-Benchmarks gibt. Die <strong>Swiss Olympic Talent Card</strong> weist die Person gegenüber Schule und Behörden aus. In der Region GSGL finden die Tests in Jona und in Chur statt.",
      "Die Ausbildung ist <strong>dual, Halle und Beach</strong>, und beide Disziplinen sind in den Wettkampfkalender integriert."],
   a:"Das Skelett des Dokuments. Stufenstruktur, Spielsysteme, Ausbildungsweg und Testkalender stammen von hier."},
  {t:"USA · USOPC und USA Volleyball",o:"Struktur und Sicherheit",
   p:["Das <strong>American Development Model</strong> gliedert die Entwicklung in fünf Phasen mit altersgerechten Erwartungen und deckt Trainerausbildung, Elternbeteiligung, Vereinsführung und Athletensicherheit ab. Es baut auf der Arbeit von Istvan Balyi zur langfristigen Entwicklung auf, und USA Volleyball hat daran mitgewirkt.",
      "USA Volleyball verlangt von jeder Trainerperson im Juniorenverein einen Basiskurs, die <strong>SafeSport</strong>-Zertifizierung vor jedem Kontakt mit Athlet:innen und eine Strafregisterprüfung für alle lizenzierten Trainer:innen.",
      "Das ADM benennt genau unser Problem: Mit zwanzig Kindern und einem Ball bekommt jedes sehr wenige Kontakte. Daher die Beharrlichkeit auf Trainings mit vielen Bällen.",
      "Und es gibt einen brauchbaren Präzedenzfall: Die NBA hat zusammen mit USA Basketball Richtlinien mit Höchstwerten für Wochenstunden, Spielzahl und Trainingsdauer je Altersgruppe publiziert."],
   a:"Der Standard für Anerkennung und Kindesschutz — auf J+S übertragen —, der Indikator der Kontaktdichte und der Präzedenzfall, Belastungsobergrenzen zu publizieren."},
  {t:"Italien · FIPAV",o:"Ausbildung und Zertifizierung",
   p:["<strong>Club Italia</strong> wurde 1998 von Julio Velasco als technischem Direktor des italienischen Verbands gegründet, mit einer widersprüchlichen Idee: Jugendliche entwickeln, indem sie in einer Aktivliga statt in Juniorenligen spielen. Der Verband kontrolliert das Team und stellt dort die besten gesichteten Talente auf. Durch diese Mannschaft gingen Egonu, Danesi, Malinov und Orro.",
      "Die FIPAV zertifiziert den Nachwuchsbereich ihrer Vereine mit einem <strong>Marchio di Qualità</strong> über ein Bewertungsraster, für das sich die Vereine bewerben. Und in der dualen Laufbahn arbeitet sie im Rahmen des Ministeriumsprojekts <strong>Studente-Atleta</strong>."],
   a:"Club Italia stützt unsere Politik der zweiten Stufe: Oben mitzuspielen ist nicht das Problem, es ungeplant zu tun schon. Und das Raster des Marchio di Qualità ist der externe Massstab, an dem sich dieses Dokument messen lassen sollte."}],
 b2:"Quellenverzeichnis",
 b2p:"Die als Fachliteratur gekennzeichneten Aussagen verweisen auf diese Liste. Die Schweizer Links sind die Quelle für alles, was mit Swiss Volley gekennzeichnet ist.",
 b3:"Was noch zu prüfen ist",
 b3p:"Methodische Ehrlichkeit: Das ist noch nicht bestätigt und darf nicht so zirkulieren, als wäre es das.",
 pend:["Ob die GSGL den Pilot der Smart Competitions in dieser Saison öffnet: Heute organisiert sie weiterhin nach Alterskategorien auf Basis ihres regionalen Konzepts von 2019.",
       "<strong>Spielform von Rookie 1 und 2.</strong> Das nationale Konzept beschreibt Rookie 1 als 3:3; mindestens eine Region, die das System bereits anwendet, publiziert Rookie 1 und 2 als 4:4. Vor der Planung gegen das Reglement der GSGL klären.",
       "<strong>Netzhöhen von Rookie 2 und 3.</strong> Es besteht ein erklärter Vorschlag des Verbands, sie für ältere Spieler:innen auf 2,10 oder 2,15 m anzupassen.",
       "<strong>Pflicht zu drei Ballkontakten nach der Annahme in Rookie.</strong> Im Rookie-Reglement in Kraft, mit Vorschlag zur Streichung.",
       "<strong>Stufe Future 3+.</strong> Existiert in den Regionen, die das System bereits anwenden, und ist in diesem Dokument noch nicht ausgearbeitet.",
       "Grenzen der Spielberechtigung von Nachwuchspersonen in Aktivligen, gegen das Reglement der laufenden Saison: Die Ausgabe wechselt jährlich.",
       "Genaue Daten der Talentsichtung GSGL und des regionalen Turnierkalenders.",
       "Namen und offizieller Kalender der Nachwuchswettkämpfe, an denen der Verein teilnimmt.",
       "Genaue Zusammensetzung der Frauen-Aktivmannschaften und Anzahl Gruppen und Kinder im Kids Volley.",
       "Eigene Zahlen zu Reichweite, Sprunghöhe und Sprungzählung: Sie entstehen durch Messen, nicht durch Suchen.",
       "Anzahl Mannschaften, Personen und Trainer:innen pro Stufe: Das Konzept ist so gebaut, dass es davon nicht abhängt, aber der Umsetzungsplan braucht es."]
}
};

resumen:{
 eyebrow:"Executive summary for the board",
 titulo:"One framework, aligned with Swiss Volley",
 intro:"Näfels has youth teams. What it does not have is a programme: a shared standard running from Kids Volley to the first team, across both branches, that survives a change of coaches. That standard is written here and embedded in the federation's official structure.",
 lede:"The club already has the hardest thing to get: an NLA team in the same building. What is missing is the road connecting a nine-year-old to that court — and the same road for everyone, whoever happens to be coaching.",
 cifras:[{n:"9",d:"stages under one technical standard"},{n:"5",d:"measurable club commitments"},
         {n:"3",d:"rollout phases, the first at no extra cost"},{n:"0",d:"francs needed to start"}],
 b1:"The problem it solves",
 p1:[["Every category is a different club.","A player moving up changes vocabulary, system and expectations. Half a season goes into translating what they already knew. With coach turnover, the problem multiplies."],
     ["Nobody owns the player's total load.","The one who performs trains in three structures and plays two tournaments a month. No coach is doing anything wrong; the total simply appears on nobody's sheet. It is the direct route to an overuse injury."],
     ["There are no criteria for decisions about a player.","Who moves up, who goes to the regional trial, who needs more. Today it is decided on impression — and an impression cannot be explained to a family."],
     ["The club cannot show what it does.","To Swiss Volley, to a sponsor, to a family choosing where to enrol their daughter: there is no document. The work exists but it is invisible."]],
 b2:"What this framework is",
 p2:"Three pieces. A <strong>backbone</strong> defining what is taught at each stage and in what order, so nothing is repeated and nothing is left out. A <strong>load management system</strong> giving every player a number and a person responsible for it. And a <strong>pathway</strong> connecting each stage to the Swiss talent structure, in both branches.",
 p2b:"It is built on the official Swiss Volley categories, borrows the coach certification and child protection standard from the United States, and the develop-through-competition model from Italy. It is not an opinion: every claim states where it comes from, and the club's own decisions are labelled as such.",
 b3:"The five commitments",
 p3:[["No player trains without a defined weekly ceiling.","One total, one person responsible, monthly review. No more accumulating stimuli because nobody added them up."],
     ["Twenty minutes of prevention in every session.","This is not a warm-up. It is the only window in an athletic life where preventive work demonstrably works — and it also improves jump height."],
     ["Two measurement rounds a year, same protocol.","October and March. After two seasons the club has its own reference values and stops guessing."],
     ["Every player with the profile goes to the regional trial.","No exceptions, and not dependent on a coach remembering."],
     ["The same technical language from Kids Volley to the first team.","One word per concept. That is what stops a stage change from costing half a season."]],
 b4:"How we measure whether it works",
 p4:[["Retention","Share of players still in the club the following season. The most honest indicator of a youth programme — and the stated goal of Smart Competitions."],
     ["Overuse injuries","Number and days lost. It has to come down. It also matters to the insurer and to families."],
     ["Players in the Talentpool","How many reach the federation structure. That is what Swiss Volley looks at."],
     ["Internal promotions","Club-developed players reaching the first team. The end goal."],
     ["Training density","Quality ball contacts per player per session. Auditable by walking into the gym."]],
 cierre:"<strong>Why now.</strong> All of the above can start this season without a single extra franc: these are decisions about method, not budget. The one thing that will not wait is the October measurement — miss that window and a full year of baseline data is gone."
},

marco:{
 p:"Swiss Volley's <strong>FTEM framework</strong> organises the career into phases: anyone not identified as a talent sits in <em>Foundation</em>, and phases T1 to T4 run from regional identification to NLA-level performance centres. Annual assessment follows the <strong>PISTE</strong> model with a national Entwicklungstest. The regional <strong>Talentsichtung</strong> opens the <strong>Talentpool</strong>, which gives access to the development structures and to the federation's athletic programme; the <strong>Swiss Olympic Talent Card</strong> certifies the player as a sporting talent to schools and authorities. In the GSGL region the trials are held in Jona and Chur.",
 m:"On the men's side the regional road continues through Jona, and the visible ceiling is in the same building: the first team in the NLA. It is an advantage almost no development club has, and it should be used — a Kids Volley child needs to watch them play.",
 f:"On the women's side the road runs through the federation's regional and national structures and, within the club, culminates in the first team in the <strong>1st League</strong>. A Future 3 player has a concrete, reachable destination in her own building — and she should know it from Kids Volley onwards."
},

vol:{
 b:"Volume: the framework adapts to whatever gym time exists",
 intro:"Gym hours change every season. So the framework does not fix a volume: it fixes a target range per stage and calculates, from whatever the club has that year, how much is missing. Change the values and everything recalculates.<br><br><strong>The fourth field is what makes the sum honest.</strong> On the men's side many youth players also play for one of the club's senior teams. Those hours and matches belong in the same total: the body does not distinguish which structure the load came from.",

 nota:"<strong>Multi-group is not a problem: it is the mechanism.</strong> With short sessions, the middle and upper stages need a second group, or a senior team, to reach the range. <strong>And a precedence rule, because the document holds two tables of hours.</strong> This range states what the <em>stage</em> needs in order to develop. A player’s actual ceiling is set by their <em>age</em>, in the Roster tab. Where the two disagree — and in several combinations they do — age wins: the stage points the direction, the body sets the limit. What needs fixing is not that young players train in several structures — it is that today they do so according to gym availability rather than technical direction, and that nobody adds up the total.",
 limites:"Limits that do not depend on the gym: weekly hours of organised sport no greater than the player's age in years, two full rest days per week, one organised sport per season, and fewer than eight months a year in the same sport."

matriz:{
 eyebrow:"The piece that turns nine stages into a programme",
 titulo:"Backbone",
 intro:"None of this depends on how many players there are or what gym slots are available. It is set once and it orders the nine stages. The priorities on every stage sheet come from here — which is why no content is repeated twice and none is left out.",
 aviso:"<strong>Two kinds of row, and they should not be confused.</strong> Rows marked Swiss Volley are imposed by the playing system of each stage: they are not discussed, they are complied with. Rows marked Club are our decision and are reviewed every season. In front of the board these are two different conversations.",
 b1:"Technical matrix",
 b1p:"Each skill appears as new content at one stage only, and is maintained thereafter. A coach wondering whether reading block is on their plate looks at one cell.",
 b2:"Tactical matrix",
 b2n:"<strong>Competing with a system and learning it are two different things.</strong> Swiss Volley defines which system is <em>played</em> at each stage, and that is not open to discussion. When it is <em>taught</em> is the club decision, and here we make a deliberate one: the 5-1 is explained from the moment the full court appears, in Rookie 3, even though it is three stages away from being played. The reason is simple: you cannot consolidate in Future 3 something the player has never seen. The same applies to the 6-2, introduced in Future 1. By the time they reach the stage where that system is the official one, they already understand it from the inside, and the season is spent playing it better rather than discovering it.<br><br>Whenever a row jumps two levels from one column to the next, it is always for the same reason: at that stage the system is the official one, and a full season of competing does the work of introducing and developing on its own.",
 b2p:"Here the system progression set by Swiss Volley becomes clearly visible: 3v3, then 4v4 with penetration from position 1, then full court with 6-6, then 6-2 and finally 5-1.",
 b3:"Athletic tiers: by maturation, not by age",
 b3p:"Two players at the same stage can be three years apart biologically, and girls mature earlier than boys. So physical work is not assigned by stage: it is assigned by tier. The stage sits on top, but the body decides. It is the same logic Swiss Volley applied when it decoupled playing level from chronological age.",
 b3d:"How a player is placed: measure standing height every three months. A sharp jump indicates the growth spurt. No equipment needed, only consistency.",
 esc:[
  {t:"Tier 1 — Before the growth spurt",w:"Predominant in Kids Volley and Rookie 1",c:"#FAE149",l:[
   "Coordination, agility and balance. The golden window for learning how to move.",
   "Strength using body weight only, and in game form.",
   "Low jumps with the focus on the landing, not the height.",
   "No external loads. No repeated maximal-intensity work.",
   "Multi-sport participation actively encouraged."]},
  {t:"Tier 2 — During the growth spurt",w:"Common in Rookie 2 and 3 · earlier on the women's side",c:"#F26A4F",l:[
   "The highest-risk tier: during the spurt the patellar tendon works close to its tolerance threshold.",
   "Jump volume goes <em>down</em>, not up. Counter-intuitive and decisive.",
   "Eccentric strength and landing control: the absolute priority.",
   "Lifting technique with a stick or an empty bar. The movement is learned, not loaded.",
   "Mobility: bone grows before muscle and everything gets short.",
   "High tolerance for clumsiness. It is temporary and predictable."]},
  {t:"Tier 3 — After the growth spurt",w:"Usual from Future 1 · earlier on the women's side",c:"#0E2A8A",l:[
   "The strength window is open: now progressive loading.",
   "Structured plyometrics and power work.",
   "Individual programming with load monitoring.",
   "For women, neuromuscular work remains mandatory: this is the stretch where it genuinely protects."]}],
 nivI:"Introduced",nivD:"Developed",nivC:"Consolidated",nivM:"Mastered",nivX:"Not worked on",

etapas:{
 kv1:{n:"Catch and throw",e:"Kids Volley 1 · ages 5 to 10",

  tec:[["Catching above the head","Hands above the head, forming a triangle. It is the setting posture before setting exists."],
       ["Throwing with two hands","From above the head, with leg extension. Later that same movement becomes the set."],
       ["Getting under the ball","Almost every error at this age is a footwork error disguised as a hands error."]],
  tac:[["Covering space in 3v3","Two in front, one behind. Understanding that the court is covered together."],
       ["Calling for the ball out loud","Communication is taught here or it is never taught."]],
  ses:[[15,"Opening game","Catching, throwing, running, jumping and landing. Playful, no queues."],
       [20,"Technical priority 1","As many repetitions as possible. Several balls, groups of two or three."],
       [20,"Priorities 2 and 3","With a partner and a low net. Always with a decision inside."],
       [25,"3v3 game","Kids Volley rules. They actually play."],

  est:[["Catches above the head","8 out of 10, with the hands and not the chest"],
