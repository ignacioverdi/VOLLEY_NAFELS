{n:"1:1, 2:2 und 3:3 auf kleinem Feld",f:"Brasilien · CBV",o:"Dass jedes Kind viele Male pro Minute lösen muss. Je weniger auf dem Feld, desto öfter kommt es dran.",a:"Felder von 6×3 bis 12×4,5 m mit Netz auf 1,80 bis 2,20 m. So viele Felder, wie in die Halle passen.",r:"Direktball verboten, Block verboten. Das Service wird geworfen, getippt oder von unten gespielt.",esc:"L5 1:1 und 2:2 mit fangen und werfen · L4 3:3 mit gespieltem erstem Kontakt.",e:"Ein einziges grosses Feld für zwanzig Kinder. Mit vier kleinen Feldern berührt jedes den Ball viermal so oft."},
{n:"König des Feldes auf kleinem Feld",f:"Gold Medal Squared",o:"Durchgehender Wettkampf mit maximaler Dichte, und ungleiche Gruppen lösen, ohne zu improvisieren.",a:"Zweierteams auf einem halben Feld. Es gibt Konfigurationen für 8, 10, 12, 14 und 16 Personen.",r:"Das gewinnende Team bleibt; das verlierende geht raus und das wartende kommt rein. Nach jeder Runde werden die Teams gemischt.",esc:"L5 fangen und werfen · L4 drei Pflichtkontakte · ab L3 ganzes Feld.",e:"Dieselben Teams die ganze Einheit lassen. Nach jeder Runde wird gemischt."},
{n:"Mattenparcours für das Service",f:"mobilesport",o:"Das Service von unten aus dem Wurf ableiten, den das Kind schon beherrscht.",a:"Matten oder Reifen als Ziele in wachsender Entfernung vom Netz.",r:"Man rückt erst zum nächsten Ziel vor, wenn drei in Folge treffen. Wer fehlt, geht ein Ziel zurück.",esc:"L5 beidhändig werfend · L4 Service von unten aus der Feldmitte · L3 von der Grundlinie.",e:"Am ersten Tag alle an die Grundlinie stellen. Man rückt das Ziel näher, statt den Anspruch zu senken."},
{n:"Der Ball berührt den Boden nicht",f:"NLA-Playbook",o:"Den Satz der ersten Mannschaft ab dem ersten Tag verankern, und zwar messbar.",a:"Freies Spiel auf kleinem Feld, Gruppen zu dritt oder viert.",r:"Gezählt wird, wie viele Bälle fielen, ohne dass sich jemand bewegt hat. Tagesziel ist, diese Zahl zu senken, nicht zu gewinnen.",esc:"L5 und L4 mit erlaubtem Fangen · ab L3 alles gespielt.",e:"Punkte zählen. Hier zählt man die Bälle, die unberührt gefallen sind."},
{n:"Alle haben eine Aufgabe",f:"Japan · JVA",o:"Dass mit dreissig Kindern und einem Feld niemand herumsteht.",a:"Gleichzeitige Stationen: ein kleines Feld im Spiel, eine Wand mit Zuspielen, ein Präzisionsreifen, eine Landungsstation.",r:"Rotiert wird nach Zeit, nicht nach Resultat. An keiner Station wird gewartet.",esc:"Gilt für L5 und L4 unverändert. Auf L3 werden aus den Stationen Spielsituationen.",e:"Eine Station stehen lassen, an der gewartet wird. Gibt es eine Schlange, ist die Station falsch gebaut."},
{n:"Oben fangen, oben werfen",f:"Kessel · Minivolley",o:"Dass die Hände dort sind, wo sie beim späteren oberen Zuspiel sein werden.",a:"Zu zweit, ein Ball pro Paar, ohne Netz oder mit tiefem Netz.",r:"Es zählt nur, wenn über dem Kopf gefangen und von oben geworfen wurde. Vor der Brust fangen zählt nicht.",esc:"L5 die ganze Übung · L4 das Fangen wird durch das Zuspiel ersetzt, der Wurf bleibt.",e:"Mit Worten korrigieren. Fängt das Kind vor der Brust, wirf den Ball höher: Die Höhe korrigiert von selbst."},
{n:"Drei Kontakte oder ungültig",f:"Brasilien · CBV",o:"Dass die Regel den Aufbau erzeugt, ohne dass die Trainerperson ihn einfordert.",a:"Spiel 3:3 oder 4:4 auf kleinem Feld.",r:"Der Punkt zählt nicht ohne drei Kontakte. Der Direktball ist Punkt für den Gegner.",esc:"L5 mit gefangenem zweitem Kontakt · L4 alles gespielt.",e:"Die Regel aufheben, wenn es schwierig wird. Genau dann lehrt sie."},
{n:"Landungen im Einstiegsspiel",f:"mobilesport",o:"Die Landung auf zwei Füssen mit ausgerichtetem Knie täglich verankern.",a:"Tiefer Kasten oder Linie. Sie springen, landen, und ein Ball wartet.",r:"Der Sprung zählt nicht, wenn die landende Person nicht bereit für den nächsten Ball ist.",esc:"L5 vom Boden · L4 vom tiefen Kasten · L3 Blocksprung.",e:"Es als separaten Präventionsblock machen. Es gehört ins Einstiegsspiel."},
{n:"Der Ball fällt weit weg",f:"Polen",o:"Dass die Füsse vor den Armen arbeiten — der universelle Fehler dieses Alters.",a:"Zu zweit oder zu dritt; wer wirft, muss den Ball weit von der annehmenden Person fallen lassen.",r:"Es zählen nur Bälle, die mit ruhigen Füssen gespielt werden. Wer sich streckt, zählt nicht.",esc:"L5 fängt · L4 spielt oben oder unten, je nach Ball.",e:"Bequem werfen, damit es gelingt. Kommt der Ball ohne Bewegung an, wurde nichts trainiert."},
{n:"Wähle die Lücke",f:"NLA-Playbook",o:"Der Beginn der taktischen Absicht: hinschauen, bevor der Ball hinübergeht.",a:"Zwei mit Hütchen markierte Zonen im gegnerischen Feld.",r:"Die Zone wird vor dem Schlag angesagt. Trifft sie, Doppelpunkt. Ohne Ansage zählt es nicht, auch wenn der Ball drin landet.",esc:"L5 mit Eigenzuspiel und Schlag aus dem Stand · L4 mit Sprungangriff.",e:"Die Härte belohnen. Belohnt wird die erfüllte Absicht."},
{n:"Zählung der Gruppe",f:"Polen",o:"Die Einheit mit Druck beginnen und mit billigem Fehler.",a:"Die ganze Gruppe, ein Ball, ohne Netz oder mit tiefem Netz.",r:"Es wird vom Gruppenrekord rückwärts gezählt. Fällt der Ball, gehen fünf verloren, es wird nicht alles neu gestartet.",esc:"L5 Ziel 15 · L4 Ziel 30 mit drei Kontakten.",e:"Bei jedem Fall auf null zurücksetzen. Das lehrt, nicht zu riskieren."},
{n:"Miniturnier über fünf Minuten",f:"Polen",o:"Frühe Wettkampferfahrung in einem tragenden Umfeld.",a:"So viele kleine Felder wie möglich, Teams zu zweit oder zu dritt, Rotation alle fünf Minuten.",r:"Es wird mit Resultat gespielt. Wer verliert, wechselt das Feld. Niemand bleibt je draussen.",esc:"L5 2:2 mit Fangen · L4 3:3 gespielt.",e:"K.-o.-Runden bauen. Wer verliert, muss weiterspielen, nicht zuschauen."}];

{n:"1v1, 2v2 and 3v3 on a reduced court",f:"Brazil · CBV",o:"So every child solves the game many times a minute. The fewer on court, the more often their turn comes.",a:"Courts from 6×3 to 12×4.5 m with the net at 1.80 to 2.20 m. As many courts as fit in the gym.",r:"First ball over is banned and blocking is banned. The serve is thrown, tapped or underhand.",esc:"L5 1v1 and 2v2 with catch and throw · L4 3v3 with the first contact played.",e:"Setting up one big court for twenty children. With four small courts each one touches the ball four times as often."},
{n:"Monarch of the court on a small court",f:"Gold Medal Squared",o:"Continuous competition at maximum density, and solving uneven groups without improvising.",a:"Teams of two on half a court. There are configurations for 8, 10, 12, 14 and 16 players.",r:"The winning team stays; the losing one goes off and the waiting one comes in. After each round the teams are mixed.",esc:"L5 catch and throw · L4 three compulsory contacts · from L3 on, full court.",e:"Keeping the same teams all session. They get mixed after every round."},
{n:"Mat course for serving",f:"mobilesport",o:"Deriving the underhand serve from the throw the child already knows.",a:"Mats or hoops as targets at increasing distances from the net.",r:"You move to the next target only after three in a row. Miss and you go back one.",esc:"L5 throwing two-handed · L4 underhand serve from mid-court · L3 from the baseline.",e:"Putting everyone on the baseline on day one. You move the target closer, you do not lower the demand."},
{n:"The ball does not hit the floor",f:"NLA playbook",o:"Installing the first team's line from day one, and making it measurable.",a:"Free play on a small court, groups of three or four.",r:"You count how many balls landed without anybody moving to get them. The day's target is to lower that number, not to win.",esc:"L5 and L4 with catching allowed · from L3 on, everything played.",e:"Counting points. Here you count the balls that dropped untouched."},
{n:"Everyone has a job",f:"Japan · JVA",o:"So that with thirty children and one court nobody is standing around.",a:"Simultaneous stations: a small court in play, a wall for setting, a precision hoop, a landing station.",r:"You rotate on time, not on result. Nobody waits their turn at any station.",esc:"Works at L5 and L4 as it stands. At L3 the stations become game situations.",e:"Leaving a station where people wait. If there is a queue, that station is badly built."},
{n:"Catch high, throw high",f:"Kessel · Minivolley",o:"So the hands are where they will need to be once the overhead touch arrives.",a:"In pairs, one ball each, with no net or a low net.",r:"It only counts if they caught above the head and threw from above. Catching at the chest does not count.",esc:"L5 the whole drill · L4 the catch is replaced by the touch and the throw stays.",e:"Correcting with words. If they catch at the chest, throw the ball higher: height corrects by itself."},
{n:"Three contacts or it does not count",f:"Brazil · CBV",o:"Letting the rule produce the building, without the coach asking for it.",a:"3v3 or 4v4 on a reduced court.",r:"The point does not count without three contacts. Returning the first ball is a point for the opponent.",esc:"L5 with the second contact caught · L4 everything played.",e:"Lifting the rule when it gets hard. That is exactly when it teaches."},
{n:"Landings in the opening game",f:"mobilesport",o:"Installing the two-footed landing with the knee aligned, every day.",a:"Low box or a line. They jump, land, and a ball is waiting.",r:"The jump does not count if the person landing is not ready for the next ball.",esc:"L5 from the floor · L4 from a low box · L3 blocking jump.",e:"Doing it as a separate prevention block. It goes inside the opening game."},
{n:"The ball lands far away",f:"Poland",o:"Getting the feet to work before the arms, which is the universal error at this age.",a:"In twos or threes; whoever throws has to make the ball land away from the receiver.",r:"Only balls played with still feet count. Reaching for it does not count.",esc:"L5 catches · L4 plays overhead or forearm depending on the ball.",e:"Throwing comfortably so it works. If the ball arrives without them moving, nothing was trained."},
{n:"Choose the gap",f:"NLA playbook",o:"The beginning of tactical intent: looking before sending the ball over.",a:"Two zones marked with cones in the opponent's court.",r:"The zone is called before striking. Hit it and it is a double point. No call and it does not count, even if the ball lands in.",esc:"L5 with a self-toss and a standing strike · L4 with a jump attack.",e:"Rewarding power. What gets rewarded is the intention delivered."},
{n:"The group's count",f:"Poland",o:"Starting the session with pressure and with a cheap error.",a:"The whole group, one ball, no net or a low net.",r:"You count backwards from the group's record. If the ball drops, five are lost, you do not restart everything.",esc:"L5 target 15 · L4 target 30 with three contacts.",e:"Resetting to zero every time it drops. That teaches them not to risk anything."},
{n:"Five-minute mini tournament",f:"Poland",o:"Early exposure to competition in an environment that supports it.",a:"As many small courts as fit, teams of two or three, rotating every five minutes.",r:"Played with a score. Whoever loses moves court. Nobody is ever left out.",esc:"L5 2v2 with catching · L4 3v3 played.",e:"Building knockout brackets. Whoever loses has to keep playing, not watch."}];

e-outs seguidos · ", "de": "L4 Ziel zwei Side-outs in Folge · ", "en": "L4 target two side-outs in a row · "}, "EJC|12": {"es": "L4 llegar con la pelota jugable, sin referencia de distancia · ", "de": "L4 einen spielbaren Ball hinbringen, ohne Distanzvorgabe · ", "en": "L4 deliver a playable ball, with no distance reference · "}, "EJC|13": {"es": "L4 un solo aro, grande y cerca · ", "de": "L4 ein einziger Reifen, gross und nah · ", "en": "L4 a single hoop, large and close · "}, "EJC|14": {"es": "L4 dos toques y devolver alto · ", "de": "L4 zwei Kontakte und hoch zurückspielen · ", "en": "L4 two contacts and return high · "}, "EJC|15": {"es": "L4 la primera pelota va obligatoriamente al del medio · ", "de": "L4 der erste Ball geht zwingend zur Person in der Mitte · ", "en": "L4 the first ball must go to the player in the middle · "}, "EJC|16": {"es": "L4 bloques de cuatro, defensa y devolución construida · ", "de": "L4 Blöcke zu vier, Abwehr und aufgebautes Rückspiel · ", "en": "L4 blocks of four, dig and a built return · "}, "EJC|17": {"es": "L3 una sola llamada · ", "de": "L3 ein einziger Call · ", "en": "L3 a single call · "}, "EJC|19": {"es": "L4 secuencia conocida y devolución alta · ", "de": "L4 bekannte Reihenfolge und hohes Rückspiel · ", "en": "L4 known sequence and a high return · "}, "EJC|20": {"es": "L4 cuatro pelotas, sin money ball · ", "de": "L4 vier Bälle, ohne Money Ball · ", "en": "L4 four balls, no money ball · "}, "EJC|21": {"es": "L3 umbrales muy anchos · ", "de": "L3 sehr weite Schwellen · ", "en": "L3 very wide thresholds · "}, "EJC|22": {"es": "L5 atrapando y lanzando en la franja · ", "de": "L5 fangen und werfen auf der Bahn · ", "en": "L5 catching and throwing on the strip · "}};

function vPlantel(){
  const lista = plFiltrado();
  const grupos = {};
  lista.forEach(function(j){ (grupos[claveDe(j)] = grupos[claveDe(j)] || []).push(j); });
  const claves = Object.keys(grupos).sort();
  const tot = PLANTEL.length;
  const alerta = PLANTEL.filter(function(j){ return estadoDe(j)[0]==="alerta"; }).length;
  const critico = PLANTEL.filter(function(j){ return estadoDe(j)[0]==="critico"; }).length;
  const conLiga = PLANTEL.filter(function(j){ return j.liga && j.liga!=="—"; }).length;

  const opt = function(v,txt,sel){ return '<option value="'+v+'"'+(v===sel?" selected":"")+">"+txt+"</option>"; };
  const selGrupo = function(j){ return EQUIPOS[j.rama].form.map(function(x){ return opt(x,x,j.grupo); }).join(""); };
  const selLiga  = function(j){ return EQUIPOS[j.rama].liga.map(function(x){ return opt(x,x,j.liga); }).join(""); };

  const fila = function(j){
    const st = estadoDe(j), e = edadDe(j), r = rangoDe(j);
    return '<tr>'
      + '<td><input class="pl-edit" value="'+(j.nombre||"").replace(/"/g,"&quot;")+'" onchange="plSet('+j.id+',\'nombre\',this.value)"></td>'
      + '<td><input class="pl-edit" type="number" style="width:74px" value="'+(j.jg||"")+'" onchange="plSet('+j.id+',\'jg\',this.value)"></td>'
      + '<td class="num">'+(e===null?"—":e)+'</td>'
      + '<td><select class="pl-edit lvl-sel'+(j.lvl?' l'+j.lvl:'')+'" onchange="plSet('+j.id+',\'lvl\',this.value)">'
        +'<option value="">—</option>'+LV().map(function(L){return '<option value="'+L.n+'"'+(Number(j.lvl)===L.n?" selected":"")+'>L'+L.n+'</option>';}).join("")+'</select></td>'
      + '<td><select class="pl-edit" onchange="plSet('+j.id+',\'rama\',this.value)">'+opt("m",S("plMasc"),j.rama)+opt("f",S("plFem"),j.rama)+'</select></td>'
      + '<td><select class="pl-edit" onchange="plSet('+j.id+',\'grupo\',this.value)">'+selGrupo(j)+'</select></td>'
      + '<td><select class="pl-edit" onchange="plSet('+j.id+',\'liga\',this.value)">'+selLiga(j)+'</select></td>'
      + '<td><select class="pl-edit" onchange="plSet('+j.id+',\'pos\',this.value)">'+PZ().map(function(x){return opt(x===PZ()[0]?"":x,x,j.pos||"");}).join("")+'</select></td>'
      + '<td><input class="pl-edit" type="number" step="0.5" style="width:64px" value="'+(j.h||0)+'" onchange="plSet('+j.id+',\'h\',this.value)"></td>'
      + '<td><input class="pl-edit" type="number" step="1" style="width:58px" value="'+(j.comp||0)+'" onchange="plSet('+j.id+',\'comp\',this.value)"></td>'
      + '<td class="num">'+(r?r[0]+"–"+r[1]+" h":"—")+'</td>'
      + '<td><span class="pill '+st[0]+'">'+st[1]+'</span></td>'
      + '<td><button class="btn-x" title="'+S("plQuitar")+'" onclick="plDel('+j.id+')">×</button></td></tr>'
      + (j.nota ? '<tr class="pl-nota"><td colspan="13"><span>'+(j.lic?'<b>'+j.lic+'</b> · ':'')+j.nota+'</span></td></tr>' : "")
      + (PL_CONTACTO ? '<tr class="pl-cont"><td colspan="13"><span>'+contactoDe(j)+'</span></td></tr>' : "");
  };

  const tabla = function(js){
    return '<div class="tabla-envoltura"><table><thead><tr>'
      + S("plTh").slice(0,3).concat([S("lvlCol")]).concat(S("plTh").slice(3,6)).concat(["Posición"]).concat(S("plTh").slice(6)).concat([""]).map(function(x){ return "<th>"+x+"</th>"; }).join("")
      + '</tr></thead><tbody>' + js.map(fila).join("") + '</tbody></table></div>';
  };

  return '<div class="enc"><div class="eyebrow">'+S("plEye")+'</div>'
    + '<h2>'+S("plTit")+'</h2><p>'+S("plIntro")+'</p></div>'

    + '<div class="pl-res" style="margin-top:24px">'
    + '<div style="--c:#FA844E"><b>'+tot+'</b><span>'+S("plRes")[0]+'</span></div>'
    + '<div style="--c:#EE4655"><b>'+conLiga+'</b><span>'+S("plRes")[1]+'</span></div>'
    + '<div style="--c:#FAE149"><b>'+alerta+'</b><span>'+S("plRes")[2]+'</span></div>'
    + '<div style="--c:#0E2A8A"><b>'+critico+'</b><span>'+S("plRes")[3]+'</span></div></div>'

    + '<div class="pl-barra no-imprimir">'
    + '<div class="pl-campo"><label>'+S("plNombre")+'</label><input class="txt" id="plNombre" placeholder="'+S("plPh")+'" onkeydown="if(event.key===\'Enter\')plAdd()"></div>'
    + '<div class="pl-campo"><label>'+S("plAnio")+'</label><input type="number" id="plJg" placeholder="2012" onkeydown="if(event.key===\'Enter\')plAdd()"></div>'
    + '<div class="pl-campo"><label>'+S("plRama")+'</label><select id="plRama" onchange="plRamaForm()"><option value="m">'+S("plM")+'</option><option value="f">'+S("plF")+'</option></select></div>'
    + '<div class="pl-campo"><label>'+S("plGrupo")+'</label><select id="plGrupo">'+EQUIPOS.m.form.map(function(x){return "<option>"+x+"</option>";}).join("")+'</select></div>'
    + '<div class="pl-campo"><label>'+S("plLiga")+'</label><select id="plLiga">'+EQUIPOS.m.liga.map(function(x){return "<option>"+x+"</option>";}).join("")+'</select></div>'
    + '<div class="pl-campo"><label>'+S("plH")+'</label><input type="number" step="0.5" id="plH" value="3"></div>'
    + '<div class="pl-campo"><label>'+S("plComp")+'</label><input type="number" step="1" id="plComp" value="1"></div>'
    + '<button class="btn-s" onclick="plAdd()">'+S("plAdd")+'</button></div>'

    + '<div class="lvl-tablero no-imprimir"><b>'+S("lvlDividir")+'</b>'
      + LV().map(function(L){
          const n = lista.filter(function(x){return Number(x.lvl)===L.n;}).length;
          return '<span class="lvl-chip l'+L.n+'" title="'+L.senal+'">L'+L.n+' '+L.t+' <i>'+n+'</i></span>';
        }).join("")
      + '<span class="lvl-chip l0">'+S("lvlSin")+' <i>'+lista.filter(function(x){return !x.lvl;}).length+'</i></span></div>'
    + '<div class="pl-barra no-imprimir" style="border-color:var(--gris-claro)">'
    + '<div class="pl-campo"><label>'+S("plAgrupar")+'</label><select onchange="PL_AGRUPAR=this.value;render()">'
      + opt("grupo",S("plPorGrupo"),PL_AGRUPAR)+opt("liga",S("plPorLiga"),PL_AGRUPAR)
      + opt("jg",S("plPorAnio"),PL_AGRUPAR)+opt("rama",S("plPorRama"),PL_AGRUPAR)
      + opt("estado",S("plPorEstado"),PL_AGRUPAR)+opt("niv",S("lvlPor"),PL_AGRUPAR)+opt("pos","Posición",PL_AGRUPAR)+opt("lic","Licencia",PL_AGRUPAR)+'</select></div>'
    + '<div class="pl-campo"><label>'+S("plRama")+'</label><select onchange="PL_RAMA=this.value;render()">'

        : S("plNota2"))+'</div>'

ENSC.gen = {
 t:"Cómo se enseña en este club",
 sub:"Instructivo general · la base metodológica que comparten los nueve grupos",
 p:"Esta solapa no dice cómo dar el entrenamiento. Dice <strong>qué tiene que aprender el jugador en cada etapa, por qué, y bajo qué principios se enseña</strong>. Dos entrenadores pueden dar sesiones completamente distintas y las dos estar bien, siempre que respeten estos principios y que al salir de la etapa el jugador entienda lo mismo.",
 bloques:[
  {h:"De dónde sale esta metodología",
   p:"No la inventamos. Se apoya en tres cuerpos que coinciden entre sí más de lo que uno esperaría. El <strong>marco suizo</strong>, que define qué se compite en cada etapa. La <strong>escuela americana de aprendizaje motor</strong>, construida por Carl McGown, doctor en aprendizaje motor de la Universidad Brigham Young, junto a Doug Beal y Marv Dunphy —oro olímpico en 1984 y 1988— en el sistema Gold Medal Squared, y por John Kessel, treinta años director de desarrollo deportivo de USA Volleyball. Y los <strong>cuatro pilares</strong> del propio proyecto del club: técnica, táctica, físico y mental.",
   f:"Cuando las tres coinciden, no es opinión. Es el estado del conocimiento."},
  {h:"El gesto no se parte en pedazos",
   p:"Es el principio más importante y el más incómodo, porque va contra cómo casi todos aprendimos a entrenar. La revisión de la literatura no encontró <strong>un solo estudio</strong> que favoreciera enseñar por partes frente a enseñar el gesto entero, y varios trabajos muestran que el entrenamiento por partes produce transferencia negativa: el jugador aprende algo que después le estorba. El motivo es neurológico: el cerebro no es un procesador en serie que arma después las piezas que le enseñaste sueltas.",
   f:"No existe «primero la técnica aislada y después jugamos». El gesto se entrena entero desde el primer día. Bloques ordenados solo en los primeros minutos de algo nuevo, y siempre del gesto completo."},
  {h:"Lo que se simplifica es el entorno, no el gesto",
   p:"Acá está la salida, y es exactamente lo que hace el sistema suizo. Si el jugador es principiante, no le partas el gesto: bajale la cantidad de información del ambiente. <strong>Red más baja, cancha más chica, menos jugadores, pelota más liviana.</strong> Esa frase está en el paper de McGown como ejemplo para entrenar chicos, y es literalmente la definición de Kids Volley y de Rookie. Smart Competitions es la doctrina americana del aprendizaje motor convertida en sistema de competencia.",
   f:"Reducí la información del ambiente. Nunca reduzcas el gesto."},
  {h:"Desordenado le gana a ordenado",
   p:"Repetir la misma acción muchas veces seguidas hace que el jugador se vea mejor <em>durante</em> el entrenamiento, y peor en el partido. Entrenar en orden aleatorio hace lo contrario: el jugador se ve peor en el entrenamiento y retiene mucho más. Es un resultado replicado en vóley, bádminton, béisbol, básquet, tenis y fútbol, y la explicación es que la práctica variable fortalece las conexiones cerebrales del aprendizaje motor mientras que repetir lo mismo no produce efecto medible sobre ellas. Y hay un dato que nos toca de lleno: <strong>el efecto del entrenamiento aleatorio es todavía más fuerte en chicos que en adultos.</strong>",
   f:"Si el ejercicio se ve lindo, sospechá. El progreso real se ve feo mientras pasa."},
  {h:"El mejor ejercicio de recepción es recepción, armado y ataque",
   p:"La frase es de Marv Dunphy, campeón olímpico en 1988: el mejor ejercicio de recepción es recibir-armar-atacar, el mejor de armado es recibir-armar-atacar, el mejor de ataque es recibir-armar-atacar. La razón es la especificidad: los beneficios de un estímulo de entrenamiento solo aparecen cuando ese estímulo reproduce los movimientos del deporte. Un entrenador arriba de una silla pegándole a los defensores no es un estímulo que exista en un partido, y por lo tanto entrena poco.",
   f:"Si la acción no aparece así en un partido, estás entrenando otra cosa."},
  {h:"Los siete controles antes de armar un ejercicio",
   p:"Esta lista sale del cuaderno de Gold Medal Squared y es lo más práctico de todo el material. Antes de dar un ejercicio, revisá: la <strong>posición y el movimiento</strong> de los jugadores en la cancha; su <strong>orientación respecto de la red</strong>; la <strong>secuencia de acciones</strong> y su ritmo; el <strong>estímulo al que reaccionan</strong>, que tiene que ser el mismo del partido; <strong>cómo se puntúa</strong> y qué se premia; que la pelota <strong>termine de manera natural</strong> como termina un punto; y el <strong>momento, tipo y cantidad de devolución</strong> que das como entrenador.",
   f:"Si un ejercicio falla en tres de los siete, no lo arregles: cambialo."},
  {h:"Sin filas",
   p:"Es la consecuencia práctica de todo lo anterior y el indicador más fácil de auditar. Un jugador parado en una fila esperando que el entrenador le tire una pelota no está aprendiendo nada, y encima está haciendo un contacto que debería hacer él. Kessel lo dice para programas con doce a treinta y seis chicos y un solo entrenador, que es exactamente nuestra situación. En la planilla de observación de sesión, si hay una fila de más de cuatro esperando, el ejercicio está mal armado.",
   f:"Contá contactos por jugador cada cinco minutos. Es el número que mide de verdad un entrenamiento."},
  {h:"Qué hace el entrenador con esto",
   p:"Lee el instructivo de su categoría antes de la primera semana, elige sus propios ejercicios, y usa los recursos para ver el gesto terminado en video. Lo único que no es negociable son estos principios y los <strong>estándares de salida</strong> de su etapa, que están en la ficha de la categoría, en las solapas Masculino y Femenino."}],
 tabla:"Equivalencia de categorías",
 tablaP:"Los documentos del club están escritos en U13, U15, U17, U19 y U21. Swiss Volley organiza en Kids, Rookie y Future, y los equipos federados del club se llaman U14, U16, U18 y U20. Son tres nomenclaturas para las mismas edades y conviven, así que la tabla queda a la vista y cada entrenador encuentra su grupo en la columna que conoce.",
 th:["Etapa del modelo","Guía del club","Equipo federado","Edad","Nota"]
};

  {n:"Toque de arriba con destino",int:"Que la pelota llegue a un lugar, no solo que salga limpia.",pts:["El torso apunta al destino antes del contacto.","Altura suficiente para que el compañero tenga tiempo."],frase:"«¿Adónde querés que llegue esa pelota?»",err:"Toque limpio pero sin dirección. Se ve en que el compañero siempre tiene que correr.",arreglo:"Objetivos físicos: un aro, un compañero sentado, una zona marcada."},
  {n:"Autoelevación y ataque de pie",int:"El germen del remate, con la pelota bajo su propio control.",pts:["Se lanza la pelota adelante y arriba.","Golpea con la mano abierta y el brazo estirado.","Elige un hueco antes de golpear."],frase:"«Elegí el hueco antes de pegarle.»",err:"Le pegan a la pelota sin mirar adónde va.",arreglo:"Ponele dos zonas marcadas y que cante cuál antes de golpear."},
  {n:"Manchette como recurso",int:"Resolver la pelota baja o rápida que no se puede tocar de arriba.",pts:["Plataforma firme, brazos juntos.","Cuerpo detrás de la pelota.","Impulso con piernas."],frase:"«Si viene baja, brazos; si viene alta, manos.»",err:"Usan manchette para todo porque les da más seguridad.",arreglo:"Regla en el juego: el primer toque de la jugada tiene que ser de arriba cuando la pelota viene alta."}],
 tactica:[{n:"Construir en tres contactos",d:"El objetivo del equipo pasa a ser la jugada, no el punto. Se sostiene con la regla, no con el discurso."},
  {n:"Cobertura básica",d:"Quién acompaña al que ataca. Es la conducta colectiva más barata de instalar y la que más rallies gana."}],
 prog:[{p:"La jugada completa",d:"Recibir, armar, atacar. El mejor ejercicio de armado es recibir-armar-atacar."},
  {p:"Aleatorio",d:"La pelota viene de lugares distintos y sin avisar. Se van a ver peor que en un ejercicio ordenado: eso es correcto."},
  {p:"La regla hace la conducta",d:"El punto solo cuenta si el equipo construyó. No hace falta explicarlo diez veces."}],
 sesion:SES_KIDS,
 errDT:["Aceptar la devolución de primera cuando el partido se pone difícil. Ahí es justamente cuando hay que sostener la regla.","Entrenar el ataque sin recepción previa. El ataque aislado no transfiere.","Dejar el juego para el final y que no llegue el tiempo."],
 evalu:"Talla cada tres meses. Los estándares de salida están en la ficha de Kids Volley 3.",
 anio:ANIO_BASE});

Object.assign(ENSC.r1, {
 porque:"Desaparece el atrapar y todo pasa a jugarse. Es también la puerta de entrada más ancha que tiene el club: el reglamento admite Rookie hasta U18, así que un chico de quince que nunca jugó entra acá sin quedar expuesto contra pares con seis años de ventaja. El entrenador de esta etapa va a tener, casi seguro, jugadores con niveles muy distintos en el mismo grupo, y eso es normal y no un problema a corregir.",
 tecnica:[
  {n:"Recepción con manchette",int:"Mantener viva la jugada cuando viene el saque.",pts:["Plataforma firme, formada antes de que llegue la pelota.","Cuerpo detrás, no al costado.","Los hombros dirigen la pelota, no los brazos."],frase:"«Llevá la plataforma a la pelota, no la pelota a la plataforma.»",err:"Corrigen con los brazos porque llegaron tarde con los pies.",arreglo:"Ejercicios donde siempre tiene que desplazarse. Nunca recepción parado."},
  {n:"Toque de arriba para armar",int:"Darle a un compañero una pelota atacable.",pts:["Altura y separación de la red suficientes.","El torso apunta al atacante."],frase:"«El torso es la brújula.»",err:"Arman pegado a la red y el atacante no puede entrar.",arreglo:"Marcá en el piso la línea de separación mínima."},
  {n:"Ataque de pie con dirección",int:"Elegir adónde va la pelota antes de golpear.",pts:["Golpe con mano abierta y brazo estirado.","Contacto adelante del cuerpo.","La dirección se elige antes."],frase:"«¿A qué hueco le pegaste?»",err:"Pegan fuerte al medio de la cancha rival.",arreglo:"Zonas marcadas y punto doble por zona elegida."}],
 tactica:[{n:"Construir en tres",d:"La regla del punto extra por cuatro ataques al campo rival ya premia esto. Usá la regla del reglamento en vez de inventar una."},
  {n:"Roles en el 3:3",d:"Quién recibe, quién arma, quién ataca, y que cambie en cada rotación."}],
 prog:[{p:"Gesto entero, siempre",d:"No existe el ejercicio de recepción sin armado y ataque después."},
  {p:"Bloques cortos, después aleatorio",d:"Cinco minutos ordenados al presentar algo nuevo, el resto desordenado."},
  {p:"Grupos de nivel dentro del grupo",d:"Con niveles distintos, no bajes el nivel de todos: armá dos canchas con reglas distintas y roten."},
  {p:"Si no les sale",d:"Red más baja, cancha más chica, menos jugadores. Nunca partir el gesto."}],
 sesion:SES_ROOKIE,
 errDT:["Tratar al que llega tarde al vóley como si estuviera atrasado. Es el destinatario principal de esta etapa.","Nivelar para abajo cuando hay diferencias grandes. Dos canchas con dos reglas resuelve lo que una cancha no puede.","Explicar la técnica en vez de cambiar la regla del juego."],
 evalu:"Primera medición completa en octubre y comparación en marzo. Los estándares están en la ficha de Rookie 1.",
 anio:ANIO_BASE});

Object.assign(ENSC.r2, {sesion:SES_ROOKIE, anio:ANIO_BASE,
 errDT:["Corregir las manos del armado cuando el problema es el momento de salida. Mirá los pies antes que las manos.","Subir el volumen de salto durante el pico de crecimiento porque «hay que aprovechar». Es al revés: baja.","Perder la paciencia con la descoordinación temporal. Es previsible y se va sola si no la castigás."],
 evalu:"Medición de octubre y marzo, y talla cada tres meses porque acá el pico de crecimiento decide la carga. Los estándares están en la ficha de Rookie 2."});

Object.assign(ENSC.r3, {
 porque:"Es el salto a la cancha completa y la primera etapa separada por sexo, así que es donde las dos ramas del club empiezan a necesitar cosas distintas de verdad. También es la edad de mayor rendimiento de la detección regional: un jugador que llega bien a Rookie 3 es un candidato real al Talentpool. Y en la rama femenina es la ventana donde el trabajo neuromuscular protege de verdad, cosa que después de los dieciocho ya no ocurre.",
 tecnica:[
  {n:"Saque de arriba desde el fondo",int:"Que el saque empiece el punto a favor y no sea un trámite.",pts:["Lanzamiento adelante y constante.","Contacto arriba con brazo estirado.","El cuerpo acompaña hacia adelante."],frase:"«El saque empieza el punto a nuestro favor o no lo empieza.»",err:"Sacan suave para no errar y regalan la iniciativa.",arreglo:"Acordá una tasa de error aceptable antes de la serie. Sin eso, todos sacan flojo."},
  {n:"Carrera de tres pasos",int:"El ritmo del ataque, que es lo que se desarma durante el pico de crecimiento.",pts:["Ritmo siempre igual: orientación, freno y paso de cierre.","Descenso del centro de gravedad y armado de brazos.","Contacto arriba y adelante."],frase:"«Tres pasos, siempre los mismos.»",err:"Carrera de dos pasos y contacto atrás de la cabeza.",arreglo:"Marca en el piso para el paso de freno, y carrera sin pelota antes."},
  {n:"Bloqueo técnico",int:"Aparecer sobre la red con las manos y llegar formado.",pts:["Manos penetrando, pulgares arriba.","Salto vertical, no hacia adelante.","Desplazamiento que termina antes del salto."],frase:"«El salto de bloqueo es para arriba, no para adelante.»",err:"Saltan hacia adelante y tocan la red.",arreglo:"Bloqueo primero desde un banco para aislar las manos del desplazamiento."},
  {n:"Recepción con tres receptores",int:"La formación que van a usar el resto de su carrera.",pts:["Cada uno cubre su zona y se canta antes de tocar.","La pelota del medio es del que va hacia adentro."],frase:"«El que va hacia adentro la toma.»",err:"Van dos o no va ninguno.",arreglo:"Se acuerda la regla antes y no se cambia en toda la temporada."}],
 tactica:[{n:"Del 4:4 al 6:6",d:"Entender que la responsabilidad se reparte distinto según cuántos hay en la cancha."},
  {n:"Detección regional",d:"Todos los perfiles que corresponden van a la sichtung. Sin excepciones y sin que dependa de que el entrenador se acuerde."}],
 prog:[{p:"Complejo entero",d:"Saque, recepción, armado y ataque encadenados. El saque se entrena dentro de la jugada, no en una serie aislada al final."},
  {p:"Aleatorio con marcador",d:"Con la cancha completa ya se puede jugar de verdad. Que casi todo tenga consecuencia."},
  {p:"Volumen de saque alto",d:"Es el único gesto donde el volumen aislado se justifica, porque en el partido se ejecuta sin oposición. Aun así, mejor dentro de la jugada."}],
 sesion:SES_ROOKIE,
 errDT:["Exigir más cuando la carrera se desarma por el crecimiento. Se sostiene la técnica, no se aprieta.","Dejar el programa neuromuscular femenino para cuando haya tiempo. Es la ventana en que sirve y no vuelve.","Olvidarse de anotar a los perfiles para la detección regional. Pasa una vez al año."],
 evalu:"Medición de octubre y marzo con protocolo idéntico. Talla cada tres meses. Detección regional GSGL en Jona o Chur.",
 anio:ANIO_BASE});

Object.assign(ENSC.f1, {
 porque:"Es la última etapa sin líbero y sin especialización, y eso no vuelve nunca. Un armador que también defiende y una central que también recibe se hacen acá o no se hacen. El entrenador de esta etapa va a recibir presión de los propios jugadores para especializarse antes de tiempo —los altos no van a querer armar y los bajos no van a querer bloquear— y su trabajo es resistir esa presión durante toda la temporada y explicar por qué.",
 tecnica:[
  {n:"Armado desde zaga en desplazamiento",int:"Que cualquiera pueda armar cuando la pelota no llega al armador.",pts:["Frente alta y manos adelante antes del último paso.","Impulso de piernas.","El torso apunta al destino."],frase:"«El que no arma hoy, no arma nunca.»",err:"Los altos evitan el segundo toque.",arreglo:"Regla: en cada rotación arma alguien distinto, y se anota."},
  {n:"Recepción contra saque de arriba",int:"Sostener la recepción con saque real de competencia.",pts:["Plataforma formada antes.","Cuerpo detrás de la pelota.","Hombros dirigen al armador."],frase:"«Se entrena con el saque del sábado, no con uno más fácil.»",err:"El entrenador baja la intensidad del saque para que salga mejor el ejercicio.",arreglo:"Nunca. La intensidad se sostiene y se baja otra variable si hace falta."},
  {n:"Bloqueo en cancha completa",int:"Tiempo y desplazamiento contra red alta.",pts:["Desplazamiento completo que termina antes del salto.","Manos sobre la red.","Estabilidad en el aire."],frase:"«Llegá formado, no llegues volando.»",err:"Saltan en movimiento lateral y se desarman en el aire.",arreglo:"Desplazamiento de dos pasos con parada obligatoria antes del salto."}],
 tactica:[{n:"Penetración en las seis rotaciones",d:"El sistema entero se apoya en esto y no admite excepciones. Se canta la rotación antes de cada punto."},
  {n:"Defensa base sin líbero",d:"Los seis defienden. Nadie sale por su altura."}],
 prog:[{p:"Complejos encadenados",d:"K1 y K2 seguidos. La transición es donde se pierde más en esta etapa."},
  {p:"Todos hacen todo, y se anota",d:"Llevá registro de cuántas veces armó cada uno. Sin registro, la especialización se instala sola."},
  {p:"Aleatorio con consecuencia",d:"Marcador en casi todo. El nivel técnico real es el que sostienen bajo presión."}],
 sesion:SES_FUTURE,
 errDT:["Ceder a la presión de especializar temprano. Es el error que más limita al jugador a largo plazo.","Bajar la intensidad del saque en los ejercicios de recepción para que se vean mejor.","Usar líbero en los entrenamientos «porque en el partido igual lo vamos a usar». En esta etapa el reglamento no lo permite y la etapa existe por eso."],
 evalu:"Medición de octubre y marzo. Es la etapa donde el Entwicklungstest y el Talentpool se vuelven concretos.",
 anio:ANIO_BASE});

Object.assign(ENSC.f2, {
 porque:"Aparece la especialización, pero repartida: dos armadoras por camada en vez de una. Para un club chico eso no es un detalle táctico, es una ventaja estructural — si se lesiona una, el equipo sigue. Y es la etapa donde el jugador empieza a pensar tácticamente por su cuenta, así que el trabajo del entrenador cambia: pasa de decir qué hacer a preguntar qué vieron.",
 tecnica:[
  {n:"Armado especializado desde zaga",int:"Dos jugadoras con volumen concentrado de armado.",pts:["Recorrido y llegada equilibrada.","Distancia constante a la red.","Misma pelota para el mismo atacante, siempre."],frase:"«Cada atacante tiene su pelota y vos la conocés.»",err:"Cada armado sale distinto y el atacante no puede anticipar.",arreglo:"Contrato escrito con cada atacante: altura, distancia y velocidad."},
  {n:"Ataque con cambio de dirección",int:"Diagonal, línea y finta desde el mismo impulso.",pts:["La carrera es siempre igual.","La muñeca decide la dirección.","La decisión se toma antes del salto."],frase:"«Misma carrera, distinta muñeca.»",err:"Cambian la carrera según el golpe y el bloqueo lo lee.",arreglo:"Filmá la carrera de las tres opciones y mostrásela: se ve al instante."},
  {n:"Bloqueo lector",int:"Pasar de reaccionar a anticipar.",pts:["Mirar el primer contacto y después a la armadora.","Decidir antes del salto.","Cerrar hacia el punto de ataque."],frase:"«Decidí antes de saltar, no en el aire.»",err:"Miran la pelota todo el tiempo y llegan tarde.",arreglo:"Ejercicio donde tienen que cantar en voz alta qué van a hacer antes del contacto de la armadora."}],
 tactica:[{n:"6-2 completo",d:"Tres atacantes en las seis rotaciones, con sus coberturas y transiciones."},
  {n:"Lectura de la armadora rival",d:"Se puntúa haber decidido antes del salto, aunque el bloqueo salga mal."},
  {n:"Carrera dual",d:"Escuela y vóley organizados. Acá empieza a decidirse quién sigue y quién abandona."}],
 prog:[{p:"Complejos a intensidad de competencia",d:"Encadenados y con consecuencia."},
  {p:"Video corto",d:"El club ya tiene sistema de video en el primer equipo. Un clip de treinta segundos por semana cambia más que veinte minutos de charla."},
  {p:"Preguntar en vez de decir",d:"«¿Qué viste?» antes de «tenías que hacer esto». Es lo que construye el pensamiento táctico propio."}],
 sesion:SES_FUTURE,
 errDT:["Elegir una armadora titular y dejar a la otra de suplente. Rompe la ventaja de la etapa.","Dar la solución táctica en vez de preguntar qué vieron.","Sumar carga sin mirar la ficha individual: acá es donde se acumulan formativas más liga."],
 evalu:"Medición de octubre y marzo. Talentpool y estructura regional marcan la diferencia en esta etapa.",
 anio:ANIO_BASE});

Object.assign(ENSC.f3, {
 porque:"Es el puente al primer equipo y la última etapa formativa. El jugador va a encontrar el 5-1 en cualquier liga de mayores, así que lo que se decide acá no es si aprende el sistema sino si llega preparado para el ritmo y la exigencia del vóley adulto. Es también la etapa de mayor riesgo de sobrecarga del club, porque son los que juegan formativas y liga al mismo tiempo.",
 tecnica:[
  {n:"Ejecución bajo fatiga y presión",int:"Que la técnica sea la del tercer set y no la del calentamiento.",pts:["Mismo gesto con las piernas cansadas.","Decisión rápida con el marcador en contra."],frase:"«Tu técnica es la del punto 24.»",err:"Sostienen el nivel mientras van ganando.",arreglo:"Empezá ejercicios con el marcador en contra a propósito."},
  {n:"Ataque de zaga dentro del sistema",int:"Que sea una opción real de distribución y no un recurso de emergencia.",pts:["Carrera desde detrás de la línea de tres metros.","Contacto alto y adelante.","Coordinación con el armado."],frase:"«La zaga es una opción, no un descarte.»",err:"Solo la usan cuando la recepción salió mal.",arreglo:"Regla: al menos un ataque de zaga por rotación con recepción buena."},
  {n:"Defensa y transición a nivel adulto",int:"La diferencia real entre juvenil y mayor está acá.",pts:["Posición baja y peso adelante.","Salida al contraataque inmediata.","Aterrizar, girar, salir de la red."],frase:"«La diferencia con los mayores no está en el ataque, está en la transición.»",err:"Defienden bien y después no atacan.",arreglo:"Todo ejercicio de defensa termina en ataque, sin excepción."}],
 tactica:[{n:"5-1 completo",d:"Rotaciones, coberturas y transiciones con una sola armadora."},
  {n:"Plan de partido y scouting",d:"Video, datos y una hoja que el jugador entiende y usa."},
  {n:"Transición al primer equipo",d:"Cada uno con un plan definido: primer equipo, estructura regional, o vóley con estudio."}],
 prog:[{p:"Todo con consecuencia",d:"Marcador, situaciones de final de set y desventaja inicial."},
  {p:"Plan escrito individual",d:"Cada jugador con un plan para entrenar solo. Es la habilidad que define quién sigue después."},
  {p:"Control de carga estricto",d:"Es la etapa donde se acumulan formativas, liga y a veces entrenamiento con el primer equipo. Mirá la ficha individual todas las semanas."}],
 sesion:SES_FUTURE,
 errDT:["Entrenarlos siempre ganando. Hay que ponerlos abajo en el marcador a propósito.","No mirar la ficha de carga individual. Acá aparece el jugador con siete estímulos semanales que nadie sumó.","Dejar la conversación de transición para abril. Se empieza en noviembre."],
 evalu:"Medición de octubre y marzo. Contacto directo con el primer equipo y con las ligas nacionales.",
 anio:ANIO_BASE});

ENSC.kv1.tecnica=[
 {n:"Atrapar arriba de la cabeza",cad:"Nace acá · va al toque de arriba de Kids 2",int:"Que las manos estén donde van a estar cuando aprenda a tocar.",pts:["Manos arriba de la cabeza formando un triángulo.","Codos afuera, no pegados al cuerpo.","La pelota se ve entre las manos antes de tocarla."],frase:"«Poné las manos arriba antes, no cuando la pelota ya está.»",err:"Atrapan contra el pecho. Ese chico va a tocar con las manos bajas durante años.",arreglo:"Pelotas más altas y suaves. Si atrapa contra el pecho, subí la pelota, no el volumen de la corrección."},
 {n:"Lanzar con dos manos desde arriba",cad:"Nace acá · va al armado de Kids 3 y Rookie 1",int:"Que el gesto de lanzar sea el mismo que después será el armado.",pts:["Sale de arriba de la cabeza.","Extensión de piernas, no de brazos.","El cuerpo apunta adonde va la pelota."],frase:"«Estirá las piernas, no los brazos.»",err:"Lanzan de pecho, como básquet.",arreglo:"Objetivo alto: un aro, una marca en la pared."},
 {n:"Llegar debajo de la pelota",cad:"Nace acá · sostiene toda la recepción posterior",int:"Que mueva los pies antes de usar las manos.",pts:["Pasos cortos, sin cruzar las piernas.","Llega y frena antes de tocar.","Queda debajo, no al costado."],frase:"«Movete vos hacia la pelota, no estires los brazos.»",err:"Estiran los brazos desde donde están. Es el error universal de la edad.",arreglo:"Juegos donde la pelota siempre cae lejos."},
 {n:"Primer toque de arriba",cad:"Se introduce acá · se desarrolla en Kids 2 y 3",int:"Que empiece a sentir la pelota con los dedos, sin exigirle todavía que juegue con eso.",pts:["Frente alta.","Manos adelante de la cara.","La pelota se ve entre las manos."],frase:"«Mirá la pelota entre las manos.»",err:"Tocan con las palmas juntas.",arreglo:"Autopases suaves antes de cualquier pelota que venga de otro."},
 {n:"Caer bien",cad:"Nace acá · se mantiene hasta el primer equipo",int:"Que el aterrizaje sea parte de cómo jugamos y no una obligación médica.",pts:["Cae sobre los dos pies.","Rodilla alineada con la punta del pie.","Absorbe flexionando, no cae duro."],frase:"«Se cae bien.»",err:"Caen con la rodilla hacia adentro. A esta edad no duele, y por eso hay que corregirlo ahora.",arreglo:"Saltos desde un cajón bajo dentro del juego de entrada, todos los días."}];
ENSC.kv1.tactica=[
 {n:"Repartir el espacio en 3:3",d:"Dos adelante y uno atrás. Entender que la cancha se cubre entre todos y no cada uno la suya."},
 {n:"Pedir la pelota en voz alta",d:"Se enseña acá o no se enseña nunca. A esta edad todavía no da vergüenza gritar."},
 {n:"Cubrir el hueco del que va",d:"Cuando uno sale a buscar la pelota, alguien ocupa su lugar. Es la primera idea de equipo que entienden."},
 {n:"La pelota alta da tiempo",d:"Si es nuestra, va alta y al medio. Si la mandamos al otro lado, va rápida y a un hueco. Es la idea de juego completa en una frase."},
 {n:"Volver a la posición",d:"Después de cada acción se vuelve al lugar. Sin eso, el 3:3 se convierte en tres chicos persiguiendo la pelota."}];

ENSC.kv2.tecnica=[
 {n:"Toque de arriba como primer contacto",cad:"Viene de Kids 1 · se consolida en Kids 3",int:"Jugar la pelota que viene del otro lado sin atraparla.",pts:["Frente alta y manos adelante de la cara.","Se toca arriba, no a la altura del pecho.","Impulso con extensión de piernas."],frase:"«Frente alta, manos adelante de la cara.»",err:"Tocan con las manos pegadas al pecho y la pelota sale para atrás.",arreglo:"Que se vea la pelota entre las manos antes del contacto. Si no la ve, las manos están mal."},
 {n:"Atrapar y lanzar con control",cad:"Viene de Kids 1 · desaparece en Rookie 1",int:"Sostener la jugada mientras el resto aprende.",pts:["Atrapa arriba y lanza alto al compañero.","No apura el lanzamiento."],frase:"«El segundo toque salva el punto. No lo apures.»",err:"Lanzan rápido y bajo para sacarse el problema de encima.",arreglo:"Regla: el lanzamiento pasa por encima de una marca alta."},
 {n:"Saque de abajo",cad:"Se introduce acá · se consolida en Rookie 1",int:"Poner la pelota en juego con un gesto que ya sabe hacer: lanzar por abajo.",pts:["Pelota sostenida, no lanzada al aire.","El brazo va como un péndulo.","El cuerpo acompaña hacia adelante."],frase:"«Es el mismo movimiento que lanzar una pelota por abajo.»",err:"Lanzan la pelota al aire antes de golpear y fallan.",arreglo:"Que la pelota se sostenga con la otra mano hasta el golpe."},
 {n:"Desplazamiento lateral",cad:"Viene de Kids 1 · va a la recepción de Rookie",int:"Llegar equilibrado, que es la condición de todo lo demás.",pts:["Pasos cortos sin cruzar.","Frena antes de tocar."],frase:"«Llegá quieto.»",err:"Llegan corriendo y tocan en movimiento.",arreglo:"Ejercicio donde tienen que frenar y tocar el piso antes de jugar."},
 {n:"Caer bien",cad:"Viene de Kids 1 · se mantiene siempre",int:"Sostener el aterrizaje ahora que empieza a haber saltos.",pts:["Dos pies, rodilla alineada.","Absorbe flexionando."],frase:"«Se cae bien.»",err:"Rodilla hacia adentro al caer.",arreglo:"En el bloque de entrada, todos los días, dentro del juego."}];
ENSC.kv2.tactica=[
 {n:"Roles dentro del 3:3",d:"Quién va a la pelota y quién cubre. Empieza el reparto de responsabilidad."},
 {n:"Jugar el segundo balón a un compañero",d:"La idea de construir en vez de devolver. Es el germen de los tres toques."},
 {n:"Ubicarse antes del saque",d:"Cada uno sabe dónde está parado antes de que la pelota entre en juego."},
 {n:"Cantar antes de tocar",d:"«Mía» se dice antes, no mientras. Es la regla de comunicación que va a durar toda la carrera."},
 {n:"Cubrir al que va",d:"El que no toca se mueve igual. Que nadie se quede mirando."}];

 ["Septiembre-octubre","Saque de arriba desde el fondo, con volumen alto. Y recepción con tres receptores.","Medición de octubre. Detección regional GSGL: anotar a todos los perfiles. 7 de 10 saques dentro."],
 ["Noviembre-diciembre","Carrera de tres pasos y bloqueo técnico. Aparece la cancha grande de verdad.","Ritmo de tres pasos estable. Manos sobre la red al bloquear."],
 ["Enero","Vuelta progresiva. Retallar: muchos crecen en este corte y la carrera se desarma.","Carga escalonada. Se sostiene la técnica, no se exige más."],
 ["Febrero-marzo","Defensa de campo en cancha grande, y transición defensa-ataque. Revisión de nivel.","Medición de marzo. Toda defensa termina en ataque."],
 ["Abril","Cierre. Es el paso a Future: se explica que ahí no hay líbero y todos arman.","Saben qué los espera y por qué."]]);

 ["Noviembre-diciembre","Recepción contra saque de arriba real y penetración en las seis rotaciones.","50% de recepciones en sistema sobre 20 saques de competencia."],
 ["Enero","Vuelta progresiva. Se retoma con el sistema completo, no por partes.","La penetración sobrevivió al corte."],
 ["Febrero-marzo","Bloqueo en cancha completa y defensa sin líbero. Se introduce el 6-2 pensando en el año que viene.","Medición de marzo. Los seis defienden sin que nadie salga por su altura."],
 ["Abril","Cierre. Entwicklungstest y Talentpool se vuelven concretos: conversación individual.","Cada uno con un plan para el año siguiente."]]);

A("f2",[
 ["Agosto","Definir las dos armadoras de la camada y explicar por qué son dos y no una.","Las dos saben que son titulares del sistema."],
 ["Septiembre-octubre","Armado especializado y el contrato escrito con cada atacante. Es el trabajo central del año.","Medición de octubre. Contrato escrito y respetado por las dos armadoras."],
 ["Noviembre-diciembre","Ataque con cambio de dirección y bloqueo lector. Arranca el video: un clip por semana.","Dos direcciones resueltas desde el mismo impulso. Decide antes de saltar."],

 ["Agosto","Armar el 5-1 y decidir quién arma. Y revisar con cada uno su carga total, porque muchos suman liga.","Sistema definido y fichas de carga firmadas."],
 ["Septiembre-octubre","5-1 completo con sus rotaciones y coberturas. Ejecución bajo presión desde el primer día.","Medición de octubre. Sostiene el sistema sin ayuda del entrenador."],
 ["Noviembre-diciembre","Ataque de zaga dentro del sistema y saque en salto bajo presión. Empieza la conversación de transición.","Un ataque de zaga por rotación. Cada uno sabe qué opción tiene el año que viene."],
 ["Enero","Vuelta progresiva. Es la etapa de mayor riesgo de acumulación: revisar ficha semanalmente.","Nadie por encima de su techo de horas."],
 ["Febrero-marzo","Defensa y transición a nivel adulto, y bloqueo lector consolidado. Plan de partido con video.","Medición de marzo. Toda defensa termina en contraataque."],

const ENSC_DE = {
 gen:{
  t:"Wie in diesem Verein unterrichtet wird",
  sub:"Allgemeine Anleitung · die methodische Grundlage aller neun Gruppen",
  p:"Dieser Reiter schreibt nicht vor, wie das Training auszusehen hat. Er hält fest, <strong>was die Spielerin oder der Spieler auf jeder Stufe lernen muss, warum, und nach welchen Grundsätzen unterrichtet wird</strong>. Zwei Trainer:innen können völlig unterschiedliche Einheiten leiten und beide richtig liegen, solange sie diese Grundsätze einhalten und am Ende der Stufe dasselbe verstanden wurde.",
  bloques:[
   {h:"Woher diese Methodik stammt",
    p:"Sie ist nicht erfunden. Sie stützt sich auf drei Quellen, die stärker übereinstimmen als man erwarten würde. Den <strong>Schweizer Rahmen</strong>, der festlegt, was auf jeder Stufe gespielt wird. Die <strong>amerikanische Schule des motorischen Lernens</strong>, aufgebaut von Carl McGown, Doktor der Bewegungswissenschaft an der Brigham Young University, gemeinsam mit Doug Beal und Marv Dunphy — Olympiagold 1984 und 1988 — im System Gold Medal Squared, und von John Kessel, dreissig Jahre Leiter Sportentwicklung bei USA Volleyball. Und die <strong>vier Säulen</strong> des Vereinsprojekts: Technik, Taktik, Athletik und Mentales.",
    f:"Wo alle drei übereinstimmen, ist es keine Meinung mehr, sondern der Stand des Wissens."},
   {h:"Die Bewegung wird nicht in Teile zerlegt",
    p:"Das ist der wichtigste und zugleich unbequemste Grundsatz, weil er dem widerspricht, wie fast alle von uns das Trainieren gelernt haben. Die Übersichtsarbeit fand <strong>keine einzige Studie</strong>, die das Unterrichten in Teilen gegenüber der ganzen Bewegung bevorzugt, und mehrere Arbeiten zeigen, dass Teiltraining negativen Transfer erzeugt: Die Person lernt etwas, das ihr später im Weg steht. Der Grund ist neurologisch: Das Gehirn ist kein serieller Prozessor, der die einzeln beigebrachten Teile nachträglich zusammensetzt.",
    f:"Es gibt kein «zuerst isolierte Technik, dann spielen». Die Bewegung wird ab dem ersten Tag ganz trainiert. Geordnete Blöcke nur in den ersten Minuten von etwas Neuem, und immer von der vollständigen Bewegung."},
   {h:"Vereinfacht wird die Umgebung, nicht die Bewegung",
    p:"Hier liegt der Ausweg, und genau das macht das Schweizer System. Wenn jemand Anfänger:in ist, zerlege die Bewegung nicht, sondern senke die Informationsmenge der Umgebung. <strong>Tieferes Netz, kleineres Feld, weniger Spieler:innen, leichterer Ball.</strong> Dieser Satz steht bei McGown als Beispiel für das Training von Kindern und ist wörtlich die Definition von Kids Volley und Rookie. Smart Competitions ist die amerikanische Lehre des motorischen Lernens, umgesetzt als Wettkampfsystem.",
    f:"Senke die Information der Umgebung. Reduziere nie die Bewegung."},
   {h:"Ungeordnet schlägt geordnet",
    p:"Dieselbe Aktion viele Male hintereinander zu wiederholen lässt die Person <em>während</em> des Trainings besser aussehen und im Spiel schlechter. Zufällige Reihenfolge bewirkt das Gegenteil: Im Training sieht es schlechter aus, behalten wird deutlich mehr. Das Ergebnis ist in Volleyball, Badminton, Baseball, Basketball, Tennis und Fussball repliziert, und die Erklärung lautet, dass variable Praxis die Verbindungen des motorischen Lernens stärkt, während blosse Wiederholung keinen messbaren Effekt darauf hat. Und ein Befund betrifft uns direkt: <strong>Der Effekt zufälligen Trainings ist bei Kindern noch stärker als bei Erwachsenen.</strong>",
    f:"Wenn eine Übung schön aussieht, werde misstrauisch. Echter Fortschritt sieht während des Trainings hässlich aus."},
   {h:"Die beste Annahmeübung ist Annahme, Zuspiel und Angriff",
    p:"Der Satz stammt von Marv Dunphy, Olympiasieger 1988: Die beste Annahmeübung ist Annahme-Zuspiel-Angriff, die beste Zuspielübung ist Annahme-Zuspiel-Angriff, die beste Angriffsübung ist Annahme-Zuspiel-Angriff. Der Grund ist Spezifität: Die Wirkung eines Trainingsreizes zeigt sich nur, wenn dieser Reiz die Bewegungen des Sports abbildet. Eine Trainerin, die von einem Kasten aus auf die Abwehr schlägt, ist kein Reiz, der im Spiel vorkommt, und trainiert entsprechend wenig.",
    f:"Wenn die Aktion im Spiel nicht so vorkommt, trainierst du etwas anderes."},
   {h:"Die sieben Kontrollen vor jeder Übung",
    p:"Diese Liste stammt aus dem Handbuch von Gold Medal Squared und ist das Praktischste des ganzen Materials. Prüfe vor jeder Übung: <strong>Position und Bewegung</strong> der Spieler:innen im Feld; ihre <strong>Ausrichtung zum Netz</strong>; die <strong>Abfolge der Aktionen</strong> und deren Rhythmus; den <strong>Reiz, auf den reagiert wird</strong>, der derselbe wie im Spiel sein muss; <strong>wie gezählt wird</strong> und was belohnt wird; dass der Ball <strong>natürlich endet</strong>, wie ein Ballwechsel endet; und <strong>Zeitpunkt, Art und Menge der Rückmeldung</strong>, die du gibst.",
    f:"Fällt eine Übung bei drei der sieben durch, repariere sie nicht: ersetze sie."},
   {h:"Keine Warteschlangen",
    p:"Das ist die praktische Folge von allem Vorherigen und der am leichtesten überprüfbare Indikator. Wer in einer Reihe darauf wartet, dass die Trainerin einen Ball zuwirft, lernt nichts und nimmt zusätzlich jemand anderem einen Kontakt weg. Kessel schreibt das für Programme mit zwölf bis sechsunddreissig Kindern und einer einzigen Trainerperson, also genau für unsere Situation. Auf dem Beobachtungsblatt gilt: Wartet irgendwo eine Reihe von mehr als vier Personen, ist die Übung falsch aufgebaut.",
    f:"Zähle die Ballkontakte pro Person in fünf Minuten. Das ist die Zahl, die ein Training wirklich misst."},
   {h:"Was die Trainerperson damit macht",
    p:"Sie liest die Anleitung ihrer Kategorie vor der ersten Woche, wählt ihre eigenen Übungen und nutzt die Quellen, um die vollständige Bewegung im Video zu sehen. Nicht verhandelbar sind nur diese Grundsätze und die <strong>Übertrittskriterien</strong> ihrer Stufe, die weiter unten auf dieser Seite stehen und aus dem Stufenblatt gelesen werden."}],
  tabla:"Entsprechung der Kategorien",
  tablaP:"Die Vereinsdokumente sind in U13, U15, U17, U19 und U21 geschrieben. Swiss Volley gliedert in Kids, Rookie und Future, und die lizenzierten Mannschaften des Vereins heissen U14, U16, U18 und U20. Es sind drei Bezeichnungen für dieselben Altersgruppen, und sie bestehen nebeneinander. Deshalb steht die Tabelle sichtbar da und jede Trainerperson findet ihre Gruppe in der Spalte, die sie kennt.",
  th:["Stufe des Konzepts","Vereinsleitfaden","Lizenzierte Mannschaft","Alter","Hinweis"]},

 kv1:{t:"Fangen und werfen",sub:"Kids Volley 1 · 5 bis 10 Jahre",
  obj:"Dass das Kind den Ball sehr oft berührt und am nächsten Dienstag wiederkommen will.",
  porque:"Es ist das erste Mal, dass das Kind überhaupt einen Volleyball berührt, und das Einzige, was darüber entscheidet, ob es nächstes Jahr weitermacht, ist ob es Spass hatte. Fangen und werfen ist keine willkürliche Vereinfachung: Es erlaubt, vom ersten Tag an Spielzüge zu bauen, ohne die Frustration, dass der Ball immer zu Boden fällt. Die Evidenz des motorischen Lernens sagt, man solle die Bewegung nicht zerlegen, sondern der Umgebung Information nehmen — und genau das ist diese Stufe: kleines Feld, tiefes Netz, leichter Ball, drei Spielende.",
  tecnica:[
   {n:"Über dem Kopf fangen",cad:"Entsteht hier · führt zum oberen Zuspiel in Kids 2",int:"Dass die Hände dort sind, wo sie beim späteren oberen Zuspiel sein werden.",pts:["Hände über dem Kopf, ein Dreieck bildend.","Ellbogen nach aussen, nicht am Körper.","Der Ball ist zwischen den Händen sichtbar, bevor er berührt wird."],frase:"«Hände hoch, bevor der Ball da ist, nicht danach.»",err:"Sie fangen vor der Brust. Dieses Kind wird jahrelang mit tiefen Händen spielen.",arreglo:"Höhere und weichere Bälle. Fängt es vor der Brust, erhöhe den Ball, nicht die Lautstärke der Korrektur."},
   {n:"Beidhändig von oben werfen",cad:"Entsteht hier · führt zum Zuspiel in Kids 3 und Rookie 1",int:"Dass die Wurfbewegung dieselbe ist, die später das Zuspiel wird.",pts:["Aus der Position über dem Kopf.","Beinstreckung, nicht Armstreckung.","Der Körper zeigt dorthin, wo der Ball hingeht."],frase:"«Strecke die Beine, nicht die Arme.»",err:"Sie werfen von der Brust wie beim Basketball.",arreglo:"Ein hohes Ziel vorgeben: ein Reifen, eine Markierung an der Wand."},
   {n:"Unter den Ball kommen",cad:"Entsteht hier · trägt die gesamte spätere Annahme",int:"Dass zuerst die Füsse und dann die Hände arbeiten.",pts:["Kurze Schritte, ohne Beinkreuzen.","Ankommen und stoppen vor dem Kontakt.","Unter dem Ball stehen, nicht daneben."],frase:"«Geh du zum Ball, streck nicht die Arme.»",err:"Sie strecken die Arme von dort, wo sie stehen. Der universelle Fehler dieses Alters.",arreglo:"Spiele, in denen der Ball immer weit weg fällt."},
   {n:"Erstes oberes Zuspiel",cad:"Wird hier eingeführt · entwickelt sich in Kids 2 und 3",int:"Ein erstes Gefühl für den Ball mit den Fingern, ohne schon damit spielen zu müssen.",pts:["Hohe Stirn.","Hände vor dem Gesicht.","Der Ball ist zwischen den Händen sichtbar."],frase:"«Schau den Ball zwischen deinen Händen an.»",err:"Sie berühren mit zusammengelegten Handflächen.",arreglo:"Sanfte Eigenzuspiele, bevor ein Ball von jemand anderem kommt."},
   {n:"Gut landen",cad:"Entsteht hier · bleibt bis zur ersten Mannschaft",int:"Dass die Landung Teil unseres Spiels ist und keine medizinische Auflage.",pts:["Landet auf beiden Füssen.","Knie in Linie mit der Fussspitze.","Federt ab, fällt nicht steif."],frase:"«Man landet gut.»",err:"Sie landen mit nach innen fallendem Knie. In diesem Alter tut es nicht weh, und genau deshalb wird es jetzt korrigiert.",arreglo:"Sprünge von einem tiefen Kasten, täglich, im Einstiegsspiel."}],
  tactica:[
   {n:"Den Raum im 3:3 aufteilen",d:"Zwei vorne, eine hinten. Verstehen, dass das Feld gemeinsam gedeckt wird und nicht jede ihres."},
   {n:"Den Ball laut fordern",d:"Das wird hier gelernt oder gar nie. In diesem Alter ist Rufen noch nicht peinlich."},
   {n:"Die Lücke der Person decken, die geht",d:"Wenn eine zum Ball geht, nimmt jemand ihren Platz ein. Die erste Mannschaftsidee, die sie verstehen."},
   {n:"Ein hoher Ball schafft Zeit",d:"Ist er unser, geht er hoch und in die Mitte. Geht er auf die andere Seite, geht er schnell und in eine Lücke. Die ganze Spielidee in einem Satz."},
   {n:"Zurück auf die Position",d:"Nach jeder Aktion zurück an den Platz. Sonst wird aus dem 3:3 ein Rudel, das dem Ball hinterherläuft."}],
  sesion:[["15","Einstiegsspiel: fangen, werfen, laufen, springen und landen. Keine Warteschlangen."],["20","Erste Bewegung des Blocks, mit maximalem Volumen. Mehrere Bälle, Gruppen zu zweit oder zu dritt."],["20","Zweite Bewegung des Blocks, im Spiel und mit tiefem Netz."],["25","Spiel 3:3 nach den Regeln der Stufe. Es wird richtig gespielt."],["10","Freies Spiel und Abschluss. Du schaust zu und korrigierst nicht."]],
  anio:[["August","Gruppe bilden. Dich den Familien mit dem Vereinsblatt vorstellen.","Alle kennen die Namen aller."],
   ["September-Oktober","Über dem Kopf fangen und unter den Ball kommen. Diese beiden tragen alles Weitere.","Körpergrösse gemessen. 8 von 10 Bällen mit den Händen gefangen, nicht mit der Brust."],
   ["November-Dezember","Beidhändig von oben werfen und gut landen. Die Landung gehört täglich ins Einstiegsspiel.","Wirft 4 Meter zu einer Mitspielerin. Landet auf zwei Füssen, ohne dass du es sagst."],
   ["Januar","Sanfter Wiedereinstieg. Es wird gespielt, nichts Neues.","Dass alle zurückkommen."],
   ["Februar-März","Erstes oberes Zuspiel, ohne schon zu verlangen, dass damit gespielt wird.","Körpergrösse. Sieht den Ball zwischen den Händen vor dem Kontakt."],
   ["April","Abschluss im Spiel. Gespräch mit jeder Familie.","Der wirkliche Indikator: wie viele sich fürs nächste Jahr anmelden."]],
  errDT:["Zu viel korrigieren. In diesem Alter unterrichtet die Trainerperson am wenigsten, die am meisten spricht.","Warteschlangen bilden, weil sie leichter zu kontrollieren sind. Der Fehler, der die meisten Ballkontakte vernichtet.","Wollen, dass die Bewegung schön aussieht. Die Form stabilisiert sich von selbst; zu hüten ist, dass sie wiederkommen wollen."],
  fis:"Koordination, Gleichgewicht und Landungen in Spielform. Keine externen Lasten.",
  men:"Dass es Spass macht und dass sie wiederkommen. In diesem Alter ist die Anmeldung fürs Folgejahr der einzige echte Indikator.",
  evalu:"Ausser der Körpergrösse alle drei Monate wird noch nichts gemessen."}
};

 kv2:{t:"Erster Volleyball-Kontakt",sub:"Kids Volley 2 · 5 bis 10 Jahre",
  obj:"Dass der erste gespielte Kontakt erscheint, ohne dass das Spiel zusammenbricht.",
  porque:"Der erste gespielte Kontakt kommt und mit ihm die erste echte Frustration: Der Ball fällt. Deshalb lässt das Reglement den zweiten Kontakt gefangen, und deshalb muss die Trainerperson der Versuchung widerstehen, die drei Kontakte zu früh zu verlangen. Ziel der Stufe ist, dass das obere Zuspiel ins Spiel kommt, ohne dass das Spiel zerfällt.",
  tecnica:[
   {n:"Oberes Zuspiel als erster Kontakt",cad:"Kommt aus Kids 1 · wird in Kids 3 gefestigt",int:"Den Ball von der anderen Seite spielen können, ohne ihn zu fangen.",pts:["Hohe Stirn und Hände vor dem Gesicht.","Der Ball wird oben gespielt, nicht auf Brusthöhe.","Impuls aus der Beinstreckung."],frase:"«Hohe Stirn, Hände vor dem Gesicht.»",err:"Sie spielen mit den Händen an der Brust und der Ball geht nach hinten weg.",arreglo:"Der Ball muss vor dem Kontakt zwischen den Händen sichtbar sein. Sieht sie ihn nicht, stehen die Hände falsch."},
   {n:"Kontrolliert fangen und werfen",cad:"Kommt aus Kids 1 · verschwindet in Rookie 1",int:"Den Spielzug am Leben halten, während der Rest gelernt wird.",pts:["Fängt oben und wirft hoch zur Mitspielerin.","Überstürzt den Wurf nicht."],frase:"«Der zweite Kontakt rettet den Ballwechsel. Überstürz ihn nicht.»",err:"Sie werfen schnell und flach, um das Problem loszuwerden.",arreglo:"Regel: Der Wurf muss über eine hohe Markierung gehen."},
   {n:"Service von unten",cad:"Wird hier eingeführt · in Rookie 1 gefestigt",int:"Den Ball mit einer Bewegung ins Spiel bringen, die das Kind schon beherrscht: von unten werfen.",pts:["Ball wird gehalten, nicht hochgeworfen.","Der Arm schwingt wie ein Pendel.","Der Körper geht nach vorne mit."],frase:"«Es ist dieselbe Bewegung wie ein Ball von unten werfen.»",err:"Sie werfen den Ball hoch und verfehlen ihn.",arreglo:"Der Ball bleibt bis zum Schlag in der anderen Hand."},
   {n:"Seitliche Verschiebung",cad:"Kommt aus Kids 1 · führt zur Annahme in Rookie",int:"Im Gleichgewicht ankommen, die Voraussetzung für alles andere.",pts:["Kurze Schritte ohne Kreuzen.","Stoppt vor dem Kontakt."],frase:"«Komm ruhig an.»",err:"Sie kommen laufend an und spielen in Bewegung.",arreglo:"Übung, bei der sie vor dem Spielen den Boden berühren müssen."},
   {n:"Gut landen",cad:"Kommt aus Kids 1 · bleibt immer",int:"Die Landung halten, jetzt wo Sprünge dazukommen.",pts:["Zwei Füsse, Knie in Linie.","Federt ab."],frase:"«Man landet gut.»",err:"Knie fällt bei der Landung nach innen.",arreglo:"Täglich im Eingangsblock, innerhalb des Spiels."}],
  tactica:[{n:"Rollen im 3:3",d:"Wer zum Ball geht und wer sichert. Die Verteilung der Verantwortung beginnt."},
   {n:"Den zweiten Ball zur Mitspielerin",d:"Die Idee des Aufbauens statt des Zurückspielens. Der Keim der drei Kontakte."},
   {n:"Vor dem Service Position beziehen",d:"Jede weiss, wo sie steht, bevor der Ball ins Spiel kommt."},
   {n:"Rufen vor der Berührung",d:"«Ich» wird vorher gesagt, nicht währenddessen. Die Kommunikationsregel für die ganze Laufbahn."},
   {n:"Die Angreiferin begleiten",d:"Wer nicht spielt, bewegt sich trotzdem. Niemand bleibt stehen und schaut zu."}],
  sesion:[["15","Einstiegsspiel: Koordination, Sprünge und Landungen in Spielform."],["22","Erste Bewegung des Blocks, mit vielen Wiederholungen und individueller Korrektur."],["20","Zweite Bewegung des Blocks, im Spiel mit tiefem Netz."],["23","Spiel 3:3 nach den Regeln der Stufe."],["10","Freies Spiel und Abschluss."]],
  anio:[["August","Wiedersehen und Einteilung. Wer kommt aus Kids 1, wer ist neu.","Gruppe steht."],
   ["September-Oktober","Oberes Zuspiel als erster Kontakt, mit viel Volumen im Spiel.","Körpergrösse. Nutzt das Zuspiel im Spiel, nicht nur in der Übung."],
   ["November-Dezember","Service von unten und seitliche Verschiebung. Das Service ist auf dieser Stufe Pflicht.","6 von 10 Services im Feld. Kommt ruhig an vor dem Kontakt."],
   ["Januar","Progressiver Wiedereinstieg. Das Zuspiel wird wiederholt, nichts Neues."],
