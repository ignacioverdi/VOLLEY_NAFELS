rama:{
 m:{intro:"On this side most players go through the growth spurt during Rookie 2 and 3. In that stretch coordination falls apart temporarily and predictably, and the patellar tendon works close to its tolerance threshold. The right answer is not to demand more: it is to hold the technique and protect the knee while the body reorganises itself.",
    fis:"Focus on landing control and eccentric strength during the spurt, and the strength window from Future 1 onwards. Tolerating clumsiness is part of the method, not a concession.",
    nota:"<strong>Six senior teams.</strong> On the men's side the club fields NLA, 1st, 2nd, 2nd B, 3rd and 4th League, plus U20, U18, U16 and U14. That is a dense ladder: there is a rung for every real level, and a player can climb gradually instead of jumping. It is the club's greatest advantage and also its greatest overload risk — see Competition and the individual load sheet.",
    red:"The men's net height rises at every Future stage: 2.24 m, 2.30 m and 2.35 m. Reach standards have to follow that progression."},
 f:{intro:"On this side most players are already past the growth spurt by the time they reach Rookie 3, and the strength window opens earlier. It is also the stretch with the highest ACL injury risk in the whole development pathway, with one decisive finding: the protective effect of neuromuscular training is strongest between 14 and 18 and disappears above 18. What is not done here cannot be recovered later.",
    fis:"Neuromuscular programme mandatory and sustained at every stage: landing from the spike with the knee aligned, decelerations and changes of direction, hamstrings and hips. Besides protecting the knee it improves jump height — it is not a tax on court time.",
    nota:"<strong>The women's ceiling is the 1st League, and the pathway already works.</strong> The women's side fields U14 and two U16 teams, then three senior teams: 4th, 3rd and 1st League. Since there are no U18 or U20 teams, the 4th and 3rd League fill that role: they are the real bridge between youth and the first team. The proof is in the 1st League squad, which already includes players born in 2008 and 2009.",
    red:"The women's net height stays at 2.18 m across all three Future stages. So the progression does not come from the net but from the level of play: the standards have to measure something else."},
 mixto:"Up to and including Rookie 2, play is not separated by gender. The two branches of this document share technical and tactical content at those stages; what does differ from the outset is the physical work, because maturation does not wait for the regulations."
},
comp:{
 eyebrow:"Where everyone plays",
 titulo:"Competition",
 intro:"Swiss Volley has reorganised youth competition through the Smart Competitions project, and the change runs deep: playing level is largely decoupled from chronological age. Understanding this is what keeps the club inside the system.",
 verif:"<strong>Where we stand today, verified.</strong> The <strong>GSGL region has not yet migrated to Smart Competitions</strong>: it organises its tournaments by age category in both genders, with Kids Volley split into three levels and youth playing rounds in a 6-6 format, under the regional youth development concept it drew up in 2019. Clubs can enter the full championship or single tournaments only. That is why the club's teams are called U14, U16, U18 and U20: it is the naming in force in the region. At the same time, Swiss Volley has already decided on the <strong>definitive introduction of Smart Competitions across all regions from 2028/29</strong>, and the project is running as a pilot in the regions that moved early. This document describes both on purpose: we operate today under GSGL's categories while the technical content is already written around Kids, Rookie and Future, which is where the whole system is heading. <span class=\"dato\">[Check each season whether GSGL opens the pilot]</span>",
 b1:"What has changed",
 p1:[["Teams are placed by level, not by age","There are only guideline ages. The main classification is by the playing level of the person and the team, and the coach enters the team through a self-assessment using a tool provided by the federation."],
     ["There is no longer a championship in grassroots play","Standalone half-day tournaments are organised across the year. A team commits to a tournament, not to a whole season, and can change tier between tournaments."],
     ["Results are not published","They have no consequences for subsequent tournaments. The focus is declaredly on the process rather than the result."],
     ["Teams referee themselves","In Kids Volley there is no officiating. In Rookie and Future the competing teams take turns."],
     ["Everyone plays","There are minimum playing times and a maximum squad size. In Future, a maximum of eleven with similar playing time for all."],
     ["Näfels is precisely who this system is for","Smart Competitions targets children and young people from Kids Volley age up to U18 who train once or twice a week. That is a literal description of our groups. It is not a system designed for a different kind of club: it is designed for this one."],
     ["Definitive introduction in 2028/29","Swiss Volley has decided on the definitive introduction of Smart Competitions for all regions from season 2028/29. Until then each region moves at its own pace. Building on this structure is not a bet: it is arriving early."],
     ["The maximum age is not the target age","Each category has a core age and an admission ceiling well above it: Kids up to U14, Rookie up to U18 and Future up to U23. That margin exists for late starters. A sixteen-year-old who has just begun plays Rookie, not Future, and that is not a demotion: it is the right level."]],
 b2:"The parallel route for those who train more",
 p2:"For anyone training three or more times a week, a result-oriented competitive route organised by age remains: the <strong>Youth Volley Days</strong>, across four weekends a year, and the <strong>Swiss youth championship</strong>. Both are structured in U14, U16 and U18. The U19/U20 and U23 categories continue to exist, as do the regional and national leagues.",
 p2b:"Access to the Swiss championship runs through regional qualifying tournaments, and each club may enter one team per category.",
 b3:"What this means for Näfels",
 p3:[["Two routes, not one","Most of the club competes in Kids, Rookie and Future by level. Players training three or more times a week add the Youth Volley Days and qualification for the Swiss championship. Who goes on which route has to be decided explicitly."],
     ["Placing a team by level is a technical decision","Putting a team on the right tier is the coach's responsibility and can go wrong. A badly placed team plays lopsided matches all season — exactly what the system is designed to prevent."],
     ["Flexibility worth using","Being able to change tier between tournaments is a tool: a team that grows during the season moves up; one that overreached moves down without drama."],
     ["The widest entrance door we have ever had","The high admission ceiling makes Rookie the natural route for anyone arriving late to volleyball, up to seventeen. The club can go and find those young people without having to promise them they will compete against peers with six years' head start. A recruitment argument that did not exist before."]],
 nota:"<strong>Pending confirmation.</strong> The project is being introduced in phases, region by region. This document is written on the target structure, which is where the whole Swiss system is heading.",
 b4:"The club's competitive ladder",
 b4p:"This is the club's real structure, verified team by team. Näfels does not have a ladder: it has <strong>nine senior teams</strong>, six men's and three women's, plus seven youth teams. A youth player can join a senior team while continuing in their stage. This is not an administrative exception: it is the second axis of development and it has to be planned.",
 b4p2:"It is precisely the model Italy institutionalised with Club Italia — developing young players by having them compete against adults rather than only against peers — with the difference that here it does not need building: it already exists. What is missing is planning it instead of letting it happen.",
 ligas:[
  {t:"4th League",s:"First contact with senior volleyball · present in both branches",c:"#FA844E",
   d:"The entry rung. The youth player meets adults, a weekly match and a rhythm that is nothing like a half-day tournament. On the women's side it also fills the role that U18 and U20 cover on the men's side: it is the natural destination after U16."},
  {t:"3rd League",s:"Regular competition · present in both branches",c:"#EE4655",
   d:"Second rung. The player stops being the one who fills in and starts carrying responsibility for the result. This is where you see whether the technical level holds against adult opposition."},
  {t:"2nd League and 2nd League B",s:"Men only · two teams",c:"#C93F60",
   d:"Having two teams at the same level is an enormous management advantage: every player can be placed where they belong without anyone being left without court time. The stretch with the most available space in the whole men's structure."},
  {t:"1st League",s:"Doorstep to the professional game · ceiling of the women's branch",c:"#8E3374",
   d:"High competitive level and senior physical demands. For a Future 3 player it is the best possible preparation environment; for a female player it is the destination, because the club's first women's team plays here. The whole women's branch points at this court."},
  {t:"NLA",s:"The destination of the men's branch",c:"#0E2A8A",
   d:"The top of the pyramid, in the same gym. A Kids Volley child has to watch them play, and a Future 3 player has to be able to train with them when he is ready."}],
 bE:"The club's teams",
 bEp:"Counting senior and youth, the club fields sixteen licensed teams plus the Männerriege and the Kids Volley programme. That is the map the youth coordination works on.",
 bEth:["Branch","Senior","Youth"],
 bEf:[["Men","NLA · 1st · 2nd · 2nd B · 3rd · 4th League","U20 · U18 · U16 · U14"],
      ["Women","1st · 3rd · 4th League","U16-1 · U16-2 · U14"]],
 bEn:"<strong>Three readings come out of this table and they change the project.</strong> First: with six men's senior teams there is a rung for every real level, from 4th League to NLA — a dense and uncommon ladder. Second: on the women's side there are no U18 or U20 teams, so the <strong>4th and 3rd League fill that role</strong>; it is not a gap, it is a bridge that already works and is worth naming as such. Third: the 1st League women's squad includes players born in 2008 and 2009, meaning juniors integrated into the first team. The second axis is not a proposal in this document: it already exists and is in use.",
 bEd:"<span class=\"dato\">[Kids Volley: number of groups and children — to be completed]</span> The club runs a Kids Volley programme and a volleyball school supported by the cantonal bank, neither of which appears in the list of licensed teams.",
 b5:"Where each stage competes",
 b5p:"<strong>Every stage competes.</strong> Each has its own circuit, and some can additionally take on a senior team. These are two different columns and they should not be confused: the first is what the player is entitled to by stage, the second is an addition the club decides on.",
 b5th:["Development stage","Own competition","Senior league","Source of the league criterion"],
 b5f:[["Kids Volley 1-2-3","Regional Kids Volley match days and the Mobiliar Kids Volley Days, open to all levels without qualification","None",1,"Players in the U14 age band or younger are not eligible for senior teams"],
      ["Rookie 1-2","Smart Competitions tournaments · regional youth championship · Swiss championship U14","None",2,"Regulation by age, plus a development criterion for anyone already past U14"],
      ["Rookie 3","Smart Competitions tournaments · regional championship · Swiss championship U14 or U16 · Youth Volley Days","None, or exceptionally",0,"Not a regulation. Only with a written report and reinforced load monitoring"],
      ["Future 1","Smart Competitions tournaments · regional championship · Swiss championship U16 or U18 · Youth Volley Days","4th or 3rd League",0,"First contact with senior play. One competition per weekend"],
      ["Future 2","Smart Competitions tournaments · regional championship · Swiss championship U18 or U20 · Youth Volley Days","3rd or 2nd League",0,"By level and maturation, not by age"],
      ["Future 3","Smart Competitions tournaments · regional championship · Swiss championship U20, U23 or SAR","2nd or 1st League · training with NLA",0,"The bridge: this is where the transition is decided"]],
 b5n:"<strong>Three regulatory points.</strong> The Swiss youth championship is played with genders separated in U14, U16, U18, U20, U23 and SAR, and each region is entitled to one place per category and gender. Regional championships are organised by each regional association and, depending on the region, run as a championship or in tournament format. And on senior leagues: a youth player may be used in a maximum of two senior leagues at once — if they appear in more, they remain eligible only for the two highest — and may be registered in only one team per league. Matches with a regional talent development team do not count towards that limit.",
 b5n2:"<span class=\"dato\">[Exact format of the regional championship in GSGL for this season — to be confirmed: it varies by region and by how far Smart Competitions has progressed]</span>",
 bN:"Two naming systems side by side",
 bNp:"The club names its teams by age — U14, U16, U18, U20 — because that is how GSGL organises its tournaments today, across all categories and both genders. Swiss Volley, by contrast, is moving to an organisation by level: Kids, Rookie and Future. <strong>There is no contradiction: these are two moments of the same system.</strong> While GSGL does not open the pilot, the club competes by age; the technical content in this document is already written by level, which is how it will work from 2028/29 at the latest. When the migration arrives, the framework does not need rewriting: the teams need re-entering.",
 b6:"The two branches side by side",
 b6p:"Both branches have a second axis and both have a visible destination inside the club: NLA for the men, 1st League for the women. The difference lies in the number of intermediate rungs, not in whether the road exists. <span class=\"dato\">[Exact composition of the women's senior teams this season — to be completed with the club]</span> Knowing it matters because it determines from which stage a player can start accumulating senior minutes.",
 b7:"Summer",
 b7p:"The summer months fall outside this framework: the club currently runs no youth activity in that period. It stays as a <strong>recommendation</strong>, not a commitment: Swiss Volley integrates beach volleyball into the youth competition calendar, and the research supports not sustaining the same sport for more than eight months a year. A summer block on sand would cover both. Noted for whenever the club has the structure to do it."
},
juego:{
 eyebrow:"How we want to play",
 titulo:"Playing identity",
 intro:"A curriculum without a playing identity is a list of contents. These six principles answer a simple question: if someone watches a Näfels team play without knowing which club it is, what do they recognise it by? These are not institutional values: they are technical decisions that show up on court and that get trained.",
 marca:"<strong>You recognise a Näfels team by the fact that the ball does not drop, that it is always played over three contacts, and that every player does everything.</strong> We are not the team that hits hardest. We are the team that is still playing when the rally gets difficult.",
 aviso:"These principles are a club decision and are reviewed every season. They are built on what the Swiss system already imposes — early penetration, a whole stretch without a libero or specialisation, process before result — and turn it into identity rather than obligation.",
 pr:[
  ["01","The first contact decides",
   "With few court hours, passing and defence are the skills that most determine whether the rally happens at all. A team that does not pass never attacks — and cannot even train attacking, because it never gets there.",
   "On court: the team routinely reaches three contacts, even on difficult balls.",
   "In training: high passing volume against a match serve, always. Softening the serve in training is paid for on Saturday."],
  ["02","Everyone sets",
   "The Swiss system imposes it in Future 1 — 6-6 system, no libero, everyone rotating through every position — and we adopt it as identity rather than as a formality. In a small club it is also a necessity: developing a single setter per age group is a structural fragility.",
   "On court: anyone sets from the back row when the first ball does not reach the setter.",
   "In training: overhead setting on the move and outside the ideal position, for everyone, at every stage."],
  ["03","We always cover",
   "The team that covers wins the long rallies, and long rallies decide junior matches. It is the cheapest collective habit to train and the least trained.",
   "On court: when one attacks, three follow. Without anyone shouting for it.",
   "In training: as a rule in small-sided games, not as an isolated drill. Installed from Kids Volley 3."],
  ["04","We attack with direction, not with power",
   "At these ages direction wins more points than power, and it also protects the shoulder and the knee. A player who only hits hard runs out of options the moment an organised block goes up.",
   "On court: at least two directions solved from the same approach.",
   "In training: the decision before the jump. We correct where they looked, not how hard they hit."],
  ["05","The aggressive error is accepted; the passive one is not",
   "This is the practical translation of the process-before-result principle Swiss Volley put at the centre of Smart Competitions. An easy serve in a match is a point given away; an aggressive serve that misses is the price of playing well.",
   "On court: a match serve at all times, with an error rate agreed in advance.",
   "In training: the right decision is praised even when the outcome is poor, and the passive decision is corrected even when the point was won."],
  ["06","We land well",
   "Landing is a technical principle, not a medical obligation. Framed this way, prevention stops being a tax on court time and becomes part of how we play — which is also what makes it actually happen.",
   "On court: knee aligned on landing from the spike and from the block, including under fatigue and in the third set.",
   "In training: in the opening block of every session, assessed by filming one rally at the end of practice."]],
 b2:"The shared language",
 b2p:"One word per concept, the same from Kids Volley to the first team. That is what lets a player who moves up understand a new coach from the first minute instead of losing half a season translating. It is also the basis of the Spanish and German versions: if the vocabulary is not fixed before translating, the three versions drift apart at the first correction.",
 b2r:"<strong>Translation rule.</strong> Terms marked as fixed are not translated: they appear identically in all three versions. Translating Talentsichtung or Entwicklungstest breaks traceability to the federation's own documents and reads as amateurish.",
 b2th:["Spanish","German","English","Usage"],
 b2fijo:"Fixed",b2libre:"Translated"
},

carga:{
 eyebrow:"Cross-cutting section · applies to both branches",
 titulo:"Individual player load",
 intro:"Every coach plans their own group, and plans it well. But a player training in two or three structures accumulates four or five stimuli, and that number appears on nobody's sheet. This section exists so that the number exists and so that somebody owns it.",
 b1:"Individual load sheet",
 b1p:"One row per player, updated at the start of each month. One total, one person responsible: the youth coordinator. The document that today does not exist in any club in the region.",
 th:["Player","Structures","hrs/week","Competitions/month","Total","Situation"],
 filas:[["Player A","Rookie 3","3","1 tournament","3 hrs · 2 stimuli","Below range — add a second group","alerta"],
        ["Player B","Future 1 + 3rd League","6.5","1 tournament + 4 matches","6.5 hrs · 4 stimuli","In range","ok"],
        ["Player C","Future 2 + 2nd League + NLA","10.5","2 tournaments + 4 matches","10.5 hrs · 7 stimuli","Over the ceiling — review this week","critico"]],
 nota:"Player C's case appears on its own, without anyone deciding it: he is the one who performs and everyone wants. He is in two youth structures plus two senior teams, with a match almost every weekend and seven stimuli of the same kind, without any strength work. Nobody decided he should train ten and a half hours: it simply added up. Patellar tendinopathy is the dominant overuse injury of the volleyball knee, and in an eleven-year cohort one in five players who developed it in adolescence gave up competitive volleyball.",
 b2:"Authorising a second stage",
 b2p:"It is approved in writing, not out of goodwill and not because of Saturday's emergency. Five conditions, all at once.",
 cond:[["A stated developmental reason","It is written down what the player needs that their own stage does not give them. If the reason is that the other team is short of players, it is not a reason."],
       ["Weekly ceiling respected","The sum of all structures stays inside the range of the stage of origin, not the destination stage."],
       ["One competition per weekend","One. Accumulated matches weigh more than accumulated training, because nobody regulates the intensity of a match."],
       ["Two full rest days","No volleyball and no gym. They are defined and respected."],
       ["Recorded and reviewed monthly","Signed by the youth coordinator. The authorisation expires: it is not permanent."],
       ["Playing in a league counts double","A player already in a senior team has their second axis covered. Adding a second youth stage on top means accumulating three ways over, and it is almost never justified."]],
 b2n:"<strong>And a regulatory limit.</strong> For the championship route each club enters one team per category, and there are restrictions on players appearing in more than one team. Training in several groups is the mechanism of this framework; competing for several teams is a different matter and must be checked against the current regulations before every entry. <span class=\"dato\">[Verify against the regulations for the season in progress]</span>",
 b3:"The right counter: jumps, not hours",
 b3p:"In volleyball the load is jumping and the hitting arm. A player in three groups can double their jump volume without it showing anywhere. The research reports widely varying figures depending on level and position, and in elite youth it documents clear differences between males and females in jumps and load per session. That is why the club's own figures are counted, not copied.",
 b3th:["Type of session","Jumps","Maximal-intensity attacks","Source"],
 b3filas:[["Technical session","to be counted","to be counted"],["Session with game play","to be counted","to be counted"],["Half-day tournament","to be counted","to be counted"]],
 b3nota:"<strong>How to complete it:</strong> two sessions of each type, one observer with a hand counter. Half an hour of work per cell, and the club has its own table. Worth more than any figure taken from a study run in a different context.",
 b4:"Progression rule",
 b4p:"The weekly total does not jump sharply from the preceding weeks. Pay particular attention to returns: after Christmas, after an injury, at the start of the season. The load spike after a break is where people break, not sustained high volume."
},

staff:{
 eyebrow:"What holds the framework up when the people change",
 titulo:"Coaching staff and player protection",
 intro:"A written framework with nobody to carry it dies in November. This section defines who does what, with what qualifications, and under what rules of conduct.",
 b1:"Structure and responsibilities",
 roles:[["Youth coordinator","Owner of the framework. Approves second stages, maintains the load sheets, observes sessions, decides on placement by level and answers to the board. A function, not an honorary title: it requires allocated hours."],
        ["Stage coach","Applies the stage sheet, records attendance and measurements, and takes part in the weekly meeting. Does not decide alone on the load of a player shared with another group."],
        ["Physical preparation lead","May be external or shared across stages. Defines and updates the athletic tiers and the home programmes."],
        ["Data and video lead","A new role. Connects what already exists in the first team to the youth programme: measurements, short video and player files."]],
 b2:"Coach development",
 b2p:"The framework does not work if every coach interprets it their own way. Three commitments: all coaches holding the J+S qualification matching their stage and kept current; one internal workshop at the start of the season to bring the framework onto the court; and a weekly thirty-minute meeting with a fixed agenda — the load of shared players, one concrete case, and one technical idea for the week.",
 b2r:"External reference: USA Volleyball requires a foundational course of every junior club coach, plus a child-protection certification completed before any contact with athletes, and a background check for everyone.",
 b2s:"And an obligation that comes with the new system: Smart Competitions includes a code of honour for coaches and families reflecting the values of Swiss sport and the idea of balanced matches, participation for all and process before result. Signing up to it is part of entering the system.",
 b3:"The shared language",
 b3p:"One word per concept, the same from Kids Volley to the first team. The full glossary, with the Spanish and German equivalents and the rule on which terms are never translated, sits under Identity. The coaching staff's obligation is to use it: if every coach names things their own way, a player changing stage loses half a season translating.",
 b4:"Ethics and child protection",
 b4p:"No youth document can circulate today without this section. Four minimum rules, applicable from tomorrow, aligned with the ethics charter of Swiss sport:",
 etica:[["Never alone","No coach is left alone with a minor in a changing room, on a trip or in a closed gym. Always two adults or an open door."],
        ["Visible communication","Messages to underage players go through group channels or with the family copied in. Never private."],
        ["A route to report","A designated person outside the coaching staff whom a player or a family can turn to. Published and known."],
        ["Image","Written family consent for photos and video, revocable at any time without having to give a reason."]],
 b5:"Families",
 b5p:"It is families who enrol a child in three structures, with the best intentions in the world. A one-page sheet at the start of the season — how many hours are appropriate, why there are two rest days, why the club sometimes says no, and why tournament results are not published — prevents most conflicts before they exist. It is handed back signed."
},
herr:{
 eyebrow:"What gets used on Monday morning",
 titulo:"Tools",
 intro:"A framework that never reaches paper never gets applied. These five pieces turn the document into daily work. They all fit on one sheet and they are all designed to be used without a computer, at the edge of the court.",
 b1:"Measurement battery",
 b1p:"Twice a year, October and March, at every stage and in both branches. Height runs separately: every three months, because it is what places a player in their athletic tier. This is the tool with an expiry date: miss October and the baseline for the whole season is gone.",
 b1th:["What is measured","How","Equipment","Common mistake"],
 b1f:[
  ["Standing height","Standing against the wall, no shoes, heels together, looking straight ahead.","Tape measure on the wall","Measuring with trainers on, or letting the child look upwards."],
  ["Arm span","Arms stretched out in a cross against the wall, fingertip to fingertip.","Tape measure","Not keeping the back flat against the wall."],
  ["Standing reach","Standing, one arm extended overhead, shoulder raised, heels on the floor.","Marked wall or jump device","Letting the heel lift: it inflates the figure and ruins the comparison."],
  ["Spike reach","With an approach, touching the highest possible point with one hand.","Jump device or marked wall","Changing the type of approach between October and March."],
  ["Block reach","No approach, standing jump, two hands.","Device or wall","Allowing a preparatory step."],
  ["Vertical jump (CMJ)","Countermovement jump, hands on hips, three attempts, best one recorded.","Jump app or force plate","Using a different app between measurements."],
  ["Landing control","Drop from a low box. Observe whether the knee collapses inward. Record good, fair or poor.","A 30 cm box and a phone to film","Recording from memory instead of filming."],
  ["Serve","Ten serves to a called zone. Record how many land in court and how many in the zone.","Cones","Changing the zone between measurements."],
  ["Reception","Twenty receptions of a match serve. Record how many stay in system.","Nothing","Softening the serve so the number looks better."]],
 b1n:"<strong>The three golden rules.</strong> Same protocol, same tester, same time of session. A change of method produces a false improvement, and a false improvement ruins a decision about a young person. If you have to choose between measuring well and measuring everyone, measure well those you can.",
 b1p2:"The recording sheet carries one row per player and these columns: name, year of birth, stage, senior team where applicable, and one column per measurement round. It is kept from one season to the next: only after two seasons does the club have its own reference values and stop guessing.",
 b2:"Home programme",
 b2p:"Fifteen minutes, three times a week, body weight only and no equipment. Handed out printed at the start of the season and reviewed once a month in the gym, with the group, so that nobody does it wrong for six months. It is the part of training with the highest return in the whole pathway and the only way to reach the weekly dose the research links to a real reduction in risk.",
 b2th:["Block","What is done","How long"],
 b2f:[["Mobility","Ankle against the wall, hips and thoracic spine.","3 minutes"],
      ["Landings","Landing from a low step with the knee aligned. First on two legs, then on one.","4 minutes"],
      ["Hamstrings","Eccentric work with a partner or a fixed anchor, progressing gradually.","3 minutes"],
      ["Hips and trunk","Bridges, lateral abduction, short planks.","3 minutes"],
      ["Balance","Single-leg stance with eyes closed and with perturbation.","2 minutes"]],
 b2n:"<strong>It adapts to the tier, not to the stage.</strong> Before the growth spurt the focus is coordination and balance; during the spurt, eccentric work and landing control; after the spurt the load can progress. And on the women's side the programme is not optional at any stage.",
 b3:"Player file",
 b3p:"One per player, following them from Kids Volley to the first team. The document that lets a new coach understand a young player in five minutes instead of three months. It is also where the club's data system enters the youth programme without needing any scouting.",
 b3th:["Block","What it contains"],
 b3f:[["Identification","Name, year of birth, year joined, school, family contact."],
      ["Trajectory","Stages and teams by season, including senior league where applicable."],
      ["Measurements","Every October and March round, as a series. The series matters more than the value."],
      ["Growth","Height every three months and current athletic tier."],
      ["Load","Weekly hours and competitions, with the monthly history."],
      ["Injuries","What, when, days out, how the return went."],
      ["Federation","Participation in Talentsichtung, entry into the Talentpool, Talent Card where applicable."],
      ["Goals","Two per season, written with the player and reviewed with them."],
      ["Coach notes","Short and dated. Earlier entries are not deleted."]],
 b4:"Session observation sheet",
 b4p:"One sheet for walking into any group and observing the same things every time. It is the coordinator's working instrument and it is for support, not control: it is shared with the coach the same day. Ten minutes of observation is enough.",
 b4f:[["Was the prevention block done in full?","Yes or no, and how many minutes actually."],
      ["Density","Quality ball contacts per player over a five-minute window. Counted, not estimated."],
      ["Queues","Was there a line of more than four players waiting anywhere?"],
      ["Season priority","Did any of the stage's five priorities appear?"],
      ["Language","Were the glossary terms used, or the coach's own?"],
      ["Correction","Was the decision corrected, or only the movement?"],
      ["Close","Did a player speak, or only the coach?"],
      ["Landings","Did anyone land with the knee collapsing inward without being corrected?"]],
 b4n:"The result is not filed, it is discussed. An observation that does not end in a five-minute conversation with the coach is a formality.",
 b5:"Family sheet",
 b5p:"One page, handed back signed at the start of the season. It is families who enrol a child in three structures, with the best intentions in the world. This sheet prevents most conflicts before they exist.",
 b5f:[["How many hours are appropriate","The range for their child's stage, and the total across all structures."],
      ["Why two rest days","And why that is not a lack of commitment."],
      ["Why the club sometimes says no","To a second team, to a third structure, to one more tournament."],
      ["Why results are not published","The Swiss youth system is deliberately process-oriented. Better explained before anyone asks."],
      ["How a stage change is decided","By level and by written standards, not by age and not by favour."],
      ["Who to turn to","The designated person outside the coaching staff, for any problem."],
      ["What is expected of the family","Bringing, collecting, supporting and not coaching from the stands. The Smart Competitions code of honour applies to families too."]]
},

plan:{
 eyebrow:"From document to practice",
 titulo:"Rollout",
 intro:"A framework is approved in one meeting and implemented over three years. These are the three phases, ordered by what they cost. The first costs nothing and changes the most.",
 b0:"Season calendar",
 b0p:"The Swiss season runs from September to April. This is the club's macrocycle, with the windows that cannot be moved and the management milestones that tend to be forgotten until it is too late.",
 b0th:["When","Development focus","Competition","Management"],
 b0f:[
  ["August","Forming groups and placing them by level","—","Internal staff workshop · team entries · family sheet"],
  ["September","Installing the season priorities","First tournaments · league starts","Load sheets completed and approved"],
  ["October","High technical volume","Regional tournaments","<strong>Measurement 1</strong> · regional Talentsichtung GSGL"],
  ["November","Priorities in game situations","Competition block","First session observations · monthly load review"],
  ["December","Consolidation","Competition block","Report to the board · home programme handed out for the break"],
  ["Christmas","Break","—","Nobody trains every day. The home programme holds the minimum"],
  ["January","<strong>Progressive return</strong>","Restart","Load does not jump straight back to December levels: this is where most people break"],
  ["February","Tactics and decision-making","Competition block 2","Review of placement by level: who moves up and who moves down"],
  ["March","Performance","Qualifiers","<strong>Measurement 2</strong> · comparison with October"],
  ["April","Close and evaluation","Swiss youth championship","Individual conversation with every player · stage decision for next season"],
  ["May to August","Off-season","—","Another sport is recommended. Fewer than eight months a year in the same sport"]],
 b0n:"<strong>Two dates that do not move.</strong> The October measurement, because without a baseline the whole season goes without data. And the regional Talentsichtung, because it is the door to the Talentpool and it happens once a year. Everything else can shift.",
 fases:[
  {t:"Phase 1 — Method",c:"No additional cost · this season",col:"#FAE149",l:[
   "Stage sheets in use across all nine stages.",
   "Twenty-minute prevention block in every session.",
   "Individual load sheet and second-stage rule in force.",
   "Weekly staff meeting with a fixed agenda.",
   "Measurement battery in October and March.",
   "Family sheet and child-protection rules published.",
   "Written criterion for placing each team by level."]},
  {t:"Phase 2 — Structure",c:"Requires hours and a board decision · seasons 2 and 3",col:"#EE4655",l:[
   "Allocated and paid hours for youth coordination.",
   "A dedicated athletic block across the three Future stages.",
   "J+S qualification plan for the whole coaching staff.",
   "A deliberate decision on the bridge between Future 3 and the women's 1st League.",
   "The club's own reference values, after two seasons of measurements.",
   "At least one club-hosted tournament per season."]},
  {t:"Phase 3 — Identity",c:"Three-year objective",col:"#0E2A8A",l:[
   "Data and video integrated from Rookie 3, supported by the first team's system.",
   "A formalised bridge between Future 3 and the first team.",
   "The document published in German and English as the club's calling card.",
   "Application for a youth development quality label."]}],
 b2:"The first 90 days",
 th:["When","What","Who"],
 dias:[["Week 1-2","Presenting the framework to the whole coaching staff. Internal workshop.","Coordinator"],
       ["Week 2","Survey: who currently trains in more than one structure. The number nobody has.","Coaches"],
       ["Week 2","Confirm with GSGL where Smart Competitions stands.","Coordinator"],
       ["Week 3","Individual load sheets completed and first review.","Coordinator"],
       ["Week 3-4","Prevention block running across all nine stages.","Coaches"],
       ["Week 4","Family sheet handed out and signed.","Club"],
       ["October","First full measurement round, same protocol at every stage.","Coordinator and physical lead"],
       ["November","Entering the players who fit the profile for the regional GSGL trial.","Coordinator"],
       ["December","First report to the board: retention, load, injuries, measurements.","Coordinator"]],
 nota:"<strong>The one thing that will not wait.</strong> The October measurement. Everything else can slip by a month; that window does not return until next year, and without a baseline the framework spends another season with no data of its own."
},
foda:{
 eyebrow:"Internal annex · does not circulate beyond the coaching staff and the board",
 titulo:"Strategic diagnosis",
 intro:"This analysis looks at the club, not at the document. It is written to decide, not to illustrate: every weakness and every threat has a strategic pairing and an action with an owner in the first 90 days plan.",
 aviso:"<strong>Restricted use.</strong> Statements such as \"not every coach holds the necessary qualification\" are accurate and internal. This annex is not given to families and is not attached to the institutional presentation.",
 f:{t:"Strengths",c:"#76B82A",l:[
   ["An NLA team in the same building","The top of the pyramid is visible and reachable. Almost no development club in the country can offer that."],
   ["Nine senior and seven youth teams","Six men's senior teams up to NLA and three women's up to 1st League. There is a rung for every real level, inside the same club. The model Italy had to build from scratch with Club Italia is already standing here."],
   ["Data and video capability already installed","It exists and works in the first team. Scaling it to the youth programme requires no purchase, only a decision."],
   ["Unified technical direction across the whole youth programme","One person responsible for nine stages and both branches. The condition that makes a shared framework possible at all."],
   ["A region with an active talent structure","GSGL's Talentsichtung works, with venues in Jona and Chur, and there is a national pathway behind it."]]},
 o:{t:"Opportunities",c:"#F2A623",l:[
   ["Rookie's high admission ceiling","Allows the club to recruit young people up to seventeen who have never played, without exposing them to peers with six years' head start. A new entrance door."],
   ["Smart Competitions rewards what we can do","The system now values participation, retention and process. A club with a written development framework is better positioned than one that only knows how to win tournaments."],
   ["School Volley as a channel into schools","The federation's official route to reach children where they are, without depending on the family already knowing volleyball."],
   ["Becoming the canton's reference club for development","Glarus is small. Whoever publishes a serious framework first sets the benchmark and wins the families."],
   ["We are already a tournament host","The club ran a GSGL youth playing round in September and a Kids Volley tournament in December. The capability is proven: what is missing is turning it into policy, with a fixed calendar of club-hosted tournaments each season. It brings teams, families, income and regional visibility at low cost."]]},
 d:{t:"Weaknesses",c:"#E8593C",l:[
   ["No women's U18 or U20 teams","The women's branch jumps straight from U16 to senior. Today the 4th and 3rd League absorb that jump and it works, but it means a seventeen-year-old competes against adults without an intermediate stage of her own age. It has to be decided whether that stands or gets covered."],
   ["Three hours a week per group","Below the recommended range at almost every stage. It is compensated through multi-group participation and senior play, but that is compensation, not a solution."],
   ["Nobody held the total load per player","The individual load sheet exists precisely because that number was on no sheet at all."],
   ["Uneven qualification across the coaching staff","J+S qualifications are not mapped by stage and there is no written renewal plan."],
   ["No data of our own","There are no club reference values because there was never systematic measurement. The first baseline is October's."],
   ["Coordination without allocated hours","If the role depends on goodwill, the framework dies in November."]]},
 a:{t:"Threats",c:"#3B8BD4",l:[
   ["A small catchment area","Glarus has a small population and several sports compete for the same children. The underlying constraint on the whole project."],
   ["Drop-out in adolescence","The peak of attrition coincides with Rookie and the start of Future. Exactly the moment the system demands most."],
   ["Overload from accumulated structures","Youth plus senior league plus tournaments. Patellar tendinopathy in adolescence ended the careers of one in five players who developed it."],
   ["Coach turnover","Without a shared language and written stage sheets, every change of coach resets the category."],
   ["Incomplete transition to Smart Competitions","The system arrives region by region. Planning on the wrong structure costs a season."],
   ["Dependence on volunteers","The structural risk of the whole of Swiss grassroots sport, which the federation itself names as one of the social shifts forcing it to adapt."]]},
 b2:"Cross-strategies",
 b2p:"A SWOT without pairings is decoration. These six strategies combine a strength or an opportunity with a concrete weakness or threat, and all of them have a counterpart in the plan.",
 cr:[
  ["Use the NLA against drop-out","Strength + Threat","The attrition peak sits at Rookie. Letting those young people into NLA matches for free, having them shag balls and train once a season with the first team is the cheapest retention intervention there is."],
  ["Make the women's ceiling visible","Strength + Threat","The women's 1st League team is the destination of the whole branch and it has to be named from Kids Volley onwards: open matches, first-team players turning up at the girls' training sessions, and a Future 3 player training with them when she is ready. Against adolescent drop-out, seeing the destination is worth more than any speech."],
  ["Recruit through School Volley and late Rookie entry","Opportunity + Threat","Against the small catchment area: go into schools through the official channel and offer Rookie to those arriving late. It widens the funnel without competing for the same children."],
  ["First-team data as a recruitment advantage","Strength + Threat","No neighbouring club can offer a family that their child gets an individual file, two measurement rounds a year and video. That is an argument for choosing a club, not just a technical tool."],
  ["The load sheet against overload","Weakness + Threat","The only antidote to accumulated structures is that a total exists with somebody responsible for it. It costs nothing and it is the first action in the plan."],
  ["Written stage sheets against turnover","Weakness + Threat","A coach who leaves takes their knowledge with them; a stage sheet stays. The shared language and the sheets are the insurance against turnover."]],
 b3:"Recruitment: how the club grows",
 b3p:"With a small catchment area, retention and recruitment matter as much as development. Four channels, ordered by cost.",
 cap:[["School Volley","The federation's official route into schools, with adapted 3v3 formats and simplified rules. The cheapest channel and the one that reaches children with nobody in the family who plays volleyball."],

/* ════════ PLANTEL — editable, los datos son del club ════════ */
const EQUIPOS = {
  m:{form:["U14","U16","U18","U20","Kids Volley"], liga:["—","4ª liga","3ª liga","2ª liga B","2ª liga","1ª liga","NLA"]},
  f:{form:["U14","U16-1","U16-2","Kids Volley"],   liga:["—","4ª liga","3ª liga","1ª liga"]}
};
const RANGO_EDAD = [[10,1.5,3],[12,3,4.5],[14,4.5,6],[16,6,9],[18,7.5,10.5],[99,9,13.5]];
const TEMPORADA = 2026;
let PLANTEL = [], PL_AGRUPAR = "grupo", PL_RAMA = "todas", PL_BUSCA = "", plSeq = 1;

const edadDe = j => j.jg ? TEMPORADA - j.jg : null;
function rangoDe(j){
  const e = edadDe(j); if(e===null) return null;
  for(const r of RANGO_EDAD) if(e<=r[0]) return [r[1],r[2]];
  return null;
}
function estadoDe(j){
  const e = edadDe(j), r = rangoDe(j), h = Number(j.h)||0;
  if(!r) return ["",S("plSinFecha")];
  if(h > e) return ["critico",S("plSupera")];
  if(h > r[1]) return ["critico",S("plSobre")];
  if(h < r[0]) return ["alerta",S("plDebajo")];
  return ["ok",S("plRango")];
}
function plFiltrado(){
  const q = PL_BUSCA.trim().toLowerCase();
  return PLANTEL.filter(j => (PL_RAMA==="todas"||j.rama===PL_RAMA) && (!q||(j.nombre||"").toLowerCase().includes(q)));
}
function claveDe(j){
  if(PL_AGRUPAR==="grupo")  return j.grupo || S("plSinGrupo");
  if(PL_AGRUPAR==="liga")   return (j.liga && j.liga!=="—") ? j.liga : S("plSinLiga");
  if(PL_AGRUPAR==="jg")     return j.jg ? String(j.jg) : S("plSinAnio");
  if(PL_AGRUPAR==="rama")   return j.rama==="f" ? S("plF") : S("plM");
  if(PL_AGRUPAR==="estado") return estadoDe(j)[1];
  return "—";
}
window.plAdd = function(){
  const g = id => document.getElementById(id);
  const nombre = (g("plNombre").value||"").trim();
  if(!nombre){ g("plNombre").focus(); return; }
  PLANTEL.push({id:plSeq++, nombre:nombre, jg:parseInt(g("plJg").value)||null,
    rama:g("plRama").value, grupo:g("plGrupo").value, liga:g("plLiga").value,
    h:parseFloat(g("plH").value)||0, comp:parseFloat(g("plComp").value)||0});
  g("plNombre").value=""; g("plJg").value="";
  render(); var n=document.getElementById("plNombre"); if(n) n.focus();
};
window.plDel = function(id){ PLANTEL = PLANTEL.filter(function(j){return j.id!==id;}); render(); };
window.plSet = function(id,campo,val){
  const j = PLANTEL.find(function(x){return x.id===id;}); if(!j) return;
  j[campo] = (campo==="h"||campo==="comp") ? (parseFloat(val)||0) : (campo==="jg") ? (parseInt(val)||null) : val;
  if(campo==="rama"){
    if(EQUIPOS[val].form.indexOf(j.grupo)<0) j.grupo = EQUIPOS[val].form[0];
    if(EQUIPOS[val].liga.indexOf(j.liga)<0) j.liga = "—";
  }
  render();
};
window.plRamaForm = function(){
  const r = document.getElementById("plRama").value;
  document.getElementById("plGrupo").innerHTML = EQUIPOS[r].form.map(function(x){return "<option>"+x+"</option>";}).join("");
  document.getElementById("plLiga").innerHTML  = EQUIPOS[r].liga.map(function(x){return "<option>"+x+"</option>";}).join("");
};
function bajar(contenido, nombre, tipo){
  const blob = new Blob([contenido], {type:tipo});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob); a.download = nombre; a.click();
  setTimeout(function(){ URL.revokeObjectURL(a.href); }, 1000);
}
window.plExport = function(){
  bajar(JSON.stringify({temporada:TEMPORADA, plantel:PLANTEL}, null, 2), "plantel_naefels.json", "application/json");
};
window.plCSV = function(){
  const filas = [[S("plNombre"),S("plAnio"),S("plRama"),S("plGrupo"),S("plLiga"),S("plH"),S("plComp"),"Status"]].concat(
    PLANTEL.map(function(j){ return [j.nombre, j.jg||"", j.rama==="f"?S("plF"):S("plM"),
      j.grupo||"", j.liga||"", j.h||0, j.comp||0, estadoDe(j)[1]]; }));
  const csv = filas.map(function(f){ return f.map(function(c){ return '"'+String(c).replace(/"/g,'""')+'"'; }).join(";"); }).join("\n");
  bajar("\ufeff"+csv, "plantel_naefels.csv", "text/csv;charset=utf-8");
};
window.plImport = function(ev){
  const f = ev.target.files[0]; if(!f) return;
  const lector = new FileReader();
  lector.onload = function(e){
    try{
      const d = JSON.parse(e.target.result);
      const arr = Array.isArray(d) ? d : d.plantel;
      if(!Array.isArray(arr)) throw new Error("formato");
      PLANTEL = arr.map(function(j){ return {id:plSeq++, nombre:j.nombre||"", jg:j.jg||null,
        rama:j.rama==="f"?"f":"m", grupo:j.grupo||"", liga:j.liga||"—",
        h:parseFloat(j.h)||0, comp:parseFloat(j.comp)||0}; });
      render();
    }catch(err){ alert(S("plError")); }
  };
  lector.readAsText(f); ev.target.value = "";
};

function bloqueVolumen(){
  const v = D().vol;
  const hGrupo = (CFG.sesiones*CFG.minutos)/60, h = hGrupo + CFG.liga, anual = Math.round(h*CFG.semanas);
  const filas = ORDEN.map(id=>{

    return `<tr><td><strong style="color:${e.ink}">${d.e.split("·")[0].trim()}</strong></td>

      </div></div>
    <div class="tabla-envoltura"><table><thead><tr><th>${v.th1}</th><th>${v.th2}</th><th>${v.th3}</th><th>${v.th4}</th><th>${v.th5}</th></tr></thead>

function vPlantel(){
  const lista = plFiltrado();
  const grupos = {};
  lista.forEach(function(j){ (grupos[claveDe(j)] = grupos[claveDe(j)] || []).push(j); });
  const claves = Object.keys(grupos).sort();
  const tot = PLANTEL.length;
  const alerta = PLANTEL.filter(function(j){ return estadoDe(j)[0]==="alerta"; }).length;
  const critico = PLANTEL.filter(function(j){ return estadoDe(j)[0]==="critico"; }).length;
  const conLiga = PLANTEL.filter(function(j){ return j.liga && j.liga!=="—"; }).length;

  const opt = function(v,txt,sel){ return '<option value="'+v+'"'+(v===sel?" selected":"")+">"+txt+"</option>"; };
  const selGrupo = function(j){ return EQUIPOS[j.rama].form.map(function(x){ return opt(x,x,j.grupo); }).join(""); };
  const selLiga  = function(j){ return EQUIPOS[j.rama].liga.map(function(x){ return opt(x,x,j.liga); }).join(""); };

  const fila = function(j){
    const st = estadoDe(j), e = edadDe(j), r = rangoDe(j);
    return '<tr>'
      + '<td><input class="pl-edit" value="'+(j.nombre||"").replace(/"/g,"&quot;")+'" onchange="plSet('+j.id+',\'nombre\',this.value)"></td>'
      + '<td><input class="pl-edit" type="number" style="width:74px" value="'+(j.jg||"")+'" onchange="plSet('+j.id+',\'jg\',this.value)"></td>'
      + '<td class="num">'+(e===null?"—":e)+'</td>'
      + '<td><select class="pl-edit" onchange="plSet('+j.id+',\'rama\',this.value)">'+opt("m",S("plMasc"),j.rama)+opt("f",S("plFem"),j.rama)+'</select></td>'
      + '<td><select class="pl-edit" onchange="plSet('+j.id+',\'grupo\',this.value)">'+selGrupo(j)+'</select></td>'
      + '<td><select class="pl-edit" onchange="plSet('+j.id+',\'liga\',this.value)">'+selLiga(j)+'</select></td>'
      + '<td><input class="pl-edit" type="number" step="0.5" style="width:64px" value="'+(j.h||0)+'" onchange="plSet('+j.id+',\'h\',this.value)"></td>'
      + '<td><input class="pl-edit" type="number" step="1" style="width:58px" value="'+(j.comp||0)+'" onchange="plSet('+j.id+',\'comp\',this.value)"></td>'
      + '<td class="num">'+(r?r[0]+"–"+r[1]+" h":"—")+'</td>'
      + '<td><span class="pill '+st[0]+'">'+st[1]+'</span></td>'
      + '<td><button class="btn-x" title="'+S("plQuitar")+'" onclick="plDel('+j.id+')">×</button></td></tr>';
  };

  const tabla = function(js){
    return '<div class="tabla-envoltura"><table><thead><tr>'
      + S("plTh").concat([""]).map(function(x){ return "<th>"+x+"</th>"; }).join("")
      + '</tr></thead><tbody>' + js.map(fila).join("") + '</tbody></table></div>';
  };

  return '<div class="enc"><div class="eyebrow">'+S("plEye")+'</div>'
    + '<h2>'+S("plTit")+'</h2><p>'+S("plIntro")+'</p></div>'

    + '<div class="pl-res" style="margin-top:24px">'
    + '<div style="--c:#FA844E"><b>'+tot+'</b><span>'+S("plRes")[0]+'</span></div>'
    + '<div style="--c:#EE4655"><b>'+conLiga+'</b><span>'+S("plRes")[1]+'</span></div>'
    + '<div style="--c:#FAE149"><b>'+alerta+'</b><span>'+S("plRes")[2]+'</span></div>'
    + '<div style="--c:#0E2A8A"><b>'+critico+'</b><span>'+S("plRes")[3]+'</span></div></div>'

    + '<div class="pl-barra no-imprimir">'
    + '<div class="pl-campo"><label>'+S("plNombre")+'</label><input class="txt" id="plNombre" placeholder="'+S("plPh")+'" onkeydown="if(event.key===\'Enter\')plAdd()"></div>'
    + '<div class="pl-campo"><label>'+S("plAnio")+'</label><input type="number" id="plJg" placeholder="2012" onkeydown="if(event.key===\'Enter\')plAdd()"></div>'
    + '<div class="pl-campo"><label>'+S("plRama")+'</label><select id="plRama" onchange="plRamaForm()"><option value="m">'+S("plM")+'</option><option value="f">'+S("plF")+'</option></select></div>'
    + '<div class="pl-campo"><label>'+S("plGrupo")+'</label><select id="plGrupo">'+EQUIPOS.m.form.map(function(x){return "<option>"+x+"</option>";}).join("")+'</select></div>'
    + '<div class="pl-campo"><label>'+S("plLiga")+'</label><select id="plLiga">'+EQUIPOS.m.liga.map(function(x){return "<option>"+x+"</option>";}).join("")+'</select></div>'
    + '<div class="pl-campo"><label>'+S("plH")+'</label><input type="number" step="0.5" id="plH" value="3"></div>'
    + '<div class="pl-campo"><label>'+S("plComp")+'</label><input type="number" step="1" id="plComp" value="1"></div>'
    + '<button class="btn-s" onclick="plAdd()">'+S("plAdd")+'</button></div>'

    + '<div class="pl-barra no-imprimir" style="border-color:var(--gris-claro)">'
    + '<div class="pl-campo"><label>'+S("plAgrupar")+'</label><select onchange="PL_AGRUPAR=this.value;render()">'
      + opt("grupo",S("plPorGrupo"),PL_AGRUPAR)+opt("liga",S("plPorLiga"),PL_AGRUPAR)
      + opt("jg",S("plPorAnio"),PL_AGRUPAR)+opt("rama",S("plPorRama"),PL_AGRUPAR)
      + opt("estado",S("plPorEstado"),PL_AGRUPAR)+'</select></div>'
    + '<div class="pl-campo"><label>'+S("plRama")+'</label><select onchange="PL_RAMA=this.value;render()">'
      + opt("todas",S("plTodas"),PL_RAMA)+opt("m",S("plM"),PL_RAMA)+opt("f",S("plF"),PL_RAMA)+'</select></div>'
    + '<div class="pl-campo"><label>'+S("plBuscar")+'</label><input class="txt" value="'+PL_BUSCA.replace(/"/g,"&quot;")+'" oninput="PL_BUSCA=this.value;render()" placeholder="'+S("plNombre")+'"></div>'
    + '<button class="btn-s sec" onclick="plExport()">'+S("plGuardar")+'</button>'
    + '<button class="btn-s sec" onclick="plCSV()">'+S("plCSV")+'</button>'
    + '<label class="btn-s sec" style="cursor:pointer">'+S("plCargar")+'<input type="file" accept=".json" style="display:none" onchange="plImport(event)"></label>'
    + '</div>'

    + (claves.length===0
        ? '<div class="pl-vacio">'+S("plVacio")+'</div>'
        : claves.map(function(k){
            const js = grupos[k];
            const hs = js.reduce(function(a,j){ return a+(Number(j.h)||0); },0);
            return '<div class="pl-grupo"><h4>'+k+'<span>'+js.length+" "+(js.length===1?S("plJug"):S("plJugs"))
              +' · '+S("plProm")+' '+(js.length?(hs/js.length).toFixed(1):0)+' '+S("plSem")+'</span></h4>'+tabla(js)+'</div>';
          }).join(""))

    + '<div class="nota aviso" style="margin-top:26px">'+S("plNota1")+'</div>'
    + '<div class="nota">'+S("plNota2")+'</div>'
    + imprimir();
}

  tema(); pintarEstaticos();

  document.getElementById("ruta").hidden = !esEt;
  if(esEt) pintarRuta();
  const vs = {resumen:vResumen, juego:vJuego, matriz:vMatriz, comp:vComp, carga:vCarga, plantel:vPlantel, staff:vStaff, herr:vHerr, plan:vPlan, foda:vFoda, ref:vRef};
  document.getElementById("contenido").innerHTML = esEt ? vEtapa(VISTA) : vs[VISTA]();
  document.querySelectorAll(".solapa").forEach(b=>b.setAttribute("aria-selected", String(b.dataset.v===VISTA)));
  enlazarConfig();
}
document.querySelectorAll(".solapa").forEach(b=>b.onclick=()=>{ VISTA=b.dataset.v; render(); });
document.querySelectorAll(".idioma").forEach(b=>b.onclick=()=>{
  if(b.disabled) return; LANG=b.dataset.lang;
  document.querySelectorAll(".idioma").forEach(x=>x.setAttribute("aria-pressed",String(x===b)));
  render();
});
render();
</script>
</body>
</html>
