<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Modelo de Formación · Axpo Volley Näfels</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@600;700&family=Barlow+Semi+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --amarillo:#FAE149;--naranja:#FA844E;--coral:#EE4655;--magenta:#B43969;--azul:#0E2A8A;--azul-profundo:#101649;
  --papel:#FBFAF9;--tarjeta:#FFF;--tinta:#16161C;--gris:#5E6068;--gris-claro:#E4E4E8;
  --dato:#FFE9A3;--dato-borde:#D9A400;--cat:var(--naranja);--cat-ink:#C25218;
  --fd:'Barlow Condensed',system-ui,sans-serif;--fb:'Barlow',system-ui,sans-serif;--fn:'Barlow Semi Condensed',system-ui,sans-serif;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--papel);color:var(--tinta);font-family:var(--fb);font-size:16px;line-height:1.55}
h1,h2,h3,h4{font-family:var(--fd);text-transform:uppercase;margin:0;font-weight:700;line-height:1.03}
a{color:var(--cat-ink)}
:focus-visible{outline:3px solid var(--azul);outline-offset:2px}
.wrap{max-width:1340px;margin:0 auto;padding:0 26px}

.masthead{color:#fff;background:var(--azul-profundo);
  background-image:linear-gradient(103deg,var(--amarillo) 0%,var(--naranja) 22%,var(--coral) 44%,var(--magenta) 68%,var(--azul) 100%)}
.masthead-in{display:flex;flex-wrap:wrap;gap:18px;align-items:flex-end;justify-content:space-between;padding:26px 0 24px}
.marca{font-family:var(--fd);font-size:15px;letter-spacing:.22em;text-transform:uppercase;opacity:.92}
.titulo{font-size:clamp(34px,6vw,58px);color:#fff;text-shadow:0 1px 0 rgba(0,0,0,.12)}
.subtitulo{font-family:var(--fn);font-size:15px;font-weight:600;opacity:.95;margin-top:4px}
.meta{font-family:var(--fn);font-size:13px;text-align:right;opacity:.95;line-height:1.5}
.idiomas{display:flex;gap:6px;justify-content:flex-end;margin-top:8px}
.idioma{font-family:var(--fn);font-weight:700;font-size:12px;letter-spacing:.1em;padding:5px 11px;border-radius:99px;
  border:1.5px solid rgba(255,255,255,.55);background:transparent;color:#fff;cursor:pointer}
.idioma[aria-pressed="true"]{background:#fff;color:var(--azul-profundo);border-color:#fff}
.idioma[disabled]{opacity:.5;cursor:not-allowed}

.solapas{background:var(--tarjeta);border-bottom:1px solid var(--gris-claro);position:sticky;top:0;z-index:20}
.solapas-in{display:flex;gap:0;align-items:stretch}
.grupo-nav{display:flex;flex-direction:column;padding:7px 0 0;flex:1 1 auto}
.grupo-nav + .grupo-nav{border-left:1px solid var(--gris-claro);padding-left:14px;margin-left:14px}
.grupo-eti{font-family:var(--fn);font-size:10px;font-weight:700;letter-spacing:.15em;text-transform:uppercase;
  color:var(--gris);padding:0 10px 3px}
.grupo-btns{display:flex}
.solapa{font-family:var(--fd);font-size:15.5px;text-transform:uppercase;letter-spacing:.02em;padding:6px 10px 12px;border:0;white-space:nowrap;
  background:transparent;color:var(--gris);cursor:pointer;white-space:nowrap;border-bottom:4px solid transparent;flex:0 1 auto}
.solapa[aria-selected="true"]{color:var(--tinta);border-bottom-color:var(--cat)}

.ruta{padding:22px 0 4px}
.ruta-rotulo{font-family:var(--fn);font-size:11px;font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:var(--gris);margin-bottom:11px}
.ruta-grupos{display:grid;grid-template-columns:repeat(3,1fr);gap:22px}
.grupo-tit{font-family:var(--fd);font-size:15px;text-transform:uppercase;letter-spacing:.09em;color:var(--gris);margin-bottom:7px}
.grupo-tit small{font-family:var(--fn);font-size:11.5px;font-weight:600;letter-spacing:0;text-transform:none;display:block;color:var(--gris);opacity:.8}
.grupo-pasos{display:grid;grid-template-columns:repeat(3,1fr);gap:5px}
.paso{border:0;padding:0;background:transparent;cursor:pointer;text-align:left;font-family:var(--fd)}
.paso-barra{height:10px;border-radius:99px;background:var(--c);opacity:.42;transition:opacity .18s,height .18s}
.paso[aria-pressed="true"] .paso-barra{opacity:1;height:15px}
.paso-txt{font-size:19px;margin-top:8px;color:var(--gris)}
.paso[aria-pressed="true"] .paso-txt{color:var(--tinta)}
.paso-estado{display:block;font-family:var(--fn);font-size:11.5px;font-weight:600;color:var(--gris);
  margin-top:1px;line-height:1.25;min-height:2.5em;white-space:normal;overflow-wrap:break-word}
.paso[aria-pressed="true"] .paso-estado{color:var(--tinta)}

main{padding-bottom:70px}
.enc{padding:30px 0 22px;border-bottom:3px solid var(--cat)}
.eyebrow{font-family:var(--fn);font-size:11.5px;font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:var(--cat-ink)}
.enc h2{font-size:clamp(30px,5vw,46px);margin:5px 0 8px}
.enc p{margin:0;max-width:66ch;color:var(--gris)}

.bloque{margin-top:34px}
.bloque > h3{font-size:24px;padding-bottom:7px;border-bottom:1.5px solid var(--gris-claro);margin-bottom:16px}
.bloque > h3 .n{color:var(--cat-ink);margin-right:9px}

.tarjetas{display:grid;grid-template-columns:repeat(auto-fit,minmax(255px,1fr));gap:14px}
.tarjeta{background:var(--tarjeta);border:1px solid var(--gris-claro);border-top:4px solid var(--cat);border-radius:3px;padding:16px 17px}
.tarjeta h4{font-size:18px;margin-bottom:6px}
.tarjeta p{margin:0;font-size:15px;color:var(--gris)}
.tarjeta .prio{font-family:var(--fn);font-size:11px;font-weight:700;letter-spacing:.15em;text-transform:uppercase;color:var(--cat-ink);display:block;margin-bottom:3px}

table{width:100%;border-collapse:collapse;font-family:var(--fn);font-size:15px;font-variant-numeric:tabular-nums}
th,td{text-align:left;padding:9px 11px;border-bottom:1px solid var(--gris-claro);vertical-align:top}
thead th{font-size:11.5px;font-weight:700;letter-spacing:.13em;text-transform:uppercase;color:var(--gris);border-bottom:2px solid var(--cat)}
tbody tr:hover{background:#FAFAFB}
td.num{font-weight:600;white-space:nowrap}
.tabla-envoltura{overflow-x:auto;background:var(--tarjeta);border:1px solid var(--gris-claro);border-radius:3px}

.fte{display:inline-block;font-family:var(--fn);font-size:10.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;
  padding:2px 7px;border-radius:2px;white-space:nowrap;border:1px solid}
.fte.of{background:#E8EEF9;color:#0E2A8A;border-color:#B9C9E8}
.fte.lit{background:#EAF3EC;color:#1F6B34;border-color:#C2DFC9}
.fte.club{background:var(--dato);color:#7A5C00;border-color:var(--dato-borde)}
.leyenda{display:flex;gap:15px;flex-wrap:wrap;margin:0 0 14px;font-family:var(--fn);font-size:13px;color:var(--gris)}
.leyenda span{display:flex;gap:6px;align-items:center}

.sesion{background:var(--tarjeta);border:1px solid var(--gris-claro);border-radius:3px;overflow:hidden}
.franja{display:grid;grid-template-columns:82px 1fr;border-bottom:1px solid var(--gris-claro)}
.franja:last-child{border-bottom:0}
.franja-t{font-family:var(--fn);font-weight:700;font-size:14px;padding:12px 10px;background:#F6F6F7;color:var(--cat-ink);
  border-right:3px solid var(--cat);font-variant-numeric:tabular-nums}
.franja-c{padding:12px 15px}
.franja-c strong{font-family:var(--fd);text-transform:uppercase;font-size:17px;font-weight:700;display:block}
.franja-c span{font-size:14.5px;color:var(--gris)}

.nota{border-left:4px solid var(--cat);background:#fff;padding:13px 16px;margin-top:14px;font-size:15px}
.nota strong{font-family:var(--fd);text-transform:uppercase;font-size:16px}
.nota.aviso{border-left-color:var(--dato-borde);background:#FFFCF3}
.nota.of{border-left-color:#0E2A8A;background:#F5F8FD}
.dato{background:var(--dato);border-bottom:2px solid var(--dato-borde);padding:0 4px;font-weight:600;font-family:var(--fn);border-radius:2px}

.pill{display:inline-block;font-family:var(--fn);font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;
  padding:3px 9px;border-radius:99px;background:var(--gris-claro);color:var(--gris)}
.pill.ok{background:#E1F0E4;color:#1F6B34}
.pill.alerta{background:#FDE7D6;color:#A6480F}
.pill.critico{background:#FBDDE0;color:#9E1F2C}

.acciones{display:flex;gap:10px;flex-wrap:wrap;margin-top:26px}
.btn{font-family:var(--fn);font-weight:700;font-size:13px;letter-spacing:.09em;text-transform:uppercase;padding:11px 18px;
  border-radius:3px;border:1.5px solid var(--tinta);background:var(--tinta);color:#fff;cursor:pointer}

.config{background:#fff;border:1.5px solid var(--cat);border-radius:3px;padding:16px 18px;margin-bottom:16px}
.config h4{font-size:18px;margin-bottom:4px}
.config .sub{font-size:14px;color:var(--gris);margin:0 0 13px}
.config-grid{display:flex;gap:22px;flex-wrap:wrap;align-items:flex-end}
.campo{display:flex;flex-direction:column;gap:5px}
.campo label{font-family:var(--fn);font-size:11px;font-weight:700;letter-spacing:.13em;text-transform:uppercase;color:var(--gris)}
.campo input{font-family:var(--fn);font-size:19px;font-weight:700;width:92px;padding:7px 10px;border:1.5px solid var(--gris-claro);border-radius:3px;background:#fff;color:var(--tinta)}
.campo input:focus{border-color:var(--cat)}
.resultado{font-family:var(--fd);font-size:29px;color:var(--cat-ink);line-height:1.05}
.resultado small{display:block;font-family:var(--fn);font-size:11.5px;font-weight:700;letter-spacing:.13em;text-transform:uppercase;color:var(--gris)}

.mx td:first-child,.mx th:first-child{position:sticky;left:0;background:#fff;min-width:210px}
.mx tbody tr:hover td:first-child{background:#FAFAFB}
.niv{display:inline-block;width:100%;text-align:center;font-family:var(--fn);font-weight:700;font-size:12px;letter-spacing:.08em;padding:4px 0;border-radius:2px}
.niv.I{background:#FDF3D4;color:#7A5C00}
.niv.D{background:#FCE0CE;color:#A6480F}
.niv.C{background:#F7D2D8;color:#9E1F2C}
.niv.M{background:#DCE3F5;color:#0E2A8A}
.niv.x{background:#F2F2F4;color:#9A9AA2}
.mx-leyenda{display:flex;gap:9px;flex-wrap:wrap;margin-bottom:13px;font-family:var(--fn);font-size:13px;align-items:center}

.escalon{background:#fff;border:1px solid var(--gris-claro);border-left:6px solid var(--c);border-radius:3px;padding:17px 19px;margin-bottom:13px}
.escalon h4{font-size:20px;margin-bottom:2px}
.escalon .cuando{font-family:var(--fn);font-size:12px;font-weight:700;letter-spacing:.13em;text-transform:uppercase;color:var(--gris);display:block;margin-bottom:10px}
.escalon ul,.fase ul{margin:0;padding-left:19px;font-size:15px}
.escalon li,.fase li{margin-bottom:4px}

.pais{background:#fff;border:1px solid var(--gris-claro);border-left:5px solid var(--cat);border-radius:3px;padding:18px 20px;margin-bottom:14px}
.pais h4{font-size:21px;margin-bottom:3px}
.pais .org{font-family:var(--fn);font-size:12px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--cat-ink);display:block;margin-bottom:9px}
.pais p{margin:0 0 9px;font-size:15px}
.pais .aplica{font-size:14.5px;color:var(--gris);border-top:1px solid var(--gris-claro);padding-top:9px;margin-top:11px}
.pais .aplica b{font-family:var(--fd);text-transform:uppercase;font-size:15px;color:var(--tinta)}

.hero{background:#fff;border:1px solid var(--gris-claro);border-radius:3px;padding:26px 28px;margin-top:26px}
.hero .lede{font-size:20px;line-height:1.48;margin:0}
.cifras{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:16px;margin-top:22px}
.cifra{border-top:4px solid var(--c);padding-top:11px}
.cifra b{display:block;font-family:var(--fd);font-size:38px;line-height:1;color:var(--tinta)}
.cifra span{font-family:var(--fn);font-size:13.5px;color:var(--gris);display:block;margin-top:4px}

.fase{background:#fff;border:1px solid var(--gris-claro);border-radius:3px;padding:18px 20px;margin-bottom:13px;border-top:5px solid var(--c)}
.fase h4{font-size:20px;margin-bottom:2px}
.fase .costo{font-family:var(--fn);font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--cat-ink);display:block;margin-bottom:10px}

.pl-barra{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;background:#fff;border:1.5px solid var(--cat);border-radius:3px;padding:14px 16px;margin-bottom:16px}
.pl-campo{display:flex;flex-direction:column;gap:4px}
.pl-campo label{font-family:var(--fn);font-size:10.5px;font-weight:700;letter-spacing:.13em;text-transform:uppercase;color:var(--gris)}
.pl-campo input,.pl-campo select{font-family:var(--fn);font-size:15px;padding:6px 9px;border:1.5px solid var(--gris-claro);border-radius:3px;background:#fff;color:var(--tinta)}
.pl-campo input:focus,.pl-campo select:focus{border-color:var(--cat);outline:none}
.pl-campo input[type=number]{width:82px}
.pl-campo input.txt{width:170px}
.btn-s{font-family:var(--fn);font-weight:700;font-size:12px;letter-spacing:.08em;text-transform:uppercase;padding:8px 13px;border-radius:3px;border:1.5px solid var(--tinta);background:var(--tinta);color:#fff;cursor:pointer}
.btn-s.sec{background:#fff;color:var(--tinta)}
.btn-x{border:0;background:transparent;color:var(--gris);cursor:pointer;font-size:17px;line-height:1;padding:2px 6px}
.btn-x:hover{color:#9E1F2C}
.pl-grupo{margin-top:22px}
.pl-grupo h4{font-size:19px;padding-bottom:6px;border-bottom:2px solid var(--cat);margin-bottom:0}
.pl-grupo h4 span{font-family:var(--fn);font-size:13px;font-weight:600;color:var(--gris);text-transform:none;letter-spacing:0;margin-left:9px}
.pl-vacio{background:#fff;border:1px dashed var(--gris-claro);border-radius:3px;padding:34px 22px;text-align:center;color:var(--gris)}
.pl-res{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:12px;margin-bottom:16px}
.pl-res div{background:#fff;border:1px solid var(--gris-claro);border-top:3px solid var(--c);border-radius:3px;padding:10px 13px}
.pl-res b{display:block;font-family:var(--fd);font-size:27px;line-height:1;color:var(--tinta)}
.pl-res span{font-family:var(--fn);font-size:12px;color:var(--gris)}
.pl-edit{width:100%;font-family:var(--fn);font-size:14px;padding:4px 6px;border:1px solid transparent;border-radius:2px;background:transparent;color:var(--tinta)}
.pl-edit:hover{border-color:var(--gris-claro)}
.pl-edit:focus{border-color:var(--cat);background:#fff;outline:none}
.cadena{font-family:var(--fn);font-size:12.5px;font-weight:600;color:var(--cat);margin:0 0 6px;letter-spacing:.02em}
.pl-nota td,.pl-cont td{border-top:0;padding-top:0}
.pl-nota span{display:block;font-family:var(--fn);font-size:13.5px;color:var(--gris);padding:0 0 8px 6px;border-left:2px solid var(--gris-claro);margin-left:4px}
.pl-cont span{display:block;font-family:var(--fn);font-size:13.5px;padding:0 0 9px 6px;border-left:2px solid #C93F60;margin-left:4px;color:var(--tinta)}
.pl-cont a{color:var(--tinta);text-decoration:none;border-bottom:1px solid var(--gris-claro)}
.pl-cont b{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--gris);margin-right:5px}
.sin-cont{color:#9E1F2C}
.obj-h{font-family:var(--fn);font-size:12px;font-weight:700;letter-spacing:.13em;text-transform:uppercase;color:var(--gris);margin:0 0 8px}
.ref-lvl{border-left:4px solid #1E6B33;background:#F4F9F5;padding:14px 18px;margin:20px 0 0}
.ref-lvl span{font-family:var(--fn);font-size:10.5px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:#1E6B33}
.ref-lvl b{display:block;font-size:16px;margin:4px 0 5px}
.ref-lvl p{margin:0;font-size:14.8px;line-height:1.55}
.pb-no{border-left:4px solid var(--cat);padding:12px 18px;margin-bottom:10px;background:#FAFAFA}
.pb-no b{display:block;font-size:17px;font-weight:600;margin-bottom:4px}
.pb-no p{margin:0;font-size:14.8px;line-height:1.55;color:var(--gris)}
.pb-t td{vertical-align:top;font-size:13.8px;line-height:1.45;padding:9px 10px 9px 0}
.pb-t td:first-child{width:152px}
.ot{border:2px solid var(--cat);padding:19px 23px;margin:26px 0 8px;background:#fff}
.ot span{font-family:var(--fn);font-size:10.5px;font-weight:700;letter-spacing:.15em;text-transform:uppercase;color:var(--cat)}
.ot p{margin:7px 0 15px;font-size:22px;font-weight:600;letter-spacing:-.013em;line-height:1.3}
.ot b{font-family:var(--fn);font-size:11.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--gris)}
.ot ul{margin:7px 0 0;padding-left:19px}
.ot li{margin-bottom:5px;font-size:15.3px;line-height:1.5}
.ini{max-width:900px;margin:0 auto}
.ini-top{padding:14px 0 30px}
.ini h2{font-size:clamp(30px,4.6vw,46px);letter-spacing:-.03em;line-height:1.05;margin:0 0 9px}
.ini-p{font-size:17.5px;color:var(--gris);margin:0;max-width:600px;line-height:1.5}
.ini-eti{font-family:var(--fn);font-size:13px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;display:flex;align-items:center;gap:11px}
.ini-eti span{font-size:11px;font-weight:700;color:var(--cat);letter-spacing:.1em}
.ini-dt{border-top:2px solid var(--tinta);padding:20px 0 30px}
.ini-sub{margin:9px 0 20px;font-size:15.3px;color:var(--gris);line-height:1.5;max-width:620px}
.eq-wrap{display:grid;grid-template-columns:repeat(auto-fit,minmax(215px,1fr));gap:12px}
.eq{border:1px solid var(--gris-claro);background:#fff;transition:border-color .18s,box-shadow .18s;align-self:start}
.eq:hover{border-color:var(--c);box-shadow:0 2px 14px rgba(0,0,0,.06)}
.eq[open]{border-color:var(--c)}
.eq summary{list-style:none;cursor:pointer;padding:0}
.eq summary::-webkit-details-marker{display:none}
.eq-h{padding:17px 18px 15px;border-left:5px solid var(--c);position:relative}
.eq-e{font-family:var(--fn);font-size:11px;font-weight:700;letter-spacing:.13em;color:var(--gris);display:block}
.eq-h b{display:block;font-family:var(--fd);font-size:33px;line-height:1;letter-spacing:-.025em;color:var(--c);margin:4px 0 6px}
.eq-n{font-family:var(--fn);font-size:12px;color:var(--gris)}
.eq-h::after{content:"+";position:absolute;right:15px;top:16px;font-family:var(--fn);font-size:20px;color:var(--c)}
.eq[open] .eq-h::after{content:"\2013"}
.eq-c{border-top:1px solid var(--gris-claro)}
.et-row{display:flex;align-items:baseline;gap:9px;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid #F0F0F0;padding:12px 16px;cursor:pointer;font:inherit;transition:background .14s}
.et-row:last-child{border-bottom:0}
.et-row:hover{background:var(--c);color:#fff}
.et-row b{font-size:15.3px;font-weight:600;white-space:nowrap}
.et-row span{font-size:13px;color:var(--gris);flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.et-row:hover span,.et-row:hover i{color:#fff}
.et-row i{font-style:normal;color:var(--c)}
.ini-dos{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:6px}
.ini-card{position:relative;display:block;width:100%;text-align:left;border:1px solid var(--gris-claro);border-top:2px solid var(--tinta);background:#fff;padding:20px 22px 44px;cursor:pointer;font:inherit;transition:border-color .18s,box-shadow .18s}
.ini-card:hover{border-color:var(--cat);box-shadow:0 2px 14px rgba(0,0,0,.06)}
.ini-card p{margin:9px 0 0;font-size:14.8px;color:var(--gris);line-height:1.5}
.ini-card .fl{position:absolute;left:22px;bottom:16px;font-style:normal;font-size:19px;color:var(--cat)}
.ini-todo{margin-top:26px;text-align:center}
.ini-todo a{font-family:var(--fn);font-size:13px;color:var(--gris);cursor:pointer;text-decoration:underline}

resumen:{
 eyebrow:"Resumen para la dirigencia",
 titulo:"Un solo modelo, alineado a Swiss Volley",
 intro:"Näfels tiene equipos de formativas. Lo que no tiene es un programa: un criterio común que atraviese desde Kids Volley hasta el primer equipo, en las dos ramas, y que sobreviva al cambio de entrenadores. Esto es ese criterio, escrito y encajado en la estructura oficial de la federación.",
 lede:"El club ya tiene lo más difícil de conseguir: un equipo de NLA en la misma casa. Lo que falta es el camino que conecta a un chico de nueve años con esa cancha — y que sea el mismo camino para todos, lo dirija quien lo dirija.",
 cifras:[{n:"9",d:"etapas bajo un mismo criterio técnico"},{n:"5",d:"compromisos medibles del club"},
         {n:"3",d:"fases de implementación, la primera sin costo adicional"},{n:"0",d:"francos necesarios para empezar"}],
 b1:"El problema que resuelve",
 p1:[["Cada categoría es un club distinto.","El jugador que sube cambia de vocabulario, de sistema y de exigencia. Se pierde medio año en traducir lo que ya sabía. Con rotación de entrenadores, el problema se multiplica."],
     ["Nadie controla la carga total del jugador.","El chico que rinde entrena en tres grupos y juega dos torneos el mismo mes. Ningún entrenador hace nada mal; el número total no está en la planilla de nadie. Es el camino directo a la lesión por sobreuso."],
     ["No hay criterio para decidir sobre un jugador.","Quién sube de etapa, quién va a la sichtung, quién necesita más. Hoy se decide por impresión, y una impresión no se le puede explicar a una familia."],
     ["El club no puede mostrar lo que hace.","Ante Swiss Volley, ante un patrocinador, ante una familia que elige dónde anotar a su hija: no hay documento. El trabajo existe pero es invisible."]],
 b2:"Qué es este modelo",
 p2:"Tres piezas. Una <strong>columna vertebral</strong> que define qué se enseña en cada etapa y en qué orden, para que nada se repita ni quede afuera. Un <strong>sistema de carga individual</strong> que le pone un número y un responsable a cada jugador. Y una <strong>ruta</strong> que conecta cada etapa con la estructura de talento suiza, en las dos ramas.",
 p2b:"Está construido sobre las categorías oficiales de Swiss Volley, y toma de Estados Unidos su estándar de habilitación y protección del menor, y de Italia su modelo de formación por competencia. No es una opinión: cada afirmación indica de dónde sale, y las decisiones propias del club están marcadas como tales.",
 b3:"Los cinco compromisos",
 p3:[["Ningún jugador entrena sin un techo semanal definido.","Un total, un responsable, revisión mensual. Se acabó el jugador que acumula estímulos porque nadie sumó."],
     ["Veinte minutos de prevención en cada sesión.","No es entrada en calor. Es el único tramo de la vida deportiva en que el trabajo preventivo demuestra efecto, y además mejora el salto."],
     ["Dos mediciones al año, mismo protocolo.","Octubre y marzo. Con dos temporadas, el club tiene sus propios percentiles y deja de adivinar."],
     ["Todo jugador con perfil va a la sichtung regional.","Sin excepción y sin que dependa de que un entrenador se acuerde."],
     ["El mismo lenguaje técnico desde Kids hasta el primer equipo.","Una palabra por concepto. Es lo que hace que subir de etapa no cueste medio año."]],
 b4:"Qué se mide para saber si funciona",
 p4:[["Retención","Porcentaje de jugadores que siguen en el club la temporada siguiente. Es el indicador más honesto de un programa formativo, y es también el objetivo declarado de Smart Competitions."],
     ["Lesiones por sobreuso","Cantidad y días perdidos. Debe bajar. Le importa al seguro y a las familias."],
     ["Jugadores en el Talentpool","Cuántos llegan a la estructura federativa. Es lo que Swiss Volley mira."],
     ["Promociones internas","Jugadores formados en el club que llegan al primer equipo. El objetivo final."],
     ["Densidad de entrenamiento","Contactos de calidad por jugador por sesión. Es auditable entrando al gimnasio."]],
 cierre:"<strong>Por qué ahora.</strong> Todo lo anterior se puede empezar esta temporada sin un franco adicional: son decisiones de método, no de presupuesto. Lo único que no espera es la medición de octubre — si se pasa esa ventana, se pierde un año entero de línea de base."
},

juego:{
 eyebrow:"Cómo queremos jugar",
 titulo:"Identidad de juego",
 intro:"Un currículum sin identidad de juego es una lista de contenidos. Estos seis principios son la respuesta a una pregunta simple: si alguien mira jugar a un equipo de Näfels sin saber de qué club es, ¿en qué lo reconoce? No son valores institucionales: son decisiones técnicas que se ven en la cancha y que se entrenan.",
 marca:"<strong>Un equipo de Näfels se reconoce en que la pelota no se cae, se juega siempre en tres contactos, y todos los jugadores hacen todo.</strong> No somos el equipo que más fuerte pega. Somos el equipo que sigue jugando cuando el punto se complica.",
 aviso:"Estos principios son decisión del club y se revisan cada temporada. Están construidos sobre lo que el sistema suizo ya impone —penetración temprana, un tramo entero sin líbero ni especialización, proceso antes que resultado— y los convierten en identidad en vez de dejarlos como obligación.",
 pr:[
  ["01","El primer contacto manda",
   "Con pocas horas de cancha, la habilidad que más determina si el punto existe es la recepción y la defensa. Un equipo que no recibe no ataca nunca, y encima no puede entrenar el ataque porque no llega a hacerlo.",
   "En la cancha: el equipo llega a tres contactos de forma habitual, incluso en pelotas difíciles.",
   "Se entrena: volumen alto de recepción con saque de partido, siempre. Bajar la exigencia del saque en el entrenamiento se paga el sábado."],
  ["02","Todos arman",
   "El sistema suizo lo impone en Future 1 —sistema 6-6, sin líbero, todos rotan por todas las posiciones— y nosotros lo adoptamos como identidad y no como trámite. En un club chico es además una necesidad: formar un solo armador por camada es una fragilidad estructural.",
   "En la cancha: cualquiera arma desde la zaga cuando la primera pelota no le llega al armador.",
   "Se entrena: toque de dedos en desplazamiento y fuera de la posición ideal, para todos, en todas las etapas."],
  ["03","Se cubre siempre",
   "El equipo que cubre gana los puntos largos, y los puntos largos son los que deciden los partidos juveniles. Es el hábito colectivo más barato de entrenar y el que menos se entrena.",
   "En la cancha: cuando uno ataca, hay tres compañeros acompañando. Sin que nadie lo grite.",
   "Se entrena: como regla de los juegos reducidos, no como ejercicio aislado. Se instala desde Kids Volley 3."],
  ["04","Se ataca con dirección, no con fuerza",
   "A estas edades la dirección gana más puntos que la potencia, y además protege el hombro y la rodilla. Un jugador que solo pega fuerte se queda sin recursos apenas enfrenta un bloqueo organizado.",
   "En la cancha: al menos dos direcciones resueltas desde la misma aproximación.",
   "Se entrena: la decisión antes del salto. Se corrige adónde miró, no cuánto pegó."],
  ["05","El error agresivo se banca; el error pasivo no",
   "Es la traducción práctica del principio de proceso antes que resultado que Swiss Volley puso en el centro de Smart Competitions. Un saque fácil en el partido es un punto regalado; un saque agresivo que se va es el precio de jugar bien.",
   "En la cancha: el saque es de partido siempre, con un porcentaje de error acordado de antemano.",
   "Se entrena: se felicita la decisión correcta aunque el resultado sea malo, y se corrige la decisión pasiva aunque el punto haya salido."],
  ["06","Se cae bien",
   "El aterrizaje es un principio técnico, no una obligación médica. Puesto acá, la prevención deja de ser un impuesto sobre el tiempo de cancha y pasa a ser parte de cómo jugamos — que es, además, lo que hace que se cumpla.",
   "En la cancha: rodilla alineada al caer del remate y del bloqueo, también con fatiga y en el tercer set.",
   "Se entrena: en el bloque de apertura de cada sesión, y se evalúa filmando un rally al final del entrenamiento."]],
 b2:"El lenguaje común",
 b2p:"Una palabra por concepto, la misma desde Kids Volley hasta el primer equipo. Es lo que hace que un jugador que cambia de etapa entienda al entrenador nuevo desde el primer minuto en vez de perder medio año traduciendo. Y es la base de las versiones en alemán e inglés: si el vocabulario no se fija antes de traducir, las tres versiones se desincronizan a la primera corrección.",
 b2r:"<strong>Regla de traducción.</strong> Los términos marcados como fijos no se traducen: se usan tal cual en las tres versiones. Traducir Talentsichtung o Entwicklungstest rompe la trazabilidad con los documentos de la federación y se nota como amateur. En la versión española se explican la primera vez y después se usan en alemán.",
 b2th:["Español","Alemán","Inglés","Uso"],
 b2fijo:"Fijo",
 b2libre:"Se traduce"
},

marco:{
 p:"El marco <strong>FTEM</strong> de Swiss Volley ordena la carrera en fases: quien no fue identificado como talento está en <em>Foundation</em>, y las fases T1 a T4 van de la detección regional a los centros de rendimiento de nivel NLA. La evaluación anual sigue el modelo <strong>PISTE</strong>, con un Entwicklungstest nacional. La <strong>Talentsichtung</strong> regional abre el <strong>Talentpool</strong>, que da acceso a las estructuras de formación y al programa atlético de la federación; la <strong>Swiss Olympic Talent Card</strong> acredita al jugador ante la escuela y las autoridades. En la región GSGL los tests se realizan en Jona y en Chur.",
 m:"En la rama masculina el camino regional continúa en Jona, y el techo visible está en la misma casa: el primer equipo de NLA. Es una ventaja que casi ningún club formativo tiene y hay que usarla — un chico de Kids Volley tiene que verlos jugar.",
   f:"En la rama femenina la ruta pasa por las estructuras regionales y nacionales de la federación, y dentro del club culmina en el primer equipo de <strong>1ª liga</strong>. Una jugadora de Future 3 tiene un destino concreto y alcanzable en su propia casa, y tiene que saberlo desde Kids Volley."
},

vol:{
 b:"Volumen: el modelo se adapta al gimnasio que haya",
 intro:"Las horas de gimnasio cambian cada temporada. Por eso el modelo no fija un volumen: fija un rango objetivo por etapa y calcula, con lo que el club tenga ese año, cuánto falta. Movés los valores y todo se recalcula.<br><br><strong>El cuarto campo es el que hace que la cuenta sea real.</strong> En la rama masculina, muchos jugadores de formativas juegan además en un equipo de liga del club. Esas horas y esos partidos van en el mismo total: el cuerpo del jugador no distingue de qué estructura viene la carga.",
 cfgTitulo:"Lo que ofrece el grupo",
 cfgSub:"Ajustá estos números a la realidad de la temporada. El resto del documento se acomoda solo.",
 lSes:"Sesiones/semana",lMin:"Minutos/sesión",lSem:"Semanas/temporada",lLiga:"+ h/sem en liga",
 rSem:"total por semana",rAnual:"horas al año",
 th1:"Etapa",th2:"Rango objetivo",th3:"Total del jugador",th4:"Situación",th5:"Qué falta",falta:"Sumar",cubierto:"Cubierto",
 sBajo:"Por debajo",sAlto:"Por encima",sRango:"En rango",
 nota:"<strong>El multi-grupo no es un problema: es el mecanismo.</strong> Con grupos cortos, las etapas medias y altas necesitan un segundo grupo, o un equipo de liga, para llegar al rango. <strong>Y una regla de precedencia, porque el documento tiene dos tablas de horas.</strong> Este rango dice lo que la <em>etapa</em> necesita para desarrollarse. El límite superior real de cada jugador lo fija su <em>edad</em>, en la solapa Plantel. Cuando los dos no coinciden —y en varias combinaciones no coinciden— manda el de la edad: la etapa marca hacia dónde ir, el cuerpo marca hasta dónde. Lo que hay que corregir no es que los chicos entrenen en varias estructuras — es que hoy lo hacen por disponibilidad de horario y no por indicación técnica, y que nadie suma el total.",
 limites:"Límites que no dependen del gimnasio: horas semanales de deporte organizado no mayores a la edad en años, dos días completos de descanso por semana, un solo deporte organizado por temporada, y menos de ocho meses al año en el mismo deporte."
},

matriz:{
 eyebrow:"La pieza que convierte nueve etapas en un programa",
 titulo:"Columna vertebral",
 intro:"Nada de lo que sigue depende de cuántos jugadores haya ni de qué horarios se consigan. Se define una vez y ordena las nueve etapas. De acá salen las prioridades de cada ficha: por eso ningún contenido se repite dos veces ni queda ninguno afuera.",
 aviso:"<strong>Dos tipos de fila, y conviene no confundirlas.</strong> Las marcadas como Swiss Volley vienen impuestas por el sistema de juego de cada etapa: no se discuten, se cumplen. Las marcadas como Club son decisión nuestra y se revisan cada temporada. Ante la dirigencia son dos conversaciones distintas.",
 b1:"Matriz técnica",
 b1p:"Cada fundamento aparece en una sola etapa como contenido nuevo, y después se sostiene. Un entrenador que quiere saber si le toca enseñar el bloqueo lector mira una celda.",
 b2:"Matriz táctica",
 b2n2:"<strong>Corrección verificada contra la fuente oficial.</strong> Swiss Volley establece que el 3:3 y el 4:4 son los sistemas de base de la formación y que por eso <em>deben seguir usándose como formas de entrenamiento también en las fases Future y Active</em>. Una versión anterior de esta matriz los daba por terminados en Rookie. No terminan: se dominan y se siguen usando. Un entrenador de Future 3 que arma un 4:4 con penetración no está retrocediendo, está aplicando el reglamento.",
 b2n:"<strong>Competir con un sistema y aprenderlo son dos cosas distintas.</strong> Swiss Volley define con qué sistema se <em>compite</em> en cada etapa, y eso no se discute. Pero cuándo se <em>enseña</em> lo decide el club, y ahí tomamos una decisión deliberada: el 5-1 se explica desde que aparece la cancha grande, en Rookie 3, aunque falten tres etapas para jugarlo. El motivo es simple: no se puede consolidar en Future 3 algo que el jugador nunca vio. Lo mismo vale para el 6-2, que se introduce en Future 1. Cuando llegan a la etapa en que ese sistema es el oficial, ya lo entienden por dentro y la temporada se usa para jugarlo mejor, no para descubrirlo.<br><br>Cuando una fila salta dos niveles de una columna a la siguiente es siempre por el mismo motivo: en esa etapa ese sistema es el oficial, y una temporada entera compitiendo hace sola el trabajo de introducir y desarrollar.",
 b2p:"Acá se ve con claridad la progresión de sistemas que define Swiss Volley: 3:3, luego 4:4 con penetración desde la posición 1, luego cancha grande con 6-6, después 6-2 y finalmente 5-1.",
 b3:"Escalera atlética: por maduración, no por edad",
 b3p:"Dos jugadores de la misma etapa pueden estar a tres años de distancia biológica, y las chicas maduran antes que los varones. Por eso el trabajo físico no se asigna por etapa: se asigna por peldaño. La etapa se apoya encima, pero el criterio es el cuerpo. Es la misma lógica que Swiss Volley aplicó al desacoplar el nivel de juego de la edad cronológica.",
 b3d:"Cómo se ubica a un jugador: se mide la talla cada tres meses. Un salto brusco indica que está atravesando el pico de crecimiento. No hace falta ningún equipamiento, solo constancia.",
 esc:[
  {t:"Peldaño 1 — Antes del pico de crecimiento",w:"Predomina en Kids y Rookie 1",c:"#FAE149",l:[
   "Coordinación, agilidad y equilibrio. Es la ventana de oro para aprender a moverse.",
   "Fuerza solo con peso corporal y en formato de juego.",
   "Saltos bajos con foco en la caída, no en la altura.",
   "Sin cargas externas ni trabajo de máxima intensidad repetido.",
   "Multideporte recomendado activamente."]},
  {t:"Peldaño 2 — Durante el pico de crecimiento",w:"Frecuente en Rookie 2 y 3 · antes en la rama femenina",c:"#F26A4F",l:[
   "Es el peldaño de mayor riesgo: durante el pico, el tendón rotuliano trabaja cerca de su umbral de tolerancia.",
   "Se <em>baja</em> el volumen de salto, no se sube. Contraintuitivo y decisivo.",
   "Fuerza excéntrica y control de aterrizaje: la prioridad absoluta.",
   "Técnica de levantamiento con palo o barra vacía. Se aprende el gesto, no se carga.",
   "Movilidad: el hueso crece antes que el músculo y todo queda corto.",
   "Tolerancia alta a la torpeza. Es temporal y previsible."]},
  {t:"Peldaño 3 — Después del pico de crecimiento",w:"Habitual desde Future 1 · antes en la rama femenina",c:"#0E2A8A",l:[
   "La ventana de fuerza está abierta: ahora sí, carga progresiva.",
   "Pliometría estructurada y trabajo de potencia.",
   "Programación individual con control de carga.",
   "En jugadoras, el trabajo neuromuscular sigue siendo obligatorio: es el tramo donde protege de verdad."]}],
 nivI:"Se introduce",nivD:"Se desarrolla",nivC:"Se consolida",nivM:"Se domina",nivX:"No se trabaja",
 cols:{kids:"Kids",r12:"Rookie 1-2",r3:"Rookie 3",f1:"Future 1",f2:"Future 2",f3:"Future 3"},

  tec:[["Armado especializado desde la zaga","Ahora sí, dos jugadores con volumen concentrado de armado."],
       ["Ataque con cambio de dirección","Diagonal, paralela y finta desde la misma aproximación."],
       ["Bloqueo lector","Del bloqueo que reacciona al bloqueo que anticipa. Es el salto cualitativo de la etapa."]],
  tac:[["6-2 completo","Tres atacantes en las seis rotaciones. Coberturas y transiciones del sistema entero."],
