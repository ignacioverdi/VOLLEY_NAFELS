rama:{
 m:{intro:"En esta rama, la mayoría de los jugadores atraviesa el pico de crecimiento durante Rookie 2 y 3. En ese tramo la coordinación se desorganiza de manera temporal y previsible, y el tendón rotuliano trabaja cerca de su umbral de tolerancia. La respuesta correcta no es exigir más: es sostener la técnica y proteger la rodilla mientras el cuerpo se reordena.",
    fis:"Foco en control de aterrizaje y fuerza excéntrica durante el pico, y ventana de fuerza a partir de Future 1. La tolerancia a la torpeza es parte del método, no una concesión.",
    nota:"<strong>Seis equipos de mayores.</strong> En la rama masculina el club presenta NLA, 1ª, 2ª, 2ª B, 3ª y 4ª liga, más equipos U20, U18, U16 y U14. Es una escalera densa: hay un escalón para cada nivel real, y un jugador puede subir de a poco en vez de dar saltos. Es la mayor ventaja del club y también su mayor riesgo de sobrecarga — ver la solapa de Competencia y la ficha de carga individual.",
    red:"La altura de red masculina sube en cada etapa de Future: 2,24 m, 2,30 m y 2,35 m. Los estándares de alcance tienen que seguir esa progresión."},
 f:{intro:"En esta rama, la mayoría de las jugadoras ya pasó el pico de crecimiento al llegar a Rookie 3, y la ventana de fuerza se abre antes. También es el tramo de mayor riesgo de lesión de ligamento cruzado de toda la formación, con un dato decisivo: el efecto protector del trabajo neuromuscular es más fuerte entre los 14 y los 18 años y desaparece por encima de los 18. Lo que no se haga acá no se recupera después.",
    fis:"Programa neuromuscular obligatorio y sostenido en todas las etapas: aterrizaje del remate con rodilla alineada, frenos y cambios de dirección, isquiotibiales y cadera. Además de proteger la rodilla, mejora el salto — no es un impuesto sobre el tiempo de cancha.",
    nota:"<strong>El techo femenino es la 1ª liga, y el camino ya funciona.</strong> La rama femenina tiene equipos U14 y dos U16, y después tres equipos de mayores: 4ª, 3ª y 1ª liga. Como no hay equipos U18 ni U20, la 4ª y la 3ª liga cumplen esa función: son el puente real entre las formativas y el primer equipo. La prueba está en el plantel de 1ª liga, donde ya juegan jugadoras nacidas en 2008 y 2009.",
    red:"La altura de red femenina se mantiene en 2,18 m en las tres etapas de Future. Eso significa que la progresión no viene de la red sino del nivel de juego: los estándares tienen que medir otra cosa."},
 mixto:"Hasta Rookie 2 inclusive se juega sin separación por sexo. Las dos ramas de este documento comparten contenido técnico y táctico en esas etapas; lo que sí difiere desde el principio es el trabajo físico, porque la maduración no espera al reglamento."
},

comp:{
 eyebrow:"Dónde compite cada jugador",
 titulo:"Competencia",
 intro:"Swiss Volley reorganizó la competencia de formativas con el proyecto Smart Competitions, y el cambio es profundo: el nivel de juego se desacopla en gran medida de la edad cronológica. Entender esto es lo que evita que el club quede fuera de sistema.",
 verif:"<strong>Dónde estamos parados hoy, verificado.</strong> La región <strong>GSGL todavía no migró a Smart Competitions</strong>: organiza sus torneos por categorías de edad en las dos ramas, con Kids Volley dividido en tres niveles y jornadas juveniles en formato 6-6, bajo el concepto de formativas que la región elaboró en 2019. Los clubes pueden inscribirse al campeonato completo o solo a torneos sueltos. Por eso los equipos del club se llaman U14, U16, U18 y U20: es la nomenclatura vigente en la región. Al mismo tiempo, Swiss Volley ya resolvió la <strong>introducción definitiva de Smart Competitions para todas las regiones a partir de 2028/29</strong>, y el proyecto está en fase piloto en las regiones que se adelantaron. Este documento describe las dos cosas a propósito: se opera hoy con las categorías de GSGL y se prepara el contenido técnico según Kids, Rookie y Future, que es adonde va todo el sistema.<br><br><strong>Tres detalles finos todavía sin cerrar.</strong> La federación tiene propuestas declaradas de ajustar las alturas de red de Rookie 2 y 3 a 2,10 o 2,15 m para jugadores mayores, y de eliminar la obligación de construir en tres contactos tras la recepción. Las regiones que ya aplican el sistema publican variantes propias, y al menos una lista Rookie 1 y 2 como 4:4 mientras el concepto nacional describe Rookie 1 como 3:3. Y existe un nivel <strong>Future 3+</strong> que este documento todavía no desarrolla. <span class=\"dato\">[Confirmar cada temporada si GSGL abre el piloto]</span>",
 b1:"Lo que cambió",
 p1:[["Se clasifica por nivel, no por edad","Solo hay edades orientativas. La clasificación principal es por nivel de juego de la persona y del equipo, y el entrenador inscribe al equipo mediante una autoevaluación con una herramienta que provee la federación."],
     ["Ya no hay campeonato en el deporte de base","Se organizan torneos sueltos de medio día repartidos en el año. Un equipo se compromete a un torneo, no a una temporada entera, y puede cambiar de escalón entre torneo y torneo."],
     ["Los resultados no se publican","No tienen consecuencias para torneos siguientes. El foco está declaradamente en el proceso y no en el resultado."],
     ["Arbitran los propios equipos","En Kids no hay arbitraje. En Rookie y Future los equipos que juegan se turnan para arbitrar."],
     ["Todos juegan","Hay tiempos mínimos de participación y un máximo de jugadores por equipo. En Future, máximo once y todos con tiempo de juego similar."],
     ["Näfels es el destinatario exacto de este sistema","Smart Competitions apunta a chicos y jóvenes, desde la edad de Kids Volley hasta U18, que entrenan una o dos veces por semana. Es la descripción literal de nuestros grupos. No es un sistema pensado para otro tipo de club: está pensado para este."],
     ["Implementación definitiva en 2028/29","Swiss Volley resolvió la introducción definitiva de Smart Competitions para todas las regiones a partir de la temporada 2028/29. Hasta entonces cada región avanza a su ritmo. Construir el modelo sobre esta estructura no es apostar: es llegar antes."],
     ["La edad máxima no es la edad objetivo","Cada categoría tiene una edad núcleo y un tope de admisión muy por encima: Kids admite hasta U14, Rookie hasta U18 y Future hasta U23. Ese margen existe para el que empieza tarde. Un chico de dieciséis que recién arranca juega Rookie, no Future, y eso no es un retroceso: es el nivel que le corresponde."]],
 b2:"La vía paralela para el que entrena más",
 p2:"Para quien entrena tres o más veces por semana se mantiene una vía competitiva orientada al resultado, organizada por edades: los <strong>Youth Volley Days</strong>, en cuatro fines de semana al año, y el <strong>campeonato suizo de formativas</strong>. Ambos se estructuran en U14, U16 y U18. Las categorías U19/U20 y U23 siguen existiendo, igual que las ligas regionales y nacionales.",
 p2b:"El acceso al campeonato suizo pasa por torneos regionales de clasificación, y cada club puede inscribir un solo equipo por categoría.",
 b3:"Qué significa para Näfels",
 p3:[["Dos vías, no una","La mayoría del club compite en Kids, Rookie y Future por nivel. Los jugadores que entrenan tres o más veces por semana suman los Youth Volley Days y la clasificación al campeonato suizo. Hay que decidir explícitamente quién va a cada una."],
     ["La inscripción por nivel es una decisión técnica","Ubicar a un equipo en el escalón correcto es responsabilidad del entrenador y admite error. Un equipo mal ubicado juega partidos desparejos toda la temporada, que es exactamente lo que el sistema quiere evitar."],
     ["Flexibilidad que hay que aprovechar","Poder cambiar de escalón entre torneos es una herramienta: el equipo que crece durante la temporada sube, el que se quedó corto baja sin drama."],
     ["La puerta de entrada más grande que tuvimos","El tope de admisión alto convierte a Rookie en la vía natural para el que llega tarde al vóley, hasta los diecisiete años. El club puede salir a buscar a esos chicos sin tener que prometerles que van a competir contra jugadores con seis años de ventaja. Es un argumento de captación que antes no existía."]],
 b4:"La escalera competitiva del club",
 b4p:"Esta es la estructura real del club, verificada equipo por equipo. Näfels no tiene una escalera competitiva: tiene <strong>nueve equipos de mayores</strong>, seis masculinos y tres femeninos, más siete equipos de formativas. Un jugador o una jugadora puede integrar un equipo de mayores mientras sigue en su categoría formativa. No es una excepción administrativa: es el segundo eje del desarrollo y hay que planificarlo.",
 b4p2:"Es exactamente el modelo que Italia institucionalizó con Club Italia — desarrollar a los jóvenes compitiendo contra adultos en vez de solo entre pares — con la diferencia de que acá no hay que construirlo: ya existe. Lo que falta es planificarlo en lugar de dejar que ocurra por disponibilidad.",
 ligas:[
  {t:"4ª liga",s:"Primer contacto con el vóley de mayores · existe en las dos ramas",c:"#FA844E",
   d:"El escalón de entrada. El juvenil se encuentra con adultos, con partido semanal y con un ritmo que no es el de un torneo de medio día. En la rama femenina cumple además la función que en masculino cubren los equipos U18 y U20: es el destino natural de una jugadora que sale de U16."},
  {t:"3ª liga",s:"Competencia regular · existe en las dos ramas",c:"#EE4655",
   d:"Segundo escalón. El jugador deja de ser el que completa y empieza a tener responsabilidad en el resultado. Es donde se ve si el juvenil sostiene su nivel técnico contra oposición adulta."},
  {t:"2ª liga y 2ª liga B",s:"Solo rama masculina · dos equipos",c:"#C93F60",
   d:"Tener dos equipos en el mismo nivel es una ventaja de gestión enorme: permite ubicar a cada jugador donde le corresponde sin que nadie quede sin jugar. Es el tramo con más lugar disponible de toda la estructura masculina."},
  {t:"1ª liga",s:"Antesala del profesionalismo · techo de la rama femenina",c:"#8E3374",
   d:"Nivel competitivo alto y exigencia física de adulto. Para un jugador de Future 3 es el mejor entorno de preparación posible; para una jugadora es el destino, porque el primer equipo femenino del club juega acá. Toda la rama femenina apunta a esta cancha."},
  {t:"NLA",s:"El destino de la rama masculina",c:"#0E2A8A",
   d:"El techo de la pirámide, en el mismo gimnasio. Un chico de Kids Volley tiene que verlos jugar, y un jugador de Future 3 tiene que poder entrenar con ellos cuando esté listo."}],
 bE:"Los equipos del club",
 bEp:"Contando mayores y formativas, el club presenta dieciséis equipos federados más la Männerriege y el programa de Kids Volley. Ese es el mapa sobre el que trabaja la coordinación de formativas.",
 bEth:["Rama","Mayores","Formativas"],
 bEf:[["Masculino","NLA · 1ª liga · 2ª liga · 2ª liga B · 3ª liga · 4ª liga","U20 · U18 · U16 · U14"],
      ["Femenino","1ª liga · 3ª liga · 4ª liga","U16-1 · U16-2 · U14"]],
 bEn:"<strong>Tres lecturas que salen de esta tabla y que cambian el proyecto.</strong> Primero: con seis equipos masculinos de mayores, un varón tiene un escalón para cada nivel real, desde 4ª liga hasta NLA — es una escalera densa y poco común. Segundo: del lado femenino no hay equipos U18 ni U20, así que la <strong>4ª y la 3ª liga femeninas cumplen esa función</strong>; no es un hueco, es un puente que ya está funcionando y que conviene nombrar como tal. Tercero: en el plantel de 1ª liga femenina figuran jugadoras nacidas en 2008 y 2009, es decir juveniles integradas al primer equipo. El segundo eje no es una propuesta de este documento: ya existe y está en uso.",
 bEd:"<span class=\"dato\">[Kids Volley: cantidad de grupos y de chicos — completar]</span> El club tiene programa de Kids Volley y una escuela de vóley con apoyo del banco cantonal, pero no está reflejado en la lista de equipos federados.",
 b5:"Dónde compite cada etapa",
 b5p:"<strong>Todas las etapas compiten.</strong> Cada una tiene su propio circuito, y algunas además pueden sumar un equipo de adultos. Son dos columnas distintas y conviene no confundirlas: la primera es lo que le corresponde al jugador por su etapa, la segunda es un agregado que el club decide.",
 b5th:["Etapa formativa","Su propia competencia","Liga de adultos","Origen del criterio de liga"],
 b5f:[["Kids Volley 1-2-3","Jornadas regionales de Kids Volley y Mobiliar Kids Volley Days, abiertos a todos los niveles sin clasificación previa","Ninguna",1,"En edad U14 o menor no hay habilitación en equipos de mayores"],
      ["Rookie 1-2","Torneos de Smart Competitions · campeonato regional de formativas · campeonato suizo U14","Ninguna",2,"Reglamento por edad, más criterio formativo para el que ya cumplió U14"],
      ["Rookie 3","Torneos de Smart Competitions · campeonato regional · campeonato suizo U14 o U16 · Youth Volley Days","Ninguna, o excepcional",0,"No es reglamento. Con informe escrito y control de carga reforzado"],
      ["Future 1","Torneos de Smart Competitions · campeonato regional · campeonato suizo U16 o U18 · Youth Volley Days","3ª liga",0,"Primer contacto con mayores. Una competencia por fin de semana"],
      ["Future 2","Torneos de Smart Competitions · campeonato regional · campeonato suizo U18 o U20 · Youth Volley Days","3ª o 2ª liga",0,"Según nivel y maduración, no según edad"],
      ["Future 3","Torneos de Smart Competitions · campeonato regional · campeonato suizo U20, U23 o SAR","2ª o 1ª liga · entrenar con NLA",0,"Es el puente: acá se decide la transición"]],
 b5n:"<strong>Tres precisiones reglamentarias.</strong> El campeonato suizo de formativas se disputa separado por sexo en U14, U16, U18, U20, U23 y SAR, y cada región tiene derecho a un lugar por categoría y por sexo. Los campeonatos regionales los organiza cada asociación regional, y según la región se juegan como campeonato o en formato de torneo. Y sobre las ligas de adultos: un juvenil puede ser utilizado como máximo en dos a la vez —si actúa en más, queda habilitado solo para las dos más altas— y por liga solo puede estar calificado en un equipo. Los partidos en un equipo de la promoción regional de talentos no se computan para ese tope.",
 b5n2:"<span class=\"dato\">[Formato exacto del campeonato regional en GSGL para esta temporada — confirmar: cambia según la región y según el avance de Smart Competitions]</span>",
 bN:"Dos nomenclaturas conviviendo",
 bNp:"El club nombra a sus equipos por edad —U14, U16, U18, U20— porque es la nomenclatura con la que GSGL organiza hoy sus torneos, en todas las categorías y en las dos ramas. Swiss Volley, en cambio, está migrando a una organización por nivel: Kids, Rookie y Future. <strong>No hay contradicción: son dos momentos del mismo sistema.</strong> Mientras GSGL no abra el piloto, el club compite por edad; el contenido técnico de este documento ya está escrito por nivel, que es como va a funcionar a partir de 2028/29 como muy tarde. Cuando llegue la migración, no hay que reescribir el modelo: hay que reinscribir los equipos.",
 b6:"Las dos ramas, en paralelo",
 b6p:"Las dos ramas tienen segundo eje y las dos tienen un destino visible dentro del club: NLA en masculino, 1ª liga en femenino. La diferencia está en la cantidad de escalones intermedios, no en la existencia del camino. <span class=\"dato\">[Composición exacta de los equipos femeninos de liga esta temporada — completar con el club]</span> Conocerla importa porque define desde qué etapa una jugadora puede empezar a sumar minutos de mayores.",
 b7:"Verano",
 b7p:"El período de verano queda fuera del alcance de este modelo: hoy el club no desarrolla actividad formativa en esos meses. Se deja como <strong>recomendación</strong>, no como compromiso: Swiss Volley integra el beach en el calendario de competencia de formativas y la literatura respalda no sostener el mismo deporte más de ocho meses al año. Un bloque de verano en playa cubriría las dos cosas a la vez. Queda anotado para cuando el club tenga la estructura para hacerlo.",
 nota:"<strong>Pendiente de confirmación.</strong> El proyecto se implementa por fases, región por región. <span class=\"dato\">[Estado de aplicación en la región GSGL para esta temporada — confirmar con el responsable regional de formativas]</span> Este documento está escrito sobre la estructura de destino, que es adonde va todo el sistema suizo."
},

carga:{
 eyebrow:"Sección transversal · aplica a las dos ramas",
 titulo:"Carga individual del jugador",
 intro:"Cada entrenador planifica su grupo y lo planifica bien. Pero el jugador que entrena en dos o tres grupos acumula cuatro o cinco estímulos, y ese número no está en la planilla de nadie. Esta sección existe para que exista ese número y para que tenga un responsable.",
 b1:"Ficha de carga individual",
 b1p:"Una fila por jugador, actualizada al inicio de cada mes. Un solo total, un solo responsable: el coordinador de formativas. Es el documento que hoy no existe en ningún club de la región.",
 th:["Jugador","Estructuras","h/sem","Competencias/mes","Total","Situación"],
 filas:[["Jugadora A","Rookie 3","3","1 torneo","3 h · 2 estímulos","Por debajo — sumar segundo grupo","alerta"],
        ["Jugador B","Future 1 + 3ª liga","6,5","1 torneo + 4 partidos","6,5 h · 4 estímulos","En rango","ok"],
        ["Jugador C","Future 2 + 2ª liga + NLA","10,5","2 torneos + 4 partidos","10,5 h · 7 estímulos","Sobre el techo — revisar esta semana","critico"]],
 nota:"El caso del jugador C aparece solo, sin que nadie lo decida: es el chico que rinde y al que todos quieren tener. Está en dos estructuras formativas y además en dos equipos de liga, con partido casi todos los fines de semana y siete estímulos del mismo tipo, sin trabajo de fuerza. Nadie decidió que entrenara diez horas y media: se fue sumando. La tendinopatía rotuliana es la lesión por sobreuso dominante en la rodilla del voleibolista, y en una cohorte de once años uno de cada cinco jugadores que la desarrolló en la adolescencia terminó abandonando el vóley competitivo.",
 b2:"Autorización de doble etapa",
 b2p:"Se aprueba por escrito, no por simpatía ni por urgencia del sábado. Cinco condiciones, todas a la vez.",
 cond:[["Motivo formativo declarado","Se escribe qué necesita el jugador que su etapa no le da. Si el motivo es que al otro equipo le faltan jugadores, no es un motivo."],
       ["Techo semanal respetado","La suma de todos los grupos queda dentro del rango de la etapa de origen, no de la de destino."],
       ["Una competencia por fin de semana","Una. La acumulación de partidos pesa más que la de entrenamientos, porque nadie regula la intensidad de un partido."],
       ["Dos días completos libres","Sin vóley y sin gimnasio. Se definen cuáles y se respetan."],
       ["Registro y revisión mensual","Firma el coordinador de formativas. La autorización caduca: no es permanente."],
       ["Y si además juega en liga, cuenta doble","Un jugador en un equipo de mayores ya tiene su segundo eje cubierto. Sumarle además una segunda etapa formativa es acumular por tres, y casi nunca está justificado."]],
 b2n:"<strong>Y un límite reglamentario.</strong> Para la vía de campeonato, cada club inscribe un solo equipo por categoría y hay restricciones sobre jugadores que aparecen en más de un equipo. Entrenar en varios grupos es el mecanismo del modelo; competir en varios equipos es otra cosa y hay que verificarlo cada temporada contra el reglamento vigente antes de inscribir. <span class=\"dato\">[Verificar con el reglamento de la temporada]</span>",
 b3:"El contador correcto: saltos, no horas",
 b3p:"En vóley la carga es salto y brazo. Un jugador en tres grupos puede duplicar su volumen de salto sin que ninguna planilla lo note. La literatura reporta cifras muy variables según nivel y posición, y en juveniles de élite documenta diferencias claras entre varones y mujeres en saltos y carga por sesión. Por eso las cifras propias se cuentan, no se copian.",
 b3th:["Tipo de sesión","Saltos","Remates a máxima intensidad","Origen"],
 b3filas:[["Sesión técnica","a contar","a contar"],["Sesión con juego","a contar","a contar"],["Torneo de medio día","a contar","a contar"]],
 b3nota:"<strong>Cómo se completa:</strong> dos sesiones de cada tipo, un observador con contador manual. Media hora de trabajo por celda, y el club tiene su propia tabla. Vale más que cualquier valor tomado de un estudio hecho en otro contexto.",
 b4:"Regla de progresión",
 b4p:"El total semanal no sube de golpe respecto de las semanas previas. Atención especial a los retornos: vuelta de Navidad, vuelta de lesión, arranque de temporada. El pico de carga después de una pausa es donde se rompe la gente, no el volumen alto sostenido."
},

staff:{
 eyebrow:"Lo que sostiene el modelo cuando cambian las personas",
 titulo:"Cuerpo técnico y protección del jugador",
 intro:"Un modelo escrito que no tiene quién lo sostenga se muere en noviembre. Esta sección define quién hace qué, con qué formación, y bajo qué reglas de conducta.",
 b1:"Estructura y responsabilidades",
 roles:[["Coordinador de formativas","Dueño del modelo. Aprueba las dobles etapas, mantiene las fichas de carga, audita sesiones, decide la inscripción por nivel y responde ante la dirigencia. Es una función, no un título honorífico: requiere horas asignadas."],
        ["Entrenador de etapa","Aplica la ficha de su etapa, registra asistencia y mediciones, y participa de la reunión semanal. No decide solo sobre la carga de un jugador que comparte con otro grupo."],
        ["Referente de preparación física","Puede ser externo o compartido entre etapas. Define y actualiza los peldaños atléticos y los programas domiciliarios."],
        ["Referente de datos y video","Rol nuevo. Conecta lo que ya existe en el primer equipo con las formativas: mediciones, video corto y ficha del jugador."]],
 b2:"Formación de entrenadores",
 b2p:"El modelo no funciona si cada entrenador lo interpreta a su manera. Tres compromisos: todos los entrenadores con la habilitación J+S correspondiente a su etapa y al día; una jornada interna al inicio de temporada para bajar el modelo a la cancha; y una reunión semanal de treinta minutos con agenda fija — carga de jugadores compartidos, un caso concreto, y una idea técnica de la semana.",
 b2r:"Referencia externa: USA Volleyball exige un curso base a todo entrenador de club juvenil, más una certificación de protección del menor completada antes de cualquier contacto con atletas, y verificación de antecedentes para todos.",
 b2s:"Y una obligación propia del nuevo sistema: Smart Competitions incorpora un código de honor para entrenadores y familias, que recoge los valores del deporte suizo y la idea de partidos parejos, participación de todos y proceso antes que resultado. Adherir a él es parte de entrar al sistema.",
 b3:"El lenguaje común",
 b3p:"Una palabra por concepto, la misma desde Kids Volley hasta el primer equipo. El glosario completo, con las equivalencias en alemán e inglés y la regla de qué términos no se traducen, está en la solapa de Identidad. La obligación del cuerpo técnico es usarlo: si cada entrenador nombra las cosas a su manera, el jugador que cambia de etapa pierde medio año traduciendo.",
 b4:"Ética y protección del menor",
 b4p:"Ningún documento formativo puede circular hoy sin esta sección. Cuatro reglas mínimas, aplicables desde mañana, alineadas con la carta de ética de Swiss Volley:",
 etica:[["Nunca a solas","Ningún entrenador queda a solas con un menor en vestuario, viaje o gimnasio cerrado. Siempre dos adultos o puerta abierta."],
        ["Comunicación visible","Los mensajes con jugadores menores van por canales grupales o con la familia en copia. Nunca privados."],
        ["Vía de denuncia","Una persona designada, externa al cuerpo técnico, a quien un jugador o una familia pueda recurrir. Publicada y conocida."],
        ["Imagen","Consentimiento escrito de la familia para fotos y video, con posibilidad de revocarlo sin dar explicaciones."]],
 b5:"Familias",
 b5p:"Son las familias las que inscriben a un chico en tres grupos, con la mejor intención del mundo. Una hoja de una página al inicio de temporada —cuántas horas corresponden, por qué hay dos días de descanso, por qué a veces el club dice que no, y por qué los resultados de los torneos no se publican— evita la mayor parte de los conflictos antes de que existan. Se entrega firmada."
},

herr:{
 eyebrow:"Lo que se usa el lunes a la mañana",
 titulo:"Herramientas",
 intro:"Un modelo que no baja a papel no se aplica. Estas cinco piezas son las que convierten el documento en trabajo diario. Todas caben en una hoja y todas están pensadas para usarse sin computadora, en el borde de la cancha.",

 b1:"Batería de mediciones",
 b1p:"Dos veces al año, octubre y marzo, en todas las etapas y las dos ramas. La talla va aparte: cada tres meses, porque es lo que ubica al jugador en su peldaño atlético. Es la herramienta con fecha de vencimiento: si se pasa octubre, se pierde la línea de base de toda la temporada.",
 b1th:["Qué se mide","Cómo","Material","Error frecuente"],
 b1f:[
  ["Talla","De pie contra la pared, sin calzado, talones juntos, mirada al frente.","Cinta métrica en la pared","Medir con zapatillas o con el chico mirando hacia arriba."],
  ["Envergadura","Brazos extendidos en cruz contra la pared, punta de dedo a punta de dedo.","Cinta métrica","No apoyar bien la espalda."],
  ["Alcance de pie","De pie, un brazo extendido arriba, hombro elevado, talones en el piso.","Pared marcada o medidor","Dejar despegar el talón: infla el número y arruina la comparación."],
  ["Alcance de ataque","Con carrera de aproximación, se toca lo más alto posible con una mano.","Medidor de saltos o pared con marcas","Cambiar el tipo de carrera entre octubre y marzo."],
  ["Alcance de bloqueo","Sin carrera, salto desde el lugar, dos manos.","Medidor o pared","Permitir un paso previo."],
  ["Salto vertical (CMJ)","Salto con contramovimiento, manos en la cintura, tres intentos, se anota el mejor.","App de salto o plataforma","Usar una app distinta entre mediciones."],
  ["Control de aterrizaje","Caída desde un cajón bajo. Se observa si la rodilla se mete hacia adentro. Se anota bien, regular o mal.","Un cajón de 30 cm y el celular para filmar","Anotar de memoria en vez de filmar."],
  ["Saque","Diez saques a una zona cantada. Se anota cuántos entran y cuántos van a la zona.","Conos","Cambiar la zona entre mediciones."],
  ["Recepción","Veinte recepciones de saque de partido. Se anota cuántas quedan en sistema.","Nada","Bajar la intensidad del saque para que el número quede lindo."]],
 b1n:"<strong>Las tres reglas de oro.</strong> Mismo protocolo, mismo evaluador, misma hora del entrenamiento. Un cambio de método produce una mejora falsa, y una mejora falsa arruina una decisión sobre un chico. Si hay que elegir entre medir bien o medir a todos, se mide bien a los que se pueda.",
 b1p2:"La planilla de registro lleva una fila por jugador y estas columnas: nombre, fecha de nacimiento, etapa, equipo de liga si corresponde, y una columna por medición. Se guarda de una temporada a la otra: recién con dos temporadas el club tiene percentiles propios y deja de adivinar.",

 b2:"Programa domiciliario",
 b2p:"Quince minutos, tres veces por semana, solo con peso corporal y sin equipamiento. Se entrega impreso al inicio de temporada y se revisa una vez por mes en el gimnasio, con el grupo, para que nadie lo haga mal durante seis meses. Es la parte del entrenamiento con mayor retorno de toda la formación, y la única forma de llegar a la dosis semanal que la evidencia asocia con reducción real del riesgo.",
 b2th:["Bloque","Qué se hace","Cuánto"],
 b2f:[["Movilidad","Tobillo contra la pared, cadera y columna dorsal.","3 minutos"],
      ["Aterrizajes","Caer de un escalón bajo con rodilla alineada. Primero con dos piernas, después con una.","4 minutos"],
      ["Isquiotibiales","Trabajo excéntrico con un compañero o apoyo fijo, progresando de a poco.","3 minutos"],
      ["Cadera y core","Puentes, abducción lateral, planchas cortas.","3 minutos"],
      ["Equilibrio","Apoyo en una pierna con los ojos cerrados y con perturbación.","2 minutos"]],
 b2n:"<strong>Se adapta al peldaño, no a la etapa.</strong> Antes del pico de crecimiento el foco está en coordinación y equilibrio; durante el pico, en excéntricos y control de aterrizaje; después del pico se puede progresar la carga. Y en la rama femenina el programa no es opcional en ninguna etapa.",

 b3:"Ficha del jugador",
 b3p:"Una por jugador, lo sigue desde Kids Volley hasta el primer equipo. Es el documento que permite que un entrenador nuevo entienda a un chico en cinco minutos en vez de en tres meses. Es también donde el sistema de datos del club entra en formativas sin necesidad de scouting.",
 b3th:["Bloque","Qué contiene"],
 b3f:[["Identificación","Nombre, fecha de nacimiento, año de ingreso al club, escuela, contacto de la familia."],
      ["Trayectoria","Etapas y equipos por temporada, incluida la liga si corresponde."],
      ["Mediciones","Todas las mediciones de octubre y marzo, en serie. La serie vale más que el valor."],
      ["Crecimiento","Talla cada tres meses y peldaño atlético actual."],
      ["Carga","Horas semanales y competencias, con el histórico mensual."],
      ["Lesiones","Qué, cuándo, cuántos días fuera, cómo fue el retorno."],
      ["Federación","Participación en Talentsichtung, ingreso al Talentpool, Talent Card si corresponde."],
      ["Objetivos","Dos por temporada, escritos con el jugador y revisados con él."],
      ["Notas del entrenador","Breves y fechadas. No se borra lo anterior."]],

 b4:"Planilla de auditoría de sesión",
 b4p:"Una hoja para entrar a cualquier grupo y observar siempre lo mismo. Es la herramienta de trabajo del coordinador y sirve para acompañar, no para controlar: se comparte con el entrenador el mismo día. Diez minutos de observación alcanzan.",
 b4f:[["¿Se hizo el bloque preventivo completo?","Sí o no, y cuántos minutos reales."],
      ["Densidad","Contactos de calidad por jugador en un tramo de cinco minutos. Se cuenta, no se estima."],
      ["Filas","¿Hubo alguna fila de más de cuatro jugadores esperando?"],
      ["Prioridad de temporada","¿Apareció alguna de las cinco prioridades de la etapa?"],
      ["Lenguaje","¿Se usaron las palabras del glosario o las del entrenador?"],
      ["Corrección","¿Se corrigió la decisión o solo el gesto?"],
      ["Cierre","¿Habló un jugador o solo el entrenador?"],
      ["Aterrizajes","¿Alguien cayó con la rodilla hacia adentro y nadie lo corrigió?"]],
 b4n:"El resultado no se archiva: se conversa. Una auditoría que no termina en una charla de cinco minutos con el entrenador es un trámite.",

 b5:"Hoja para las familias",
 b5p:"Una página, se entrega firmada al inicio de temporada. Son las familias las que inscriben a un chico en tres estructuras, con la mejor intención del mundo. Esta hoja evita la mayor parte de los conflictos antes de que existan.",
 b5f:[["Cuántas horas corresponden","El rango de la etapa de su hijo o hija, y el total contando todas las estructuras."],
      ["Por qué dos días de descanso","Y por qué eso no es falta de compromiso."],
      ["Por qué a veces el club dice que no","A un segundo equipo, a una tercera estructura, a un torneo más."],
      ["Por qué no se publican los resultados","El sistema suizo de formativas es deliberadamente orientado al proceso. Conviene explicarlo antes de que lo pregunten."],
      ["Cómo se decide que suba de etapa","Por nivel y por estándares escritos, no por edad ni por simpatía."],
      ["A quién recurrir","La persona designada, externa al cuerpo técnico, para cualquier problema."],
      ["Qué se espera de la familia","Llevar, buscar, acompañar y no dirigir desde la tribuna. El código de honor de Smart Competitions alcanza también a las familias."]]
},

plan:{
 eyebrow:"De documento a práctica",
 titulo:"Implementación",
 intro:"Un modelo se aprueba en una reunión y se implementa en tres años. Estas son las tres fases, ordenadas por lo que cuestan. La primera no cuesta nada y es la que más cambia.",
 fases:[
  {t:"Fase 1 — Método",c:"Sin costo adicional · esta temporada",col:"#FAE149",l:[
   "Fichas de etapa en uso en los nueve escalones.",
   "Bloque preventivo de veinte minutos en todas las sesiones.",
   "Ficha de carga individual y regla de doble etapa vigentes.",
   "Reunión semanal de staff con agenda fija.",
   "Batería de mediciones de octubre y marzo.",
   "Hoja de familias y reglas de protección del menor publicadas.",
   "Criterio escrito de inscripción por nivel para cada equipo."]},
  {t:"Fase 2 — Estructura",c:"Requiere horas y decisión de la dirigencia · temporadas 2 y 3",col:"#EE4655",l:[
   "Horas asignadas y remuneradas para la coordinación de formativas.",
   "Bloque atlético propio en las tres etapas de Future.",
   "Plan de habilitación J+S para todo el cuerpo técnico.",
   "Definición del techo de la pirámide femenina.",
   "Percentiles propios del club, con dos temporadas de mediciones.",
   "Organización de al menos un torneo propio por temporada."]},
  {t:"Fase 3 — Identidad",c:"Objetivo a tres años",col:"#0E2A8A",l:[
   "Datos y video integrados desde Rookie 3, apoyados en el sistema del primer equipo.",
   "Puente formalizado entre Future 3 y el primer equipo.",
   "Documento publicado en alemán e inglés como carta de presentación del club.",
   "Postulación a una certificación de calidad de formativas."]}],
 b0:"Calendario de la temporada",
 b0p:"La temporada suiza va de septiembre a abril. Este es el macrociclo del club, con las ventanas que no se pueden mover y los hitos de gestión que suelen olvidarse hasta que ya es tarde.",
 b0th:["Cuándo","Foco formativo","Competencia","Gestión"],
 b0f:[
  ["Agosto","Armado de grupos y ubicación por nivel","—","Jornada interna de staff · inscripción de equipos · hoja de familias"],
  ["Septiembre","Instalación de las prioridades de temporada","Primeros torneos · arranque de ligas","Fichas de carga cargadas y aprobadas"],
  ["Octubre","Volumen técnico alto","Torneos regionales","<strong>Medición 1</strong> · Talentsichtung regional GSGL"],
  ["Noviembre","Prioridades en situación de juego","Bloque competitivo","Primera auditoría de sesiones · revisión mensual de carga"],
  ["Diciembre","Consolidación","Bloque competitivo","Informe a la dirigencia · entrega del programa domiciliario para el corte"],
  ["Navidad","Corte","—","Nadie entrena todos los días. El programa domiciliario sostiene el mínimo"],
  ["Enero","<strong>Retorno progresivo</strong>","Reinicio","La carga no vuelve de golpe al nivel de diciembre: es donde más gente se rompe"],
  ["Febrero","Táctica y decisión","Bloque competitivo 2","Revisión de ubicación por nivel: quién sube y quién baja de escalón"],
  ["Marzo","Rendimiento","Clasificaciones","<strong>Medición 2</strong> · comparación con octubre"],
  ["Abril","Cierre y evaluación","Campeonato suizo de formativas","Entrevista individual con cada jugador · decisión de etapa para la temporada siguiente"],
  ["Mayo a agosto","Fuera de temporada","—","Se recomienda otro deporte. Menos de ocho meses al año en el mismo deporte"]],
 b0n:"<strong>Dos fechas que no se mueven.</strong> La medición de octubre, porque sin línea de base la temporada entera se queda sin datos. Y la Talentsichtung regional, porque es la puerta al Talentpool y ocurre una vez al año. Todo lo demás admite corrimiento.",
 b2:"Los primeros 90 días",
 th:["Cuándo","Qué","Quién"],
 dias:[["Semana 1-2","Presentación del modelo al cuerpo técnico completo. Jornada interna.","Coordinador"],
       ["Semana 2","Relevamiento: quiénes entrenan hoy en más de un grupo. Es el dato que nadie tiene.","Entrenadores"],
       ["Semana 2","Confirmar con GSGL el estado de aplicación de Smart Competitions.","Coordinador"],
       ["Semana 3","Fichas de carga individual cargadas y primera revisión.","Coordinador"],
       ["Semana 3-4","Bloque preventivo en marcha en los nueve escalones.","Entrenadores"],
       ["Semana 4","Hoja de familias entregada y firmada.","Club"],
       ["Octubre","Primera medición completa, mismo protocolo en todas las etapas.","Coordinador y ref. físico"],
       ["Noviembre","Presentación de los jugadores con perfil a la sichtung regional GSGL.","Coordinador"],
       ["Diciembre","Primer informe a la dirigencia: retención, carga, lesiones, mediciones.","Coordinador"]],
 nota:"<strong>Lo único que no espera.</strong> La medición de octubre. Todo lo demás se puede correr un mes; esa ventana no vuelve hasta el año siguiente, y sin línea de base el modelo se queda otra temporada sin datos propios."
},

foda:{
 eyebrow:"Anexo interno · no circula fuera del cuerpo técnico y la dirigencia",
 titulo:"Diagnóstico estratégico",
 intro:"Este análisis mira al club, no al documento. Está escrito para decidir, no para ilustrar: cada debilidad y cada amenaza tienen un cruce estratégico y una acción con responsable en el plan de los primeros 90 días.",
 aviso:"<strong>Uso restringido.</strong> Frases como «no todos los entrenadores tienen la formación necesaria» son ciertas y son internas. Este anexo no se entrega a familias ni se adjunta a la presentación institucional.",
 f:{t:"Fortalezas",c:"#76B82A",l:[
   ["Un equipo de NLA en la misma casa","El techo de la pirámide es visible y accesible. Casi ningún club formativo del país puede ofrecer eso."],
   ["Nueve equipos de mayores y siete de formativas","Seis equipos masculinos de mayores hasta NLA y tres femeninos hasta 1ª liga. Un jugador o una jugadora tiene un escalón para cada nivel real, dentro del mismo club. Es el modelo que Italia tuvo que construir desde cero con Club Italia, y acá ya está montado."],
   ["Capacidad de análisis de datos y video ya instalada","Existe y funciona en el primer equipo. Escalarla a formativas no requiere comprar nada, solo decidirlo."],
   ["Dirección técnica unificada de todas las inferiores","Un solo responsable para las nueve etapas y las dos ramas. Es la condición que hace posible un modelo común."],
   ["Región con estructura de talento activa","La Talentsichtung de GSGL funciona, con sedes en Jona y Chur, y hay un camino nacional detrás."]]},
 o:{t:"Oportunidades",c:"#F2A623",l:[
   ["El tope de admisión alto de Rookie","Permite captar chicos de hasta diecisiete años que nunca jugaron, sin exponerlos a competir contra pares con seis años de ventaja. Es una puerta de entrada nueva."],
   ["Smart Competitions premia lo que sabemos hacer","El sistema pasó a valorar participación, retención y proceso. Un club con un modelo formativo escrito está mejor posicionado que uno que solo sabe ganar torneos."],
   ["School Volley como canal a las escuelas","Vía oficial de la federación para llegar a los chicos donde están, sin depender de que la familia ya conozca el vóley."],
   ["Ser el club de referencia formativa del cantón","Glarus es chico. El primero que publique un modelo serio se queda con la vara y con las familias."],
   ["Ya somos sede de torneos","El club organizó una jornada juvenil de GSGL en septiembre y un torneo de Kids Volley en diciembre. La capacidad está probada: falta convertirla en política, con un calendario fijo de torneos propios cada temporada. Trae equipos, familias, ingresos y visibilidad regional a costo bajo."]]},
 d:{t:"Debilidades",c:"#E8593C",l:[
   ["Sin equipos femeninos U18 ni U20","La rama femenina salta de U16 directamente a los equipos de mayores. Hoy ese salto lo absorben la 4ª y la 3ª liga, y funciona, pero significa que una chica de diecisiete compite contra adultas sin una instancia intermedia propia de su edad. Hay que decidir si eso se sostiene o se cubre."],
   ["Tres horas semanales por grupo","Por debajo del rango recomendado en casi todas las etapas. Se compensa con multi-grupo y liga, pero es una compensación, no una solución."],
   ["Nadie tenía el total de carga de cada jugador","La ficha de carga individual nace justamente porque ese número no existía en ninguna planilla."],
   ["Formación desigual del cuerpo técnico","La habilitación J+S no está mapeada por etapa y no hay plan de actualización escrito."],
   ["Sin datos propios","No hay percentiles del club porque no hubo mediciones sistemáticas. La primera línea de base es la de octubre."],
   ["Coordinación sin horas asignadas","Si la función depende de la buena voluntad, el modelo se muere en noviembre."]]},
 a:{t:"Amenazas",c:"#3B8BD4",l:[
   ["Base de captación chica","Glarus tiene poca población y varios deportes compitiendo por los mismos chicos. Es la restricción de fondo de todo el proyecto."],
   ["Abandono en la adolescencia","El pico de deserción coincide con Rookie y el inicio de Future. Es el momento exacto en que el sistema exige más."],
   ["Sobrecarga por acumulación de estructuras","Formativa más liga más torneos. La tendinopatía rotuliana en la adolescencia terminó la carrera de uno de cada cinco jugadores que la desarrollaron."],
   ["Rotación de entrenadores","Sin lenguaje común ni fichas escritas, cada cambio de entrenador reinicia la categoría."],
   ["Transición incompleta de Smart Competitions","El sistema se implementa región por región. Planificar sobre la estructura equivocada cuesta una temporada."],
   ["Dependencia de voluntarios","Es el riesgo estructural de todo el deporte de base suizo, y la propia federación lo declara como uno de los cambios sociales que la obligan a adaptarse."]]},
 b2:"Estrategias cruzadas",
 b2p:"Un FODA sin cruces es decoración. Estas seis estrategias combinan una fortaleza o una oportunidad con una debilidad o una amenaza concreta, y todas tienen un correlato en el plan.",
 cr:[
  ["Usar el NLA contra el abandono","Fortaleza + Amenaza","El pico de deserción está en Rookie. Que esos chicos entren gratis a los partidos de NLA, hagan de alcanzapelotas y entrenen una vez por temporada con el primer equipo es la intervención de retención más barata que existe."],
  ["Hacer visible el techo femenino","Fortaleza + Amenaza","El primer equipo femenino de 1ª liga es el destino de toda la rama y hay que nombrarlo desde Kids Volley: partidos abiertos, jugadoras del primer equipo apareciendo en los entrenamientos de las chicas, y una jugadora de Future 3 entrenando con ellas cuando esté lista. Contra el abandono adolescente, ver el destino vale más que cualquier discurso."],
  ["Captación por School Volley y Rookie tardío","Oportunidad + Amenaza","Contra la base chica: entrar a las escuelas por el canal oficial y ofrecer Rookie a los que llegan tarde. Amplía el embudo sin competir por los mismos chicos de siempre."],
  ["Datos del primer equipo como diferencial de captación","Fortaleza + Amenaza","Ningún club vecino puede ofrecerle a una familia que su hijo tenga ficha individual, mediciones dos veces al año y video. Es un argumento de elección de club, no solo una herramienta técnica."],
  ["Ficha de carga contra la sobrecarga","Debilidad + Amenaza","El único antídoto contra la acumulación de estructuras es que exista un total con responsable. Es de costo cero y es la primera acción del plan."],
  ["Fichas escritas contra la rotación","Debilidad + Amenaza","Un entrenador que se va se lleva su conocimiento; una ficha de etapa se queda. El lenguaje común y las fichas son el seguro contra la rotación."]],
 b3:"Captación: cómo crece el club",
 b3p:"Con una base de captación chica, la retención y la captación importan tanto como la formación. Cuatro canales, ordenados por costo.",
 cap:[["School Volley","Vía oficial de la federación hacia las escuelas, con formas de juego adaptadas de 3:3 y reglas simplificadas. Es el canal más barato y el que llega a los chicos que no tienen a nadie en su familia que juegue al vóley."],
      ["Rookie para los que llegan tarde","El tope de admisión hasta U18 permite ofrecer una entrada digna a los de quince o dieciséis. Requiere decirlo en voz alta: hoy nadie sabe que se puede."],
      ["Torneos propios","Organizar torneos de medio día es liviano con el nuevo sistema. Trae equipos, familias e ingresos, y pone al club en el mapa regional."],
      ["El NLA como imán","Partidos abiertos a las formativas, jugadores del primer equipo apareciendo en los entrenamientos de los chicos. Cuesta cero francos y es lo que ningún club vecino puede copiar."]],
 b4:"Lo que hay que decidir",
 b4p:"Tres decisiones que no son técnicas y que este documento no puede tomar por la dirigencia.",
 dec:[["Si se crea un equipo femenino U18","Hoy la 4ª y la 3ª liga cubren esa franja. Crear un U18 femenino daría una instancia propia de edad, pero compite por las mismas jugadoras y por las mismas horas de gimnasio. Es una decisión de recursos, no técnica."],
      ["Horas remuneradas de coordinación","Cuántas y con qué presupuesto. Sin esto, la fase 1 se aplica a medias y la fase 2 no empieza nunca."],
      ["Prioridad entre las dos vías","Cuántos jugadores se orientan a la vía por nivel y cuántos a la vía de campeonato por edad. Es una decisión de identidad del club, no una cuestión operativa."]]
},

ref:{
 eyebrow:"De dónde sale cada cosa",
 titulo:"Referencias",
 intro:"Este modelo no se inventa desde cero: toma el marco obligatorio suizo y le suma lo que hacen dos de los sistemas formativos más sólidos del mundo. Cada uno aporta algo distinto y concreto.",
 b1:"Marco de referencia por país",
 paises:[
  {t:"Suiza · Swiss Volley y Swiss Olympic",o:"Obligatorio para nosotros",
   p:["Las categorías, los sistemas de juego, las alturas de red y las reglas de participación de este documento salen de <strong>Smart Competitions</strong>, el sistema de competencia de formativas que Swiss Volley desarrolló dentro del proyecto homónimo de Swiss Olympic, bajo el lema de más participación y personalidades más fuertes para un mejor rendimiento futuro.",
      "El <strong>Rahmenkonzept FTEM</strong> ordena la carrera en fases: quien no fue identificado como talento está en Foundation, y T1 a T4 van de la detección regional a los centros de rendimiento de nivel NLA. La evaluación anual sigue el modelo <strong>PISTE</strong>.",
      "La <strong>Talentsichtung</strong> regional abre el <strong>Talentpool</strong>, que da acceso a las estructuras de formación y al programa atlético de la federación con sus benchmarks de test. La <strong>Swiss Olympic Talent Card</strong> acredita al jugador ante la escuela y las autoridades. En la región GSGL los tests se realizan en Jona y en Chur.",
      "La formación es <strong>dual, vóley y beach</strong>, y ambas disciplinas están integradas en el calendario de competencia."],
   a:"Es el esqueleto del documento. La estructura de etapas, los sistemas de juego, la ruta del jugador y el calendario de tests salen de acá."},
  {t:"Estados Unidos · USOPC y USA Volleyball",o:"Estructura y seguridad",
   p:["El <strong>American Development Model</strong> organiza el desarrollo en cinco etapas con expectativas propias de cada edad, y cubre formación de entrenadores, participación de las familias, administración del club y seguridad del atleta. Está construido sobre el trabajo de Istvan Balyi en desarrollo a largo plazo, y USA Volleyball participó en su elaboración.",
      "USA Volleyball exige un curso base a todo entrenador de club juvenil, la certificación <strong>SafeSport</strong> completada antes de tener contacto con atletas, y verificación de antecedentes para todos los entrenadores federados.",
      "El ADM señala un problema idéntico al nuestro: con veinte jugadores y una sola pelota, cada chico recibe muy pocos contactos. De ahí la insistencia en sesiones con muchas pelotas.",
      "Y hay un precedente útil: la NBA junto a USA Basketball publicaron guías con máximos de horas semanales, cantidad de partidos y duración de sesión por franja etaria."],
   a:"El estándar de habilitación y protección del menor —adaptado a J+S—, el indicador de densidad de contactos, y el precedente de publicar techos de volumen."},
  {t:"Italia · FIPAV",o:"Formación y certificación",
   p:["<strong>Club Italia</strong> lo fundó Julio Velasco en 1998 siendo director técnico de la federación, con una idea contraintuitiva: desarrollar a los jóvenes compitiendo en una liga de mayores en vez de en ligas juveniles. Lo controla la federación, que coloca ahí a los mejores jóvenes detectados. Por ese equipo pasaron Egonu, Danesi, Malinov y Orro.",
      "La FIPAV certifica con un <strong>Marchio di Qualità</strong> el sector juvenil de sus clubes mediante una planilla de evaluación por la que las sociedades postulan. Y en doble carrera opera dentro del proyecto ministerial <strong>Studente-Atleta</strong>."],
   a:"Club Italia respalda nuestra política de doble etapa: jugar arriba no es el problema, hacerlo sin planificación sí. Y la rúbrica del Marchio di Qualità es la vara externa contra la que conviene medir este documento."}],
 b2:"Bibliografía",
 b2p:"Las afirmaciones marcadas como Literatura remiten a esta lista. Los enlaces suizos son la fuente de todo lo marcado como Swiss Volley.",
 b3:"Qué falta verificar",
 b3p:"Honestidad de método: esto todavía no está confirmado y no debe circular como si lo estuviera.",
 pend:["Si GSGL abre el piloto de Smart Competitions esta temporada: hoy sigue organizando por categorías de edad bajo su concepto regional de 2019.",
       "Alturas de red y medidas vigentes por etapa, contra el reglamento de la temporada: las reglas están en revisión y hay propuestas de cambio ya recogidas por la federación.",
       "<strong>Forma de juego de Rookie 1 y 2.</strong> El concepto nacional describe Rookie 1 como 3:3; al menos una región que ya aplica el sistema publica Rookie 1 y 2 como 4:4. Resolver contra el reglamento de GSGL antes de planificar.",
       "<strong>Alturas de red de Rookie 2 y 3.</strong> Hay una propuesta declarada de la federación para ajustarlas a 2,10 o 2,15 m en jugadores mayores.",
       "<strong>Regla de los tres contactos obligatorios tras la recepción en Rookie.</strong> Está vigente en el reglamento de Rookie pero hay propuesta de eliminarla.",
       "<strong>Nivel Future 3+.</strong> Existe en las regiones que ya aplican el sistema y este documento todavía no lo desarrolla.",
       "Límites de habilitación de juveniles en ligas de adultos, contra el reglamento de la temporada en curso: la edición cambia cada año.",
       "Fechas exactas de la Talentsichtung GSGL y del calendario regional de torneos.",
       "Estructura femenina real de Näfels y techo de la pirámide para las jugadoras.",
       "Cifras propias de alcance, salto y conteo de saltos: se generan midiendo, no buscando.",
       "Cantidad de equipos, jugadores y entrenadores por etapa: el modelo está diseñado para no depender de esto, pero el plan de implementación sí lo necesita."]
}
};

resumen:{
 eyebrow:"Zusammenfassung für den Vorstand",
 titulo:"Ein Konzept, abgestimmt auf Swiss Volley",
 intro:"Näfels hat Nachwuchsmannschaften. Was fehlt, ist ein Programm: eine gemeinsame Linie, die von Kids Volley bis zur ersten Mannschaft trägt, in beiden Sparten, und die einen Trainerwechsel überlebt. Genau diese Linie ist hier aufgeschrieben und in die offizielle Struktur des Verbands eingebettet.",
 lede:"Der Verein hat bereits das Schwierigste: eine NLA-Mannschaft im eigenen Haus. Was fehlt, ist der Weg, der ein neunjähriges Kind mit diesem Feld verbindet — und zwar derselbe Weg für alle, unabhängig davon, wer gerade trainiert.",
 cifras:[{n:"9",d:"Stufen nach einer gemeinsamen technischen Linie"},{n:"5",d:"messbare Verpflichtungen des Vereins"},
         {n:"3",d:"Umsetzungsphasen, die erste ohne Zusatzkosten"},{n:"0",d:"Franken nötig für den Start"}],
 b1:"Welches Problem das löst",
 p1:[["Jede Kategorie ist ein eigener Verein.","Wer aufsteigt, wechselt Vokabular, System und Anspruch. Ein halbes Jahr geht dafür drauf, das bereits Gelernte zu übersetzen. Mit Trainerwechseln vervielfacht sich das Problem."],
     ["Niemand kennt die Gesamtbelastung.","Wer Leistung bringt, trainiert in drei Strukturen und spielt zwei Turniere im Monat. Kein Trainer macht etwas falsch; die Gesamtzahl steht schlicht auf keinem Blatt. Das ist der direkte Weg zur Überlastungsverletzung."],
     ["Es fehlen Kriterien für Entscheide über Spieler:innen.","Wer aufsteigt, wer zur Sichtung geht, wer mehr braucht. Heute entscheidet der Eindruck — und einen Eindruck kann man einer Familie nicht erklären."],
     ["Der Verein kann nicht zeigen, was er tut.","Gegenüber Swiss Volley, einem Sponsor oder einer Familie, die einen Verein für ihre Tochter sucht: Es gibt kein Dokument. Die Arbeit existiert, aber sie ist unsichtbar."]],
 b2:"Was dieses Konzept ist",
 p2:"Drei Teile. Ein <strong>Rückgrat</strong>, das festlegt, was auf jeder Stufe und in welcher Reihenfolge vermittelt wird, damit nichts doppelt kommt und nichts vergessen geht. Ein <strong>System zur individuellen Belastungssteuerung</strong>, das jeder Spielerin und jedem Spieler eine Zahl und eine verantwortliche Person zuordnet. Und ein <strong>Weg</strong>, der jede Stufe mit der Schweizer Talentstruktur verbindet, in beiden Sparten.",
 p2b:"Es baut auf den offiziellen Kategorien von Swiss Volley auf, übernimmt aus den USA den Standard für Trainerausbildung und Kindesschutz und aus Italien das Modell der Ausbildung über den Wettkampf. Es ist keine Meinung: Jede Aussage nennt ihre Herkunft, und die eigenen Entscheide des Vereins sind als solche gekennzeichnet.",
 b3:"Die fünf Verpflichtungen",
 p3:[["Niemand trainiert ohne definierte Wochenobergrenze.","Eine Zahl, eine verantwortliche Person, monatliche Überprüfung. Schluss mit dem Spieler, der Reize anhäuft, weil niemand addiert."],
     ["Zwanzig Minuten Prävention in jedem Training.","Das ist kein Einlaufen. Es ist der einzige Lebensabschnitt, in dem präventive Arbeit nachweislich wirkt — und sie verbessert zusätzlich die Sprunghöhe."],
     ["Zwei Messungen pro Jahr, gleiches Protokoll.","Oktober und März. Nach zwei Saisons hat der Verein eigene Referenzwerte und muss nicht mehr schätzen."],
     ["Alle mit passendem Profil gehen an die regionale Sichtung.","Ohne Ausnahme und ohne dass es davon abhängt, ob ein Trainer daran denkt."],
     ["Dieselbe Fachsprache von Kids Volley bis zur ersten Mannschaft.","Ein Wort pro Begriff. Genau das sorgt dafür, dass ein Stufenwechsel kein halbes Jahr kostet."]],
 b4:"Woran wir messen, ob es funktioniert",
 p4:[["Verbleib","Anteil der Spieler:innen, die in der Folgesaison noch im Verein sind. Der ehrlichste Indikator für ein Nachwuchsprogramm — und zugleich das erklärte Ziel der Smart Competitions."],
     ["Überlastungsverletzungen","Anzahl und Ausfalltage. Muss sinken. Interessiert auch die Versicherung und die Eltern."],
     ["Spieler:innen im Talentpool","Wie viele den Sprung in die Verbandsstruktur schaffen. Das schaut Swiss Volley an."],
     ["Interne Aufstiege","Im Verein ausgebildete Spieler:innen, die es in die erste Mannschaft schaffen. Das Endziel."],
     ["Trainingsdichte","Qualitative Ballkontakte pro Person und Training. Überprüfbar, indem man in die Halle geht."]],
 cierre:"<strong>Warum jetzt.</strong> All das lässt sich in dieser Saison ohne einen zusätzlichen Franken starten: Es sind methodische Entscheide, keine Budgetfragen. Das Einzige, was nicht warten kann, ist die Oktobermessung — verpasst man dieses Fenster, fehlt ein ganzes Jahr Ausgangswerte."
},

marco:{
 p:"Das <strong>Rahmenkonzept FTEM</strong> von Swiss Volley gliedert die Laufbahn in Phasen: Wer nicht als Talent identifiziert wurde, befindet sich in <em>Foundation</em>; die Phasen T1 bis T4 reichen von der regionalen Sichtung bis zu den Leistungszentren auf NLA-Niveau. Die jährliche Beurteilung folgt dem <strong>PISTE</strong>-Modell mit einem nationalen Entwicklungstest. Die regionale <strong>Talentsichtung</strong> öffnet den <strong>Talentpool</strong>, der Zugang zu den Ausbildungsstrukturen und zum Athletikprogramm des Verbands gibt; die <strong>Swiss Olympic Talent Card</strong> weist die Person gegenüber Schule und Behörden als Sporttalent aus. In der Region GSGL finden die Tests in Jona und in Chur statt.",
 m:"Bei den Männern führt der regionale Weg über Jona weiter, und die sichtbare Spitze steht im selben Haus: die erste Mannschaft in der NLA. Das ist ein Vorteil, den kaum ein Ausbildungsverein hat, und er will genutzt werden — ein Kind aus dem Kids Volley muss sie spielen sehen.",
 f:"Bei den Frauen führt der Weg über die regionalen und nationalen Strukturen des Verbands und endet vereinsintern in der ersten Mannschaft in der <strong>1. Liga</strong>. Eine Spielerin auf Stufe Future 3 hat ein konkretes, erreichbares Ziel im eigenen Haus — und sie soll das ab Kids Volley wissen."
},

vol:{
 b:"Umfang: das Konzept passt sich der verfügbaren Halle an",
 intro:"Die Hallenzeiten ändern sich jede Saison. Deshalb legt das Konzept keinen Umfang fest, sondern einen Zielbereich pro Stufe — und rechnet mit dem, was der Verein in diesem Jahr hat, aus, wie viel fehlt. Werte ändern, alles rechnet neu.<br><br><strong>Das vierte Feld macht die Rechnung erst realistisch.</strong> Bei den Männern spielen viele Nachwuchsspieler zusätzlich in einer Aktivmannschaft des Vereins. Diese Stunden und Spiele gehören in dieselbe Summe: Der Körper unterscheidet nicht, aus welcher Struktur die Belastung kommt.",

 nota:"<strong>Mehrfachzugehörigkeit ist kein Problem, sondern der Mechanismus.</strong> Bei kurzen Trainingsblöcken brauchen die mittleren und oberen Stufen eine zweite Gruppe oder eine Aktivmannschaft, um den Zielbereich zu erreichen. <strong>Und eine Vorrangregel, denn das Dokument enthält zwei Stundentabellen.</strong> Dieser Bereich beschreibt, was die <em>Stufe</em> zur Entwicklung braucht. Die tatsächliche Obergrenze einer Person ergibt sich aus ihrem <em>Alter</em>, im Reiter Kader. Wo beide nicht übereinstimmen — und in mehreren Kombinationen tun sie das nicht — gilt das Alter: Die Stufe zeigt die Richtung, der Körper zeigt die Grenze. Zu korrigieren ist nicht, dass Jugendliche in mehreren Strukturen trainieren — sondern dass sie es heute nach Hallenverfügbarkeit tun statt nach technischer Anweisung, und dass niemand die Summe zieht.",
 limites:"Grenzen, die nicht von der Halle abhängen: nicht mehr Wochenstunden organisierter Sport als Lebensjahre, zwei vollständig freie Tage pro Woche, eine organisierte Sportart pro Saison und weniger als acht Monate pro Jahr in derselben Sportart."

matriz:{
 eyebrow:"Das Stück, das aus neun Stufen ein Programm macht",
 titulo:"Rückgrat",
 intro:"Nichts davon hängt davon ab, wie viele Kinder da sind oder welche Hallenzeiten man bekommt. Es wird einmal festgelegt und ordnet die neun Stufen. Daraus ergeben sich die Schwerpunkte jedes Stufenblatts — deshalb wiederholt sich kein Inhalt und keiner fällt weg.",
 aviso:"<strong>Zwei Arten von Zeilen, und man sollte sie nicht verwechseln.</strong> Die mit Swiss Volley gekennzeichneten ergeben sich zwingend aus dem Spielsystem der jeweiligen Stufe: Sie werden nicht diskutiert, sondern eingehalten. Die mit Verein gekennzeichneten sind unser Entscheid und werden jede Saison überprüft. Vor dem Vorstand sind das zwei verschiedene Gespräche.",
 b1:"Technikmatrix",
 b1p:"Jedes Element erscheint nur auf einer Stufe als neuer Inhalt und wird danach gehalten. Wer wissen will, ob bei ihm der Lesende Block ansteht, schaut auf ein Feld.",
 b2:"Taktikmatrix",
 b2n:"<strong>Mit einem System zu spielen und es zu lernen sind zwei verschiedene Dinge.</strong> Swiss Volley legt fest, mit welchem System auf jeder Stufe <em>gespielt</em> wird, und das steht nicht zur Diskussion. Wann es <em>unterrichtet</em> wird, entscheidet der Verein — und hier treffen wir einen bewussten Entscheid: Das 5-1 wird ab dem Moment erklärt, in dem das ganze Feld dazukommt, also in Rookie 3, obwohl noch drei Stufen bis zum Spielen fehlen. Der Grund ist einfach: Man kann in Future 3 nichts festigen, das die Person nie gesehen hat. Dasselbe gilt für das 6-2, das in Future 1 eingeführt wird. Erreichen sie die Stufe, auf der dieses System offiziell ist, verstehen sie es bereits von innen, und die Saison dient dazu, es besser zu spielen statt es zu entdecken.<br><br>Wenn eine Zeile von einer Spalte zur nächsten zwei Stufen überspringt, hat das immer denselben Grund: Auf dieser Stufe ist dieses System das offizielle, und eine ganze Saison im Wettkampf leistet die Arbeit des Einführens und Entwickelns von selbst.",
 b2p:"Hier wird die von Swiss Volley vorgegebene Systemabfolge deutlich sichtbar: 3:3, dann 4:4 mit Penetration aus Position 1, dann ganzes Feld mit 6-6, anschliessend 6-2 und schliesslich 5-1.",
 b3:"Athletik-Stufen: nach Reifegrad, nicht nach Alter",
 b3p:"Zwei Jugendliche derselben Stufe können biologisch drei Jahre auseinanderliegen, und Mädchen reifen früher als Jungen. Deshalb wird Athletik nicht nach Stufe zugeteilt, sondern nach Reifegrad. Die Stufe legt sich darüber, aber massgebend ist der Körper. Es ist dieselbe Logik, mit der Swiss Volley das Spielniveau vom kalendarischen Alter entkoppelt hat.",
 b3d:"So wird eine Person eingeordnet: Körpergrösse alle drei Monate messen. Ein deutlicher Sprung zeigt den Wachstumsschub an. Es braucht keine Ausrüstung, nur Konstanz.",
 esc:[
  {t:"Stufe 1 — Vor dem Wachstumsschub",w:"Überwiegt im Kids Volley und in Rookie 1",c:"#FAE149",l:[
   "Koordination, Agilität und Gleichgewicht. Das goldene Fenster, um Bewegen zu lernen.",
   "Kraft ausschliesslich mit dem eigenen Körpergewicht und in Spielform.",
   "Tiefe Sprünge mit Fokus auf die Landung, nicht auf die Höhe.",
   "Keine externen Lasten, keine wiederholte Maximalintensität.",
   "Mehrere Sportarten werden aktiv empfohlen."]},
  {t:"Stufe 2 — Während des Wachstumsschubs",w:"Häufig in Rookie 2 und 3 · bei den Frauen früher",c:"#F26A4F",l:[
   "Die risikoreichste Stufe: Während des Schubs arbeitet die Patellasehne nahe an ihrer Toleranzgrenze.",
   "Das Sprungvolumen wird <em>gesenkt</em>, nicht erhöht. Widersprüchlich und entscheidend.",
   "Exzentrische Kraft und Landungskontrolle: die absolute Priorität.",
   "Hebetechnik mit Stab oder leerer Stange. Die Bewegung wird gelernt, nicht belastet.",
   "Beweglichkeit: Der Knochen wächst vor dem Muskel, alles wird zu kurz.",
   "Hohe Toleranz gegenüber Unbeholfenheit. Sie ist vorübergehend und vorhersehbar."]},
  {t:"Stufe 3 — Nach dem Wachstumsschub",w:"Üblich ab Future 1 · bei den Frauen früher",c:"#0E2A8A",l:[
   "Das Kraftfenster ist offen: Jetzt progressive Belastung.",
   "Strukturierte Plyometrie und Schnellkraftarbeit.",
   "Individuelle Programmierung mit Belastungssteuerung.",
   "Bei Spielerinnen bleibt neuromuskuläres Training Pflicht: In diesem Abschnitt schützt es wirklich."]}],
