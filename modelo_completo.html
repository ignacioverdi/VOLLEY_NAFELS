const OBJ_LVL = {es:[
{n:1,meta:"Que conduzca el juego y sostenga su nivel cuando el partido aprieta.",
 tec:[
 {t:"Ejecutar igual en el tercer set que en el calentamiento",d:"El nivel técnico real de un jugador no es el que muestra fresco: es el que sostiene con las piernas cansadas y el marcador en contra. Se entrena empezando ejercicios en desventaja a propósito, con series al final de la sesión y con consecuencia por el error. Incluye recepción, armado y ataque bajo fatiga, y la capacidad de repetir el mismo gesto cuando el cuerpo pide acortarlo."},
 {t:"Distribuir con plan, no por costumbre",d:"Elegir atacante según la rotación en la que está el equipo y según el bloqueo que tiene enfrente, no según quién pide más fuerte. Requiere conocer el porcentaje de cada atacante contra bloqueo formado y saber qué rotación del rival es la más débil. Se trabaja con el video de la semana y una hoja simple con la distribución prevista por rotación."},
 {t:"Resolver contra bloqueo formado",d:"A este nivel el bloqueo llega siempre, así que pegar fuerte deja de alcanzar. Incluye las tres herramientas completas: usar las manos del bloqueo, atacar la costura entre los dos bloqueadores, y la finta larga detrás. Se entrena con bloqueo real y puntuando la decisión, no el punto."},
 {t:"Sostener el saque agresivo en los puntos que definen",d:"Cualquiera saca fuerte a 10-5. Lo que define es el saque a 23 iguales. Se trabaja con series al final del entrenamiento, cansados, con una tasa de error acordada por jugador y con consecuencia cuando se afloja. El lanzamiento tiene que ser idéntico al del primer saque del partido."},
 {t:"Transición inmediata después del bloqueo",d:"Aterrizar equilibrado, girar hacia la pelota, salir tres metros de la red y recién ahí correr. Es la diferencia más grande entre un juvenil y un jugador de mayores, y casi nunca se entrena. Todo ejercicio de bloqueo y defensa tiene que terminar en un ataque, sin excepción."}],
 tac:[
 {t:"Sistema 5-1 completo",d:"Las seis rotaciones con sus coberturas y transiciones, con una sola armadora. Incluye qué hacer cuando la armadora tiene que defender, quién arma en su lugar, y cómo se reacomoda el ataque en esa rotación. Es el sistema que va a encontrar en cualquier liga de mayores."},
 {t:"Plan de partido propio",d:"Que llegue a la cancha con algo preparado: dos o tres cosas concretas del rival que vio en video y que puede aplicar. No es scouting profesional, es una hoja con tres puntos que el jugador entiende y usa."},
 {t:"Ajustar sin que el entrenador lo pida",d:"Reconocer qué está pasando en el partido y cambiar algo por decisión propia, y poder explicar por qué lo cambió. Se entrena preguntando «¿qué viste?» antes de dar la solución, durante toda la temporada."},
 {t:"Controlar el ritmo del partido",d:"Saber cuándo acelerar y cuándo frenar, cuándo pedir un balón alto para dar aire al equipo y cuándo arriesgar. Es una habilidad de conducción y se desarrolla dándole al jugador la responsabilidad de decidirlo en los entrenamientos con marcador."},
 {t:"Entrar a la estructura no es el logro",d:"La frase es del documento federal francés y conviene tenerla escrita para la conversación con el jugador y con la familia: pertenecer a una selección o a un polo <strong>no es una finalidad en sí misma, sino un medio funcional</strong> para alcanzar el objetivo deportivo propio. Un L1 que entra al Talentpool y cree que ya llegó, se detiene ahí. El marco francés se apoya en tres patas —deportiva, escolar y personal— y ninguna sustituye a las otras."},
 {t:"Sostener a un compañero en una mala racha",d:"El liderazgo en la cancha no es gritar: es hacerse cargo del punto siguiente cuando otro se cayó. Va de la mano con la regla de no buscar culpables: el que recibe mal no se comenta, se cubre."}],
 next:"Ya está en el techo formativo. Lo que sigue es competir en el primer equipo."},

{n:2,meta:"Que resuelva contra oposición organizada y empiece a decidir solo.",
 tec:[
 {t:"Dos direcciones desde el mismo impulso",d:"Diagonal, línea y finta saliendo de una carrera idéntica. Es lo que impide que el bloqueo rival lea la intención antes del salto. Incluye trabajo de muñeca y de punto de contacto, y se corrige filmando las tres opciones: cuando el jugador se ve cambiando la carrera, lo entiende al instante."},
 {t:"Bloqueo lector",d:"Pasar de reaccionar a anticipar: mirar el primer contacto, después al armador, y decidir antes del salto. Se entrena obligando a cantar en voz alta qué van a hacer antes de que la armadora toque, y puntuando la decisión aunque el bloqueo salga mal."},
 {t:"Ataque de zaga",d:"Carrera desde detrás de la línea de tres metros, con despegue antes de la línea y contacto alto. Es un ataque de tiempo más lento que el de punta, así que el atacante arranca antes y el armador levanta más adelante en la red. El error típico es arrancar tarde y pisar: se corrige con una marca en el piso un metro más atrás que obliga a salir antes. Incluye la coordinación con el armado, que es distinta a la del ataque de punta."},
 {t:"Saque en salto o saque de arriba con zona",d:"El lanzamiento es el noventa por ciento del saque en salto, así que se entrena por separado: series de solo lanzamiento con una marca en el piso, sin golpear. Después se suma la carrera y recién al final el golpe. Si el jugador todavía no tiene el cuerpo para el salto, el objetivo equivalente es el saque de arriba agresivo con zona elegida."},
 {t:"Tiempos de ataque",d:"Brasil los abre recién en la fase de rendimiento y en este orden: ataque por entrada y por salida, después media bola en el medio, y después tiempo de frente. Cada tiempo obliga al atacante a arrancar antes y al armador a acortar la trayectoria, y es lo que empieza a romper el bloqueo rival. El ataque de zaga viene después de todos ellos."},
 {t:"Armar con contrato",d:"Cada atacante define con el armador la altura, la distancia a la red y la velocidad de su pelota, y se escribe. Después se repite hasta que sale sin pensarlo. La descoordinación entre armador y atacante casi nunca es técnica: es que nunca se pusieron de acuerdo."}],
 tac:[
 {t:"Sistema 6-2 completo",d:"Dos armadoras que arman desde zaga y atacan cuando rotan adelante, con tres atacantes siempre en la red. Incluye las coberturas, que cambian en cada rotación y son lo que más se descuida de este sistema."},
 {t:"Leer al armador rival",d:"Mirar el primer contacto del rival y después al armador, y acomodar la posición antes de que la pelota salga. Se trabaja en el bloqueo y en la defensa al mismo tiempo, porque la información es la misma."},
 {t:"Reconocer y ajustar en partido",d:"Darse cuenta de que el rival está atacando siempre por el mismo lado, o de que el bloqueo está llegando tarde, y cambiar algo. Empieza acá y se consolida en L1."},
 {t:"La carrera dual se organiza, no se improvisa",d:"Es el level donde la escuela y el vóley empiezan a chocar de verdad. Polonia lo resuelve con escuelas deportivas de diez horas semanales de entrenamiento contra tres de educación física; Francia con polos de dieciséis horas y horario escolar adaptado, evaluados por el ministerio. Nuestro instrumento equivalente es la Talent Card de Swiss Olympic, y existe justamente para que la escuela acomode el horario. Casi nadie la pide."},
 {t:"Usar video",d:"Un clip corto por semana, treinta segundos, con una sola cosa para corregir. Más que eso no se aplica. Apoyado en el sistema de datos que el club ya tiene en el primer equipo."},
 {t:"Dirigir una serie vos mismo",d:"En Japón el entrenamiento lo dirigen principalmente los capitanes y la mayoría de los ejercicios los manejan los jugadores. Una serie por semana dirigida por un jugador desde este level: él la organiza, él corrige y él sostiene el ritmo mientras el entrenador mira. Es la forma más barata de construir el pensamiento táctico que este level tiene que producir."},
 {t:"Coberturas y transiciones del 6-2",d:"Con tres atacantes en red, quién cubre cambia en cada rotación. Es lo que decide los rallies largos y lo que menos se entrena."}],
 next:"Para llegar a L1: sostener todo esto con el marcador en contra y en el tercer set."},

{n:3,meta:"Que sostenga la jugada completa con oposición real y deje de depender del entrenador dentro del punto.",
 tec:[
 {t:"Recepción en sistema contra saque de competencia",d:"«En sistema» significa que el armador puede jugar el segundo balón sin moverse más de un paso y con las tres opciones de ataque abiertas. El objetivo es que la mitad de las recepciones queden así. Se entrena siempre con saque real, nunca con pelota lanzada, y con desplazamiento: la plataforma se forma antes de que llegue la pelota y los hombros dirigen al armador. Si el ejercicio se ve bien es porque el saque está flojo. Brasil trabaja la recepción de cinco jugadores en formación W o M en toda la fase de desarrollo, con un motivo explícito: repartir la cancha en partes iguales para que todos reciban y <strong>nadie se esconda</strong>, porque la recepción es la habilidad más difícil del vóley y la que más se evita."},
 {t:"Penetración desde zona 1",d:"Salir cuando el saque rival cruza la red, no cuando la recepción ya salió; recorrido recto hacia la zona 2-3; y el último paso es de freno. El error universal es salir tarde y compensar corriendo: llegan al balón pero llegan en movimiento. Se entrena sin pelota, cronometrado contra el saque, mirando solo los pies."},
 {t:"Sostener la carrera cuando el armado no es perfecto",d:"En este level el ritmo ya está; lo que se entrena es no cambiarlo cuando la pelota viene corta o separada. El paso largo de freno se hace con la pierna contraria al brazo que golpea, y es el que convierte la carrera horizontal en salto vertical: si se acorta, el jugador termina saltando hacia adelante y pegándole a la red. La dirección se decide antes del salto, no en el aire, y eso se corrige preguntando adónde apuntó, no cuán fuerte pegó."},
 {t:"Saque de arriba con 7 de 10 y zona cantada",d:"Primero la constancia, después la zona. Se mide en series de diez con registro, para que cada jugador conozca su número. Sin una tasa de error acordada, todos sacan flojo para no fallar."},
 {t:"Armado de espaldas",d:"Brasil lo pone como paso explícito de la progresión: primero se arma solo de frente, después de frente y de espaldas, y recién al final libre. Sin el armado de espaldas el equipo es previsible, porque el bloqueo rival sabe que la pelota va siempre hacia donde mira el armador. Se entrena con el mismo criterio que el de frente: impulso de piernas y el arco de la espalda dando la dirección, no los brazos."},
 {t:"Bloqueo con manos sobre la red y orientadas al campo",d:"Manos penetrando por encima de la cinta, pulgares arriba y palmas giradas hacia adentro de la cancha rival: un bloqueo que mira al techo devuelve la pelota afuera y no suma. El salto es vertical y sale después del despegue del atacante, no junto con él. El desplazamiento termina antes del salto: el error más común es saltar todavía moviéndose de costado y desarmarse en el aire."}],
 tac:[
 {t:"Penetración en las seis rotaciones",d:"Sin excepciones. Se canta la rotación antes de cada punto hasta que sale solo. Todo el sistema posterior se apoya en esto."},
 {t:"Sistema 6-6: todos arman",d:"Cuando la pelota no llega al armador, arma el que esté más cerca. Incluye el armado con manchette cuando no se llega con las manos. Se entrena con registro de cuántas veces armó cada uno."},
 {t:"El club y la estructura regional no se eligen",d:"En los polos franceses las jugadoras entrenan de lunes a viernes en la estructura federal y <strong>vuelven a su club el viernes</strong> para entrenar y competir el fin de semana, con la licencia siempre en el club de origen. Cuando un jugador nuestro entra a la sichtung de GSGL no lo perdemos: es la misma relación. Vale decírselo al jugador y a la familia antes de que alguien lo interprete como una despedida."},
 {t:"Cubrir al atacante siempre",d:"Si uno ataca, los demás acompañan a dos metros, cuerpo bajo y manos abiertas, mirando el bloqueo y no la pelota. Es la conducta que más rallies largos gana y la más barata de instalar."},
 {t:"Arrancar según el primer contacto",d:"El atacante empieza la carrera por lo que ve en la recepción, no cuando el armador ya tocó. Si espera, llega tarde a todo lo que no sea pelota alta."},
 {t:"La defensa y el control como decisión",d:"Japón explica su nivel diciendo que sus jugadores son más bajos y que por eso pusieron la defensa y el control de pelota por encima de todo. En este level se decide si un jugador va a la pelota o espera a ser lo bastante alto. El que no gana por altura gana porque la pelota no toca el piso."},
 {t:"Empezar a leer al armador rival",d:"Introducción: mirar dónde está el primer contacto y cómo está orientado el cuerpo del armador. No se le pide acertar todavía, se le pide mirar."}],
 next:"Para llegar a L2: decidir antes del salto y sumar una segunda dirección de ataque."},

{n:4,meta:"Que sostenga bajo presión lo que ya hace bien con pelota cómoda.",
 tec:[
 {t:"Recepción contra saque de competencia",d:"Es el salto que define este level. El jugador ya recibe bien la pelota lanzada; ahora tiene que sostenerlo contra el saque del sábado. Nunca bajar la intensidad del saque para que el ejercicio salga mejor: si hace falta, se le baja la zona, no la velocidad."},
 {t:"Armar en desplazamiento",d:"Llegar y jugar sin que la pelota salga plana. La pelota plana significa que llegó sin piernas: el impulso sale de la extensión, no de los brazos. Se entrena recibiendo siempre en movimiento, nunca armando parado."},
 {t:"Estabilizar la carrera de tres pasos",d:"El mismo ritmo cada vez: orientación, freno y paso de cierre. Si el jugador está en pico de crecimiento la carrera se va a desarmar de manera temporal y previsible, y ahí se sostiene la técnica en vez de exigir más. Marca en el piso para el paso de freno."},
 {t:"Contacto arriba y adelante",d:"El error más común del level es golpear con la pelota atrás de la cabeza, que limita todo lo que viene después. Se corrige con ataque desde un cajón bajo para aislar el brazo, y con autopases antes de sumar el armado."},
 {t:"Saque de arriba que elija zona",d:"Ya entra; ahora tiene que caer donde se decidió. Dos zonas marcadas y que cante cuál antes de sacar. El objetivo no es el ace, es empezar el punto a favor."}],
 tac:[
 {t:"Construir tres toques también cuando se complica",d:"Con pelota fácil ya lo hacen. La conducta que hay que sacar es devolver de primera cuando el punto se pone difícil, y se saca con la regla del ejercicio —el punto no cuenta si no hubo tres— y no con el reto. Brasil la convierte en regla de competencia: en toda la fase de iniciación está <strong>prohibida la pelota de primera</strong>. No es una consigna del entrenador, es el reglamento el que produce la conducta."},
 {t:"Acompañar al que ataca, siempre",d:"Sin que se lo recuerden. Se instala como regla del juego reducido y no como ejercicio aislado."},
 {t:"Resolver la zona de conflicto",d:"La pelota entre dos es del que se mueve hacia adentro de la cancha; el otro canta y se abre. Es un acuerdo, no una habilidad: se define antes de la temporada y no se cambia."},
 {t:"Volver a la posición",d:"Después de cada acción se vuelve al lugar. Sin esto el equipo se convierte en gente persiguiendo la pelota."},
 {t:"Saber la rotación y quién arma",d:"Antes del saque, que el equipo sepa en qué rotación está y quién penetra. Se dice en voz alta hasta que salga solo."},
 {t:"Competir seguido, y que el error no cueste",d:"Polonia sostiene que la exposición temprana a la competencia, en un ambiente que la banca, es lo que enseña a manejar la presión y a recuperarse del error. Es el level donde eso se instala. Y la advertencia que va con esto: es exactamente la edad donde el efecto de la edad relativa decide quién sigue, así que antes de bajar a alguien de level, mirá su fecha de nacimiento."}],
 next:"Para llegar a L3: que la técnica no se caiga cuando aparece el saque de competencia."},

{n:5,meta:"Que el rally exista: que la pelota sobreviva al primer contacto.",
 tec:[
 {t:"Llevar la plataforma a la pelota con los pies",d:"Casi todo lo que parece error de brazos a este level es error de pies. El jugador estira los brazos desde donde está en vez de moverse. Se corrige con juegos donde la pelota siempre cae lejos, obligando a desplazarse, y pidiendo que llegue quieto antes de tocar."},
 {t:"Manos arriba y adelante de la cara, formando la ventana",d:"Pulgares e índices formando un triángulo por el que el jugador mira la pelota, manos separadas y dedos firmes pero no rígidos. Se colocan antes de que la pelota llegue, no cuando ya está encima. Si el jugador no ve la pelota a través de las manos, están mal puestas. Empieza con autopases suaves antes de cualquier pelota que venga de otro."},
 {t:"Golpear con la mano abierta, envolviendo la pelota",d:"El contacto empieza con el talón de la mano y termina con los dedos cerrándose sobre la pelota: ese latigazo de muñeca es lo que le da dirección y lo que hace que la pelota caiga dentro. Brazo estirado y contacto adelante del cuerpo, nunca al costado ni atrás. Se trabaja primero de pie con autoelevación, para que controle la pelota antes de sumar la carrera."},
 {t:"Caer sobre los dos pies con la rodilla alineada",d:"Se entrena desde el primer día y todos los días, dentro del juego de entrada. A esta edad no duele, y por eso justamente hay que corregirlo ahora: la rodilla que se va hacia adentro al caer es el gesto que después lesiona."},
 {t:"Saque que entre a la cancha",d:"Con el gesto que le salga: de abajo está perfecto. La clave es que la pelota se sostiene con la otra mano hasta el golpe en vez de lanzarla al aire, que es de donde salen casi todos los errores a esta edad. El brazo va como un péndulo y el cuerpo acompaña hacia adelante. El objetivo es que el punto empiece, no que el saque sea bonito. Brasil directamente prohíbe el saque de arriba en toda la fase de iniciación, y el motivo de sus entrevistados es contundente: si se permite, un solo chico que saca fuerte termina el partido solo y los demás dejan de jugar."}],
 tac:[
 {t:"Nadie espera en una fila",d:"John Kessel, treinta años director de desarrollo de USA Volleyball, escribió su manual de minivóley para programas con doce a treinta y seis chicos y un solo entrenador, que es exactamente esta situación. Su regla: quien está parado en una fila esperando una pelota del entrenador no aprende nada y además le saca un contacto a otro. Varias pelotas, grupos de dos o tres, y si hay más de cuatro esperando, el ejercicio está mal armado."},
 {t:"Pedir la pelota en voz alta",d:"Antes de tocarla, no mientras. A esta edad todavía no da vergüenza gritar, así que se instala acá o no se instala nunca."},
 {t:"Entender que se juega en tres toques",d:"Y que devolver de primera, aunque funcione hoy, es lo que hay que sacar. Se sostiene con la regla del juego."},
 {t:"Ir a la pelota que es suya",d:"Y no ir a la que no lo es. Cada uno tiene una zona y una responsabilidad."},
 {t:"Volver a la posición",d:"Después de cada acción. Sin esto, el 3:3 se convierte en tres chicos persiguiendo una pelota."},
 {t:"Jugar con el compañero",d:"Construir con el otro en vez de resolver solo. Es la primera idea de equipo que entienden y la base de todo lo demás. Polonia lo lleva al extremo con casi cuarenta y siete mil chicos jugando 1:1, 2:2, 3:3 y 4:4 en cancha reducida: cuantos menos hay en la cancha, más veces tiene que resolver cada uno y más rápido aparece la idea de construir."}],
 next:"Para llegar a L4: que la recepción llegue al armador y la jugada de tres aparezca sola."}]};

OBJ_LVL.de = [
{n:1,meta:"Dass sie das Spiel führt und ihr Niveau hält, wenn es eng wird.",
 tec:[
 {t:"Im dritten Satz gleich ausführen wie im Einlaufen",d:"Das echte technische Niveau zeigt sich nicht frisch, sondern mit müden Beinen und bei Rückstand. Trainiert wird, indem Übungen absichtlich im Rückstand beginnen, Serien ans Ende der Einheit gelegt werden und der Fehler eine Konsequenz hat. Umfasst Annahme, Zuspiel und Angriff unter Ermüdung und die Fähigkeit, dieselbe Bewegung zu wiederholen, wenn der Körper sie abkürzen will."},
 {t:"Mit Plan verteilen, nicht aus Gewohnheit",d:"Die Angreiferin nach der Rotation wählen und nach dem Block, der gegenübersteht, nicht danach, wer am lautesten ruft. Dafür braucht es die Quote jeder Angreiferin gegen formierten Block und das Wissen, welche gegnerische Rotation die schwächste ist. Gearbeitet wird mit dem Wochenvideo und einem einfachen Blatt mit der geplanten Verteilung pro Rotation."},
 {t:"Gegen formierten Block lösen",d:"Auf diesem Niveau steht der Block immer, also reicht hart schlagen nicht mehr. Umfasst alle drei Werkzeuge: die Hände des Blocks nutzen, die Naht zwischen den zwei Blockenden angreifen und den langen Lob dahinter. Trainiert wird mit echtem Block, und gewertet wird die Entscheidung, nicht der Punkt."},
 {t:"Das aggressive Service in den entscheidenden Punkten halten",d:"Bei 10:5 serviert jede hart. Entscheidend ist das Service bei 23:23. Gearbeitet wird mit Serien am Ende des Trainings, müde, mit einer pro Person vereinbarten Fehlerquote und mit Konsequenz, wenn nachgelassen wird. Der Wurf muss identisch sein mit dem beim ersten Service des Spiels."},
 {t:"Sofortiger Übergang nach dem Block",d:"Ausgeglichen landen, zum Ball drehen, drei Meter vom Netz weggehen und erst dann anlaufen. Es ist der grösste Unterschied zwischen Nachwuchs und Aktiven und wird fast nie trainiert. Jede Block- und Abwehrübung muss in einem Angriff enden, ohne Ausnahme."}],
 tac:[
 {t:"Vollständiges System 5-1",d:"Alle sechs Rotationen mit ihren Sicherungen und Übergängen, mit einer einzigen Zuspielerin. Umfasst, was zu tun ist, wenn die Zuspielerin verteidigen muss, wer dann zuspielt und wie sich der Angriff in dieser Rotation neu ordnet. Es ist das System jeder Aktivliga."},
 {t:"Eigener Matchplan",d:"Dass sie mit etwas Vorbereitetem auf das Feld kommt: zwei oder drei konkrete Dinge über den Gegner, die sie im Video gesehen hat und anwenden kann. Kein professionelles Scouting, sondern ein Blatt mit drei Punkten, das die Person versteht und nutzt."},
 {t:"Anpassen, ohne dass die Trainerperson es verlangt",d:"Erkennen, was im Spiel passiert, aus eigenem Entscheid etwas ändern und erklären können warum. Trainiert wird, indem man die ganze Saison «Was hast du gesehen?» fragt, bevor man die Lösung gibt."},
 {t:"Das Tempo des Spiels steuern",d:"Wissen, wann beschleunigt und wann verlangsamt wird, wann ein hoher Ball der Mannschaft Luft verschafft und wann Risiko angebracht ist. Es ist eine Führungsfähigkeit und entsteht, wenn man der Person im Training mit Resultat die Verantwortung dafür gibt."},
 {t:"Der Eintritt in die Struktur ist nicht die Leistung",d:"Der Satz stammt aus dem französischen Verbandsdokument und lohnt sich für das Gespräch mit der Person und der Familie: Die Zugehörigkeit zu einer Nationalmannschaft oder einem Zentrum <strong>ist kein Selbstzweck, sondern ein funktionales Mittel</strong>, um das eigene sportliche Ziel zu erreichen. Wer auf L1 in den Talentpool kommt und glaubt, angekommen zu sein, bleibt dort stehen. Der französische Rahmen steht auf drei Beinen — sportlich, schulisch und persönlich — und keines ersetzt die anderen."},
 {t:"Eine Mitspielerin durch eine schwache Phase tragen",d:"Führung auf dem Feld heisst nicht rufen, sondern den nächsten Punkt übernehmen, wenn eine andere eingebrochen ist. Gehört zur Regel, keine Schuldigen zu suchen: Wer schlecht annimmt, wird nicht kommentiert, sondern gedeckt."}],
 next:"Sie ist am oberen Ende der Ausbildung. Was folgt, ist der Wettkampf in der ersten Mannschaft."},

{n:2,meta:"Dass sie gegen organisierten Widerstand löst und beginnt, selbst zu entscheiden.",
 tec:[
 {t:"Zwei Richtungen aus demselben Anlauf",d:"Diagonal, longline und Lob aus einem identischen Anlauf. Genau das verhindert, dass der gegnerische Block die Absicht vor dem Sprung liest. Umfasst Handgelenksarbeit und Trefferpunkt, und korrigiert wird mit Video der drei Varianten: Wenn die Person sich selbst den Anlauf verändern sieht, versteht sie es sofort."},
 {t:"Lesender Block",d:"Vom Reagieren zum Antizipieren: den ersten Kontakt ansehen, dann die Zuspielerin, und vor dem Sprung entscheiden. Trainiert wird, indem laut angesagt werden muss, was man tun wird, bevor die Zuspielerin den Ball berührt, und indem die Entscheidung gewertet wird, auch wenn der Block misslingt."},
 {t:"Hinterfeldangriff",d:"Anlauf von hinter der Drei-Meter-Linie, Absprung vor der Linie und hoher Kontakt. Es ist ein langsamerer Angriff als der über aussen, also startet die Angreiferin früher und die Zuspielerin spielt weiter vorne am Netz. Der typische Fehler ist zu spätes Starten und Übertreten: Eine Bodenmarkierung einen Meter weiter hinten erzwingt den frühen Start."},
 {t:"Sprungservice oder Service von oben mit Zone",d:"Der Wurf ist neunzig Prozent des Sprungservices, also wird er getrennt trainiert: Serien nur mit Wurf und einer Bodenmarkierung, ohne Schlag. Danach kommt der Anlauf dazu und erst zuletzt der Schlag. Hat die Person den Körper für den Sprung noch nicht, lautet das gleichwertige Ziel: aggressives Service von oben mit gewählter Zone."},
 {t:"Angriffstempi",d:"Brasilien öffnet sie erst in der Leistungsphase und in dieser Reihenfolge: Angriff über aussen und über die Position 2, dann der schnelle Ball in der Mitte, dann das Tempo vor der Zuspielerin. Jedes Tempo zwingt die Angreiferin, früher zu starten, und die Zuspielerin, die Flugbahn zu verkürzen, und genau das beginnt den gegnerischen Block zu brechen. Der Hinterfeldangriff kommt nach allen davon."},
 {t:"Zuspiel mit Abmachung",d:"Jede Angreiferin legt mit der Zuspielerin Höhe, Abstand zum Netz und Tempo ihres Balls fest, und es wird aufgeschrieben. Danach wird wiederholt, bis es ohne Nachdenken kommt. Die Abstimmung zwischen Zuspiel und Angriff scheitert fast nie an der Technik, sondern daran, dass man sich nie geeinigt hat."}],
 tac:[
 {t:"Vollständiges System 6-2",d:"Zwei Zuspielerinnen, die aus dem Hinterfeld zuspielen und angreifen, sobald sie nach vorne rotieren, mit immer drei Angreiferinnen am Netz. Umfasst die Sicherungen, die sich in jeder Rotation ändern und an diesem System am meisten vernachlässigt werden."},
 {t:"Die gegnerische Zuspielerin lesen",d:"Den ersten Kontakt des Gegners ansehen, dann die Zuspielerin, und die Position anpassen, bevor der Ball weg ist. Wird im Block und in der Abwehr gleichzeitig erarbeitet, weil die Information dieselbe ist."},
 {t:"Im Spiel erkennen und anpassen",d:"Merken, dass der Gegner immer über dieselbe Seite angreift, oder dass der Block zu spät kommt, und etwas ändern. Beginnt hier und wird in L1 gefestigt."},
 {t:"Die duale Laufbahn wird organisiert, nicht improvisiert",d:"Auf diesem Level geraten Schule und Volleyball wirklich in Konflikt. Polen löst es mit Sportschulen mit zehn Trainingsstunden pro Woche gegenüber drei Stunden Sportunterricht; Frankreich mit Zentren mit sechzehn Stunden und angepasstem Stundenplan, vom Ministerium evaluiert. Unser entsprechendes Instrument ist die Talent Card von Swiss Olympic, und sie existiert genau dafür, dass die Schule den Stundenplan anpasst. Fast niemand beantragt sie."},
 {t:"Video nutzen",d:"Ein kurzer Clip pro Woche, dreissig Sekunden, mit genau einer Sache zum Korrigieren. Mehr wird nicht umgesetzt. Gestützt auf das Datensystem, das der Verein in der ersten Mannschaft bereits hat."},
 {t:"Eine Serie selbst leiten",d:"In Japan wird das Training hauptsächlich von den Captains geleitet, und die meisten Übungen führen die Spielenden. Eine Serie pro Woche, ab diesem Level von einer Spielerin geleitet: Sie organisiert, sie korrigiert und sie hält den Rhythmus, während die Trainerperson zuschaut. Es ist der günstigste Weg, das taktische Denken aufzubauen, das dieses Level erzeugen soll."},
 {t:"Sicherungen und Übergänge im 6-2",d:"Mit drei Angreiferinnen am Netz wechselt in jeder Rotation, wer sichert. Das entscheidet die langen Ballwechsel und wird am wenigsten trainiert."}],
 next:"Für L1: all das auch bei Rückstand und im dritten Satz halten."},

{n:3,meta:"Dass sie den vollständigen Spielzug gegen echten Widerstand hält und im Ballwechsel nicht mehr von der Trainerperson abhängt.",
 tec:[
 {t:"Annahme im System gegen Wettkampfservice",d:"«Im System» heisst, dass die Zuspielerin den zweiten Ball spielen kann, ohne sich mehr als einen Schritt zu bewegen, und dass alle drei Angriffsoptionen offen sind. Ziel ist, dass die Hälfte der Annahmen so ankommt. Brasilien arbeitet in der gesamten Entwicklungsphase mit einer Annahme zu fünft in W- oder M-Formation, mit ausdrücklicher Begründung: das Feld in gleiche Teile aufteilen, damit alle annehmen und sich <strong>niemand versteckt</strong>, denn die Annahme ist die schwierigste Fähigkeit im Volleyball und die, der am meisten ausgewichen wird."},
 {t:"Penetration aus Position 1",d:"Starten, wenn das gegnerische Service das Netz überquert, nicht wenn die Annahme schon weg ist; gerader Weg in die Zone 2-3; und der letzte Schritt ist ein Bremsschritt. Der universelle Fehler ist zu spätes Starten und Ausgleichen mit Tempo: Sie erreichen den Ball, kommen aber in Bewegung an. Trainiert wird ohne Ball, getaktet gegen das Service, mit Blick nur auf die Füsse."},
 {t:"Den Anlauf halten, wenn das Zuspiel nicht perfekt ist",d:"Auf diesem Level steht der Rhythmus bereits; trainiert wird, ihn nicht zu verändern, wenn der Ball kurz oder abgesetzt kommt. Der lange Bremsschritt erfolgt mit dem Bein gegenüber dem Schlagarm und wandelt den horizontalen Anlauf in einen vertikalen Sprung: Wird er verkürzt, springt die Person nach vorne und schlägt ins Netz."},
 {t:"Service von oben, 7 von 10, mit angesagter Zone",d:"Zuerst die Konstanz, dann die Zone. Gemessen wird in Zehnerserien mit Erfassung, damit jede Person ihre Zahl kennt. Ohne vereinbarte Fehlerquote servieren alle zu vorsichtig."},
 {t:"Zuspiel nach hinten",d:"Brasilien setzt es als ausdrücklichen Schritt der Progression: zuerst nur nach vorne zuspielen, dann nach vorne und nach hinten, und erst zuletzt frei. Ohne das Zuspiel nach hinten ist die Mannschaft vorhersehbar, weil der gegnerische Block weiss, dass der Ball immer dorthin geht, wohin die Zuspielerin schaut. Trainiert wird mit demselben Kriterium wie nach vorne: Impuls aus den Beinen, und die Richtung kommt aus der Rückenspannung, nicht aus den Armen."},
 {t:"Block mit Händen über dem Netz und zum Feld ausgerichtet",d:"Hände über der Netzkante penetrierend, Daumen oben und Handflächen ins gegnerische Feld gedreht: Ein Block, der zur Decke schaut, spielt den Ball ins Aus und bringt nichts. Der Sprung ist vertikal und erfolgt nach dem Absprung der Angreiferin, nicht gleichzeitig. Die Verschiebung endet vor dem Sprung: Der häufigste Fehler ist, noch in der Seitwärtsbewegung zu springen und in der Luft zu zerfallen."}],
 tac:[
 {t:"Penetration in allen sechs Rotationen",d:"Ohne Ausnahmen. Die Rotation wird vor jedem Punkt angesagt, bis es von selbst geht. Das gesamte spätere System stützt sich darauf."},
 {t:"System 6-6: alle spielen zu",d:"Erreicht der Ball die Zuspielerin nicht, spielt die Nächststehende zu. Umfasst das Zuspiel mit Manchette, wenn es mit den Händen nicht reicht. Trainiert wird mit Erfassung, wie oft jede zugespielt hat."},
 {t:"Verein und regionale Struktur sind keine Wahl",d:"In den französischen Zentren trainieren die Spielerinnen von Montag bis Freitag in der Verbandsstruktur und <strong>kehren am Freitag in ihren Verein zurück</strong>, um am Wochenende zu trainieren und zu spielen, mit der Lizenz stets im Stammverein. Wenn eine Person von uns zur GSGL-Sichtung geht, verlieren wir sie nicht: Es ist dieselbe Beziehung."},
 {t:"Die Angreiferin immer sichern",d:"Greift eine an, begleiten die anderen auf zwei Metern, tief und mit offenen Händen, den Blick auf dem Block und nicht auf dem Ball. Das Verhalten, das die meisten langen Ballwechsel gewinnt und am günstigsten zu installieren ist."},
 {t:"Nach dem ersten Kontakt starten",d:"Die Angreiferin beginnt den Anlauf nach dem, was sie in der Annahme sieht, nicht wenn die Zuspielerin schon berührt hat. Wer wartet, kommt bei allem ausser hohen Bällen zu spät."},
 {t:"Abwehr und Ballkontrolle als Entscheidung",d:"Japan begründet sein Niveau damit, dass seine Spielenden kleiner sind und es deshalb Abwehr und Ballkontrolle über alles stellte. Auf diesem Level entscheidet sich, ob eine Person zur Abwehr geht oder darauf wartet, gross genug zu werden. Wer nicht über die Grösse gewinnt, gewinnt darüber, dass der Ball nicht zu Boden fällt."},
 {t:"Beginnen, die gegnerische Zuspielerin zu lesen",d:"Einführung: schauen, wo der erste Kontakt ist und wie der Körper der Zuspielerin ausgerichtet ist. Richtig liegen wird noch nicht verlangt, hinschauen schon."}],
 next:"Für L2: vor dem Sprung entscheiden und eine zweite Angriffsrichtung dazunehmen."},

{n:4,meta:"Dass sie unter Druck hält, was mit bequemem Ball schon gelingt.",
 tec:[
 {t:"Annahme gegen Wettkampfservice",d:"Das ist der Sprung, der dieses Level definiert. Den zugeworfenen Ball nimmt die Person bereits gut an; jetzt muss sie das gegen das Service vom Samstag halten. Nie die Serviceintensität senken, damit die Übung besser aussieht: Wenn nötig, senkt man die Zone, nicht die Geschwindigkeit."},
 {t:"Zuspiel in der Verschiebung",d:"Ankommen und spielen, ohne dass der Ball flach herauskommt. Ein flacher Ball heisst, dass sie ohne Beine angekommen ist: Der Impuls stammt aus der Streckung, nicht aus den Armen. Trainiert wird, indem der Ball immer in Bewegung angenommen wird, nie im Stand zugespielt."},
 {t:"Den Dreischritt-Anlauf stabilisieren",d:"Jedes Mal derselbe Rhythmus: ausrichten, bremsen, schliessen. Steckt die Person im Wachstumsschub, zerfällt der Anlauf vorübergehend und vorhersehbar, und dann hält man die Technik, statt mehr zu verlangen. Bodenmarkierung für den Bremsschritt."},
 {t:"Kontakt oben und vor dem Körper",d:"Der häufigste Fehler dieses Levels ist der Schlag mit dem Ball hinter dem Kopf, was alles Folgende begrenzt. Korrigiert wird mit Angriff von einem tiefen Kasten, um den Arm zu isolieren, und mit Eigenzuspielen, bevor das Zuspiel dazukommt."},
 {t:"Service von oben mit Zonenwahl",d:"Es kommt bereits ins Feld; jetzt soll es dort landen, wo entschieden wurde. Zwei markierte Zonen, und die Zone wird vor dem Service angesagt. Das Ziel ist kein Ass, sondern den Ballwechsel zu unseren Gunsten zu eröffnen."}],
 tac:[
 {t:"Drei Kontakte auch dann, wenn es schwierig wird",d:"Mit einfachem Ball gelingt es bereits. Abzustellen ist das Direktrückspiel, sobald der Ballwechsel eng wird, und abgestellt wird es mit der Regel der Übung — der Punkt zählt nicht ohne drei Kontakte — und nicht mit einer Ermahnung. Brasilien macht daraus eine Wettkampfregel: In der gesamten Einführungsphase ist der <strong>Direktball über das Netz verboten</strong>. Es ist keine Anweisung der Trainerperson, sondern das Reglement erzeugt das Verhalten."},
 {t:"Die Angreiferin immer begleiten",d:"Ohne Erinnerung. Wird als Regel des Kleinfeldspiels installiert, nicht als isolierte Übung."},
 {t:"Die Konfliktzone lösen",d:"Der Ball zwischen zweien gehört der, die sich nach innen bewegt; die andere ruft und macht Platz. Es ist eine Abmachung, keine Fähigkeit: vor der Saison festgelegt und nicht mehr geändert."},
 {t:"Auf die Position zurück",d:"Nach jeder Aktion zurück an den Platz. Ohne das wird die Mannschaft zu Leuten, die dem Ball hinterherlaufen."},
 {t:"Rotation und Zuspielerin kennen",d:"Vor dem Service weiss die Mannschaft, in welcher Rotation sie steht und wer einläuft. Wird laut gesagt, bis es von selbst geht."},
 {t:"Oft wettkämpfen, und der Fehler darf nichts kosten",d:"Polen hält fest, dass frühe Wettkampferfahrung in einem tragenden Umfeld genau das ist, was den Umgang mit Druck und die Erholung vom Fehler lehrt. Auf diesem Level wird das verankert. Und die Warnung dazu: Es ist genau das Alter, in dem der Relative Alterseffekt entscheidet, wer weitermacht — bevor du also jemanden ein Level zurückstufst, schau auf das Geburtsdatum."}],
 next:"Für L3: dass die Technik nicht zerfällt, sobald das Wettkampfservice auftaucht."},

{n:5,meta:"Dass der Ballwechsel überhaupt entsteht: dass der Ball den ersten Kontakt überlebt.",
 tec:[
 {t:"Das Spielbrett mit den Füssen zum Ball bringen",d:"Fast alles, was auf diesem Level wie ein Armfehler aussieht, ist ein Fussfehler. Die Person streckt die Arme von dort aus, wo sie steht, statt sich zu bewegen. Korrigiert wird mit Spielen, in denen der Ball immer weit weg fällt, und mit der Vorgabe, ruhig anzukommen, bevor berührt wird."},
 {t:"Hände oben und vor dem Gesicht, als Fenster",d:"Daumen und Zeigefinger bilden ein Dreieck, durch das die Person den Ball ansieht, Hände getrennt und Finger fest, aber nicht steif. Sie werden gestellt, bevor der Ball ankommt, nicht wenn er schon da ist. Sieht die Person den Ball nicht durch die Hände, stehen sie falsch."},
 {t:"Mit offener Hand schlagen und den Ball umschliessen",d:"Der Kontakt beginnt mit dem Handballen und endet mit den Fingern, die sich über den Ball schliessen: Dieser Peitschenschlag aus dem Handgelenk gibt Richtung und sorgt dafür, dass der Ball ins Feld fällt. Gestreckter Arm und Kontakt vor dem Körper, nie seitlich oder dahinter. Zuerst im Stand mit Eigenzuspiel, damit sie den Ball kontrolliert, bevor der Anlauf dazukommt."},
 {t:"Auf zwei Füssen mit ausgerichtetem Knie landen",d:"Wird ab dem ersten Tag und täglich trainiert, im Einstiegsspiel. In diesem Alter tut es nicht weh, und genau deshalb wird es jetzt korrigiert: das nach innen fallende Knie bei der Landung ist die Bewegung, die später verletzt."},
 {t:"Ein Service, das ins Feld kommt",d:"Mit der Bewegung, die gelingt: von unten ist völlig in Ordnung. Entscheidend ist, dass der Ball bis zum Schlag in der anderen Hand gehalten und nicht hochgeworfen wird — daher stammen in diesem Alter fast alle Fehler. Der Arm schwingt wie ein Pendel und der Körper geht nach vorne mit. Ziel ist, dass der Ballwechsel beginnt, nicht dass das Service schön aussieht. Brasilien verbietet das Service von oben in der gesamten Einführungsphase, und die Begründung der Befragten ist unmissverständlich: Erlaubt man es, entscheidet ein einziges Kind mit hartem Service das Spiel allein, und die anderen hören auf zu spielen."}],
 tac:[
 {t:"Niemand wartet in einer Schlange",d:"John Kessel, dreissig Jahre Leiter Sportentwicklung bei USA Volleyball, schrieb sein Minivolley-Handbuch für Programme mit zwölf bis sechsunddreissig Kindern und einer einzigen Trainerperson — genau diese Situation. Seine Regel: Wer in einer Reihe auf einen Ball wartet, lernt nichts und nimmt jemand anderem einen Kontakt weg. Mehrere Bälle, Gruppen zu zweit oder zu dritt, und wenn mehr als vier warten, ist die Übung falsch gebaut."},
 {t:"Den Ball laut fordern",d:"Vor der Berührung, nicht währenddessen. In diesem Alter ist Rufen noch nicht peinlich, also wird es hier installiert oder gar nie."},
 {t:"Verstehen, dass über drei Kontakte gespielt wird",d:"Und dass das Direktrückspiel, auch wenn es heute funktioniert, abzustellen ist. Getragen von der Spielregel."},
 {t:"Zum eigenen Ball gehen",d:"Und nicht zu dem, der einem nicht gehört. Jede hat eine Zone und eine Verantwortung."},
 {t:"Auf die Position zurück",d:"Nach jeder Aktion. Ohne das wird aus dem 3:3 ein Rudel, das einem Ball hinterherläuft."},
 {t:"Mit der Mitspielerin spielen",d:"Mit der anderen aufbauen statt allein zu lösen. Die erste Mannschaftsidee, die sie verstehen, und die Grundlage für alles Weitere. Polen treibt es auf die Spitze mit fast siebenundvierzigtausend Kindern, die 1:1, 2:2, 3:3 und 4:4 auf kleinem Feld spielen: Je weniger auf dem Feld stehen, desto öfter muss jede lösen und desto schneller entsteht die Idee des Aufbauens."}],
 next:"Für L4: dass die Annahme die Zuspielerin erreicht und der Dreier-Aufbau von selbst entsteht."}];

OBJ_LVL.en = [
{n:1,meta:"That they run the game and hold their level when the match tightens.",
 tec:[
 {t:"Execute the same in the third set as in the warm-up",d:"A player's real technical level is not what they show fresh: it is what they hold with tired legs and the scoreboard against them. It is trained by starting drills deliberately behind, putting series at the end of the session, and giving errors a consequence. It covers passing, setting and hitting under fatigue, and the ability to repeat the same action when the body wants to cut it short."},
 {t:"Distribute with a plan, not out of habit",d:"Choose the attacker by the rotation the team is in and by the block in front, not by who shouts loudest. It requires knowing each attacker's percentage against a formed block and which of the opponent's rotations is weakest. Worked on with the week's video and a simple sheet showing the planned distribution by rotation."},
 {t:"Solve against a formed block",d:"At this level the block always gets there, so hitting hard stops being enough. It covers all three tools: using the block's hands, attacking the seam between the two blockers, and the deep tip behind. Trained against a real block, scoring the decision rather than the point."},
 {t:"Hold the aggressive serve in the points that decide",d:"Anyone serves hard at 10-5. What decides is the serve at 23-all. Worked with series at the end of practice, tired, with an error rate agreed per player and a consequence when they ease off. The toss has to be identical to the one on the first serve of the match."},
 {t:"Immediate transition after the block",d:"Land balanced, turn to the ball, move three metres off the net and only then approach. It is the biggest gap between a junior and a senior player, and it is almost never trained. Every blocking and defensive drill has to end in an attack, without exception."}],
 tac:[
 {t:"The complete 5-1 system",d:"All six rotations with their coverage and transitions, with a single setter. It covers what to do when the setter has to dig, who sets instead, and how the attack reorganises in that rotation. It is the system of any senior league."},
 {t:"Their own match plan",d:"That they arrive on court with something prepared: two or three concrete things about the opponent they saw on video and can apply. Not professional scouting — a sheet with three points the player understands and uses."},
 {t:"Adjust without the coach asking",d:"Recognise what is happening in the match, change something on their own decision, and be able to explain why. Trained by asking «what did you see?» before giving the solution, all season long."},
 {t:"Control the tempo of the match",d:"Know when to speed up and when to slow down, when a high ball gives the team air and when to take a risk. It is a leadership skill and it grows by handing the player that decision in training with a score."},
 {t:"Getting into the structure is not the achievement",d:"The line comes from the French federal document and is worth having written down for the conversation with the player and the family: belonging to a national team or a centre <strong>is not an end in itself but a functional means</strong> of reaching your own sporting goal. An L1 who joins the Talentpool and believes they have arrived stops there. The French framework stands on three legs — sporting, academic and personal — and none replaces the others."},
 {t:"Carry a teammate through a bad spell",d:"Leadership on court is not shouting: it is taking the next point when somebody else has dropped off. It goes with the rule of not looking for culprits — the player who passes badly is not commented on, they are covered."}],
 next:"They are at the top of the development pathway. What follows is competing in the first team."},

{n:2,meta:"That they solve against organised opposition and start deciding on their own.",
 tec:[
 {t:"Two directions from the same approach",d:"Cross-court, line and tip out of an identical approach. That is what stops the opposing block from reading the intention before the jump. It covers wrist work and contact point, and is corrected by filming the three options: when a player sees themselves changing the approach, they understand it instantly."},
 {t:"Reading block",d:"Moving from reacting to anticipating: watch the first contact, then the setter, and decide before the jump. Trained by making them call out loud what they will do before the setter touches the ball, and by scoring the decision even when the block fails."},
 {t:"Back-row attack",d:"Approach from behind the three-metre line, take-off before the line and a high contact. It is a slower tempo than the outside attack, so the hitter starts earlier and the setter delivers further forward along the net. The typical error is starting late and stepping on the line: a floor mark a metre further back forces the early start."},
 {t:"Jump serve, or overhand serve with a zone",d:"The toss is ninety per cent of the jump serve, so it is trained separately: series of tosses only, with a floor mark, without hitting. Then the approach is added, and the strike only at the end. If the player does not yet have the body for the jump, the equivalent objective is an aggressive overhand serve into a chosen zone."},
 {t:"Attack tempos",d:"Brazil opens them only in the performance phase and in this order: attack from the outside and from the right, then the quick in the middle, then the front tempo. Each tempo forces the hitter to start earlier and the setter to shorten the trajectory, and it is what begins to break the opposing block. The back-row attack comes after all of them."},
 {t:"Setting to an agreement",d:"Each attacker settles with the setter the height, the distance from the net and the speed of their ball, and it gets written down. Then it is repeated until it comes without thinking. Setter-hitter mismatch is almost never technical: they simply never agreed."}],
 tac:[
 {t:"The complete 6-2 system",d:"Two setters who set from the back row and attack once they rotate front, with three attackers always at the net. It covers coverage, which changes every rotation and is the most neglected part of this system."},
 {t:"Read the opposing setter",d:"Watch the opponent's first contact, then the setter, and adjust position before the ball leaves. Worked in blocking and in defence at the same time, because the information is the same."},
 {t:"Recognise and adjust in the match",d:"Notice that the opponent is always attacking down the same side, or that the block is arriving late, and change something. It starts here and is consolidated at L1."},
 {t:"The dual career gets organised, not improvised",d:"This is the level where school and volleyball genuinely start to collide. Poland solves it with sport schools running ten hours of training a week against three of physical education; France with centres of sixteen hours and an adapted school timetable, assessed by the ministry. Our equivalent instrument is the Swiss Olympic Talent Card, and it exists precisely so the school adjusts the timetable. Almost nobody asks for it."},
 {t:"Use video",d:"One short clip a week, thirty seconds, with a single thing to correct. More than that does not get applied. Supported by the data system the club already runs in the first team."},
 {t:"Run a series yourself",d:"In Japan practice is run primarily by the captains and most drills are player-run. One series a week led by a player, from this level on: they organise it, they correct it and they hold the rhythm while the coach watches. It is the cheapest way to build the tactical thinking this level is supposed to produce."},
 {t:"Coverage and transitions in the 6-2",d:"With three attackers at the net, who covers changes every rotation. It decides the long rallies and it is the least trained."}],
 next:"To reach L1: hold all of this with the scoreboard against them and in the third set."},

{n:3,meta:"That they hold the complete rally against real opposition and stop depending on the coach inside the point.",
 tec:[
 {t:"Passing in system against a match serve",d:"«In system» means the setter can play the second ball without moving more than a step, with all three attacking options open. The target is for half the receptions to arrive that way. Brazil works a five-passer reception in a W or M formation right through the development phase, with an explicit reason: split the court into equal parts so everyone passes and <strong>nobody hides</strong>, because passing is the hardest skill in volleyball and the one players most avoid."},
 {t:"Penetration from position 1",d:"Leave as the opposing serve crosses the net, not once the pass is already away; a straight route into zone 2-3; and the last step is a braking step. The universal error is leaving late and compensating with speed: they reach the ball but arrive moving. Trained without a ball, timed against the serve, watching only the feet."},
 {t:"Hold the approach when the set is not perfect",d:"At this level the rhythm is already there; what gets trained is not changing it when the ball comes short or off the net. The long braking step is taken with the leg opposite the hitting arm, and it is what converts a horizontal approach into a vertical jump: shorten it and the player ends up jumping forward and hitting the net."},
 {t:"Overhand serve, 7 out of 10, with a called zone",d:"Consistency first, the zone after. Measured in series of ten with a record, so every player knows their number. Without an agreed error rate, everyone serves soft to avoid missing."},
 {t:"Back setting",d:"Brazil makes it an explicit step of the progression: first set only forward, then forward and back, and free only at the end. Without back setting the team is predictable, because the opposing block knows the ball always goes where the setter is facing. Trained on the same criteria as the forward set: impulse from the legs, with the arch of the back giving the direction, not the arms."},
 {t:"Block with hands over the net and angled into the court",d:"Hands penetrating over the tape, thumbs up and palms turned into the opponent's court: a block that faces the ceiling puts the ball out and achieves nothing. The jump is vertical and happens after the hitter's take-off, not with it. The footwork finishes before the jump: the commonest error is jumping while still moving sideways and coming apart in the air."}],
 tac:[
 {t:"Penetration in all six rotations",d:"No exceptions. The rotation is called before every point until it becomes automatic. Everything the system does later rests on this."},
 {t:"The 6-6 system: everyone sets",d:"When the ball does not reach the setter, whoever is nearest sets. It includes setting with the forearms when the hands cannot get there. Trained with a record of how often each player set."},
 {t:"The club and the regional structure are not a choice",d:"In the French centres the players train Monday to Friday in the federal structure and <strong>return to their club on Friday</strong> to train and compete at the weekend, with the licence always at the home club. When one of our players enters the GSGL trial we do not lose them: it is the same relationship. Worth saying to the player and the family before somebody reads it as a goodbye."},
 {t:"Always cover the attacker",d:"When one attacks, the others follow at two metres, low and with open hands, watching the block rather than the ball. The behaviour that wins the most long rallies and the cheapest to install."},
 {t:"Start on the first contact",d:"The attacker begins the approach on what they see in the pass, not once the setter has touched the ball. Wait, and they are late to everything but a high ball."},
 {t:"Begin reading the opposing setter",d:"An introduction: look at where the first contact is and how the setter's body is oriented. Getting it right is not yet required; looking is."},
 {t:"Defence and ball control as a decision",d:"Japan explains its level by saying its players are shorter and that it therefore put defence and ball control above everything else. This is the level where a player decides whether they go to the ball or wait to become tall enough. Whoever does not win on height wins because the ball does not hit the floor."}],
 next:"To reach L2: decide before the jump and add a second attacking direction."},

{n:4,meta:"That they hold under pressure what they already do well with a comfortable ball.",
 tec:[
 {t:"Passing against a match serve",d:"This is the jump that defines the level. The player already passes a tossed ball well; now they have to hold it against Saturday's serve. Never lower the serve intensity so the drill looks better: if you need to, lower the target zone, not the speed."},
 {t:"Setting on the move",d:"Arrive and play without the ball coming out flat. A flat ball means they arrived without legs: the impulse comes from extension, not from the arms. Trained by always receiving the ball while moving, never setting from standing."},
 {t:"Stabilise the three-step approach",d:"The same rhythm every time: orient, brake, close. If the player is in the growth spurt the approach will fall apart temporarily and predictably, and then you hold the technique rather than demand more. Floor mark for the braking step."},
 {t:"Contact high and in front",d:"The commonest error at this level is striking with the ball behind the head, which limits everything that follows. Corrected with attacking from a low box to isolate the arm, and with self-sets before adding the setter."},
 {t:"Overhand serve that chooses a zone",d:"It already lands in; now it has to land where it was meant to. Two marked zones, and the zone is called before serving. The goal is not an ace, it is opening the rally in our favour."}],
 tac:[
 {t:"Three contacts even when it gets difficult",d:"With an easy ball they already manage. What has to go is returning first time as soon as the rally gets hard, and it goes through the rule of the drill — the point does not count without three contacts — not through a telling-off. Brazil turns it into a competition rule: throughout the initiation phase <strong>returning the first ball is forbidden</strong>. It is not a coach instruction, it is the regulation that produces the behaviour."},
 {t:"Always follow the attacker",d:"Without being reminded. Installed as a rule of the small-sided game, not as an isolated drill."},
 {t:"Solve the conflict zone",d:"The ball between two belongs to whoever moves inward; the other calls and clears. It is an agreement, not a skill: set before the season and never changed."},
 {t:"Return to position",d:"After every action, back to your place. Without it the team becomes people chasing a ball."},
 {t:"Know the rotation and who sets",d:"Before the serve, the team knows which rotation it is in and who penetrates. Said out loud until it becomes automatic."},
 {t:"Compete often, and let the error cost nothing",d:"Poland holds that early exposure to competition, in an environment that supports it, is what teaches players to handle pressure and recover from errors. This is the level where that gets installed. And the warning that goes with it: this is exactly the age at which the relative age effect decides who carries on, so before you move anyone down a level, look at their date of birth."}],
 next:"To reach L3: that the technique does not fall apart the moment a match serve appears."},

{n:5,meta:"That the rally exists at all: that the ball survives the first contact.",
 tec:[
 {t:"Take the platform to the ball with the feet",d:"Almost everything that looks like an arm error at this level is a footwork error. The player reaches from where they are standing instead of moving. Corrected with games where the ball always lands away from them, and by asking them to arrive still before contact."},
 {t:"Hands up and in front of the face, forming the window",d:"Thumbs and index fingers making a triangle the player looks at the ball through, hands apart and fingers firm but not rigid. They are set before the ball arrives, not once it is on top of them. If the player cannot see the ball through their hands, the hands are wrong."},
 {t:"Strike with an open hand, wrapping the ball",d:"Contact starts with the heel of the hand and finishes with the fingers closing over the ball: that wrist snap is what gives direction and what makes the ball drop in. Straight arm and contact in front of the body, never beside or behind. Worked first from standing with a self-toss, so they control the ball before adding the approach."},
 {t:"Land on both feet with the knee aligned",d:"Trained from day one and every day, inside the opening game. At this age it does not hurt, and that is exactly why it gets corrected now: the knee collapsing inward on landing is the movement that injures later."},
 {t:"A serve that lands in court",d:"With whatever action works: underhand is perfectly fine. The key is that the ball is held in the other hand until the strike rather than tossed, which is where almost every error at this age comes from. The arm swings like a pendulum and the body goes forward with it. The goal is that the rally starts, not that the serve looks good. Brazil bans the overhand serve outright through the whole initiation phase, and the reason their interviewees give is blunt: allow it and one child who serves hard finishes the match on their own while the rest stop playing."}],
 tac:[
 {t:"Nobody waits in a line",d:"John Kessel, for thirty years director of sport development at USA Volleyball, wrote his minivolley manual for programmes with twelve to thirty-six children and a single coach, which is exactly this situation. His rule: anyone standing in a line waiting for a ball from the coach learns nothing and takes a contact away from somebody else. Several balls, groups of two or three, and if more than four are waiting, the drill is badly built."},
 {t:"Call for the ball out loud",d:"Before touching it, not during. At this age shouting is not yet embarrassing, so it gets installed here or never."},
 {t:"Understand that we play over three contacts",d:"And that returning first time, even when it works today, is what has to go. Held up by the rule of the game."},
 {t:"Go for the ball that is yours",d:"And not for the one that is not. Each player has a zone and a responsibility."},
 {t:"Return to position",d:"After every action. Without it, 3v3 turns into three children chasing a ball."},
 {t:"Play with your teammate",d:"Build with the other rather than solving alone. The first team idea they understand and the basis of everything else. Poland takes it to the extreme with nearly forty-seven thousand children playing 1v1, 2v2, 3v3 and 4v4 on reduced courts: the fewer there are on court, the more often each one has to solve it and the faster the idea of building appears."}],
 next:"To reach L4: that the pass reaches the setter and the three-contact build appears by itself."}];

const OL = () => OBJ_LVL[LANG] || OBJ_LVL.es;
/* referencia internacional por level */
const REF_LVL_ES = {
1:{t:"Brasil Sub-19/21 · Francia · Estados Unidos",d:"<strong>Brasil</strong> quita todas las restricciones en esta fase —sistema, saque, ataque, bloqueo y líbero libres— porque el jugador ya pasó por todas las etapas, pero mantiene el límite de subir solo <strong>una</strong> categoría. <strong>Francia</strong> aporta la frase que ordena la conversación con la familia: pertenecer a una selección o a un polo <em>no es una finalidad en sí misma, sino un medio funcional</em>. Entrar a la estructura no es el logro."},
2:{t:"Brasil Sub-17 · Estados Unidos · Francia",d:"<strong>Brasil</strong> introduce acá el 5-1, permite el líbero por primera vez, habilita el bloqueo doble en las puntas y abre los tiempos de ataque, pero sigue prohibiendo el ataque de zaga; el saque es de arriba sin salto y máximo cinco por jugador. <strong>Estados Unidos</strong> empieza a seleccionar para su programa nacional justo acá: U16 en varones y U15 en mujeres. <strong>Francia y Polonia</strong> resuelven la carrera dual con estructura: dieciséis y diez horas semanales con horario escolar adaptado."},
3:{t:"Brasil Sub-14/15 · Francia",d:"<strong>Brasil</strong> usa el 4x2 simple y después con infiltración —nuestro 4:4 con penetración—, mantiene el líbero prohibido, pasa a recepción de cinco en formación W o M para que nadie se esconda, y permite jugar hasta dos categorías por encima. <strong>Francia</strong> aporta el diseño que más nos sirve: en sus polos las jugadoras entrenan de lunes a viernes en la estructura federal y <strong>vuelven a su club el viernes</strong>. No es elegir entre club y federación."},
4:{t:"Brasil Sub-13 · Polonia",d:"<strong>Brasil</strong> juega 6x0 sin cambio entre frente y fondo —todos en todas las posiciones—, prohíbe el bloqueo, el saque es por abajo y el ataque sin salto; el armado empieza a incluir la pelota de espaldas. <strong>Polonia</strong> aporta la advertencia más importante de esta edad: es exactamente acá donde el efecto de la edad relativa decide quién sigue y quién se va. Mirá la fecha de nacimiento antes de sacar conclusiones."},
5:{t:"Brasil Sub-9/11 · Polonia",d:"<strong>Brasil</strong> juega en canchas de 6x3 a 12x4,5 con red de 1,80 a 2,20 m, en 1x1, 2x2 y 3x3, con la pelota de primera prohibida y el bloqueo prohibido; el saque es lanzado, de toque o por abajo. <strong>Polonia</strong> lo hace a una escala que impresiona: cerca de 47.000 chicos de 7 a 13 años en un solo torneo, en 1:1, 2:2, 3:3 y 4:4, con el objetivo declarado de maximizar los contactos con la pelota."}

 fuente:"Dónde ver formas ya dibujadas",

    {n:"Cuenta regresiva de equipo",o:"Empezar la sesión con presión y con el error barato.",a:"Todo el grupo, una pelota, el objetivo es llegar a X contactos sin que caiga.",r:"Se cuenta hacia atrás desde el récord del grupo. Si cae, no se reinicia todo: se pierden cinco. El error cuesta pero no borra.",esc:"L5 objetivo 15 · L4 objetivo 30 con tres toques obligatorios · L3 en adelante, con red de por medio y rotación.",e:"Reiniciar en cero cada vez que cae. Eso enseña a no arriesgar."}]},
  {h:"K1 in-system · recepción # o +",

   ej:[
    {n:"Recepción, armado, ataque encadenado",o:"El ejercicio base de todos: es el mejor de recepción, el mejor de armado y el mejor de ataque, todo a la vez.",a:"Saque cómodo del entrenador o free ball. Recepción, armado y ataque completo. La pelota termina como termina un punto.",r:"El punto solo cuenta si hubo tres contactos y el ataque cayó en una zona cantada antes.",esc:"L5 atrapar-lanzar-golpear de pie · L4 ataque en salto sin exigir dirección · L3 con dirección elegida · L2 con dos opciones de armado · L1 con bloqueo real enfrente.",e:"Cortar el ejercicio después del armado. Si la pelota no termina, no es la jugada."},
    {n:"El central existe",o:"Que el armador incorpore al central como amenaza constante y no como recurso.",a:"Recepción cómoda con central disponible en todas las repeticiones.",r:"Cada tres jugadas, al menos una tiene que ir al central. Si no fue, la serie se repite.",esc:"L4 el central solo aparece y no recibe pelota · L3 recibe pelota alta en el medio · L2 primer tiempo cercano · L1 con los tiempos abiertos.",e:"Dejarlo para el final de la sesión, cuando ya están cansados y el central no salta."},
    {n:"Cobertura obligatoria",o:"Instalar que el equipo acompaña al que ataca, que es lo que más rallies largos gana.",a:"La misma jugada completa, pero el entrenador o un compañero bloquea y devuelve la pelota al propio campo.",r:"Si el equipo recupera la pelota bloqueada, vale doble. Si no había nadie cubriendo, el punto se pierde aunque la pelota haya caído afuera.",esc:"L5 y L4 un compañero simula el bloqueo desde una silla · L3 bloqueo real simple · L2 y L1 bloqueo doble.",e:"Pedir cobertura de palabra. Se instala con el punto doble, no con el recordatorio."},
    {n:"Cuatro atacantes, seis rotaciones",o:"Que el equipo pueda presentarse siempre con todas las opciones, en todas las rotaciones.",a:"Se juega la rotación completa; cada dos jugadas se rota.",r:"En cada rotación tienen que atacar al menos dos jugadores distintos antes de rotar.",esc:"L4 dos atacantes en 4:4 · L3 tres en cancha grande · L2 tres siempre en red con el 6-2 · L1 con ataque de zaga incluido.",e:"Rotar solo cuando sale bien. La rotación es fija: se rota igual."}]},
  {h:"K1 semi-system · recepción !",
   d:"El armador todavía tiene opciones pero no todas. Es la situación más frecuente en formativas y la que menos se entrena, porque no se ve linda.",
   ej:[
    {n:"Saque del sábado",o:"Sostener la recepción contra el saque real, sin bajarle la intensidad al ejercicio.",a:"Saque de competencia desde el fondo. Recepción, armado y ataque con lo que haya quedado.",r:"No se baja la velocidad del saque nunca. Si el grupo no llega, se achica la zona de recepción o se suma un receptor.",esc:"L5 no aplica · L4 dos receptores y saque de arriba suave · L3 tres receptores y saque real · L2 y L1 con saque en salto.",e:"Sacar más flojo para que el ejercicio salga. Ahí dejaste de entrenar lo que ibas a entrenar."},
    {n:"Armado con un paso de más",o:"Armar bien aunque el cuerpo todavía esté llegando, que es lo que va a pasar casi siempre.",a:"El entrenador manda la pelota deliberadamente a dos metros del armador.",r:"Solo cuenta si la pelota sale con altura. La pelota plana significa que llegó sin piernas y no suma.",esc:"L4 con pelota lanzada · L3 desde recepción real con penetración · L2 y L1 con contrato de altura y distancia por atacante.",e:"Corregir las manos. Casi siempre el problema está en el momento de salida, no en el contacto."},
    {n:"Dos opciones, no cuatro",o:"Decidir bien con opciones limitadas, que es la definición de semi-system.",a:"Recepción ! provocada. El central queda fuera de la jugada por regla.",r:"El armador tiene que cantar en voz alta a cuál de las dos opciones va, antes de tocar la pelota.",esc:"L4 dos atacantes, elige uno · L3 elige y avisa · L2 elige sin avisar y el atacante lo lee · L1 con el bloqueo rival leyendo también.",e:"Dejar que el armador siempre mande a la misma punta. Se anota a quién fue cada pelota."},
    {n:"Escalera de tres calidades",o:"Que el equipo reconozca en qué situación está y cambie la ambición del ataque.",a:"El entrenador saca alternando tres calidades sin avisar: cómoda, incómoda y muy difícil.",r:"Según la calidad que salga, el equipo tiene permiso de atacar fuerte, de atacar seguro o de devolver alto y profundo. Elegir mal cuesta el punto aunque la pelota caiga adentro.",esc:"L4 dos calidades · L3 tres · L2 y L1 tres calidades y además elegir a qué zona del campo rival.",e:"Premiar solo el punto. Acá se premia la decisión."}]},
  {h:"K1 out-of-system · recepción -",

    {n:"El armador no está",o:"Que cualquiera pueda armar cuando la pelota no llega, con pelota utilizable.",a:"Recepción mala provocada. El armador queda fuera de la jugada por regla, tocándose la red con la mano.",r:"Arma el que esté más cerca. Se anota quién armó cada pelota y al final de la semana todos tienen que figurar.",esc:"L4 arma el que esté cerca, como pueda · L3 con manchette dirigida · L2 y L1 con altura y distancia acordadas igual que el armador titular.",e:"Dejar que los altos se salteen el ejercicio porque «ellos no arman». Justamente por eso."},
    {n:"Pelota alta y profunda",o:"Atacar contra bloqueo formado sin regalar el punto.",a:"Pelota alta a la punta, con bloqueo doble ya armado enfrente.",r:"Vale el ataque que cae en los últimos tres metros o que sale por las manos del bloqueo. El que cierra el brazo y la pelota va afuera pierde el punto doble.",esc:"L4 sin bloqueo, solo profundidad · L3 bloqueo simple · L2 bloqueo doble · L1 doble y con defensa detrás.",e:"Festejar el pelotazo. El criterio es dónde cayó, no cuán fuerte fue."},
    {n:"Reciclar",o:"Entender que a veces la mejor jugada es devolver bien y volver a empezar.",a:"Situación imposible provocada: pelota lejísimos, tiempo cortado.",r:"El equipo gana el punto si la pelota vuelve alta, profunda y con el equipo ya reorganizado en defensa. Si atacan y pierden, no vale.",esc:"L4 devolver alto · L3 devolver alto y profundo · L2 elegir entre reciclar y atacar · L1 reciclar y ganar el rally siguiente.",e:"Enseñar que devolver es de cobarde. Reciclar bien es una decisión, no una renuncia."},
    {n:"Tres contactos o nada",o:"Que la jugada exista incluso en la peor recepción.",a:"Juego libre con saque agresivo.",r:"El punto no cuenta si el equipo no llegó a tres contactos. Devolver de primera es punto para el rival aunque la pelota caiga adentro.",esc:"L5 con pelota lanzada · L4 con saque suave · L3 y arriba con saque real.",e:"Levantar la regla cuando el partido se pone difícil. Ahí es cuando hay que sostenerla."}]},
  {h:"K2 transición · somos nosotros los que sacamos",

   ej:[
    {n:"Toda defensa termina en ataque",o:"Cortar de raíz la costumbre de levantar la pelota y mandarla al otro lado.",a:"El entrenador ataca desde una silla o desde el piso al campo propio. El equipo defiende y contraataca.",r:"La pelota defendida que vuelve al otro campo sin pasar por tres contactos no suma. Punto solo si hubo contraataque.",esc:"L5 no aplica · L4 defensa y devolución construida · L3 defensa, armado y ataque de pie · L2 y L1 con transición completa y ataque en salto.",e:"Entrenar defensa como un fin. La defensa es el principio de un ataque."},
    {n:"Aterrizar, girar, salir",o:"La transición del bloqueador, que es donde se pierde más tiempo.",a:"Bloquean, caen, y la pelota siguiente llega inmediatamente para que tengan que atacar desde tres metros.",r:"Se cronometra: del aterrizaje al armado del brazo no pueden pasar más de dos segundos.",esc:"L3 sin pelota, solo el movimiento · L2 con pelota alta · L1 con pelota real y bloqueo enfrente.",e:"Dejarlos bloquear y quedarse mirando la pelota. El bloqueo termina cuando ya salieron de la red."},
    {n:"Bloqueo que dirige",o:"Que el bloqueo mande la pelota al campo rival o hacia donde está nuestro defensor, no al techo.",a:"Atacante fijo desde una zona. Bloqueo doble con referencia cantada.",r:"Solo cuenta el bloqueo que devuelve la pelota adentro o la desvía hacia la zona donde había un defensor. El bloqueo que toca y se va afuera no suma.",esc:"L4 manos sobre la red y nada más · L3 cerrar al punto de ataque · L2 lector con llamada · L1 con las cinco llamadas del playbook.",e:"Contar los bloqueos-punto. Se cuenta el bloqueo que deja la pelota jugable."},
    {n:"Free ball, ataque inmediato",o:"No relajarse con la pelota fácil, que es donde más puntos se regalan.",a:"El entrenador manda una free ball sin avisar en medio de una serie.",r:"La free ball tiene que terminar en ataque en salto. Si el equipo la devuelve alta, pierde el punto.",esc:"L4 free ball con ataque de pie · L3 en salto · L2 y L1 con el central incorporado.",e:"Avisar que viene la free ball. La gracia es que aparezca."}]},
