<!DOCTYPE html>
<html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>ARMAR RUTINAS — Axpo Volley Näfels</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow+Condensed:wght@300;400;600;700;800;900&display=swap" rel="stylesheet">
<script src="firebase.js" onerror="void 0"></script>
<script src="plantel_nafels.js" onerror="void 0"></script>
<script src="datos_ejercicios.js" onerror="void 0"></script>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  :root{--bg:#080a12;--card:#0e1019;--card2:#13162a;--elev:#171a30;--border:rgba(255,255,255,.07);--b2:rgba(255,255,255,.14);
    --red:#ef2740;--redd:#c01528;--green:#22c55e;--amber:#f59e0b;--indigo:#818cf8;--teal:#2dd4bf;--mut:#5b6680;--mut2:#9aa6c0;--txt:#e7ecf5}
  body{background:radial-gradient(900px 500px at 0% -8%,rgba(239,39,64,.08),transparent 55%),var(--bg);
    font-family:'Barlow Condensed',sans-serif;color:var(--txt);min-height:100vh;padding-bottom:100px}
  select,input,textarea{font-family:'Barlow Condensed',sans-serif}
  .wrap{max-width:1000px;margin:0 auto;padding:0 16px}
  .header{display:flex;align-items:center;gap:14px;padding:16px 0 6px;flex-wrap:wrap}
  .back-btn{color:var(--mut2);text-decoration:none;font-size:12px;font-weight:700;letter-spacing:1px;text-transform:uppercase;
    border:1px solid var(--border);padding:7px 13px;border-radius:9px;white-space:nowrap}
  .back-btn:hover{color:var(--txt)}
  .subtitle{font-size:11px;color:var(--mut);letter-spacing:2px;text-transform:uppercase}
  h1{font-family:'Bebas Neue',sans-serif;font-size:27px;letter-spacing:3px}
  .badge{background:rgba(239,39,64,.14);border:1px solid rgba(239,39,64,.34);color:#ff5870;padding:4px 12px;border-radius:20px;
    font-size:11px;font-weight:700;letter-spacing:1px;margin-left:auto;white-space:nowrap}
  .topline{height:3px;background:linear-gradient(90deg,var(--red),transparent);border-radius:3px;margin:2px 0 16px}
  .card{background:linear-gradient(180deg,var(--elev),var(--card));border:1px solid var(--border);border-radius:16px;padding:18px;margin-bottom:14px}
  label.fld{display:block;font-size:10px;color:var(--mut);letter-spacing:1.5px;text-transform:uppercase;margin-bottom:6px}
  select,input[type=text],input[type=number]{width:100%;background:#fff;color:#111;border:1px solid var(--b2);border-radius:9px;
    padding:9px 11px;font-size:14px;font-weight:600;outline:none}
  .ctrl-grid{display:grid;grid-template-columns:2fr 1.4fr auto;gap:10px;align-items:end}
  .btn{padding:10px 16px;border:none;border-radius:10px;font-family:'Bebas Neue';font-size:15px;letter-spacing:2px;cursor:pointer;white-space:nowrap}
  .btn-red{background:linear-gradient(135deg,var(--red),var(--redd));color:#fff}
  .btn-ghost{background:rgba(255,255,255,.05);color:var(--mut2);border:1px solid var(--border)!important}
  .btn-ghost:hover{color:var(--txt)}
  .btn-teal{background:linear-gradient(135deg,var(--teal),#14b8a6);color:#06231d}
  .btn-sm{font-size:12px;letter-spacing:1px;padding:6px 11px;border-radius:8px}
  .ses{border:1px solid var(--border);border-radius:14px;margin-bottom:12px;overflow:hidden;background:var(--card)}
  .ses-hd{display:flex;align-items:center;gap:10px;padding:12px 14px;background:linear-gradient(180deg,var(--elev),var(--card))}
  .ses-hd input{background:rgba(255,255,255,.05);color:var(--txt);border:1px solid var(--border);font-family:'Bebas Neue';font-size:18px;letter-spacing:1px}
  .ses-bd{padding:12px;background:rgba(6,7,13,.4)}
  .blo{border:1px solid var(--border);border-radius:12px;margin-bottom:10px;overflow:hidden}
  .blo-hd{display:flex;align-items:center;gap:8px;padding:9px 12px}
  .blo-hd select{max-width:230px;background:var(--card2);color:var(--txt);border-color:var(--border)}
  .blo-ic{font-size:17px}
  .ej-row{display:grid;grid-template-columns:1fr 64px 78px 96px 1.2fr auto;gap:7px;align-items:center;padding:7px 12px;border-top:1px solid var(--border)}
  .ej-row select,.ej-row input{background:var(--card2);color:var(--txt);border-color:var(--border);font-size:13px;padding:7px 8px}
  .ej-row .vbtn{color:var(--indigo);font-size:11px;text-decoration:none;white-space:nowrap}
  .x{background:none;border:none;color:var(--mut);font-size:17px;cursor:pointer;padding:2px 6px}
  .x:hover{color:var(--red)}
  .addrow{display:flex;gap:8px;padding:9px 12px;flex-wrap:wrap}
  .hint{font-size:11px;color:var(--mut);line-height:1.6}
  .savebar{position:fixed;bottom:0;left:0;right:0;background:rgba(8,10,18,.94);backdrop-filter:blur(16px);border-top:1px solid var(--border);
    padding:12px 16px;display:flex;align-items:center;gap:12px;justify-content:center;z-index:50}
  .savebar .st{font-size:12px;color:var(--mut2)}
  .empty{color:var(--mut);text-align:center;padding:30px;font-size:14px}
  .colhdr{display:grid;grid-template-columns:1fr 64px 78px 96px 1.2fr auto;gap:7px;padding:2px 12px 4px;font-size:9px;color:var(--mut);letter-spacing:1px;text-transform:uppercase}
  @media(max-width:640px){.ctrl-grid{grid-template-columns:1fr}.ej-row,.colhdr{grid-template-columns:1fr 1fr;}.ej-row .vbtn{grid-column:1/-1}}
</style></head>
<body>
<div class="wrap">
  <div class="header">
    <a href="prep_fisica.html" class="back-btn">← Prep Física</a>
    <div><div class="subtitle">Axpo Volley Näfels · Cuerpo técnico</div><h1>ARMAR RUTINAS</h1></div>
    <div class="badge">Preparador físico</div>
  </div>
  <div class="topline"></div>

  <div class="card">
    <div class="ctrl-grid">
      <div><label class="fld">Jugador</label><select id="selJug"></select></div>
      <div><label class="fld">Mes de uso</label><select id="selMes"></select></div>
      <button class="btn btn-ghost" onclick="cargar()">Cargar</button>
    </div>
    <div class="hint" style="margin-top:10px" id="estado">Elegí jugador y mes. Si ya hay una rutina cargada para ese mes, se abre para editar; si no, empezás una nueva.</div>
  </div>

  <div id="editor"></div>

  <div class="card" style="text-align:center">
    <button class="btn btn-ghost" onclick="addSesion()">+ Agregar día / sesión</button>
  </div>
</div>

<div class="savebar">
  <span class="st" id="savest">—</span>
  <button class="btn btn-teal" onclick="guardar()">💾 GUARDAR RUTINA</button>
</div>

<script>
var MESES=['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
var BLOQUES=[
  {nombre:'ENTRADA EN CALOR',icon:'🔥',color:'#f97316'},
  {nombre:'ACTIVACIÓN',icon:'⚡',color:'#eab308'},
  {nombre:'FUERZA INFERIOR',icon:'🦵',color:'#ef2740'},
  {nombre:'FUERZA SUPERIOR',icon:'💪',color:'#3b82f6'},
  {nombre:'POTENCIA',icon:'🚀',color:'#f59e0b'},
  {nombre:'PLIOMETRÍA',icon:'🤸',color:'#a855f7'},
  {nombre:'CORE',icon:'🎯',color:'#22c55e'},
  {nombre:'PREVENTIVOS',icon:'🛡️',color:'#06b6d4'},
  {nombre:'MOVILIDAD',icon:'🧘',color:'#2dd4bf'}
];
function roster(){ return (window.PLANTEL_NAFELS&&window.PLANTEL_NAFELS.jugadores)||[]; }
function catalogo(){ return (window.EJERCICIOS_DATA&&window.EJERCICIOS_DATA.grupos)||[]; }
function pname(j){ return '#'+j.num+'  '+(j.ap||j.nombre); }
function ejById(id){ var g=catalogo(); for(var i=0;i<g.length;i++){var e=g[i].ejercicios.find(function(x){return x.id===id;});if(e)return e;} return null; }
function bloqueByName(n){ return BLOQUES.find(function(b){return b.nombre===n;})||BLOQUES[2]; }

var R = null;   // rutina en edición: {mes, mesLabel, semanas:[{id,label,bloques:[{nombre,icon,color,ejercicios:[{id,nombre,series,reps,descanso,nota,video}]}]}]}
var DIRTY=false;
function setDirty(d){ DIRTY=d; document.getElementById('savest').textContent = d?'Cambios sin guardar':'Guardado'; }

/* ---------- init selects ---------- */
(function init(){
  var sj=document.getElementById('selJug');
  sj.innerHTML = roster().length ? roster().map(function(j){return '<option value="'+j.num+'">'+pname(j)+'</option>';}).join('')
                                 : '<option value="">(no se cargó el plantel)</option>';
  var sm=document.getElementById('selMes'), now=new Date(), opts='';
  for(var d=-1; d<=4; d++){                          // mes anterior + actual + 4 siguientes
    var dt=new Date(now.getFullYear(), now.getMonth()+d, 1);
    var key=dt.getFullYear()+'-'+String(dt.getMonth()+1).padStart(2,'0');
    var lbl=MESES[dt.getMonth()]+' '+dt.getFullYear();
    opts+='<option value="'+key+'" data-lbl="'+lbl+'"'+(d===0?' selected':'')+'>'+lbl+'</option>';
  }
  sm.innerHTML=opts;
  cargar();
})();

/* ---------- cargar rutina (Firebase) ---------- */
function nuevaRutina(){
  var sm=document.getElementById('selMes'), opt=sm.options[sm.selectedIndex];
  return { mes: sm.value, mesLabel: opt?opt.getAttribute('data-lbl'):sm.value, semanas: [] };
}
function cargar(){
  var num=+document.getElementById('selJug').value, mes=document.getElementById('selMes').value;
  if(!num){ R=nuevaRutina(); render(); return; }
  document.getElementById('estado').textContent='Buscando rutina guardada…';
  var done=function(data){
    if(data && data.semanas){ R=data; if(!R.mesLabel){var o=document.getElementById('selMes').options[document.getElementById('selMes').selectedIndex];R.mesLabel=o?o.getAttribute('data-lbl'):mes;} R.mes=mes;
      document.getElementById('estado').textContent='Rutina de '+R.mesLabel+' cargada — editá lo que quieras.'; }
    else { R=nuevaRutina(); document.getElementById('estado').textContent='No había rutina para ese mes. Empezás una nueva.'; }
    render(); setDirty(false);
  };
  if(typeof fbGet!=='undefined'){ fbGet('prep_rutinas/'+num+'/'+mes, done); }
  else { try{ var loc=JSON.parse(localStorage.getItem('prep_rutina_'+num+'_'+mes)||'null'); }catch(e){loc=null;} done(loc); }
}

/* ---------- edición de estado ---------- */
function addSesion(){
  if(!R) R=nuevaRutina();
  R.semanas.push({ id:'S'+Date.now(), label:'Día '+(R.semanas.length+1), bloques:[] });
  setDirty(true); render();
}
function delSesion(si){ R.semanas.splice(si,1); setDirty(true); render(); }
function addBloque(si){ R.semanas[si].bloques.push({nombre:BLOQUES[2].nombre,icon:BLOQUES[2].icon,color:BLOQUES[2].color,ejercicios:[]}); setDirty(true); render(); }
function delBloque(si,bi){ R.semanas[si].bloques.splice(bi,1); setDirty(true); render(); }
function addEj(si,bi){ R.semanas[si].bloques[bi].ejercicios.push({id:'',nombre:'',series:4,reps:'8-10',descanso:'90 s',nota:'',video:null}); setDirty(true); render(); }
function delEj(si,bi,ei){ R.semanas[si].bloques[bi].ejercicios.splice(ei,1); setDirty(true); render(); }

function onSesLabel(si,v){ R.semanas[si].label=v; setDirty(true); }
function onBloque(si,bi,v){ var b=bloqueByName(v); R.semanas[si].bloques[bi].nombre=b.nombre; R.semanas[si].bloques[bi].icon=b.icon; R.semanas[si].bloques[bi].color=b.color; setDirty(true); render(); }
function onEj(si,bi,ei,field,v){
  var e=R.semanas[si].bloques[bi].ejercicios[ei];
  if(field==='id'){ var cat=ejById(v); e.id=v; e.nombre=cat?cat.es:''; e.video=cat?cat.video:null; }
  else e[field]=v;
  setDirty(true);
  if(field==='id') render();
}

/* ---------- render ---------- */
function catOptions(sel){
  var h='<option value="">— elegir ejercicio —</option>';
  catalogo().forEach(function(g){
    h+='<optgroup label="'+g.nombre+'">';
    g.ejercicios.forEach(function(e){ h+='<option value="'+e.id+'"'+(e.id===sel?' selected':'')+'>'+e.es+'</option>'; });
    h+='</optgroup>';
  });
  return h;
}
function bloqueOptions(sel){
  return BLOQUES.map(function(b){return '<option'+(b.nombre===sel?' selected':'')+'>'+b.nombre+'</option>';}).join('');
}
function render(){
  var ed=document.getElementById('editor');
  if(!R || !R.semanas.length){ ed.innerHTML='<div class="card"><div class="empty">Todavía no hay días cargados.<br>Tocá “+ Agregar día / sesión” para empezar.</div></div>'; return; }
  var h='';
  R.semanas.forEach(function(s,si){
    h+='<div class="card" style="padding:0">';
    h+='<div class="ses-hd"><span style="color:var(--mut);font-size:12px;letter-spacing:1px">SESIÓN</span>'
      +'<input type="text" value="'+(s.label||'').replace(/"/g,'&quot;')+'" oninput="onSesLabel('+si+',this.value)" style="flex:1">'
      +'<button class="x" title="Eliminar sesión" onclick="delSesion('+si+')">🗑</button></div>';
    h+='<div class="ses-bd">';
    s.bloques.forEach(function(b,bi){
      h+='<div class="blo"><div class="blo-hd"><span class="blo-ic">'+b.icon+'</span>'
        +'<select onchange="onBloque('+si+','+bi+',this.value)">'+bloqueOptions(b.nombre)+'</select>'
        +'<span style="width:14px;height:14px;border-radius:4px;background:'+b.color+'"></span>'
        +'<button class="x" style="margin-left:auto" title="Eliminar bloque" onclick="delBloque('+si+','+bi+')">✕</button></div>';
      if(b.ejercicios.length){
        h+='<div class="colhdr"><span>Ejercicio</span><span>Series</span><span>Reps</span><span>Descanso</span><span>Nota</span><span></span></div>';
      }
      b.ejercicios.forEach(function(e,ei){
        h+='<div class="ej-row">'
          +'<select onchange="onEj('+si+','+bi+','+ei+',\'id\',this.value)">'+catOptions(e.id)+'</select>'
          +'<input type="number" min="1" value="'+(e.series||'')+'" oninput="onEj('+si+','+bi+','+ei+',\'series\',this.value)">'
          +'<input type="text" value="'+(e.reps||'').replace(/"/g,'&quot;')+'" oninput="onEj('+si+','+bi+','+ei+',\'reps\',this.value)">'
          +'<input type="text" value="'+(e.descanso||'').replace(/"/g,'&quot;')+'" oninput="onEj('+si+','+bi+','+ei+',\'descanso\',this.value)">'
          +'<input type="text" placeholder="indicación…" value="'+(e.nota||'').replace(/"/g,'&quot;')+'" oninput="onEj('+si+','+bi+','+ei+',\'nota\',this.value)">'
          +(e.video?'<a class="vbtn" href="'+e.video+'" target="_blank">▶ video</a>':'<button class="x" onclick="delEj('+si+','+bi+','+ei+')">✕</button>');
        if(e.video) h+='';
        h+='</div>';
      });
      h+='<div class="addrow"><button class="btn btn-ghost btn-sm" onclick="addEj('+si+','+bi+')">+ Ejercicio</button></div>';
      h+='</div>';
    });
    h+='<div class="addrow"><button class="btn btn-ghost btn-sm" onclick="addBloque('+si+')">+ Bloque</button></div>';
    h+='</div></div>';
  });
  ed.innerHTML=h;
}

/* ---------- guardar (Firebase + local) ---------- */
function guardar(){
  var num=+document.getElementById('selJug').value;
  if(!num){ alert('Elegí un jugador.'); return; }
  if(!R || !R.semanas.length){ alert('Agregá al menos un día con ejercicios.'); return; }
  // limpiar ejercicios sin elegir
  R.semanas.forEach(function(s){ s.bloques.forEach(function(b){ b.ejercicios=b.ejercicios.filter(function(e){return e.id;}); }); });
  R.actualizado = new Date().toISOString();
  var path='prep_rutinas/'+num+'/'+R.mes;
  try{ localStorage.setItem('prep_rutina_'+num+'_'+R.mes, JSON.stringify(R)); }catch(e){}
  if(typeof fbSet!=='undefined'){ fbSet(path, R); document.getElementById('savest').textContent='Guardado en la nube ✓'; }
  else { document.getElementById('savest').textContent='Guardado en este dispositivo ✓ (sin conexión a la nube)'; }
  setDirty(false);
}
window.addEventListener('beforeunload', function(e){ if(DIRTY){ e.preventDefault(); e.returnValue=''; } });
</script>
</body></html>
